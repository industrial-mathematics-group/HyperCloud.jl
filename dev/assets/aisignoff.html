ion `D` and sets the state vector length to `M = D + 2`.\n\"\"\"\nstruct EulerEquation{D, M, T, R} \u003c: HyperbolicPDE{D, M, T}\n    gamma::T\n    rep::R\nend\n\nfunction EulerEquation(::Val{D}, ::Type{T}, gamma::T = T(1.4), rep::R = Conservative()) where {D, T, R \u003c: EquationRepresentation}\n    return EulerEquation{D, D + 2, T, R}(gamma, rep)\nend\n\n@inline function prim2cons(eq::EulerEquation{D, M, T}, V::State{M, T}) where {D, M, T}\n    rho = V[1]\n    u = Space{D, T}(ntuple(d -> V[1+d], Val(D))) \n    p = V[M]\n    \n    m = rho .* u\n    E = p / (eq.gamma - T(1)) + T(0.5) * rho * sum(abs2, u) \n    \n    return State{M, T}(rho, m..., E)\nend\n\n# Positivity floor of density and pressure, the same everywhere (fluxes, primitive variables, wave speeds, fluid\n# velocity): `cons2prim` used 1e-7 while the eigenvalues used 1e-9, so the flux and its CFL bound saw different\n# states near vacuum.\n@inline _euler_floor(::Type{T}) where {T} = T(1e-9)\n\n@inline function cons2prim(eq::EulerEquation{D, M, T}, U::State{M, T}) where {D, M, T}\n    rho = max(U[1], _euler_floor(T))\n    m = Space{D, T}(ntuple(d -> U[1+d], Val(D)))\n    E = U[M]\n    \n    u = m ./ rho\n    p = (eq.gamma - T(1)) * (E - T(0.5) * sum(abs2, m) / rho)\n    \n    return State{M, T}(rho, u..., max(p, _euler_floor(T)))\nend\n\n@inline function flux(eq::EulerEquation{D, M, T, \u003c:Conservative}, U::State{M, T}) where {D, M, T}\n    V = cons2prim(eq, U)\n    rho = V[1]\n    u = Space{D, T}(ntuple(d -> V[1+d], Val(D)))\n    p = V[M]\n    E = U[M]\n    \n    return Flux{D, M, T}(ntuple(Val(D)) do d\n        ud = u[d]\n        mass_flux = rho * ud\n        mom_flux = ntuple(i -> rho * u[i] * ud + (i == d ? p : zero(T)), Val(D))\n        energy_flux = ud * (E + p)\n        \n        State{M, T}(mass_flux, mom_flux..., energy_flux)\n    end)\nend\n\n\"Admissible conservative Euler state (MOOD PAD): finite, positive density and pressure.\"\n@inline function is_admissible(eq::EulerEquation{D, M, T, \u003c:Conservative}, U::State{M, T}) where {D, M, T}\n    all(isfinite, U) || return false\n    rho = U[1]\n    rho > zero(T) || return false\n    m_sq = sum(abs2, ntuple(i -> U[1+i], Val(D)))\n    return (eq.gamma - one(T)) * (U[M] - T(0.5) * m_sq / rho) > zero(T)\nend\n\n@inline function max_eigenvalue(eq::EulerEquation{D, M, T, \u003c:Conservative}, U::State{M, T}, d::Int) where {D, M, T}\n    rho = max(U[1], _euler_floor(T))\n    m_d = U[1+d]\n    E = U[M]\n    \n    m_sq = sum(abs2, ntuple(i -> U[1+i], Val(D)))\n    p = max((eq.gamma - one(T)) * (E - T(0.5) * m_sq / rho), _euler_floor(T))\n    c = sqrt(eq.gamma * p / rho)\n    \n    return abs(m_d / rho) + c\nend\n\n@inline function max_eigenvalue(eq::EulerEquation{D, M, T, \u003c:NCRepresentation}, V::State{M, T}, d::Int) where {D, M, T}\n    rho = max(V[1], _euler_floor(T))\n    u_d = V[1+d]\n    p = max(V[M], _euler_floor(T))\n    \n    c = sqrt(eq.gamma * p / rho)\n    \n    return abs(u_d) + c\nend\n\n# Moving grids: material velocity and exact relative wave speed |u_d − w| + c\n@inline function fluid_velocity(eq::EulerEquation{D, M, T, \u003c:Conservative}, U::State{M, T}) where {D, M, T}\n    rho = max(U[1], _euler_floor(T))\n    return Space{D, T}(ntuple(d -> U[1+d] / rho, Val(D)))\nend\n@inline fluid_velocity(eq::EulerEquation{D, M, T, \u003c:NCRepresentation}, V::State{M, T}) where {D, M, T} =\n    Space{D, T}(ntuple(d -> V[1+d], Val(D)))\n\n@inline function max_eigenvalue(eq::EulerEquation{D, M, T, \u003c:Conservative}, U::State{M, T}, d::Int, shift::Real) where {D, M, T}\n    rho = max(U[1], _euler_floor(T))\n    m_sq = sum(abs2, ntuple(i -> U[1+i], Val(D)))\n    p = max((eq.gamma - one(T)) * (U[M] - T(0.5) * m_sq / rho), _euler_floor(T))\n    return abs(U[1+d] / rho - T(shift)) + sqrt(eq.gamma * p / rho)\nend\n@inline function max_eigenvalue(eq::EulerEquation{D, M, T, \u003c:NCRepresentation}, V::State{M, T}, d::Int, shift::Real) where {D, M, T}\n    rho = max(V[1], _euler_floor(T)); p = max(V[M], _euler_floor(T))\n    return abs(V[1+d] - T(shift)) + sqrt(eq.gamma * p / rho)\nend\n\n# =========================================================================\n# EULER ANALYTIC CLOSURES\n# =========================================================================\n\nfunction analytic_closure(eq::EulerEquation{1, M, T}, ic::Riemann, geom::GeometricDomain) where {M, T}\n    gamma = eq.gamma\n    \n    rho_L, m_L, E_L = ic.uL\n    rho_R, m_R, E_R = ic.uR\n    x0 = ic.p0[1]\n\n    # `uL` lies on the side where (x - x0) * n \u003c 0. If n points in -x, solve the problem in\n    # the mirrored frame x' = σ (x - x0), where velocities also change sign (u' = σ u),\n    # and map the momentum back at the end.\n    σ = ic.n[1] \u003c 0 ? -one(T) : one(T)\n\n    u_L = σ * m_L / rho_L\n    p_L = (gamma - one(T)) * (E_L - T(0.5) * rho_L * u_L^2)\n    u_R = σ * m_R / rho_R\n    p_R = (gamma - one(T)) * (E_R - T(0.5) * rho_R * u_R^2)\n    \n    c_L = sqrt(gamma * p_L / rho_L)\n    c_R = sqrt(gamma * p_R / rho_R)\n    \n    # Pressure positivity condition (Toro, Sec. 4.6): if the outer states separate faster than the two\n    # rarefactions can fill, i.e. 2 (c_L + c_R) / (γ - 1) ≤ u_R - u_L, a vacuum (ρ = p = 0) opens between the\n    # rarefaction tails u_L + 2 c_L / (γ - 1) and u_R - 2 c_R / (γ - 1); there is no star region.\n    vacuum = T(2) * (c_L + c_R) / (gamma - one(T)) \u003c= u_R - u_L\n    S_vac_L = u_L + T(2) * c_L / (gamma - one(T))\n    S_vac_R = u_R - T(2) * c_R / (gamma - one(T))\n\n    # Pre-calculate exact p_star and u_star\n    function pressure_func(p_star_guess::T)\n        f_L = p_star_guess > p_L ? (p_star_guess - p_L) * sqrt((T(2.0) / ((gamma + one(T)) * rho_L)) / (p_star_guess + p_L * (gamma - one(T)) / (gamma + one(T)))) : (T(2.0) * c_L / (gamma - one(T))) * ((p_star_guess / p_L)^((gamma - one(T)) / (T(2.0) * gamma)) - one(T))\n        f_R = p_star_guess > p_R ? (p_star_guess - p_R) * sqrt((T(2.0) / ((gamma + one(T)) * rho_R)) / (p_star_guess + p_R * (gamma - one(T)) / (gamma + one(T)))) : (T(2.0) * c_R / (gamma - one(T))) * ((p_star_guess / p_R)^((gamma - one(T)) / (T(2.0) * gamma)) - one(T))\n        return f_L + f_R + (u_R - u_L)\n    end\n\n    # Newton iteration for p*. Tolerance and floor are relative to the data (absolute 1e-9 values made the solution\n    # scale dependent: wrong star states for pressures ~1e-8, and in Float32 the tolerance was never reached).\n    u_scale = abs(u_L) + abs(u_R) + c_L + c_R\n    p_floor = eps(T) * min(p_L, p_R)\n    p_star  = T(0.5) * (p_L + p_R)\n    for _ in 1:(vacuum ? 0 : 100)\n        f_p = pressure_func(p_star)\n        if abs(f_p) \u003c= 16 * eps(T) * u_scale; break; end\n        dfdp = (pressure_func(p_star * T(1.001)) - f_p) / (p_star * T(0.001))\n        dfdp > zero(T) || break                        # f is increasing in p*; a non-positive slope is round-off\n        p_star = max(p_floor, p_star - f_p / dfdp)\n    end\n\n    f_L_final = p_star > p_L ? (p_star - p_L) * sqrt((T(2.0) / ((gamma + one(T)) * rho_L)) / (p_star + p_L * (gamma - one(T)) / (gamma + one(T)))) : (T(2.0) * c_L / (gamma - one(T))) * ((p_star / p_L)^((gamma - one(T)) / (T(2.0) * gamma)) - one(T))\n    u_star = u_L - f_L_final\n\n    return function exact_euler_riemann(st::SVector)\n        t = T(st[end])\n        x = T(st[1])\n        \n        if t \u003c= zero(T); return ic(SVector{1, T}(x)); end\n        \n        s_query = σ * (x - x0) / t\n        rho_final, u_final, p_final = zero(T), zero(T), zero(T)\n\n        if vacuum\n            if s_query \u003c= u_L - c_L                                  # left state\n                rho_final, u_final, p_final = rho_L, u_L, p_L\n            elseif s_query \u003c S_vac_L                                 # left rarefaction fan\n                u_final = (T(2.0) / (gamma + one(T))) * (c_L + (gamma - one(T)) / T(2.0) * u_L + s_query)\n                c_final = c_L - (gamma - one(T)) / T(2.0) * (u_final - u_L)\n                rho_final = rho_L * (c_final / c_L)^(T(2.0) / (gamma - one(T)))\n                p_final = p_L * (rho_final / rho_L)^gamma\n            elseif s_query \u003c= S_vac_R                                # vacuum: ρ = p = 0 (and zero momentum)\n                rho_final, u_final, p_final = zero(T), zero(T), zero(T)\n            elseif s_query \u003c u_R + c_R                               # right rarefaction fan\n                u_final = (T(2.0) / (gamma + one(T))) * (-c_R + (gamma - one(T)) / T(2.0) * u_R + s_query)\n                c_final = c_R + (gamma - one(T)) / T(2.0) * (u_final - u_R)\n                rho_final = rho_R * (c_final / c_R)^(T(2.0) / (gamma - one(T)))\n                p_final = p_R * (rho_final / rho_R)^gamma\n            else                                                     # right state\n                rho_final, u_final, p_final = rho_R, u_R, p_R\n            end\n        elseif s_query \u003c= u_star # Left of contact\n            if p_star > p_L # Left Shock\n                S_L = u_L - c_L * sqrt((gamma + one(T)) / (T(2.0) * gamma) * (p_star / p_L) + (gamma - one(T)) / (T(2.0) * gamma))\n                rho_star_L = rho_L * ((p_star / p_L) + (gamma - one(T)) / (gamma + one(T))) / (one(T) + (p_star / p_L) * (gamma - one(T)) / (gamma + one(T)))\n                rho_final, u_final, p_final = s_query \u003c= S_L ? (rho_L, u_L, p_L) : (rho_star_L, u_star, p_star)\n            else # Left Rarefaction\n                S_head_L = u_L - c_L\n                S_tail_L = u_star - c_L * (p_star / p_L)^((gamma - one(T)) / (T(2.0) * gamma))\n                if s_query \u003c= S_head_L; rho_final, u_final, p_final = rho_L, u_L, p_L\n                elseif s_query >= S_tail_L; rho_final, u_final, p_final = rho_L * (p_star / p_L)^(one(T) / gamma), u_star, p_star\n                else\n                    u_final = (T(2.0) / (gamma + one(T))) * (c_L + (gamma - one(T)) / T(2.0) * u_L + s_query)\n                    c_final = c_L - (gamma - one(T)) / T(2.0) * (u_final - u_L)\n                    rho_final = rho_L * (c_final / c_L)^(T(2.0) / (gamma - one(T)))\n                    p_final = p_L * (rho_final / rho_L)^gamma\n                end\n            end\n        else # Right of contact\n            if p_star > p_R # Right Shock\n                S_R = u_R + c_R * sqrt((gamma + one(T)) / (T(2.0) * gamma) * (p_star / p_R) + (gamma - one(T)) / (T(2.0) * gamma))\n                rho_star_R = rho_R * ((p_star / p_R) + (gamma - one(T)) / (gamma + one(T))) / (one(T) + (p_star / p_R) * (gamma - one(T)) / (gamma + one(T)))\n                rho_final, u_final, p_final = s_query >= S_R ? (rho_R, u_R, p_R) : (rho_star_R, u_star, p_star)\n            else # Right Rarefaction\n                S_head_R = u_R + c_R\n                S_tail_R = u_star + c_R * (p_star / p_R)^((gamma - one(T)) / (T(2.0) * gamma))\n                if s_query >= S_head_R; rho_final, u_final, p_final = rho_R, u_R, p_R\n                elseif s_query \u003c= S_tail_R; rho_final, u_final, p_final = rho_R * (p_star / p_R)^(one(T) / gamma), u_star, p_star\n                else\n                    u_final = (T(2.0) / (gamma + one(T))) * (-c_R + (gamma - one(T)) / T(2.0) * u_R + s_query)\n                    c_final = c_R + (gamma - one(T)) / T(2.0) * (u_final - u_R)\n                    rho_final = rho_R * (c_final / c_R)^(T(2.0) / (gamma - one(T)))\n                    p_final = p_R * (rho_final / rho_R)^gamma\n                end\n            end\n        end\n\n        return SVector{3, T}(rho_final, σ * rho_final * u_final, p_final / (gamma - one(T)) + T(0.5) * rho_final * u_final^2)\n    end\nend"},{"name":"linear_advection.jl","path":"src/PDEs/linear_advection.jl","type":"file","files":1,"lines":143,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":143}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":143}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":143}}},"parts":[{"lines":137,"runs":[[1,63],[67,69],[72,94],[96,143]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":6,"runs":[[64,66],[70,71],[95,95]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export LinearAdvection\n\n\"\"\"\n    LinearAdvection{D, M, T, L} \u003c: HyperbolicPDE{D, M, T}\n\nImplements N-dimensional, M-variable coupled linear advection systems. \n\n# Fields\n- `vel::Velocity{D, M, T, L}`: The constant advective velocity matrices for each spatial dimension.\n- `max_eigs::SVector{D, T}`: The precomputed spectral radius (maximum absolute eigenvalue) for each spatial matrix, used to optimize runtime execution.\n\n# Constructors\n- `LinearAdvection(velocities, ::Type{T}=eltype(velocities[1]))`: Automatically extracts the spatial dimension `D` and system size `M` from the provided velocity matrices and precomputes the exact spectral radii.\n\"\"\"\nstruct LinearAdvection{D, M, T, L} \u003c: HyperbolicPDE{D, M, T}\n    vel::Velocity{D, M, T, L}\n    max_eigs::SVector{D, T}\nend\n\n# Smart constructor\nfunction LinearAdvection(velocities, ::Type{T}=eltype(velocities[1])) where {T}\n    vel_svec = param2vel(velocities, T)\n    \n    D = length(vel_svec)\n    M = size(vel_svec[1], 1)\n    L = M * M # Extract the total length parameter\n    \n    # Precompute the exact spectral radius\n    max_eigs = SVector{D, T}(ntuple(d -> T(maximum(abs.(eigvals(Matrix(vel_svec[d]))))), Val(D)))\n    \n    return LinearAdvection{D, M, T, L}(vel_svec, max_eigs)\nend\n\n@inline prim2cons(::LinearAdvection, U::State) = U\n@inline cons2prim(::LinearAdvection, W::State) = W\n\n@inline function flux(eq::LinearAdvection{D, M, T}, U::State) where {D, M, T}\n    return Flux{D, M, T}(ntuple(Val(D)) do d\n        State{M, T}(eq.vel[d] * U)\n    end)\nend\n\n@inline function max_eigenvalue(eq::LinearAdvection, U::State, d::Int)\n    return eq.max_eigs[d]\nend\n\n# API implementation returning the strict M x M matrix\n@inline velocity(eq::LinearAdvection, U::State, d::Int) = eq.vel[d]\n\n# Moving grids (scalar systems only: the transport velocity is unambiguous)\n@inline fluid_velocity(eq::LinearAdvection{D, 1, T}, U::State) where {D, T} = Space{D, T}(ntuple(d -> eq.vel[d][1, 1], Val(D)))\n@inline max_eigenvalue(eq::LinearAdvection{D, 1, T}, U::State, d::Int, shift::Real) where {D, T} = abs(eq.vel[d][1, 1] - T(shift))\n\n# Fulfill the core API for kinetic relaxation speeds\n@inline function kinetic_wave_speed(eq::LinearAdvection{D, NK, T}, d::Int, k::Int) where {D, NK, T}\n    return eq.vel[d][k,k]\nend\n\n# ---------------------------------------------------------\n# Analytic Closures\n# ---------------------------------------------------------\n\nfunction analytic_closure(eq::LinearAdvection{D, M, T}, ic::InitialCondition, geom::GeometricDomain) where {D, M, T}\n    # 1. Safety Check: Ensure multi-dimensional system matrices commute. The tolerance is relative to the\n    # matrix norms (round-off of the products scales with them) and to the precision T.\n    tol = sqrt(eps(T))\n    if D > 1\n        for i in 1:D\n            for j in (i+1):D\n                Ai, Aj = eq.vel[i], eq.vel[j]\n                if norm(Ai * Aj - Aj * Ai) > tol * norm(Ai) * norm(Aj)\n                    error(\"Velocity matrices for dimensions $i and $j do not commute. Analytic ray-tracing closure is not mathematically valid for this system.\")\n                end\n            end\n        end\n    end\n\n    mins = geom.mins\n    maxs = geom.maxs\n    is_per = geom.is_periodic\n    \n    # 2. System Eigendecomposition (Safe to sum since they commute)\n    vel_sum = sum(eq.vel)\n    F = eigen(Matrix(vel_sum)) \n    \n    # Force the eigen decomposition back into the requested precision T\n    R = SMatrix{M, M, T}(real.(F.vectors))\n    L = inv(R)\n    \n    # The eigenvectors of Σ_d A_d only diagonalise every A_d if its eigenvalues are simple (or the\n    # family is diagonal). Verify instead of silently tracing wrong wave speeds.\n    for d in 1:D\n        Λ = L * eq.vel[d] * R\n        off = maximum(abs(Λ[i, j]) for i in 1:M, j in 1:M if i != j; init = zero(T))\n        off \u003c= tol * max(one(T), maximum(abs, Λ)) || error(\n            \"Velocity matrix of dimension $d is not diagonalised by the eigenvectors of the summed system \" *\n            \"(repeated eigenvalues); the analytic ray-tracing closure cannot be built for this system.\")\n    end\n\n    wave_speeds = SVector{M, SVector{D, T}}(ntuple(Val(M)) do m\n        SVector{D, T}(ntuple(Val(D)) do d\n            (L * eq.vel[d] * R)[m, m]\n        end)\n    end)\n    \n    return function exact_linear_system(st::SVector)\n        # Ensure spacetime vector inputs are properly cast to T\n        t = T(st[end])\n        pos = SVector{D, T}(ntuple(d -> T(st[d]), Val(D))) \n        \n        u_final = zeros(MVector{M, T})\n        \n        # 3. Characteristic Tracing\n        for m in 1:M\n            vel_m = wave_speeds[m]\n            \n            pos0 = pos - vel_m * t\n            \n            pos0 = SVector{D, T}(ntuple(Val(D)) do d\n                if is_per[d]\n                    mins[d] + mod(pos0[d] - mins[d], maxs[d] - mins[d])\n                else\n                    pos0[d]\n                end\n            end)\n            \n            u0 = ic(pos0)\n            \n            # Project into characteristic variables\n            w_m = zero(T)\n            for k in 1:M\n                w_m += L[m, k] * u0[k]\n            end\n            \n            # Reconstruct into physical variables\n            for k in 1:M\n                u_final[k] += R[k, m] * w_m\n            end\n        end\n        \n        return State{M, T}(Tuple(u_final))\n    end\nend"}]},{"name":"SimulationFunctions","path":"src/SimulationFunctions","type":"dir","files":4,"lines":379,"counts":{"AI-Generation":{"files":{"G2":1.0234375,"G3":2.9765625},"lines":{"G2":34,"G3":345}},"Human-Review":{"files":{"H0":2.9504456485564523,"H1":0.049554351443547716,"H2":1.0},"lines":{"H0":342,"H1":6,"H2":31}},"AI-Review":{"files":{"A0":0.10446740577419086,"A1":3.895532594225809},"lines":{"A0":12,"A1":367}}},"errors":0,"children":[{"name":"_main.jl","path":"src/SimulationFunctions/_main.jl","type":"file","files":1,"lines":31,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":31,"runs":[[1,31]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export extract_namespace\n\n\"\"\"\n    extract_namespace(params::Dict, prefix::Symbol; separator::String=\"_\")\n\nExtracts all keys from a dictionary that start with the given `prefix` followed by the `separator` (e.g., `PDE_name`). Leaves the values exactly as they are (preserving tuples for hashing) and returns a new dictionary with the stripped keys.\n\"\"\"\nfunction extract_namespace(params::Dict, prefix::Symbol; separator::String=\"_\")\n    prefix_str = string(prefix) * separator\n    len = length(prefix_str)\n    \n    extracted = Dict{Symbol, Any}()\n    for (k, v) in params\n        k_str = string(k)\n        if startswith(k_str, prefix_str)\n            new_key = Symbol(k_str[len+1:end])\n            extracted[new_key] = v\n        end\n    end\n    return extracted\nend\n\n@inline _unwrap(v::SVector{1, T}) where {T} = v[1]\n@inline _unwrap(v) = v\n\n@inline get_D(::HyperbolicPDE{D}) where {D} = D\n@inline get_M(::HyperbolicPDE{D,M}) where {D,M} = M\n\ninclude(\"direct.jl\")\ninclude(\"kinetic.jl\")\ninclude(\"bgk.jl\")"},{"name":"bgk.jl","path":"src/SimulationFunctions/bgk.jl","type":"file","files":1,"lines":128,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.0234375,"G3":0.9765625},"lines":{"G2":3,"G3":125}},"Human-Review":{"files":{"H0":0.96875,"H1":0.03125},"lines":{"H0":124,"H1":4}},"AI-Review":{"files":{"A0":0.03125,"A1":0.96875},"lines":{"A0":4,"A1":124}}},"parts":[{"lines":121,"runs":[[1,15],[18,66],[68,104],[106,110],[114,128]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":3,"runs":[[16,17],[105,105]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":3,"runs":[[67,67],[112,113]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":1,"runs":[[111,111]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 04a3f13"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"\nexport run_bgk_simulation\n\n\"\"\"\n    run_bgk_simulation(params::ParamDict) -> Union{AbstractSimData, Nothing}\n\nRuns the discrete-velocity BGK model (`:PDE_name => :bgk`, see [`BGKEquation`](@ref)). The particle\nstate is the distribution at the velocity nodes; the `IC` namespace gives the macroscopic state\n`(ρ, ρu..., E)` (initial conditions are built with `M = D + 2`, like an Euler run with the same `γ`), and\nevery particle starts in its discrete Maxwellian. The collision term is implicit for an IMEX tableau\n([`BGKRelaxation`](@ref)), explicit for an explicit one ([`ExplicitBGKRelaxation`](@ref)) and dropped in\nthe collisionless limit (`:PDE_tau => Inf`). Schemes, fluxes, limiters, MOOD and the grid are configured\nexactly as for the other equations.\n\nThe returned snapshots hold the macroscopic moments `(ρ, ρu..., E)`, directly comparable with Euler\nruns; with `:save_relax => true` (or `:Kinetic_save_relax => true`, as for `run_kinetic_simulation`) they keep the\nfull distributions instead.\n`run_direct_simulation` and `run_kinetic_simulation` forward BGK configurations here, so the method\ndictionaries work unchanged.\n\"\"\"\nfunction run_bgk_simulation(params::ParamDict)::Union{AbstractSimData, Nothing}\n    T = get(params, :T, Float64)\n\n    try\n        @info \"--- Running BGK Simulation ---\"\n        context = Dict{Symbol, Any}()\n        context[:T] = T\n        context[:Storage] = storage_for(get_backend())   # a GPU backend runs on its device\n        apply_memory_limit!(context)                      # set_memory_limit!: reserve the buffers once\n\n        # 1. Extract Config Namespaces\n        pde_conf    = extract_namespace(params, :PDE)\n        domain_conf = extract_namespace(params, :Grid)\n        grid_conf   = extract_namespace(params, :Grid)\n        weight_conf = extract_namespace(params, :Weight)\n        flux_conf   = extract_namespace(params, :Flux)\n        lim_conf    = extract_namespace(params, :Limiter)\n        mood_conf   = extract_namespace(params, :MOOD)\n        scheme_conf = extract_namespace(params, :Scheme)\n        ic_conf     = extract_namespace(params, :IC)\n        time_conf   = extract_namespace(params, :Time)\n        adapt_conf  = extract_namespace(params, :Adapt)\n\n        # 2. Equation; the initial condition lives in the macroscopic (Euler) variables\n        eq = build_equation(pde_conf, context)\n        eq isa BGKEquation || error(\"run_bgk_simulation needs a BGK equation (:PDE_name => :bgk), got $(typeof(eq))\")\n        D = get_D(eq)\n\n        context[:Equation] = euler_limit(eq)\n        context[:D] = D\n        context[:M] = D + 2\n        IC = build_ic(ic_conf, context)\n\n        context[:Equation] = eq\n        context[:M] = get_M(eq)\n\n        # 3. Collision term: implicit for IMEX tableaus, explicit otherwise\n        context[:Tableau] = build_tableau(time_conf, context)\n        context[:ExplicitSources], context[:ImplicitSources] = bgk_sources(eq, context[:Tableau])\n        collision = _is_collisionless(eq.relaxation) ? \"none (collisionless)\" :\n                    isempty(context[:ImplicitSources]) ? \"explicit\" : \"implicit\"\n        @info \"BGK: D = $D, $(num_velocities(eq)) velocities, $(get_M(eq)) equations, γ = $(round(eq.gamma; digits = 4)), \" *\n              \"collision: $collision\"\n\n        # 4. Geometry & Grid\n        geom = build_domain(domain_conf, context)\n        _check_wall_ops(eq, geom)\n        context[:Domain] = geom\n        context[:WeightConf] = weight_conf\n\n        pg = build_run_grid(grid_conf, context)           # also sets context[:Grid]\n        adaptivity = build_adaptivity(adapt_conf, context)\n\n        # 5. Spatial Schemes\n        context[:Flux]    = build_flux(flux_conf, context)\n        context[:Limiter] = build_limiter(lim_conf, context)\n        context[:MOOD]    = build_mood(mood_conf, context)\n        context[:Scheme]  = build_scheme(scheme_conf, context)\n\n        # 6. Time Stepper\n        method = build_run_timestepper(context; time_conf = time_conf)\n        _log_memory(context)\n\n        # 7. Initialization (discrete Maxwellian of the macroscopic initial state)\n        set_initial_conditions!(pg, eq, IC)\n\n        # 8. Time Settings\n        is_cfl = haskey(time_conf, :CFL)\n        dt = is_cfl ? T(time_conf[:CFL]) : T(time_conf[:dt])\n        tmax = T(get(time_conf, :tmax, params[:tmax]))\n\n        # 9. Execution\n        xs_svector, us_svector, ts_full, k_step, elapsed_time = solve_equation(\n            method, eq, pg, tmax, dt;\n            is_cfl = is_cfl, snapshots = params[:snapshots],\n            remove_ghosts = get(params, :remove_ghosts, true),\n            show_progress = _PROGRESS_BAR[], progress_interval = _PROGRESS_INTERVAL[],\n            adaptivity = adaptivity\n        )\n\n        @info \"BGK Simulation (D=$D) finished in $(round(elapsed_time, digits=2)) seconds.\"\n\n        # 10. Data Packaging: macroscopic moments unless the distributions are requested\n        valid_indices = findall(i -> isassigned(us_svector, i), 1:length(us_svector))\n        us_final = if get(params, :save_relax, false) || get(params, :Kinetic_save_relax, false)   # as the kinetic runner\n            us_svector[valid_indices]\n        else\n            [[moments(eq, u) for u in snap] for snap in us_svector[valid_indices]]\n        end\n\n        sim_data = create_sim_data(xs_svector[valid_indices], us_final, ts_full[valid_indices], params; xmins=Tuple(geom.mins), xmaxs=Tuple(geom.maxs), tmin=zero(T), tmax=tmax,\n                                   metadata = run_metadata(context, k_step, ts_full[last(valid_indices)], tmax;\n                                                           final_state = last(us_final)))\n        add_stat!(sim_data, :Runtime, elapsed_time, :none)\n        add_stat!(sim_data, :k_step, Float64(k_step), :none)\n        add_stat!(sim_data, :final_particle_count, Float64(pg.meta.N), :none)\n        record_memory!(sim_data, context)\n\n        return sim_data\n\n    catch e\n        @error \"Error during BGK Simulation!\" exception=(e, catch_backtrace())\n        return nothing\n    end\nend\n\n# BGK configurations carry their own collision term, so the direct and kinetic runners hand them over.\n_is_bgk(params) = get(params, :PDE_name, nothing) === :bgk\n"},{"name": t{Symbol, Any}()\n        context[:T] = T\n        context[:Storage] = storage_for(get_backend())   # a GPU backend runs on its device\n        apply_memory_limit!(context)                      # set_memory_limit!: reserve the buffers once\n        \n        # 1. Extract Config Namespaces\n        pde_conf    = extract_namespace(params, :PDE)\n        kin_conf    = extract_namespace(params, :Kinetic)\n        domain_conf = extract_namespace(params, :Grid) \n        grid_conf   = extract_namespace(params, :Grid)\n        weight_conf = extract_namespace(params, :Weight)\n        flux_conf   = extract_namespace(params, :Flux)\n        lim_conf    = extract_namespace(params, :Limiter)\n        mood_conf   = extract_namespace(params, :MOOD)\n        scheme_conf = extract_namespace(params, :Scheme)\n        ic_conf     = extract_namespace(params, :IC)\n        time_conf   = extract_namespace(params, :Time)\n        adapt_conf  = extract_namespace(params, :Adapt)\n        \n        # 2. Base Macroscopic Equation\n        eq_macro = build_equation(pde_conf, context)\n        D = get_D(eq_macro)\n        \n        context[:Equation] = eq_macro \n        context[:D] = D\n        context[:M] = get_M(eq_macro)\n\n        IC = build_ic(ic_conf, context)\n        \n        # 3. Build Kinetic System\n        eq_kin, source_term = build_kinetic_system(kin_conf, context)\n        \n        # Overwrite Context for downstream components to scale to NK dimensions\n        context[:Equation] = eq_kin\n        context[:M] = get_M(eq_kin)\n        context[:ExplicitSources] = ()\n        context[:ImplicitSources] = (source_term,)\n        \n        # 4. Geometry & Grid\n        geom = build_domain(domain_conf, context)\n        _check_wall_ops(eq_kin, geom)\n        context[:Domain] = geom\n        context[:WeightConf] = weight_conf\n        \n        pg = build_run_grid(grid_conf, context)           # also sets context[:Grid]\n        adaptivity = build_adaptivity(adapt_conf, context)\n        \n        # 5. Spatial Schemes\n        context[:Flux]    = build_flux(flux_conf, context)\n        context[:Limiter] = build_limiter(lim_conf, context)\n        context[:MOOD]    = build_mood(mood_conf, context)\n        context[:Scheme]  = build_scheme(scheme_conf, context)\n        \n        # 6. Time Stepper\n        context[:Tableau] = build_tableau(time_conf, context)\n        method = build_run_timestepper(context; time_conf = time_conf)\n        _log_memory(context)\n        \n        # 7. Initialization\n        set_initial_conditions!(pg, source_term, IC, eq_macro)\n        \n        # 8. Time Settings\n        is_cfl = haskey(time_conf, :CFL)\n        dt = is_cfl ? T(time_conf[:CFL]) : T(time_conf[:dt])\n        tmax = T(get(time_conf, :tmax, params[:tmax]))\n        \n        # 9. Execution\n        xs_svector, us_svector, ts_full, k_step, elapsed_time = solve_equation(\n            method, eq_kin, pg, tmax, dt; \n            is_cfl = is_cfl, snapshots = params[:snapshots], \n            remove_ghosts = get(params, :remove_ghosts, true), \n            show_progress = _PROGRESS_BAR[], progress_interval = _PROGRESS_INTERVAL[],\n            adaptivity = adaptivity\n        )\n        \n        @info \"Kinetic Simulation (D=$D) finished in$(round(elapsed_time, digits=2)) seconds.\"\n\n        # 10. Data Packaging & Macroscopic Collapse\n        valid_indices = findall(i -> isassigned(us_svector, i), 1:length(us_svector))\n        \n        if get(params, :save_relax, false) || get(kin_conf, :save_relax, false)\n            us_final = us_svector[valid_indices]\n        else\n            # Extract km directly from the returned source_term\n            km = source_term.km\n            us_final = [[km(u) for u in snap] for snap in us_svector[valid_indices]]\n        end\n        \n        sim_data = create_sim_data(xs_svector[valid_indices], us_final, ts_full[valid_indices], params; xmins=Tuple(geom.mins), xmaxs=Tuple(geom.maxs), tmin=zero(T), tmax=tmax,\n                                   metadata = run_metadata(context, k_step, ts_full[last(valid_indices)], tmax;\n                                                           final_state = last(us_final)))\n        add_stat!(sim_data, :Runtime, elapsed_time, :none)\n        add_stat!(sim_data, :k_step, Float64(k_step), :none)\n        add_stat!(sim_data, :final_particle_count, Float64(pg.meta.N), :none)\n        record_memory!(sim_data, context)\n        \n        return sim_data\n\n    catch e\n        @error \"Error during Kinetic Simulation!\" exception=(e, catch_backtrace())\n        return nothing\n    end\nend"}]},{"name":"SourceTerms","path":"src/SourceTerms","type":"dir","files":3,"lines":247,"counts":{"AI-Generation":{"files":{"G2":2.174757281553398,"G3":0.825242718446602},"lines":{"G2":162,"G3":85}},"Human-Review":{"files":{"H0":0.825242718446602,"H1":0.17475728155339806,"H2":2.0},"lines":{"H0":85,"H1":18,"H2":144}},"AI-Review":{"files":{"A1":3.0},"lines":{"A1":247}}},"errors":0,"children":[{"name":"_main.jl","path":"src/SourceTerms/_main.jl","type":"file","files":1,"lines":2,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":2,"runs":[[1,2]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"include(\"kineti (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export BGKRelaxation, ExplicitBGKRelaxation\n\n# =========================================================================\n# BGK COLLISION TERM\n# =========================================================================\n\"\"\"\n    BGKRelaxation(eq::BGKEquation) \u003c: AbstractImplicitSourceTerm\n    ExplicitBGKRelaxation(eq::BGKEquation) \u003c: AbstractExplicitSourceTerm\n\nThe BGK collision term `S(f) = (M[f] - f) / τ` with the conservative discrete Maxwellian `M[f]` of\n[`equilibrium`](@ref) and `τ` from the equation's [`RelaxationTimeModel`](@ref), treated implicitly\n(IMEX tableaus) or explicitly (explicit RK tableaus, only stable for `Δt ≲ τ`).\n\nThe implicit stage equation `f = f* + Δt a_ii S(f)` is solved in closed form: the collision conserves\nthe moments, so `M[f] = M[f*]` and `τ(f) = τ(f*)`, and `f = (f* + λ M[f*]) / (1 + λ)` with\n`λ = Δt a_ii / τ`. This is exact for any stiffness (`τ → 0` projects onto the equilibrium, and `τ = 0`,\ni.e. `λ = Inf`, returns `M[f*]`), which makes the IMEX scheme asymptotic preserving towards the Euler\nequations. The explicit form divides by `τ`, so `bgk_sources` rejects `τ = 0` for explicit tableaus. A non-physical particle state\n(`ρ ≤ 0` or `θ ≤ 0`) is left untouched (zero source).\n\"\"\"\nstruct BGKRelaxation{E \u003c: BGKEquation} \u003c: AbstractImplicitSourceTerm\n    eq::E\nend\n\n\"The explicit form of the BGK collision term, see [`BGKRelaxation`](@ref).\"\nstruct ExplicitBGKRelaxation{E \u003c: BGKEquation} \u003c: AbstractExplicitSourceTerm\n    eq::E\nend\n\nconst _BGKCollision = Union{BGKRelaxation, ExplicitBGKRelaxation}\n\n@inline function evaluate_source(st::_BGKCollision, f::State{M, T}, p_idx::Int, pg, t::Real) where {M, T}\n    U = moments(st.eq, f)\n    f_eq, ok = equilibrium(st.eq, U)\n    ok || return zero(f)\n    # τ = 0 gives ±Inf/NaN here. The IMEX steppers only evaluate it at stages with a_ii = 0, and in the shipped\n    # tableaus it never enters the update there: IMEX_Euler_Tableau and IMEX_ARS233_Tableau (config keys :IMEXEuler,\n    # :ARS233) have a zero first column and b[1] = 0; IMEX_ARS222_Tableau, IMEX_PRSSP3_Tableau and IMEX_SSP2332_Tableau\n    # (:ARS222, :PRSSP3, :SSP332) have no\n    # such stage. A tableau that used it would turn the run into NaN\n    # (loudly) rather than silently drop the collision.\n    return (f_eq - f) / relaxation_time(st.eq, U)\nend\n\n@inline function implicit_solve(st::BGKRelaxation, f::State{M, T}, dt_coeff::Real, p_idx::Int, pg, t::Real) where {M, T}\n    U = moments(st.eq, f)\n    f_eq, ok = equilibrium(st.eq, U)\n    ok || return f\n    λ = T(dt_coeff) / relaxation_time(st.eq, U)\n    isinf(λ) && return f_eq                 # τ = 0: projection onto the equilibrium (Inf / Inf otherwise)\n    return (f + λ * f_eq) / (one(T) + λ)\nend\n\n\"\"\"\n    bgk_sources(eq::BGKEquation, tableau::IMEXButcherTableau) -> (explicit, implicit)\n\nThe source tuples of a BGK run: the collision term implicit for an IMEX tableau, explicit for a purely\nexplicit one, and none in the collisionless limit (`ConstantRelaxationTime(Inf)`). A zero relaxation time\n(`τ = 0`, or a zero viscosity) needs an IMEX tableau: the explicit collision term `(M[f] - f) / τ` is then\nundefined, so it throws an `ArgumentError`.\n\"\"\"\nfunction bgk_sources(eq::BGKEquation, tableau::IMEXButcherTableau)\n    _is_collisionless(eq.relaxation) && return (), ()\n    all(iszero, tableau.a) || return (), (BGKRelaxation(eq),)\n    _is_zero_relaxation(eq.relaxation) && throw(ArgumentError(\n        \"BGK: the relaxation time is zero, which the explicit collision term (M[f] - f) / τ cannot handle; \" *\n        \"use an IMEX time stepper (e.g. :ARS222) for τ = 0\"))\n    return (ExplicitBGKRelaxation(eq),), ()\nend\n\n# =========================================================================\n# INITIAL CONDITIONS\n# =========================================================================\n\n\"\"\"\n    set_initial_conditions!(pg::ParticleGrid, eq::BGKEquation, IC::InitialCondition)\n\nFor the BGK equation `IC` gives the macroscopic state `(ρ, ρu..., E)` (the conservative Euler variables\nof [`euler_limit`](@ref)); every particle starts in the conservative discrete Maxwellian of that state.\nIf the velocity grid cannot represent a state (its moments differ from `U` by more than `√ε`, relative per\ncomponent to ρ, ρ(|u| + √θ) and E as in `equilibrium`; e.g. a mean velocity near `vmax` or a temperature the grid\ndoes not resolve), it warns once with the number of such particles: the run then starts from a different\nmacroscopic state (and in the unresolved cold case the collision may not conserve it). (`equilibrium` itself runs\nin kernels and stops silently at the closest equilibrium.)\n\"\"\"\nfunction set_initial_conditions!(pg::ParticleGrid, eq::BGKEquation{D, M, T}, IC::InitialCondition) where {D, M, T}\n    n_bad, worst = Ref(0), Ref(zero(T))\n    set_states!(pg) do pos\n        U = IC(pos)\n        length(U) == D + 2 || error(\"BGK initial conditions give the macroscopic state (ρ, ρu..., E) of length $(D + 2), got $(length(U))\")\n        Uv = SVector{D + 2, T}(U)\n        f, ok = equilibrium(eq, Uv)\n        ok || error(\"initial state $U at $pos is not admissible for the BGK equation (ρ > 0, θ > 0)\")\n        ρ, u, θ = _primitives(eq, Uv)\n        scale = SVector{D + 2, T}(ρ, ntuple(_ -> ρ * (sqrt(sum(abs2, u)) + sqrt(θ)), Val(D))..., Uv[D + 2])\n        r = _scaled_residual(moments(eq, f) - Uv, scale)\n        r > sqrt(eps(T)) && (n_bad[] += 1; worst[] = max(worst[], r))\n        f\n    end\n    n_bad[] > 0 && @warn \"BGK initial state: the velocity grid cannot represent the macroscopic state of $(n_bad[]) \" *\n                         \"particle(s) (relative moment error up to $(worst[])); enlarge `vmax` or refine the velocity grid\"\n    return nothing\nend\n"},{"name":"kinetic.jl","path":"src/SourceTerms/kinetic.jl","type":"file","files":1,"lines":142,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":142,"runs":[[1,142]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export Kin2Macro, RelaxationSourceTerm\n\n\"\"\"\n    Kin2Macro{NM, NK}\n\nA mapping structure bridging kinetic (`NK`) and macroscopic (`NM`) state components.\n\"\"\"\nstruct Kin2Macro{NM, NK}\n    ranges::NTuple{NM, UnitRange{Int}}\n    k_to_m::NTuple{NK, Int}\nend\n\nfunction Kin2Macro(edges::Union{Vector{Int},Tuple})\n    NM = length(edges) - 1\n    NK = edges[end] - 1\n    ranges = ntuple(i -> edges[i]:(edges[i+1]-1), NM)\n    \n    k_to_m_array = zeros(Int, NK)\n    for m in 1:NM\n        for k in ranges[m]\n            k_to_m_array[k] = m\n        end\n    end\n    \n    return Kin2Macro{NM,NK}(ranges, Tuple(k_to_m_array))\nend\n\n@inline (km::Kin2Macro{NM,NK})(v::AbstractVector) where {NM,NK} = State{NM}(ntuple(i -> sum(v[k] for k in km.ranges[i]), Val(NM)))\n@inline (km::Kin2Macro{NM,NK})(k::Int) where {NM,NK} = km.k_to_m[k]\n\n@inline function flux_dot(F::Flux{D, NM, T}, m_idx::Int, scaled_inv_speed::Space{D, T}) where {D, NM, T}\n    return sum(ntuple(d -> F[d][m_idx] * scaled_inv_speed[d], Val(D)))\nend\n\n# =========================================================================\n# LOCAL RELAXATION SOURCE TERM\n# =========================================================================\n\"\"\"\n    RelaxationSourceTerm{D, NM, NK, T, MEQ} \u003c: AbstractImplicitSourceTerm\n\nModels the stiff local relaxation of a kinetic system toward the macroscopic Maxwellian equilibrium state.\n\n# Constructors\n- `RelaxationSourceTerm(km, eps, coeffs, macro_eq, eq_kin, interior_factor)`: Precomputes the scaled inverse kinetic wave speeds utilizing the `kinetic_wave_speed` API, scaling them by the `interior_factor` (which defaults to the spatial dimension `D`). It stores the inverse of the relaxation parameter (`eps`) to optimize the runtime implicit solve.\n\"\"\"\nstruct RelaxationSourceTerm{D, NM, NK, T, MEQ \u003c: HyperbolicPDE} \u003c: AbstractImplicitSourceTerm\n    km::Kin2Macro{NM, NK}\n    macro_eq::MEQ\n    inv_epsilon::T\n    coefficients::State{NM, T}\n    scaled_inv_speeds::SVector{NK, Space{D, T}}\nend\n\nfunction RelaxationSourceTerm(\n    km::Kin2Macro{NM, NK}, \n    eps::T, \n    coeffs::State{NM, T}, \n    macro_eq::HyperbolicPDE{D, NM, T},\n    eq_kin::HyperbolicPDE{D, NK, T}, \n    interior_factor::T = T(D)\n) where {D, NM, NK, T}\n    \n    # We now extract speeds using the generic kinetic_wave_speed API instead of hardcoded .vel\n    scaled_inv_speeds = ntuple(Val(NK)) do k\n        Space{D, T}(ntuple(Val(D)) do d\n            v = kinetic_wave_speed(eq_kin, d, k)\n            abs(v) > T(1e-14) ? interior_factor / v : zero(T)\n        end)\n    end\n    \n    return RelaxationSourceTerm(\n        km, macro_eq, one(T) / eps, coeffs, SVector{NK, Space{D, T}}(scaled_inv_speeds)\n    )\nend\n\n@inline function evaluate_source(rs::RelaxationSourceTerm{D, NM, NK, T}, U_kinetic::State{NK, T}, p_idx::Int, pg::ParticleGrid, t::Real) where {D, NM, NK, T}\n    u_macro = rs.km(U_kinetic)\n    flux_vals = flux(rs.macro_eq, u_macro)\n    \n    return State{NK, T}(ntuple(Val(NK)) do k\n        m_idx = rs.km(k)\n        f_dot_inv_lambda = flux_dot(flux_vals, m_idx, rs.scaled_inv_speeds[k])\n        \n        Mk = rs.coefficients[m_idx] * (u_macro[m_idx] + f_dot_inv_lambda)\n        (Mk - U_kinetic[k]) * rs.inv_epsilon\n    end)\nend\n\n\n@inline function implicit_solve(\n    rs::RelaxationSourceTerm{D, NM, NK, T}, \n    Y_in::State{NK, T},                \n    dt_coeff::Real,              \n    p_idx::Int,\n    pg::ParticleGrid,\n    t::Real      \n) where {D, NM, NK, T}\n    \n    dt_over_eps = T(dt_coeff) * rs.inv_epsilon\n    denom = one(T) / (one(T) + dt_over_eps)\n\n    u_macro = rs.km(Y_in)\n    flux_vals = flux(rs.macro_eq, u_macro)\n\n    return State{NK, T}(ntuple(Val(NK)) do k\n        v_k_base = Y_in[k]\n        m_idx = rs.km(k)\n        \n        f_dot_inv_lambda = flux_dot(flux_vals, m_idx, rs.scaled_inv_speeds[k])\n        Mk_val = rs.coefficients[m_idx] * (u_macro[m_idx] + f_dot_inv_lambda)\n        \n        (v_k_base + dt_over_eps * Mk_val) * denom\n    end)\nend\n\n# =========================================================================\n# 1. SET INITIAL CONDITIONS\n# =========================================================================\n\n# --- LOCAL Relaxation Initialization ---\nfunction set_initial_conditions!(\n    pg::ParticleGrid{D, NK}, \n    st::RelaxationSourceTerm{D, NM, NK},     \n    IC::InitialCondition,\n    eq_macro::HyperbolicPDE{D}\n) where {D, NM, NK}\n    \n    set_states!(pg) do pos\n        u_val = IC(pos)                      # Macro State{NM}\n        flux_vals = flux(eq_macro, u_val)    # Flux{D, NM}\n        \n        # Build the initial kinetic SVector component-by-component\n        State{NK}(ntuple(Val(NK)) do k\n            m_idx = st.km(k)\n            f_dot_inv_lambda = flux_dot(flux_vals, m_idx, st.scaled_inv_speeds[k])\n            \n            # Inline Maxwellian Initialization\n            return st.coefficients[m_idx] * (u_val[m_idx] + f_dot_inv_lambda)\n        end)\n    end\n    return nothing\nend\n"}]},{"name":"device.jl","path":"src/device.jl","type":"file","files":1,"lines":178,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":178}},"Human-Review":{"files":{"H0":0.9101123595505618,"H1":0.0898876404494382},"lines":{"H0":162,"H1":16}},"AI-Review":{"files":{"A0":0.16853932584269662,"A1":0.8314606741573034},"lines":{"A0":30,"A1":148}}},"parts":[{"lines":148,"runs":[[1,133],[164,178]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":16,"runs":[[134,134],[136,138],[144,144],[146,148],[150,154],[156,158]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 04a3f13"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":14,"runs":[[135,135],[139,143],[145,145],[149,149],[155,155],[159,163]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"export storage_for, with_backend, set_memory_limit!, get_memory_limit\n\n# =========================================================================\n# DEVICE RUNS\n#\n# The runners place a run where the execution backend of HyperCloudCore runs (`set_backend!`): CPU\n# backends keep host arrays, a GPU `KABackend` (e.g. `set_backend!(ROCBackend())` after `using AMDGPU`)\n# puts the grid, the scheme and the time stepper on that device via `context[:Storage]`. Setup (initial\n# conditions) and output (snapshots) stay on the host and move the first `N` particles in one copy.\n# =========================================================================\n\n\"\"\"\n    storage_for(backend = get_backend()) -> Type\n\nThe array type a run lives on for `backend`: `Array` for the CPU backends (`PolyesterBackend`,\n`ThreadsBackend`, `KABackend(CPU())`), the device array type of a GPU `KABackend` (e.g. `ROCArray`).\n\"\"\"\nstorage_for(::ExecutionBackend = get_backend()) = Array\nstorage_for(b::KABackend) = Base.typename(typeof(HyperCloudCore.KA.allocate(b.backend, Float32, 0))).wrapper\n\n\"\"\"\n    with_backend(f, backend)\n\nCalls `f()` with `backend` as the execution backend and restores the previous backend afterwards.\n\"\"\"\nfunction with_backend(f, backend)\n    previous = get_backend()\n    set_backend!(backend)\n    try\n        return f()\n    finally\n        set_backend!(previous)\n    end\nend\n\n\"\"\"\n    build_run_grid(grid_conf, context) -> ParticleGrid\n\n`build_particle_grid` for the storage in `context`. A device grid is constructed on the host first\n(neighbour search, volumes) and then moved, so the construction runs on a CPU backend.\n\"\"\"\nfunction build_run_grid(grid_conf::Dict, context::Dict)\n    host_backend = storage_type(context) === Array ? get_backend() : PolyesterBackend()\n    return with_backend(() -> build_particle_grid(grid_conf, context), host_backend)\nend\n\n\"The first `n` entries of a grid array on the host: a view of a host array, a copy of a device array.\"\nhost_view(a, n::Integer) = parent(a) isa Array ? view(a, 1:n) : Array(view(a, 1:n))\n\n\"\"\"\n    set_states!(f, pg::ParticleGrid)\n\nSets the state of every particle to `f(position)`. Evaluated on the host; a device grid receives the\nstates in one copy.\n\"\"\"\nfunction set_states!(f::F, pg::ParticleGrid) where {F}\n    N    = pg.meta.N\n    pos  = host_view(pg.core.positions, N)\n    vals = Vector{eltype(parent(pg.rhos))}(undef, N)\n    @inbounds for i in 1:N\n        vals[i] = f(pos[i])\n    end\n    copyto!(pg.rhos, 1, vals, 1, N)\n    return nothing\nend\n\n# =========================================================================\n# MEMORY BUDGET\n#\n# A machine setting like the backend (not a run parameter, so it does not enter the run hash): with a\n# limit, the runners size every growable buffer of the run once, under that many bytes (`reserve!`), and\n# a run that outgrows the reservation fails with a `CapacityError` instead of reallocating.\n# =========================================================================\n\nconst _MEMORY_LIMIT = Ref{Union{Nothing, NamedTuple}}(nothing)\n\n\"\"\"\n    set_memory_limit!(limit::Integer; tolerance = 0.05, slots_per_particle = nothing)\n    set_memory_limit!(nothing)\n\nReserves the buffers of every following run under `limit` bytes (HyperCloudCore's `reserve!`):\n`tolerance` is the share of the limit kept free for the runtime, `slots_per_particle` the neighbour\nslots reserved per particle (default: what the initial neighbour lists need; raise it for moving or\nadaptive grids). `nothing` removes the limit (buffers grow on demand, the default).\n\"\"\"\nfunction set_memory_limit!(limit::Integer; tolerance::Real = 0.05, slots_per_particle::Union{Nothing, Real} = nothing)\n    limit > 0 || throw(ArgumentError(\"limit must be positive, got $limit\"))\n    _MEMORY_LIMIT[] = (; limit = Int(limit), tolerance = Float64(tolerance), slots_per_particle)\nend\nset_memory_limit!(::Nothing) = (_MEMORY_LIMIT[] = nothing)\n\n\"The memory limit set with [`set_memory_limit!`](@ref) as `(; limit, tolerance, slots_per_particle)`, or `nothing`.\"\nget_memory_limit() = _MEMORY_LIMIT[]\n\n\"Passes the memory limit to the builders (`context[:MemoryLimit]`, read by `build_timestepper`).\"\nfunction apply_memory_limit!(context::Dict)\n    m = _MEMORY_LIMIT[]\n    m === nothing && return context\n    context[:MemoryLimit]     = m.limit\n    context[:MemoryTolerance] = m.tolerance\n    m.slots_per_particle === nothing || (context[:SlotsPerParticle] = m.slots_per_particle)\n    return context\nend\n\n\"\"\"\n    build_run_timestepper(context; time_conf) -> TimeStepper\n\n`build_timestepper`, which also performs the memory reservation. On a device grid the reservation is\nverified: with HyperCloudCore 0.6.0 and AMDGPU 2.9.1 (ROCm 7.2, gfx1201), `reserve!` returns with zeroed grid\nbuffers when earlier device runs happened in the same process (the data copied into the newly allocated\nbuffers is lost shortly after the copy; a ROCm / AMDGPU.jl issue, see the HyperCloudCore GPU roadmap). A\nchanged grid throws instead of silently running on corrupted data; run in a fresh session.\n\"\"\"\nfunction build_run_timestepper(context::Dict; time_conf::Dict = Dict{Symbol, Any}())\n    checked = haskey(context, :MemoryLimit) && storage_type(context) !== Array\n    before  = checked ? _grid_fingerprint(context[:Grid]) : nothing\n    ts = build_timestepper(context; time_conf = time_conf)\n    if checked && !isequal(_grid_fingerprint(context[:Grid]), before)   # isequal: padding slots may hold NaN\n        error(\"the memory reservation corrupted the device grid (seen with HyperCloudCore 0.6.0 / AMDGPU 2.9.1 \" *\n              \"after earlier device runs in this process): run in a fresh Julia session or without `set_memory_limit!`\")\n    end\n    return ts\nend\n\n# Host copies of the first N particles' grid data and of their neighbour slots.\nfunction _grid_fingerprint(pg::ParticleGrid)\n    N, c, nb = pg.meta.N, pg.core, pg.neighbor\n    ranges = collect(host_view(nb.ranges, N))\n    S = maximum(r -> isempty(r) ? 0 : last(r), ranges; init = 0)     # last slot in use (either layout)\n    return (ranges, map(a -> collect(host_view(a, N)), (c.positions, c.is_boundary, c.volumes, c.tags, nb.counts)),\n            map(a -> collect(host_view(a, S)), (nb.indices, nb.weights, nb.distances)))\nend\n\n\"\"\"\n    run_metadata(context, k_step, t_final, tmax; final_state = nothing) -> Dict{Symbol, Any}\n\nWhat a runner stores in the dataset's `metadata` (PDEStudioCore ≥ 0.5; not data, so never plotted as a statistic):\nthe HyperCloudCore version (PDEStudioCore's `:provenance` names only the solver's own package, HyperCloud), the\nexecution backend, the float type, the number of steps, the time the run reached, whether it stopped before\n`tmax` (`:stopped_early`) and, given the last stored state, whether that state is finite (`:finite`). A blown-up\nrun is stored like any other (`solve_equation` warns); these two flags keep it findable later. Both are needed: a\nblow-up the time step does not see (fixed `dt`, constant wave speeds) is only detected at stored snapshots, so with\n`snapshots = 1` the run reaches `tmax` with a non-finite state.\n\"\"\"\nfunction run_metadata(context::Dict, k_step::Integer, t_final::Real, tmax::Real; final_state = nothing)\n    T = get(context, :T, Float64)\n    return Dict{Symbol, Any}(\n        :hypercloudcore => string(pkgversion(HyperCloudCore)),\n        :backend        => _backend_name(get_backend()),\n        :float_type     => string(T),\n        :steps          => Int(k_step),\n        :t_final        => Float64(t_final),\n        # the time loop ends within max(1e-12, 4 eps) tmax of tmax when it is not stopped\n        :stopped_early  => tmax - t_final > 2 * max(1e-12, 4 * eps(T)) * tmax,\n        :finite         => final_state === nothing || all(u -> all(isfinite, u), final_state),\n    )\nend\n\n# The execution backend, with the KernelAbstractions device (\"KABackend(POCLBackend)\" is the CPU check through PoCL,\n# not a GPU run)\n_backend_name(b) = string(nameof(typeof(b)))\n_backend_name(b::KABackend) = \"KABackend(\" * string(nameof(typeof(b.backend))) * \")\"\n\n\"Logs the reservation of a run and records it in `sim_data`'s statistics (no-op without a memory limit).\"\nfunction record_memory!(sim_data, context::Dict)\n    haskey(context, :Memory) || return sim_data\n    r = context[:Memory]\n    add_stat!(sim_data, :reserved_particles, Float64(r.particles), :none)\n    add_stat!(sim_data, :reserved_bytes, Float64(r.bytes), :none)\n    return sim_data\nend\n\nfunction _log_memory(context::Dict)\n    haskey(context, :Memory) || return\n    r = context[:Memory]\n    @info \"Reserved $(round(r.bytes / 2^20; digits = 1)) MiB of $(round(r.limit / 2^20; digits = 1)) MiB: \" *\n          \"$(r.particles) particles, $(r.slots) neighbour slots\"\nend\n"},{"name":"HyperCloud.jl","path":"src/HyperCloud.jl","type":"file","files":1,"lines":43,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":43}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":43}},"AI-Review":{"files":{"A0":0.023255813953488372,"A1":0.9767441860465116},"lines":{"A0":1,"A1":42}}},"parts":[{"lines":42,"runs":[[1,24],[26,43]],"declaration":{"AI-Generatio
