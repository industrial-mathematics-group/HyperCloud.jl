__)\nend\nend"},{"name":"inbuilt_methods.jl","path":"src/inbuilt_methods.jl","type":"file","files":1,"lines":172,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.05232558139534884,"G3":0.9476744186046512},"lines":{"G2":9,"G3":163}},"Human-Review":{"files":{"H0":0.9476744186046512,"H1":0.05232558139534884},"lines":{"H0":163,"H1":9}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":172}}},"parts":[{"lines":161,"runs":[[1,10],[14,56],[59,64],[67,112],[114,114],[116,138],[140,143],[145,172]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":9,"runs":[[11,13],[57,58],[65,66],[139,139],[144,144]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":2,"runs":[[113,113],[115,115]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export create_method, generate_relax_params, get_master_method_dict\n\n# 1. Define the parameters that direct solvers should completely ignore\n# Note: Updated to map to your new flattened namespace keys!\nconst ignore_relax = [:Kinetic_velocities, :Kinetic_epsilon, :Kinetic_indices, :Kinetic_interior_factor, :save_relax]\n\n\"\"\"\n    create_method(timestepper::Symbol, main_gradient::Symbol, order::Int; kwargs...)\n\nAutomatically generates a method ParamDict using the strict namespace API, \nautomatically assigns the correct simulation pipeline, and generates a standardized plot label:\n`\"\u003cstepper>\u003cscheme>\u003corder>\"` followed in parentheses by a non-default flux, the limiter (with its mode if not\n`:hard`), and for MOOD the strategy, the criterion if it is not `:U2`, and `δ=\u003cMOOD_delta_relax>` if non-zero.\n\"\"\"\nfunction create_method(timestepper::Symbol, main_gradient::Symbol, order::Int;\n                       main_flux::Symbol = :AlignedRusanov,\n                       limiter::Symbol = :none,\n                       limiter_mode::Symbol = :hard,\n                       mood_criterion::Symbol = :none,\n                       mood_strategy::Symbol = :EPD1,\n                       sim_func_name::Union{Symbol, Nothing} = nothing,\n                       custom_label::Union{String, Nothing} = nothing,\n                       kwargs...)\n                       \n    # Automatically infer the simulation pipeline as a Symbol\n    if isnothing(sim_func_name)\n        is_imex = timestepper ∈ (:ARS222, :ARS233, :IMEXEuler, :PRSSP3, :SSP332)\n        sim_func_name = is_imex ? :run_kinetic_simulation : :run_direct_simulation\n    end\n\n    # Build the base ParamDict mapped directly to the new API Namespaces\n    dict = Dict{Symbol, Any}(\n        :Time_stepper => timestepper,\n        :Scheme_name => main_gradient,\n        :Scheme_order => order,\n        :Flux_name => main_flux,\n        :Limiter_name => limiter,\n        :Limiter_mode => limiter_mode,\n        :MOOD_criterion => mood_criterion,\n        :MOOD_strategy => mood_strategy,\n        :sim_func_name => sim_func_name\n    )\n    \n    # Add any extra kwargs (like the ignore lists)\n    for (k, v) in kwargs\n        dict[Symbol(k)] = v isa String ? Symbol(v) : v\n    end\n    \n    # Auto-Generate the Label\n    if !isnothing(custom_label)\n        name = custom_label\n    else\n        name = \"$(timestepper)$(main_gradient)$(order)\"\n        \n        mods = String[]\n        if main_flux != :AlignedRusanov; push!(mods, string(main_flux)); end\n        # the limiter mode and the MOOD relaxation only when not the default (`:hard`, 0), so the existing labels stay\n        if limiter != :none; push!(mods, limiter_mode == :hard ? string(limiter) : \"$(limiter) $(limiter_mode)\"); end\n        \n        if mood_criterion != :none\n            push!(mods, string(mood_strategy))\n            if mood_criterion != :U2\n                push!(mods, string(mood_criterion))\n            end\n            δ = get(kwargs, :MOOD_delta_relax, 0)\n            iszero(δ) || push!(mods, \"δ=$(δ)\")\n        end\n        \n        if !isempty(mods)\n            name *= \"(\" * join(mods, \",\") * \")\"\n        end\n    end\n    \n    return name => dict\nend\n\n\"\"\"\n    get_master_method_dict()\n\nReturns a MethodDict containing every standard numerical scheme in the Meshfree framework.\n\"\"\"\nfunction get_master_method_dict()\n    methods = [\n        \"Analytical Solution\" => Dict{Symbol, Any}(:sim_func_name => :run_direct_simulation),\n        \n        # =====================================================================\n        # 1. STABLE BASELINES (1st Order)\n        # =====================================================================\n        create_method(:Euler, :Upwind, 1, ignore=ignore_relax, Scheme_upwind_alg_nd=:Classic),\n        create_method(:RK2, :Upwind, 1, ignore=ignore_relax, Scheme_upwind_alg_nd=:Classic),\n        create_method(:IMEXEuler, :Upwind, 1, Scheme_upwind_alg_nd=:Classic), \n        create_method(:SSP332, :Upwind, 1, Scheme_upwind_alg_nd=:Classic),\n        create_method(:PRSSP3, :Upwind, 1, Scheme_upwind_alg_nd=:Classic),\n        create_method(:RK2, :WENO, 2, ignore=ignore_relax),\n\n        # =====================================================================\n        # 2. EXPLICIT 2ND ORDER (RK2) - DIRECT\n        # =====================================================================\n        # (Upwind is strictly first order, so there is no RK2Upwind2.)\n        create_method(:RK2, :MUSCL,  2, ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  1, ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, limiter=:VK, limiter_mode=:hard, ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, limiter=:BJ, limiter_mode=:hard, ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, limiter=:minmod, limiter_mode=:hard, ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, mood_criterion=:U2, mood_strategy=:EPD0, MOOD_delta_relax = 0., ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, mood_criterion=:U2, mood_strategy=:EPD1, MOOD_delta_relax = 0., ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, mood_criterion=:U2, mood_strategy=:EPD2, MOOD_delta_relax = 0., ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, mood_criterion=:U2, mood_strategy=:SEPD0, MOOD_delta_relax = 0., ignore=ignore_relax),\n        create_method(:RK2, :MUSCL,  2, mood_criterion=:U1, mood_strategy=:EPD1, MOOD_delta_relax = 0., ignore=ignore_relax),\n        create_method(:RK4SSP, :MUSCL,  4, mood_criterion=:only, ignore=ignore_relax),\n\n        # =====================================================================\n        # 3. RELAXATION 2ND ORDER (ARS222, SSP332) - KINETIC\n        # =====================================================================\n        create_method(:ARS222, :MUSCL,  2),\n        create_method(:SSP332, :MUSCL,  2),\n        create_method(:SSP332, :MUSCL,  2, limiter=:VK, limiter_mode=:hard),\n        create_method(:SSP332, :MUSCL,  2, limiter=:minmod, limiter_mode=:hard),\n        create_method(:SSP332, :MUSCL,  2, mood_criterion=:U2, mood_strategy=:EPD1, MOOD_delta_relax = 0.),\n        create_method(:SSP332, :MUSCL,  2, mood_criterion=:U2, mood_strategy=:EPD2, MOOD_delta_relax = 0.),\n        create_method(:SSP332, :MUSCL,  2, mood_criterion=:U2, mood_strategy=:SEPD0, MOOD_delta_relax = 0.),\n        create_method(:SSP332, :MUSCL,  2, mood_criterion=:U1, mood_strategy=:EPD1, MOOD_delta_relax = 0.),\n\n        # =====================================================================\n        # 4. HIGH-ORDER (RK4 Direct / ARS233 Kinetic)\n        # =====================================================================\n        (create_method(:RK4SSP, :MUSCL, order, ignore=ignore_relax) for order in 2:5)...,\n        (create_method(:RK4SSP, :MUSCL, order, limiter=:VK, limiter_mode=:hard, ignore=ignore_relax) for order in 2:5)...,\n        (create_method(:RK4SSP, :MUSCL, order, mood_criterion=:U2, mood_strategy=:EPD1, MOOD_delta_relax = 0., ignore=ignore_relax) for order in 2:5)...,\n        (create_method(:RK4SSP, :MUSCL, order, mood_criterion=:U2, mood_strategy=:EPD2, MOOD_delta_relax = 0., ignore=ignore_relax) for order in 2:5)...,\n        (create_method(:PRSSP3, :MUSCL, order, mood_criterion=:U2, mood_strategy=:EPD1, MOOD_delta_relax = 0., ) for order in 2:5)...,\n        (create_method(:RK4SSP, :MUSCL, order, limiter=:minmod, limiter_mode=:hard, ignore=ignore_relax) for order in 2:5)...\n    ]\n    \n    return Dict(methods...)\nend\n\n\"\"\"\n    generate_relax_params(v_mag::Real, dim::Integer, NM::Integer)\n\nGenerates symmetric kinetic velocities matching the native `Flux{D, NK}` tuple format \nalong with the uniformly partitioned edge indices (`relax_indices`) for the kinetic system.\n\"\"\"\ngenerate_relax_params(v_mag::Real, dim::Integer, NM::Integer) = generate_relax_params(Float64(v_mag), Int(dim), Int(NM))\nfunction generate_relax_params(v_mag::Float64, dim::Int, NM::Int)\n    kin_per_macro = 2 * dim\n    NK = kin_per_macro * NM\n    \n    relax_velocities = ntuple(Val(dim)) do d\n        ntuple(Val(NK)) do k\n            m_idx = div(k - 1, kin_per_macro)\n            local_k = k - m_idx * kin_per_macro\n            \n            d_active = div(local_k - 1, 2) + 1\n            is_positive = isodd(local_k)\n            \n            if d == d_active\n                return is_positive ? v_mag : -v_mag\n            else\n                return 0.0\n            end\n        end\n    end\n    \n    relax_indices = zeros(Int, NM + 1)\n    relax_indices[1] = 1\n    for m in 1:NM\n        relax_indices[m+1] = relax_indices[m] + kin_per_macro\n    end\n    \n    return relax_velocities, relax_indices\nend"},{"name":"macros.jl","path":"src/macros.jl","type":"file","files":1,"lines":253,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":0.9999999999999999},"lines":{"G3":253}},"Human-Review":{"files":{"H0":0.9525691699604742,"H1":0.04743083003952569},"lines":{"H0":241,"H1":12}},"AI-Review":{"files":{"A0":0.05533596837944664,"A1":0.9446640316205533},"lines":{"A0":14,"A1":239}}},"parts":[{"lines":239,"runs":[[1,135],[137,140],[146,146],[153,175],[178,253]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":12,"runs":[[136,136],[141,145],[147,149],[152,152],[176,177]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 04a3f13"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":2,"runs":[[150,151]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Global configuration references for plotting\nconst BONITO_LISTEN_URL = Ref(\"0.0.0.0\")\nconst BONITO_LISTEN_PORT = Ref(9384)\nconst BONITO_PROXY_URL = Ref(\"\")\nconst BONITO_IS_CONFIGURED = Ref(false)\n\n# Global configuration references for paths\nconst CONFIG_SEARCH_PATHS = Ref{Vector{String}}([\"configs\", \"experiments\"])\nconst CONFIG_ROOT_OVERWRITE = Ref{String}(\"\")\n\n\"\"\"\n    _launch_and_display_plotter(mod::Module)\n\nInternal helper function to check backends in the calling module, configure \nBonito (if loaded), and trigger the main plot display. Returns `true` if successful.\n\"\"\"\nfunction _launch_and_display_plotter(mod::Module)\n    if isdefined(mod, :launch_plotter) && isdefined(mod, :set_sim_config!)\n        if isempty(BONITO_PROXY_URL[]); BONITO_PROXY_URL[] = \"http://localhost:$(BONITO_LISTEN_PORT[])\" end\n        \n        # --- Dynamic Backend Activation & Server Setup ---\n        if isdefined(mod, :WGLMakie)\n            if isdefined(mod, :Bonito)\n                if !BONITO_IS_CONFIGURED[]\n                    mod.Bonito.configure_server!(\n                        listen_url = BONITO_LISTEN_URL[],\n                        listen_port = BONITO_LISTEN_PORT[],\n                        proxy_url = BONITO_PROXY_URL[]\n                    )\n                    BONITO_IS_CONFIGURED[] = true\n                end\n            else\n                @warn \"WGLMakie is loaded, but Bonito is not! Default Bonito settings are used. Please run `using Bonito` to configure the web server.\"\n            end\n            @info \"Bonito server listens on $(BONITO_LISTEN_URL[]):$(BONITO_LISTEN_PORT[]). Visit $(BONITO_PROXY_URL[])/browser-display to see the plots.\" \n            mod.WGLMakie.activate!()\n            \n        elseif isdefined(mod, :GLMakie)\n            mod.GLMakie.activate!()\n        else\n            @warn \"No Makie backend found! Please run `using GLMakie` or `using WGLMakie`.\"\n        end\n\n        # --- Launch and Display ---\n        fig = Base.invokelatest(() -> mod.launch_plotter())\n        return fig\n    else\n        @warn \"Please run `using PDEStudio` first to enable plotting.\"\n        return nothing\n    end\nend\n\n\"\"\"\n    _get_user_project_root(mod::Module)\n\nRoot directory below which `CONFIG_SEARCH_PATHS` are searched: `CONFIG_ROOT_OVERWRITE` if it\nis set, otherwise the PDEStudioCore save path (`get_save_path()`, the working directory by default).\n\"\"\"\nfunction _get_user_project_root(mod::Module)\n    isempty(CONFIG_ROOT_OVERWRITE[]) || return CONFIG_ROOT_OVERWRITE[]\n    return get_save_path()\nend\n\n\"\"\"\n    resolve_config_path(mod::Module, name::AbstractString)\n\nRecursively searches for the configuration file `name.jl` across the user-defined `CONFIG_SEARCH_PATHS`.\n\"\"\"\nfunction resolve_config_path(mod::Module, name::AbstractString)\n    root = _get_user_project_root(mod)\n    target_file = \"$(name).jl\"\n    \n    for folder in CONFIG_SEARCH_PATHS[]\n        search_base = joinpath(root, folder)\n        if !isdir(search_base)\n            continue\n        end\n        \n        # Completely recursive search\n        for (current_dir, dirs, files) in walkdir(search_base)\n            if target_file in files\n                found_path = joinpath(current_dir, target_file)\n                @info \"Loading plugin config from: $found_path\"\n                return found_path\n            end\n        end\n    end\n    \n    error(\"Simulation setup for '$name' not found recursively in any of the configured search paths:$(CONFIG_SEARCH_PATHS[])\")\nend\n\n\"\"\"\n    backup_config(mod::Module, original_path::AbstractString, base_name::AbstractString)\n\nCopies the executed file to a `backups` subfolder within the primary configuration directory.\n\"\"\"\nfunction backup_config(mod::Module, original_path::AbstractString, base_name::AbstractString)\n    if !isfile(original_path)\n        error(\"Source file for '$base_name' not found:$original_path\")\n    end\n\n    root = _get_user_project_root(mod)\n    timestamp = Dates.format(Dates.now(), \"yyyymmdd_HHMMSS\")\n    \n    # Default to the first configured search path for saving backups\n    backup_folder = isempty(CONFIG_SEARCH_PATHS[]) ? \"configs\" : first(CONFIG_SEARCH_PATHS[])\n    backup_dir = joinpath(root, backup_folder, \"backups\")\n    mkpath(backup_dir)\n    \n    backup_name = \"$(base_name)_$(timestamp).jl\"\n    backup_path = joinpath(backup_dir, backup_name)\n    \n    cp(original_path, backup_path, force=true)\n    @info \"Archived config file for plotting/reproducibility: $backup_name\"\n    \n    return backup_path\nend\n\n# Fallback method to extract the path directly from a Function object\nfunction backup_config(mod::Module, func::Function, base_name::AbstractString)\n    mths = methods(func)\n    if isempty(mths)\n        error(\"Could not find any methods for function '$base_name'.\")\n    end\n    original_path = String(first(mths).file)\n    return backup_config(mod, original_path, base_name)\nend\n# =========================================================================\n# MACRO UTILITIES\n# =========================================================================\n\n# Helper to normalize macro inputs (bare words, strings, or symbols) into a pure Symbol\n_normalize_macro_name(name) = name isa QuoteNode ? name.value : Symbol(name)\n\n\"\"\"\n    @sim name [key = value ...]\n\nEvaluates the configuration and runs the simulation. Checks the local module scope first; \nif not found, dynamically loads the configuration from the user's configured search paths.\nAccepts strings (`\"name\"`), bare words (`name`), or symbols (`:name`).\n\nReturns PDEStudioCore's `RunSummary` (what ran, was cached, failed or was made with other code), which the REPL\nshows as a short report. Options after the name are passed to `run_all_simulations` and override the defaults\n`force_overwrite = false`, `calculate_stats = true`, e.g. `@sim euler_1d_sod dry_run = true` (report what would\nrun, write nothing), `@sim euler_1d_sod on_changed_sources = :recompute` or `@sim euler_1d_sod force_overwrite = true`.\n\"\"\"\nmacro sim(name, opts...)\n    all(o -> o isa Expr && o.head === :(=) && o.args[1] isa Symbol, opts) ||\n        throw(ArgumentError(\"@sim: options after the name must be `key = value`, got $(join(opts, \", \"))\"))\n    keys_ = [o.args[1] for o in opts]\n    allunique(keys_) || throw(ArgumentError(\"@sim: option(s) given twice: $(join(unique(filter(k -> count(==(k), keys_) > 1, keys_)), \", \"))\"))\n    kw = Expr(:tuple, Expr(:parameters, (Expr(:kw, o.args[1], esc(o.args[2])) for o in opts)...))   # (; key = value, ...)\n    mod = __module__\n    raw_sym = _normalize_macro_name(name)\n    name_sym = QuoteNode(raw_sym)\n    name_str = string(raw_sym)\n    \n    return quote\n        local config\n        local is_local = isdefined($mod,$name_sym)\n        \n        if is_local\n            # 1. Execute the function defined in the user's local scope\n            config = $(esc(raw_sym))()\n        else\n            # 2. Plugin Fallback: Include the file directly into the user's module.\n            path = HyperCloud.resolve_config_path($mod,$name_str)\n            config = Base.include($mod, path)\n            \n            # If the file defines and returns a function instead of a raw config, evaluate it.\n            if config isa Function\n                config = Base.invokelatest(config)\n            end\n        end\n        \n        opts = merge((force_overwrite = false, calculate_stats = true), $kw)\n        Base.invokelatest(() -> run_all_simulations(config; opts...))\n    end\nend\n\n\"\"\"\n    @backup name\n\nManually triggers a backup of the source file where the configuration function or script `name` is defined.\n\"\"\"\nmacro backup(name)\n    mod = __module__\n    raw_sym = _normalize_macro_name(name)\n    name_sym = QuoteNode(raw_sym)\n    name_str = string(raw_sym)\n\n    return quote\n        local is_local = isdefined($mod,$name_sym)\n        \n        if is_local\n            HyperCloud.backup_config($mod, $(esc(raw_sym)),$name_str)\n        else\n            path = HyperCloud.resolve_config_path($mod,$name_str)\n            HyperCloud.backup_config($mod, path,$name_str)\n        end\n    end\nend\n\n\"\"\"\n    @plot()\n\nLaunches the PDEStudio plotter utilizing the active module's backend.\n\"\"\"\nmacro plot()\n    mod = __module__\n    return quote\n        HyperCloud._launch_and_display_plotter($mod)\n    end\nend\n\n\"\"\"\n    @plot name\n\nLaunches the PDEStudio plotter, loads the configuration from the function or plugin `name`, and forces a plot update.\n\"\"\"\nmacro plot(name)\n    mod = __module__\n    raw_sym = _normalize_macro_name(name)\n    name_sym = QuoteNode(raw_sym)\n    name_str = string(raw_sym)\n\n    return quote\n        res = HyperCloud._launch_and_display_plotter($mod)\n        if !isnothing(res)\n            # Display GLMakie figure before changing it\n            if !isdefined($mod, :WGLMakie); display(res) end\n            \n            local config\n            local is_local = isdefined($mod,$name_sym)\n            \n            if is_local\n                config = $(esc(raw_sym))()\n            else\n                path = HyperCloud.resolve_config_path($mod,$name_str)\n                config = Base.include($mod, path)\n                if config isa Function\n                    config = Base.invokelatest(config)\n                end\n            end\n\n            $mod.set_sim_config!(config)\n            $mod.force_simulation()\n        else\n            @warn \"Plotter returned nothing!\" \n        end\n        res\n    end\nend"},{"name":"time_integration.jl","path":"src/time_integration.jl","type":"file","files":1,"lines":245,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.08163265306122448,"G3":0.9183673469387755},"lines":{"G2":20,"G3":225}},"Human-Review":{"files":{"H0":0.9183673469387755,"H1":0.08163265306122448},"lines":{"H0":225,"H1":20}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":245}}},"parts":[{"lines":175,"runs":[[1,14],[41,100],[102,108],[118,132],[134,148],[151,158],[160,161],[185,191],[193,194],[196,196],[198,198],[200,238],[242,245]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":50,"runs":[[15,40],[101,101],[109,109],[111,113],[133,133],[149,150],[162,165],[168,170],[172,173],[175,175],[181,183],[192,192],[195,195],[197,197]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":20,"runs":[[110,110],[114,117],[159,159],[166,167],[171,171],[174,174],[176,180],[184,184],[199,199],[239,241]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export solve_equation, saveData!\n\n\"\"\"\n    NoFallbackGrad \u003c: DivergenceInterpolator\n\nPlaceholder used by [`solve_equation`](@ref) when the time stepper exposes no\n`divergence_interpolator`: the CFL estimate falls back to a first-order MLS fit and the\nmaximum consistency order is 1.\n\"\"\"\nstruct NoFallbackGrad \u003c: DivergenceInterpolator end\nHyperCloudCore._extract_order(::NoFallbackGrad) = 1\nHyperCloudCore._divergence_degree(::NoFallbackGrad) = 1\nHyperCloudCore.update_size!(::NoFallbackGrad, ::Int) = nothing\n\n# Largest absolute component of a stored state (NaN or Inf if any component is not finite).\nfunction _max_abs(states::AbstractVector)\n    m = zero(eltype(eltype(states)))\n    for u in states, c in u\n        isfinite(c) || return oftype(m, Inf)\n        m = max(m, abs(c))\n    end\n    return m\nend\n\n# The step does not see every blow-up (fixed steps, constant wave speeds, CFL estimates that skip NaN\n# particles), so every stored state is checked as well. Returns `(blown_up, growth_warned)`.\nfunction _check_snapshot(state, t, tmax, k_step, u0_scale, growth_warned::Bool; final::Bool = false)\n    scale = _max_abs(state)\n    if !isfinite(scale)\n        @warn \"solve_equation: the state at t = $t is not finite (blown up)\" *\n              (final ? \".\" : \"; the run stopped before tmax = $tmax after $k_step steps. The data end at t = $t.\")\n        return true, growth_warned\n    elseif !growth_warned && u0_scale > 0 && scale > 1e8 * u0_scale\n        @warn \"solve_equation: at t = $t the state is $(scale / u0_scale) times larger than at t = 0; \" *\n              \"the run is probably unstable.\"\n        return false, true\n    end\n    return false, growth_warned\nend\n\n\"\"\"\n    saveData!(xs_storage, us_storage, ts_storage, snap_idx, pg, current_t, remove_ghosts)\n\nExtracts and archives the simulation state at a specific snapshot index.\n\n# Details\n- Records the current time into `ts_storage`.\n- If `remove_ghosts` is true, it filters out boundary particles and saves only the active domain core. Otherwise, it copies the entire grid.\n- Allocates new state and position vectors for the targeted snapshot and copies the corresponding views from the particle grid.\n\"\"\"\nfunction saveData!(\n    xs_storage::AbstractVector, \n    us_storage::AbstractVector, \n    ts_storage::AbstractVector, \n    snap_idx::Int, \n    pg::ParticleGrid{D, M, T}, \n    current_t::Real, \n    remove_ghosts::Bool\n) where {D, M, T}\n    \n    ts_storage[snap_idx] = T(current_t)\n    N_active = pg.meta.N \n    \n    pos_array = host_view(get_positions(pg), N_active)\n    rho_array = host_view(pg.rhos, N_active)\n    \n    if remove_ghosts\n        indices = findall(!, host_view(pg.core.is_boundary, N_active))\n        N_save = length(indices)\n        \n        xs_storage[snap_idx] = Vector{Space{D, T}}(undef, N_save)\n        us_storage[snap_idx] = Vector{State{M, T}}(undef, N_save)\n        \n        copyto!(xs_storage[snap_idx], view(pos_array, indices))\n        copyto!(us_storage[snap_idx], view(rho_array, indices))\n    else\n        N_save = N_active\n        \n        xs_storage[snap_idx] = Vector{Space{D, T}}(undef, N_save)\n        us_storage[snap_idx] = Vector{State{M, T}}(undef, N_save)\n        \n        copyto!(xs_storage[snap_idx], view(pos_array, 1:N_save))\n        copyto!(us_storage[snap_idx], view(rho_array, 1:N_save))\n    end\nend\n\n\"\"\"\n    solve_equation(timestepper, eq, pg, tmax, dt; kwargs...)\n\nThe primary simulation orchestrator governing the main time-stepping loop. \n\n# Arguments\n- `timestepper::TimeStepper`: The selected Runge-Kutta or IMEX time integrator.\n- `eq::HyperbolicPDE`: The physical equation system.\n- `pg::ParticleGrid`: The active mesh-free domain configuration.\n- `tmax::Real`: The final simulation time.\n- `dt::Real`: The baseline time step.\n\n# Keyword Arguments\n- `is_cfl::Bool`: If true, `dt` is treated as a CFL number, and the physical time step is dynamically computed at each iteration using the grid and interpolator properties.\n- `snapshots::Integer`: The number of output intervals (at least 1); `snapshots + 1` states are stored, including `t = 0`.\n- `remove_ghosts::Bool`: Strips boundary/ghost particles from the returned snapshot data if true.\n- `show_progress::Bool`: Toggles visual progress tracking.\n- `progress_interval::Real`: Sets the refresh rate (in seconds) for logging the simulation's progress and calculating the ETA.\n- `adaptivity`: a `ParticleAdaptivity` applied between steps (particle insertion/merging on moving grids), or `nothing`.\n\n# Returns\n- A tuple containing: `(position_history, state_history, time_history, total_steps, elapsed_wall_time)`.\n\nThe loop stops early with a warning that gives the time reached if the time step collapses (below `1e-12 tmax`)\nor is not finite, or if a stored snapshot is not finite (a blown-up state; this also covers fixed time steps\nand equations with constant wave speeds, whose step never collapses). Every stored snapshot is checked,\nthe final one included. The last stored state is the one at that time, and the snapshots that were not\nreached are left unassigned. Each blow-up is reported once (the final slot of a stopped run is not checked again).\nA snapshot that grew by more than a factor `1e8` over the initial state gives a warning (once) but does not stop\nthe run. An infinite CFL step with a finite state and a finite CFL number (no wave moves) advances straight to\n`tmax`; an infinite CFL number (or fixed step) stops at once.\n\"\"\"\nfunction solve_equation(\n    timestepper::TimeStepper, \n    eq::HyperbolicPDE{D, M, T}, \n    pg::ParticleGrid{D, M, T},\n    tmax::Real,\n    dt::Real;\n    is_cfl::Bool = false,\n    snapshots::Integer = 10,\n    remove_ghosts::Bool = false,\n    show_progress::Bool = true,\n    progress_interval::Real = 1.0,\n    adaptivity::Union{Nothing, ParticleAdaptivity} = nothing\n) where {D, M, T}\n    \n    snapshots >= 1 || throw(ArgumentError(\"snapshots must be ≥ 1 (the number of output intervals), got $snapshots\"))\n    xs = Vector{Vector{Space{D, T}}}(undef, snapshots + 1)\n    us = Vector{Vector{State{M, T}}}(undef, snapshots + 1)\n    ts = Vector{T}(undef, snapshots + 1)\n\n    tmax_val = T(tmax)\n    dt_inp = T(dt)\n    t_snap = range(zero(T), tmax_val, length=snapshots+1)\n    snap_counter = 1\n    t = zero(T)\n    k_step = 0\n    \n    div_interp = hasproperty(timestepper, :divergence_interpolator) ? timestepper.divergence_interpolator : NoFallbackGrad()\n\n    saveData!(xs, us, ts, snap_counter, pg, t, remove_ghosts)\n    snap_counter += 1 \n    u0_scale = _max_abs(us[1])\n    growth_warned = false\n    \n    @info \"Using $(nameof(typeof(get_backend()))) for parallel runs!\"\n\n    p = Progress(10000, desc=\"Running Simulation...\", dt=progress_interval, enabled=show_progress)\n    \n    # Initialize trackers for the interval-based ETA\n    last_log_time = time()\n    last_sim_time = t\n    stopped = false      # stopped early: the stop has been reported, the final slot is not checked again\n\n    elapsed_time = @elapsed while t \u003c tmax_val\n        dt_step = is_cfl ? dt_inp * get_time_step(pg, eq, div_interp) : dt_inp\n        # A collapsed or non-finite step (NaN states, unbounded wave speeds) ends the run early, so no NaN\n        # time is ever recorded. An infinite CFL step means that no wave moves, and the run goes straight to\n        # tmax, unless the state is not finite (the CFL estimate skips particles with NaN wave speeds).\n        # An infinite CFL number is a configuration error, not a field at rest: it stops below.\n        if is_cfl && isfinite(dt_inp) && dt_step == T(Inf)\n            if !isfinite(_max_abs(host_view(pg.rhos, pg.meta.N)))\n                @warn \"solve_equation stopped at t = $t before tmax = $tmax_val after $k_step steps: the state \" *\n                      \"is not finite (blown up). The data end at t = $t.\"\n                stopped = true\n                break\n            end\n        elseif !(isfinite(dt_step) && dt_step > T(1e-12) * tmax_val)      # relative: no fixed time scale\n            @warn \"solve_equation stopped at t = $t before tmax = $tmax_val after $k_step steps: the time step \" *\n                  \"is $(isfinite(dt_step) ? \"collapsed\" : \"not finite\") (dt = $dt_step\" *\n                  (isfinite(dt_inp) && dt_inp > zero(T) ? \"); the state has probably blown up.\" :\n                   \", from $(is_cfl ? \"the CFL number\" : \"the fixed step\") $dt_inp, which must be positive and finite).\") *\n                  \" The data end at t = $t.\"\n            stopped = true\n            break\n        end\n        dt_val = min(dt_step, tmax_val - t)\n        if dt_val \u003c= max(T(1e-12), 4 * eps(T)) * tmax_val; break; end      # tmax reached up to round-off (relative)\n\n        timestepper(eq, pg, t, dt_val)\n        adaptivity === nothing || adapt_particles!(pg, adaptivity, _extract_order(div_interp))\n\n        t += dt_val\n        k_step += 1\n        \n        blown_up = false\n        while snap_counter \u003c= snapshots && t >= t_snap[snap_counter]\n            saveData!(xs, us, ts, snap_counter, pg, t, remove_ghosts)\n            blown_up, growth_warned = _check_snapshot(us[snap_counter], t, tmax_val, k_step, u0_scale, growth_warned)\n            snap_counter += 1\n            blown_up && break\n        end\n        blown_up && (stopped = true; break)\n\n        if show_progress\n            current_progress = ceil(Int, (t / tmax_val) * 10000)\n            update!(p, min(current_progress, 10000))\n        else\n            current_time = time()\n            wall_dt = current_time - last_log_time\n            \n            if wall_dt > progress_interval\n                sim_dt = t - last_sim_time\n                pct = round((t / tmax_val) * 100, digits=1)\n                \n                # Calculate ETA only if simulation has advanced\n                if sim_dt > 0\n                    eta_seconds = (tmax_val - t) * (wall_dt / sim_dt)\n                    eta_secs_int = round(Int, eta_seconds)\n                    \n                    # Format as HH:MM:SS\n                    h = eta_secs_int ÷ 3600\n                    m = (eta_secs_int % 3600) ÷ 60\n                    s = eta_secs_int % 60\n                    eta_str = string(lpad(h, 2, '0'), \":\", lpad(m, 2, '0'), \":\", lpad(s, 2, '0'))\n                    \n                    @info \"Simulation Progress: $pct% | ETA: $eta_str\"\n                else\n                    @info \"Simulation Progress: $pct% | ETA: Calculating...\"\n                end\n                \n                # Reset interval trackers\n                last_log_time = current_time\n                last_sim_time = t\n            end\n        end\n    end\n    \n    show_progress && finish!(p)\n\n    if snap_counter \u003c= snapshots + 1\n        saveData!(xs, us, ts, snapshots + 1, pg, t, remove_ghosts)\n        # The final slot is checked too (with one snapshot it is the only one after t = 0), unless the run stopped:\n        # then it holds the state whose stop was just reported\n        stopped || _check_snapshot(us[snapshots + 1], t, tmax_val, k_step, u0_scale, growth_warned; final = true)\n    end\n\n    return xs, us, ts, k_step, elapsed_time\nend"}]},{"name":"test","path":"test","type":"dir","files":10,"lines":2346,"counts":{"AI-Generation":{"files":{"G2":0.26660740801447447,"G3":9.733392591985526},"lines":{"G2":88,"G3":2258}},"Human-Review":{"files":{"H0":6.662285387941233,"H1":3.3377146120587677},"lines":{"H0":2190,"H1":156}},"AI-Review":{"files":{"A0":1.1137126078675934,"A1":8.886287392132406},"lines":{"A0":352,"A1":1994}}},"errors":0,"children":[{"name":"gpu","path":"test/gpu","type":"dir","files":2,"lines":267,"counts":{"AI-Generation":{"files":{"G2":0.004032258064516129,"G3":1.995967741935484},"lines":{"G2":1,"G3":266}},"Human-Review":{"files":{"H0":0.9959677419354839,"H1":1.0040322580645162},"lines":{"H0":247,"H1":20}},"AI-Review":{"files":{"A1":2.0},"lines":{"A1":267}}},"errors":0,"children":[{"name":"Project.toml","path":"test/gpu/Project.toml","type":"file","files":1,"lines":19,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"errors":[],"parts":[{"lines":19,"runs":[[1,19]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Environment of the device checks (opt-in, not part of Pkg.test). Instantiate once with\n#     julia --project=test/gpu -e 'using Pkg; Pkg.instantiate()'\n# and run with\n#     julia -t auto --project=test/gpu test/gpu/runtests.jl\n# CASE=\u003cregex> restricts the run to matching case names.\n\n[deps]\nAMDGPU = \"21141c5a-9bdb-4563-92ae-f87d6854732e\"\nHyperCloud = \"46243fee-3493-4f45-a265-764054f6ddcc\"\nLinearAlgebra = \"37e2e46d-f89d-539d-b4ee-838fcccc9c8e\"\nLogging = \"56ddb016-857b-54e1-b83d-db4d58db5568\"\nStaticArrays = \"90137ffa-7385-5640-81b9-e52037218182\"\nTest = \"8dfed614-e22c-5e08-85e1-65c5234f0b40\"\n\n[sources]\nHyperCloud = {path = \"../..\"}\n\n[compat]\nAMDGPU = \"2.9\"\n"},{"name":"runtests.jl","path":"test/gpu/runtests.jl","type":"file","files":1,"lines":248,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.004032258064516129,"G3":0.9959677419354839},"lines":{"G2":1,"G3":247}},"Human-Review":{"files":{"H0":0.9959677419354839,"H1":0.004032258064516129},"lines":{"H0":247,"H1":1}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":248}}},"parts":[{"lines":247,"runs":[[1,178],[180,248]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[179,179]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Device checks of HyperCloud on HyperCloudCore's KABackend(ROCBackend()); every device run must reproduce a\n# PolyesterBackend host run.\n#  - \"pipeline\": the runners' build steps with context[:Storage] = ROCArray, a fixed number of steps\n#    (isolates the physics: PDEs, ICs, builders, kinetic source terms);\n#  - \"runner\": complete run_direct_simulation / run_kinetic_simulation runs, snapshots compared.\nusing HyperCloud, AMDGPU, StaticArrays, Test, LinearAlgebra, Logging\nusing HyperCloud: get_D, get_M, extract_namespace, build_kinetic_system, set_initial_conditions!, build_ic, build_equation\nAMDGPU.allowscalar(false)\nconst HC = HyperCloud\n\nconst DeviceArray    = ROCArray\nconst device_backend = KABackend(ROCBackend())\n\n# Cases expected to fail, with the reason. Julia reports \"Unexpected Pass\" once they are fixed. (Empty since the\n# WENO kernel and the :sinusoidal mover were fixed in HyperCloudCore after 0.6.0.)\nconst KNOWN_BROKEN = Dict{Regex, String}()\nis_broken(name) = any(occursin(k, name) for k in keys(KNOWN_BROKEN))\n\n\"Build every pipeline component for `params` on `storage`; returns (eq, pg, ts, set_ic!).\"\nfunction build_pipeline(params, storage)\n    T = get(params, :T, Float64)\n    ctx = Dict{Symbol, Any}(:T => T, :Storage => storage)\n    ns(k) = extract_namespace(params, k)\n    eq_macro = build_equation(ns(:PDE), ctx)\n    ctx[:Equation] = eq_macro; ctx[:D] = get_D(eq_macro); ctx[:M] = get_M(eq_macro)\n    IC = build_ic(ns(:IC), ctx)\n    if params[:sim_func_name] === :run_kinetic_simulation\n        eq, st = build_kinetic_system(ns(:Kinetic), ctx)\n        ctx[:Equation] = eq; ctx[:M] = get_M(eq)\n        ctx[:ExplicitSources] = (); ctx[:ImplicitSources] = (st,)\n        set_ic! = pg -> set_initial_conditions!(pg, st, IC, eq_macro)\n    else\n        eq = eq_macro\n        ctx[:ExplicitSources] = (); ctx[:ImplicitSources] = ()\n        set_ic! = pg -> set_initial_conditions!(pg, eq, IC)\n    end\n    ctx[:Domain]     = build_domain(ns(:Grid), ctx)\n    ctx[:WeightConf] = ns(:Weight)\n    pg = HC.build_run_grid(ns(:Grid), ctx)\n    ctx[:Flux]    = build_flux(ns(:Flux), ctx)\n    ctx[:Limiter] = build_limiter(ns(:Limiter), ctx)\n    ctx[:MOOD]    = build_mood(ns(:MOOD), ctx)\n    ctx[:Scheme]  = build_scheme(ns(:Scheme), ctx)\n    ctx[:Tableau] = build_tableau(ns(:Time), ctx)\n    ts = build_timestepper(ctx; time_conf = ns(:Time))\n    return eq, pg, ts, set_ic!\nend\n\ndivinterp(ts) = hasproperty(ts, :divergence_interpolator) ? ts.divergence_interpolator : HC.NoFallbackGrad()\n\n\"Run `nsteps` on the host and on the device from the same IC and compare.\"\nfunction compare(params; nsteps = 10)\n    T = get(params, :T, Float64)\n    set_backend!(PolyesterBackend())                                  # grids are built on the host\n    eq, pg_h, ts_h, set_ic! = build_pipeline(params, Array)\n    set_ic!(pg_h)\n    _, pg_d, ts_d, set_ic_d! = build_pipeline(params, DeviceArray)\n    set_ic_d!(pg_d)\n    N = pg_h.meta.N\n    @assert pg_d.meta.N == N && Array(pg_d.core.positions)[1:N] == pg_h.core.positions[1:N]\n    cfl  = T(get(params, :Time_CFL, 0.2))\n    dt_h = cfl * get_time_step(pg_h, eq, divinterp(ts_h))\n    set_backend!(device_backend)\n    dt_d = cfl * get_time_step(pg_d, eq, divinterp(ts_d))\n    for k in 0:nsteps-1; ts_d(eq, pg_d, k * dt_h, dt_h); end\n    set_backend!(PolyesterBackend())\n    for k in 0:nsteps-1; ts_h(eq, pg_h, k * dt_h, dt_h); end\n    ud, uh = Array(pg_d.rhos)[1:N], pg_h.rhos[1:N]\n    od, oh = Array(pg_d.core.particle_orders)[1:N], pg_h.core.particle_orders[1:N]\n    diff  = maximum(i -> maximum(abs.(ud[i] .- uh[i])), 1:N)\n    scale = maximum(i -> maximum(abs.(uh[i])), 1:N)\n    return (; diff, scale, dt_h, dt_d, order_mismatches = count(od .!= oh), finite = all(u -> all(isfinite, u), ud))\nend\n\nconst RESULTS = Pair{String, Any}[]\n\nfunction check(name, params; nsteps = 10, rtol = 1e-10)\n    occursin(Regex(get(ENV, \"CASE\", \"\")), name) || return\n    @testset \"$name\" begin\n        r = try\n            compare(params; nsteps)\n        catch e\n            push!(RESULTS, name => \"ERROR: \" * first(sprint(showerror, e), 200))\n            is_broken(name) ? (@test_broken false) : (@test false)\n            return\n        end\n        push!(RESULTS, name => r)\n        ok = r.finite && isapprox(r.dt_d, r.dt_h; rtol = 1e-12) && r.diff \u003c= rtol * max(r.scale, 1)\n        is_broken(name) ? (@test_broken ok) : (@test ok)\n        # MOOD orders are not compared strictly: on flat plateaus the detection criterion sees only\n        # round-off (~1e-14) and may flip between host and device without changing the state.\n    end\nend\n\n# --- Configurations --------------------------------------------------------\n\nconst KIN_1D = let (v, i) = generate_relax_params(2.0, 1, 1)\n    Dict{Symbol, Any}(:Kinetic_velocities => v, :Kinetic_indices => i, :Kinetic_epsilon => 1e-6)\nend\nconst KIN_2D = let (v, i) = generate_relax_params(2.0, 2, 1)\n    Dict{Symbol, Any}(:Kinetic_velocities => v, :Kinetic_indices => i, :Kinetic_epsilon => 1e-6)\nend\n\nconst LIN_1D = merge(Dict{Symbol, Any}(\n    :PDE_name => :linear, :PDE_velocities => ((1.0,),), :sim_func_name => :run_direct_simulation,\n    :tmax => 0.1, :snapshots => 2,\n    :Grid_domain => :rectangular, :Grid_mins => (0.0,), :Grid_maxs => (1.0,), :Grid_Ns => (200,),\n    :Grid_periodic => true, :Grid_randomness_factor => (0.0,), :Grid_seed => 42, :Grid_mover => :none,\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 5.5,\n    :IC_name => :box, :IC_u_bg => (0.1,), :IC_u_box => (1.0,), :IC_mins => (0.3,), :IC_maxs => (0.6,),\n    :Time_CFL => 0.2), KIN_1D)\n\nconst BURGERS_1D = merge(LIN_1D, Dict{Symbol, Any}(\n    :PDE_name => :burgers, :PDE_D => 1, :Grid_mins => (-1.0,), :Grid_maxs => (1.0,),\n    :IC_name => :gauss, :IC_a => (1.0,), :IC_b => (0.0,), :IC_width => 0.2))\n\nfunction lin_2d(periodic::Bool)\n    d = merge(Dict{Symbol, Any}(\n        :PDE_name => :linear, :PDE_D => 2, :PDE_velocities => ((1.0,), (0.5,)), :sim_func_name => :run_direct_simulation,\n        :tmax => 0.1, :snapshots => 2,\n        :Grid_domain => :rectangular, :Grid_mins => (0.0, 0.0), :Grid_maxs => (1.0, 1.0), :Grid_Ns => (40, 40),\n        :Grid_periodic => periodic, :Grid_randomness_factor => (0.2, 0.2), :Grid_seed => 42, :Grid_mover => :none,\n        :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 2.5,\n        :IC_name => :box, :IC_u_bg => (0.1,), :IC_u_box => (1.0,), :IC_mins => (0.25, 0.25), :IC_maxs => (0.6, 0.6),\n        :Scheme_upwind_alg_nd => :Classic, :MOOD_delta_relax => 1e-6,\n        :Time_CFL => 0.2), KIN_2D)\n    periodic || (d[:Grid_bc] = Dict{Int, AbstractBoundaryCondition}(i => OutflowBC() for i in 1:4))\n    return d\nend\n\n\"Run `params` with the runner on the host and on the device and compare the snapshots.\"\nfunction compare_runner(params)\n    run = getfield(HyperCloud, params[:sim_func_name])\n    h = with_backend(() -> run(params), PolyesterBackend())\n    d = with_backend(() -> run(params), device_backend)\n    (h === nothing || d === nothing) && error(\"run failed (host: $(h !== nothing), device: $(d !== nothing))\")\n    length(h.t) == length(d.t) || error(\"snapshot counts differ: $(length(h.t)) vs $(length(d.t))\")\n    maxdiff(a, b) = maximum(k -> isempty(a[k]) ? 0.0 : maximum(i -> maximum(abs.(a[k][i] .- b[k][i])), eachindex(a[k])), eachindex(a))\n    all(k -> length(h.x[k]) == length(d.x[k]), eachindex(h.x)) || error(\"particle counts differ\")\n    return (; diff = maxdiff(h.u, d.u), scale = maximum(k -> maximum(u -> maximum(abs, u), h.u[k]), eachindex(h.u)),\n              xdiff = maxdiff(h.x, d.x), dt_h = h.t[end], dt_d = d.t[end], nsnap = length(h.t),\n              N = length(h.x[end]), order_mismatches = 0, finite = all(k -> all(u -> all(isfinite, u), d.u[k]), eachindex(d.u)))\nend\n\nfunction check_runner(name, params; rtol = 1e-10)\n    occursin(Regex(get(ENV, \"CASE\", \"\")), name) || return\n    @testset \"$name\" begin\n        r = try\n            compare_runner(params)\n        catch e\n            push!(RESULTS, name => \"ERROR: \" * first(sprint(showerror, e), 200))\n            is_broken(name) ? (@test_broken false) : (@test false)\n            return\n        end\n        push!(RESULTS, name => r)\n        ok = r.finite && r.dt_d == r.dt_h && r.diff \u003c= rtol * max(r.scale, 1) && r.xdiff \u003c= rtol\n        is_broken(name) ? (@test_broken ok) : (@test ok)\n    end\nend\n\nconst METHODS = sort!([(k, v) for (k, v) in get_master_method_dict() if haskey(v, :Time_stepper)]; by = first)\nconst SOD     = HyperCloud.euler_1d_sod()\n\ntry\n    @testset \"HyperCloud on $(AMDGPU.device())\" begin\n        # First, before any other device run: with HyperCloudCore 0.6.0 / AMDGPU 2.9.1 a reservation after\n        # earlier device runs in the process can zero grid buffers (the runners detect it and refuse to run).\n        @testset \"Memory limit\" begin\n            enable_progress_bar!(false)\n            try\n                set_memory_limit!(2^30; slots_per_particle = 19)            # reserved once, nothing grows\n                sod_adapt = merge(SOD.shared, SOD.methods[:RK2MUSCL2_U1_EPD1], Dict{Symbol, Any}(:Grid_mover => :lagrangian, :Adapt_enabled => true))\n                check_runner(\"runner | sod lagrangian mover + adaptivity, memory limit\", sod_adapt)\n                # A further reserved device run in the same process: correct, or refused by the runner's check.\n                @testset \"second reserved device run: correct or refused\" begin\n                    logs, sim = Test.collect_test_logs(min_level = Logging.Error) do\n                        with_backend(() -> run_direct_simulation(merge(lin_2d(false), last(create_method(:ARS222, :MUSCL, 2)))), device_backend)\n                    end\n                    refused = any(l -> haskey(l.kwargs, :exception) && occursin(\"memory reservation corrupted\", sprint(showerror, first(l.kwargs[:exception]))), logs)\n                    push!(RESULTS, \"runner | second reserved device run\" => (sim !== nothing ? \"ran\" : refused ? \"refused by the corruption check\" : \"FAILED otherwise\"))\n                    @test sim !== nothing || refused\n                end\n            finally\n                set_memory_limit!(nothing)\n            end\n        end\n        @testset \"1D linear advection, box IC\" begin\n            for (n, m) in METHODS; check(\"lin1d | $n\", merge(LIN_1D, m)); end\n        end\n        @testset \"Sod shock tube (Euler, outflow BC)\" begin\n            for (n, m) in sort!([(k, v) for (k, v) in SOD.methods if haskey(v, :Time_stepper)]; by = first)\n                check(\"sod | $n\", merge(SOD.shared, m))\n            end\n        end\n        @testset \"1D Burgers\" begin\n            check(\"burgers | RK2 MUSCL2\", merge(BURGERS_1D, last(create_method(:RK2, :MUSCL, 2))))\n            check(\"burgers | ARS222 MUSCL2 kinetic\", merge(BURGERS_1D, last(create_method(:ARS222, :MUSCL, 2))))\n        end\n        @testset \"2D linear advection (jittered grid)\" begin\n            for periodic in (true, false), (n, m) in [\n                    (\"RK2 Upwind1\",           last(create_method(:RK2, :Upwind, 1))),\n                    (\"RK3 MUSCL3 MOOD\",       last(create_method(:RK3, :MUSCL, 3; mood_criterion = :U1))),\n                    (\"ARS222 MUSCL2 kinetic\", last(create_method(:ARS222, :MUSCL, 2)))]\n                check(\"2d periodic=$periodic | $n\", merge(lin_2d(periodic), m))\n            end\n        end\n        @testset \"Runners\" begin\n            enable_progress_bar!(false)\n            mood = Dict{Symbol, Any}(:MOOD_delta_relax => 1e-6)\n            check_runner(\"runner | lin1d RK3 MUSCL3 MOOD\", merge(LIN_1D, last(create_method(:RK3, :MUSCL, 3; mood_criterion = :U1)), mood))\n            check_runner(\"runner | lin1d ARS222 MUSCL2 kinetic\", merge(LIN_1D, last(create_method(:ARS222, :MUSCL, 2))))\n            check_runner(\"runner | lin1d ARS222 MUSCL2 kinetic save_relax\", merge(LIN_1D, last(create_method(:ARS222, :MUSCL, 2)), Dict{Symbol, Any}(:save_relax => true)))\n            for (n, m) in sort!([(k, v) for (k, v) in SOD.methods if haskey(v, :Time_stepper)]; by = first)\n                check_runner(\"runner | sod $n\", merge(SOD.shared, m))\n            end\n            check_runner(\"runner | sod RK2Upwind1 keep ghosts\", merge(SOD.shared, SOD.methods[:RK2Upwind1], Dict{Symbol, Any}(:remove_ghosts => false)))\n            for periodic in (true, false)\n                check_runner(\"runner | 2d periodic=$periodic RK3 MUSCL3 MOOD\", merge(lin_2d(periodic), last(create_method(:RK3, :MUSCL, 3; mood_criterion = :U1))))\n                check_runner(\"runner | 2d periodic=$periodic ARS222 MUSCL2 kinetic\", merge(lin_2d(periodic), last(create_method(:ARS222, :MUSCL, 2))))\n            end\n            lagr = Dict{Symbol, Any}(:Grid_mover => :lagrangian)\n            check_runner(\"runner | burgers lagrangian mover\", merge(BURGERS_1D, last(create_method(:RK2, :MUSCL, 2)), lagr))\n            check_runner(\"runner | sod lagrangian mover\", merge(SOD.shared, SOD.methods[:RK2MUSCL2_U1_EPD1], lagr))\n            check_runner(\"runner | sod lagrangian mover + adaptivity\", merge(SOD.shared, SOD.methods[:RK2MUSCL2_U1_EPD1], lagr, Dict{Symbol, Any}(:Adapt_enabled => true)))\n            check_runner(\"runner | sod scaled lagrangian mover + adaptivity\", merge(SOD.shared, SOD.methods[:RK2MUSCL2_U1_EPD1],\n                         Dict{Symbol, Any}(:Grid_mover => :scaled_lagrangian, :Grid_mover_alpha => 0.5, :Adapt_enabled => true)))\n            check_runner(\"runner | lin1d sinusoidal mover\", merge(LIN_1D, last(create_method(:RK2, :MUSCL, 2)), Dict{Symbol, Any}(:Grid_mover => :sinusoidal, :Grid_mover_amplitude => 0.02)))\n            check_runner(\"runner | 2d MLS volumes\", merge(lin_2d(true), last(create_method(:RK2, :MUSCL, 2)), Dict{Symbol, Any}(:Grid_volumes => :mls)))\n            check_runner(\"runner | 2d MLS volumes, sinusoidal mover\", merge(lin_2d(true), last(create_method(:RK2, :MUSCL, 2)),\n                         Dict{Symbol, Any}(:Grid_volumes => :mls, :Grid_mover => :sinusoidal, :Grid_mover_amplitude => 0.02)))\n            check_runner(\"runner | f32 lin1d RK2 MUSCL2\", merge(LIN_1D, last(create_method(:RK2, :MUSCL, 2)), Dict{Symbol, Any}(:T => Float32)); rtol = 1e-5)\n            check_runner(\"runner | lin1d RK2WENO2\", merge(LIN_1D, get_master_method_dict()[\"RK2WENO2\"]))\n            enable_progress_bar!(true)\n        end\n        @testset \"Float32\" begin\n            check(\"f32 | RK2 MUSCL2\", merge(LIN_1D, last(create_method(:RK2, :MUSCL, 2)), Dict{Symbol, Any}(:T => Float32)); rtol = 1e-5)\n        end\n    end\nfinally\n    set_backend!(PolyesterBackend())\n    println(\"\\n\", \"=\"^30, \" results (max |u_dev - u_host|, scale, dt_dev/dt_host - 1, MOOD order mismatches)\")\n    for (n, r) in RESULTS\n        s = r isa String ? r : string(\"diff=\", round(r.diff; sigdigits = 3), \"  scale=\", round(r.scale; sigdigits = 3),\n                                      \"  ddt=\", round(r.dt_d / r.dt_h - 1; sigdigits = 3),\n                                      haskey(r, :nsnap) ? \"  xdiff=$(round(r.xdiff; sigdigits = 3))  N=$(r.N)\" : \"  mood≠=$(r.order_mismatches)\")\n        println(rpad(n, 52), s)\n    end\nend\n"}]},{"name":"examples.jl","path":"test/examples.jl","type":"file","files":1,"lines":57,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":0.9999999999999999},"lines":{"G3":57}},"Human-Review":{"files":{"H0":0.9649122807017543,"H1":0.03508771929824561},"lines":{"H0":55,"H1":2}},"AI-Review":{"files":{"A0":0.05263157894736842,"A1":0.9473684210526315},"lines":{"A0":3,"A1":54}}},"parts":[{"lines":8,"runs":[[1,1],[25,26],[53,57]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":46,"runs":[[2,13],[15,24],[27,35],[38,52]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[14,14]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":[ i], t))[1] - us[i][1]), eachindex(xs)) / length(xs)\nend\n\nset_save_path!(mktempdir())    # not restored: the plotter below may still be running from it\nenable_progress_bar!(false)\n\n@testset \"Examples\" begin\n    @testset \"$(nameof(example))\" for (example, tmax, overrides, bound) in EXAMPLE_CHECKS\n        conf = example()\n        # Every active method is defined (or is a reference method, which the pipeline skips)\n        @test all(m -> haskey(conf.methods, m) || is_reference_method(m), conf.defaults)\n        merge!(conf.shared, Dict{Symbol, Any}(:tmax => tmax), overrides)\n        tasks = generate_tasks(conf)\n        @test !isempty(tasks)\n        @test all(p -> haskey(p, :sim_func_name) && haskey(p, :Time_stepper), tasks)\n\n        summary = run_all_simulations(conf; force_overwrite = true, calculate_stats = true)\n        @test isempty(summary.failed) && isempty(summary.empty) && isempty(summary.stats_failed)   # nothing silently lost\n\n        reference = conf.reference === nothing ? nothing : getfield(HyperCloud, conf.reference)\n        for p in tasks\n            @test does_sim_data_exist(p)\n            does_sim_data_exist(p) || continue\n            sim = load_sim_data(p, Val(:lagrangian))\n            @test sim.t[end] ≈ tmax\n            if reference !== nothing\n                err = final_error(reference(p), sim)\n                @info \"$(nameof(example)): error vs $(conf.reference)\" p[:Time_stepper] p[:Scheme_order] err\n                @test err \u003c bound\n            end\n        end\n    end\n\n    if RUN_GUI_TESTS\n        @plot euler_1d_sod\n        reset_plotter!()\n    end\nend\n"},{"name":"Project.toml","path":"test/Project.toml","type":"file","files":1,"lines":11,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new
