t the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[150,150]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[219,219]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"using HyperCloud\nusing StaticArrays\nusing Test\nusing LinearAlgebra\nusing Dates\n\nconst HC = HyperCloud\n\n# GLMakie needs a display. On headless CI run with HYPERCLOUD_GUI_TESTS=false\n# (or wrap the job in xvfb-run). `using` must stay at top level.\nconst RUN_GUI_TESTS = get(ENV, \"HYPERCLOUD_GUI_TESTS\", \"true\") == \"true\"\nif RUN_GUI_TESTS\n    using PDEStudio\n    using GLMakie\nend\n\n# Execution backend of the HyperCloudCore per-particle loops: polyester (default), threads or ka_cpu\n# (KernelAbstractions kernels on the host).\nconst TEST_BACKEND = get(ENV, \"HYPERCLOUD_BACKEND\", \"polyester\")\nif TEST_BACKEND == \"polyester\"\n    set_backend!(PolyesterBackend())\nelseif TEST_BACKEND == \"threads\"\n    set_backend!(ThreadsBackend())\nelseif TEST_BACKEND == \"ka_cpu\"\n    set_backend!(HyperCloudCore.KA.CPU())\nelse\n    error(\"HYPERCLOUD_BACKEND=$(TEST_BACKEND) is not supported (polyester, threads, ka_cpu)\")\nend\n@info \"Testing with $(get_backend()) on $(Threads.nthreads()) threads\"\n\n# =========================================================================\n# 0. MOCK MODULES (must be defined at top-level scope)\n# =========================================================================\n\nmodule MockPDEStudio\n    using HyperCloud\n    using Base\n\n    launch_plotter() = \"mock_figure\"\n    set_sim_config!(conf) = nothing\n    force_simulation() = nothing\n    dummy_config() = \"mock_config\"\nend\n\nmodule MockGLMakie\n    activate!() = nothing\nend\n\nmodule MockWGLMakie\n    activate!() = nothing\nend\n\nmodule MockBonito\n    configure_server!(; listen_url, listen_port, proxy_url) = nothing\nend\n\n# =========================================================================\n# 1. HELPERS\n# =========================================================================\n\n\"Dispatch to the pipeline named in `params[:sim_func_name]`.\"\nrun_sim(params) = getfield(HyperCloud, params[:sim_func_name])(params)\n@eval HyperCloud dummy_func(params) = $(NoSimData)()\n\"Spacetime vector `(x..., t)` as expected by the analytic closures.\"\nspacetime(x, t) = SVector(Tuple(x)..., Float64(t))\n\n\"\"\"\n    l1_error(params; component = 1) -> (err, sim_data)\n\nRuns the simulation described by `params` and returns the mean absolute error of\nthe final snapshot against `analytical_solution(params)`. Returns `(NaN, nothing)`\nif the run failed. The runners catch every exception and return `nothing`, so\ncallers must always check `sim !== nothing`.\n\"\"\"\nfunction l1_error(params; component::Int = 1)\n    exact = analytical_solution(params)\n    sim = run_sim(params)\n    sim === nothing && return (NaN, nothing)\n    xs, us, t = sim.x[end], sim.u[end], sim.t[end]\n    err = sum(i -> abs(exact(spacetime(xs[i], t))[component] - us[i][component]), eachindex(xs))\n    return (err / length(xs), sim)\nend\n\n\"Midpoint-rule quadrature (robust to the discontinuities in exact solutions).\"\nfunction integrate(f, a, b; n::Int = 20_000)\n    h = (b - a) / n\n    return h * sum(i -> f(a + (i - 0.5) * h), 1:n)\nend\n\nfunction test_domain(mins, maxs, periodic)\n    conf = Dict{Symbol, Any}(:domain => :rectangular, :mins => mins, :maxs => maxs, :periodic => periodic)\n    return build_domain(conf, Dict{Symbol, Any}(:T => Float64, :D => length(mins)))\nend\n\nfunction test_grid(mins, maxs, Ns; M::Int = 1, randomness::Float64 = 0.0, seed::Int = 42)\n    D = length(mins)\n    ctx = Dict{Symbol, Any}(:T => Float64, :D => D, :M => M)\n    ctx[:Domain] = test_domain(mins, maxs, true)\n    ctx[:WeightConf] = Dict{Symbol, Any}(:name => :exponential, :alpha => 1.0, :range => 2.5)\n    grid_conf = Dict{Symbol, Any}(:Ns => Ns, :randomness_factor => ntuple(_ -> randomness, D), :seed => seed)\n    return build_particle_grid(grid_conf, ctx), ctx\nend\n\n# --- Reusable configurations ----------------------------------------------\n\nconst UPWIND1 = Dict{Symbol, Any}(\n    :Time_stepper => :RK2,\n    :Scheme_name => :Upwind, :Scheme_order => 1, :Scheme_MLS_order => 1,\n    :Scheme_upwind_alg_nd => :Classic, :Flux_name => :Upwind,\n    :MOOD_criterion => :none,\n)\n\n\"1D periodic linear advection of a Gaussian; the workhorse for accuracy tests.\"\nlinear_1d_gauss(N; tmax = 0.1, width = 0.1) = Dict{Symbol, Any}(\n    :PDE_name => :linear, :PDE_velocities => ((1.0,),),\n    :sim_func_name => :run_direct_simulation,\n    :tmax => tmax, :snapshots => 2,\n    :Grid_domain => :rectangular, :Grid_mins => (0.0,), :Grid_maxs => (1.0,), :Grid_Ns => (N,),\n    :Grid_periodic => true, :Grid_randomness_factor => (0.0,), :Grid_seed => 42, :Grid_mover => :none,\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 5.5,\n    :IC_name => :gauss, :IC_a => (1.0,), :IC_b => (0.5,), :IC_width => width,\n    :Time_CFL => 0.2,\n)\n\n\"1D periodic Burgers with a Gaussian pulse (breaking time ≈ 0.23, so keep tmax below that).\"\nburgers_1d_gauss(N; tmax = 0.15) = Dict{Symbol, Any}(\n    :PDE_name => :burgers, :PDE_D => 1,\n    :sim_func_name => :run_direct_simulation,\n    :tmax => tmax, :snapshots => 2,\n    :Grid_domain => :rectangular, :Grid_mins => (-1.0,), :Grid_maxs => (1.0,), :Grid_Ns => (N,),\n    :Grid_periodic => true, :Grid_randomness_factor => (0.0,), :Grid_seed => 42, :Grid_mover => :none,\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 5.5,\n    :IC_name => :gauss, :IC_a => (1.0,), :IC_b => (0.0,), :IC_width => 0.2,\n    :Time_CFL => 0.2,\n)\n\n\"2D linear advection along the diagonal on the unit square.\"\nfunction linear_2d_base(periodic::Bool)\n    d = Dict{Symbol, Any}(\n        :PDE_name => :linear, :PDE_D => 2, :PDE_velocities => ((1.0,), (1.0,)),\n        :sim_func_name => :run_direct_simulation,\n        :tmax => 0.1, :snapshots => 2,\n        :Grid_domain => :rectangular, :Grid_mins => (0.0, 0.0), :Grid_maxs => (1.0, 1.0),\n        :Grid_Ns => (20, 20), :Grid_periodic => periodic,\n        :Grid_randomness_factor => (0.0, 0.0), :Grid_seed => 42, :Grid_mover => :none,\n        :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 2.5,\n        :Time_CFL => 0.2,\n    )\n    if !periodic\n        # NOTE: boundary conditions are read from `:Grid_bc` (`:Grid_bc_map` is an alias).\n        d[:Grid_bc] = Dict{Int, AbstractBoundaryCondition}(i => OutflowBC() for i in 1:4)\n    end\n    return d\nend\n\n\"1D BGK model (γ = 3: one distribution, `M = Nv`) with a smooth periodic density/momentum/energy wave.\"\nbgk_wave_params(N; Nv = 16, tau = Inf, stepper = :RK3, order = 3, T = Float64) = Dict{Symbol, Any}(\n    :PDE_name => :bgk, :PDE_D => 1, :PDE_gamma => 3.0, :PDE_Nv => Nv, :PDE_vmax => 6.0, :PDE_tau => tau,\n    :sim_func_name => :run_bgk_simulation, :T => T,\n    :tmax => 0.2, :snapshots => 2,\n    :Grid_domain => :rectangular, :Grid_mins => (0.0,), :Grid_maxs => (1.0,), :Grid_Ns => (N,),\n    :Grid_periodic => true, :Grid_randomness_factor => (0.0,), :Grid_seed => 42, :Grid_mover => :none,\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 5.5,\n    :IC_name => :sine, :IC_a => (0.2, 0.1, 0.1), :IC_period => (1.0,), :IC_c_offset => (1.0, 0.0, 0.5),\n    :Time_CFL => 0.2, :Time_stepper => stepper,\n    :Scheme_name => :MUSCL, :Scheme_order => order, :Flux_name => :Rusanov, :Limiter_name => :none,\n    :MOOD_criterion => :none,\n)\n\n\"Sod shock tube for the 1D BGK model with γ = 1.4 (Chu-reduced pair f, h: `M = 2 Nv`).\"\nbgk_sod_params(N; Nv = 16, tau = 1e-5) = Dict{Symbol, Any}(\n    :PDE_name => :bgk, :PDE_D => 1, :PDE_gamma => 1.4, :PDE_Nv => Nv, :PDE_vmax => 6.0, :PDE_tau => tau,\n    :sim_func_name => :run_kinetic_simulation,                      # forwarded to run_bgk_simulation\n    :tmax => 0.2, :snapshots => 1,\n    :Grid_domain => :rectangular, :Grid_mins => (-0.5,), :Grid_maxs => (0.5,), :Grid_Ns => (N,),\n    :Grid_periodic => false, :Grid_bc => Dict{Int, AbstractBoundaryCondition}(1 => FixedDirichlet(), 2 => OutflowBC()),\n    :Grid_randomness_factor => (0.0,), :Grid_seed => 10, :Grid_mover => :none,\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 5.5,\n    :IC_name => :riemann, :IC_uL => (1.0, 0.0, 2.5), :IC_uR => (0.125, 0.0, 0.25), :IC_p0 => (0.0,), :IC_n => (1.0,),\n    :Time_CFL => 0.2, :Time_stepper => :ARS222,\n    :Scheme_name => :MUSCL, :Scheme_order => 2, :Flux_name => :Rusanov, :Limiter_name => :VK, :Limiter_mode => :hard,\n    :MOOD_criterion => :none,\n)\n\n\"Mean density error of a BGK run against the exact Euler solution with the same γ (`(err, sim)`).\"\nfunction euler_l1(params)\n    exact = euler_limit_solution(params)\n    sim = run_sim(params)\n    sim === nothing && return (NaN, nothing)\n    xs, us, t = sim.x[end], sim.u[end], sim.t[end]\n    return sum(i -> abs(exact(spacetime(xs[i], t))[1] - us[i][1]), eachindex(xs)) / length(xs), sim\nend\n\n\"Totals Σ_i U_i of the stored macroscopic snapshots (equal volumes on a regular lattice).\"\ntotals(sim, snap) = sum(sim.u[snap])\n\nconst IMEX_STEPPERS = (:ARS222, :ARS233, :IMEXEuler, :PRSSP3, :SSP332)\n\n# Master-dict entries that currently fail the sweep. They are reported as \"Broken\"\n# instead of failing. Delete an entry once it is fixed (Julia then reports \"Unexpected Pass\").\nconst KNOWN_BROKEN_METHODS = Dict{String, String}()\n\n# =========================================================================\n# MAIN TEST SUITE: test groups\n# =========================================================================\n# The suite is dominated by compilation (every method is a new combination of scheme, MOOD and tableau types,\n# compiled anew; compilation is single threaded). The groups are independent and run in separate processes in\n# parallel:\n#   HYPERCLOUD_TEST_JOBS=n     at most n processes (default: the CPU threads, at most the number of groups and\n#                              one per 2.5 GiB of free memory; a group peaks at 1.4-2 GiB); 1 runs every group in\n#                              this process, one after the other.\n#   HYPERCLOUD_TEST_GROUP=name runs one group in this process (what the parallel runner starts).\nconst TEST_GROUPS = [\n    \"units\"    => [\"units.jl\"],\n    \"sims-bgk\" => [\"sims_bgk.jl\"],\n    \"sweep-a\"  => [\"sims_sweep.jl\"],\n    \"sweep-b\"  => [\"sims_sweep.jl\"],\n    \"sims\"     => [\"sims.jl\"],\n    \"walls\"    => [\"sims_walls.jl\"],\n    \"examples\" => [\"examples.jl\"],\n]\nconst TEST_GROUP = get(ENV, \"HYPERCLOUD_TEST_GROUP\", \"\")\nTEST_GROUP == \"\" || TEST_GROUP in first.(TEST_GROUPS) ||\n    error(\"HYPERCLOUD_TEST_GROUP=$(TEST_GROUP) is not a test group ($(join(first.(TEST_GROUPS), \", \")))\")\n\n# The master-dictionary sweep is split over the two `sweep` groups (all methods when run in one process).\nfunction _sweep_cases(cases)\n    h = cld(length(cases), 2)\n    return TEST_GROUP == \"sweep-a\" ? cases[1:h] : TEST_GROUP == \"sweep-b\" ? cases[h+1:end] : cases\nend\n\nfunction run_group(name; label = name)\n    @testset \"$label\" begin\n        for file in Dict(TEST_GROUPS)[name]\n            include(file)\n        end\n    end\nend\n\n# Runs the groups in child processes (same julia flags, e.g. --check-bounds and coverage, the same project and\n# environment, so HYPERCLOUD_BACKEND and HYPERCLOUD_GUI_TESTS carry over) and prints each group's output when it\n# finishes: in full if it failed, else its test summary.\nfunction run_groups_in_parallel(jobs)\n    names = first.(TEST_GROUPS)\n    threads = max(1, Threads.nthreads() ÷ jobs)\n    cmd(name) = addenv(`$(Base.julia_cmd()) --project=$(Base.active_project()) --threads=$threads $(@__FILE__)`,\n                       \"HYPERCLOUD_TEST_GROUP\" => name)\n    logs = Dict(name => tempname() for name in names)\n    queue, running, failed = copy(names), Dict{String, Tuple{Base.Process, IOStream, Float64}}(), String[]\n    println(\"Running $(length(names)) test groups in up to $jobs processes ($threads thread(s) each)\")\n    while !isempty(queue) || !isempty(running)\n        while length(running) \u003c jobs && !isempty(queue)\n            name = popfirst!(queue)\n            io = open(logs[name], \"w\")\n            running[name] = (run(pipeline(cmd(name); stdout = io, stderr = io); wait = false), io, time())\n        end\n        sleep(0.5)\n        for (name, (proc, io, t0)) in collect(running)\n            process_exited(proc) || continue\n            close(io)\n            delete!(running, name)\n            out = read(logs[name], String)\n            ok = success(proc)\n            ok || push!(failed, name)\n            println(\"\\n\", \"=\"^30, \" test group `$name`: \", ok ? \"passed\" : \"FAILED\", \" in $(round(time() - t0; digits = 1)) s\")\n            i = findlast(\"Test Summary:\", out)\n            print(ok && i !== nothing ? out[first(i):end] : out)\n        end\n    end\n    @testset \"HyperCloud Tests\" begin\n        @testset \"$name\" for name in names\n            @test !(name in failed)\n        end\n    end\nend\n\nconst TEST_JOBS = parse(Int, get(ENV, \"HYPERCLOUD_TEST_JOBS\",\n    string(clamp(min(Sys.CPU_THREADS, Int(Sys.free_memory() ÷ (5 * 2^29))), 1, length(TEST_GROUPS)))))\n\nif TEST_GROUP != \"\"\n    run_group(TEST_GROUP)\n    println(\"test group `$(TEST_GROUP)`: peak memory $(Sys.maxrss() ÷ 2^20) MiB\")\nelseif TEST_JOBS \u003c= 1\n    @testset \"HyperCloud Tests\" begin\n        for name in first.(TEST_GROUPS)\n            name == \"sweep-b\" && continue            # `sweep-a` runs every method in one process\n            run_group(name; label = name == \"sweep-a\" ? \"sweep\" : name)\n        end\n    end\nelse\n    run_groups_in_parallel(TEST_JOBS)\nend\n"},{"name":"sims.jl","path":"test/sims.jl","type":"file","files":1,"lines":291,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.07560137457044673,"G3":0.9243986254295533},"lines":{"G2":22,"G3":269}},"Human-Review":{"files":{"H0":0.8934707903780069,"H1":0.10652920962199312},"lines":{"H0":260,"H1":31}},"AI-Review":{"files":{"A0":0.05154639175257732,"A1":0.9484536082474226},"lines":{"A0":15,"A1":276}}},"parts":[{"lines":188,"runs":[[1,56],[133,262],[290,291]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":66,"runs":[[57,78],[81,81],[86,87],[91,92],[96,96],[108,113],[119,132],[263,265],[267,268],[270,274],[282,289]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":22,"runs":[[79,80],[83,85],[93,95],[97,105],[114,118]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":9,"runs":[[82,82],[266,266],[269,269],[275,276],[278,281]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 04a3f13"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":6,"runs":[[88,90],[106,107],[277,277]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Group `sims`: initial conditions, snapshots, convergence orders, Burgers, the Sod sweep, Float32, movers,\n# backend helpers, the memory limit, spherical WENO, the run_all_simulations driver.\n\n@testset \"Simulations\" begin\n    @testset \"Initial conditions (2D linear advection)\" begin\n        cases = [\n            (\"Box\", true, Dict{Symbol, Any}(:IC_name => :box, :IC_u_bg => (0.1,), :IC_u_box => (1.0,),\n                                            :IC_mins => (0.25, 0.25), :IC_maxs => (0.75, 0.75))),\n            (\"Gauss\", true, Dict{Symbol, Any}(:IC_name => :gauss, :IC_a => (1.0,), :IC_b => (0.5, 0.5), :IC_width => 0.1)),\n            (\"Sine\", true, Dict{Symbol, Any}(:IC_name => :sine, :IC_a => (1.0,), :IC_period => (1.0, 1.0), :IC_c_offset => (0.5,))),\n            (\"Riemann\", false, Dict{Symbol, Any}(:IC_name => :riemann, :IC_uL => (1.0,), :IC_uR => (0.0,),\n                                                 :IC_p0 => (0.5, 0.5), :IC_n => (1.0, 1.0))),\n            (\"Smoothed Riemann\", false, Dict{Symbol, Any}(:IC_name => :s_riemann, :IC_uL => (1.0,), :IC_uR => (0.0,),\n                                                          :IC_p0 => (0.5, 0.5), :IC_n => (1.0, 0.0), :IC_width => 0.05)),\n            (\"Quadrant Riemann\", false, Dict{Symbol, Any}(:IC_name => :q_riemann, :IC_p0 => (0.5, 0.5),\n                                                          :IC_states => ((1.0,), (2.0,), (3.0,), (4.0,)))),\n        ]\n\n        @testset \"IC: $name\" for (name, periodic, ic) in cases\n            params = merge(linear_2d_base(periodic), ic, UPWIND1)\n            exact = analytical_solution(params)\n            sim = run_direct_simulation(params)\n            @test sim !== nothing\n            if sim !== nothing\n                x0, u0 = sim.x[1], sim.u[1]\n                # The IC was actually applied to every particle\n                @test all(i -> isapprox(u0[i][1], exact(spacetime(x0[i], 0.0))[1]; atol = 1e-12), eachindex(x0))\n\n                # The run reaches tmax, stays finite and (nearly) inside the initial bounds\n                @test sim.t[end] ≈ params[:tmax]\n                lo, hi = extrema(u[1] for u in u0)\n                slack = 0.05 * (hi - lo) + 1e-12\n                uend = [u[1] for u in sim.u[end]]\n                @test all(isfinite, uend)\n                @test lo - slack \u003c= minimum(uend)\n                @test maximum(uend) \u003c= hi + slack\n            end\n        end\n    end\n\n    @testset \"Snapshot bookkeeping\" begin\n        params = merge(linear_1d_gauss(50; tmax = 0.1), UPWIND1)\n        params[:snapshots] = 4\n        sim = run_direct_simulation(params)\n        @test sim !== nothing\n        if sim !== nothing\n            @test length(sim.t) == 5\n            @test sim.t[1] == 0\n            @test sim.t[end] ≈ 0.1\n            @test issorted(sim.t)\n            @test all(k -> sim.t[k] >= (k - 1) * 0.1 / 4 - 1e-12, eachindex(sim.t))\n            @test all(x -> length(x) == length(sim.x[1]), sim.x)\n            @test sim.x[1] == sim.x[end]   # Grid_mover = :none keeps particles fixed\n        end\n    end\n\n    @testset \"Early stop is reported, snapshots = 0 is rejected\" begin\n        # Sod with MUSCL2 and no limiter at CFL 4 blows up in the first step: the loop stops with a warning\n        # (instead of silently), records no NaN time and the runner still returns the data up to that point.\n        sod = euler_1d_sod()\n        p = merge(sod.shared, sod.methods[:RK2MUSCL2_VK], Dict{Symbol, Any}(:Grid_Ns => (100,), :Time_CFL => 4.0,\n                  :Limiter_name => :none, :tmax => 0.2, :snapshots => 4))\n        sim = @test_logs (:warn, r\"solve_equation stopped at t = .* before tmax\") match_mode = :any run_direct_simulation(p)\n        @test sim !== nothing\n        if sim !== nothing\n            @test all(isfinite, sim.t)\n            @test sim.t[end] \u003c 0.2\n        end\n\n        # A non-finite step (here a NaN fixed dt) stops at once without recording a NaN time\n        pn = merge(linear_1d_gauss(50), UPWIND1, Dict{Symbol, Any}(:Time_dt => NaN))\n        delete!(pn, :Time_CFL)\n        simn = @test_logs (:warn, r\"time step is not finite\") match_mode = :any run_direct_simulation(pn)\n        @test simn !== nothing && simn.t == [0.0, 0.0]\n\n        # Blow-ups the step doesn't see (constant wave speeds): unstable linear advection at CFL 5 first grows\n        # (warned once), then overflows; the run stops at the first non-finite snapshot\n        pb = merge(linear_1d_gauss(50; tmax = 100.0), UPWIND1, Dict{Symbol, Any}(:Time_CFL => 5.0, :snapshots => 10))\n        logsb, simb = Test.collect_test_logs(() -> run_direct_simulation(pb))\n        warnsb = [l.message for l in logsb if l.level == Base.CoreLogging.Warn]\n        @test simb !== nothing && all(isfinite, simb.t) && simb.t[end] \u003c 100.0\n        @test simb.metadata[:stopped_early] && simb.metadata[:t_final] == simb.t[end]   # findable later\n        # each blow-up is reported once: the growth warning and one stop (the final slot of a stopped run is not\n        # checked again; it used to repeat \"not finite\" without \"stopped before tmax\")\n        @test length(warnsb) == 2 && occursin(\"times larger than at t = 0\", warnsb[1]) && occursin(\"stopped before tmax\", warnsb[2])\n        # ... also when the final slot is the only one after t = 0\n        pb1 = merge(pb, Dict{Symbol, Any}(:snapshots => 1))\n        simb1 = @test_logs (:warn, r\"is not finite \\(blown up\\)\") match_mode = :any run_direct_simulation(pb1)\n        # reaches tmax with a non-finite state: findable by :finite, not by :stopped_early\n        @test simb1 !== nothing && !simb1.metadata[:stopped_early] && !simb1.metadata[:finite]\n        # A NaN state has an infinite CFL step (NaN wave speeds are skipped): it stops, it doesn't jump to tmax\n        pnan = merge(burgers_1d_gauss(50), UPWIND1, Dict{Symbol, Any}(:IC_a => (NaN,), :snapshots => 1))\n        logsnan, simnan = Test.collect_test_logs(() -> run_direct_simulation(pnan))\n        @test count(l -> l.level == Base.CoreLogging.Warn, logsnan) == 1\n        @test any(l -> occursin(\"is not finite (blown up)\", l.message), logsnan)\n        @test simnan !== nothing && simnan.t[end] == 0.0\n        # An infinite CFL number is a configuration error: it stops at once instead of one silent step to tmax\n        pcfl = merge(linear_1d_gauss(50), UPWIND1, Dict{Symbol, Any}(:Time_CFL => Inf))\n        simcfl = @test_logs (:warn, r\"from the CFL number Inf, which must be positive and finite\") match_mode = :any run_direct_simulation(pcfl)\n        @test simcfl !== nothing && simcfl.t == [0.0, 0.0]\n        # A fixed-step blow-up with snapshots = 1 (the final slot is the only check): Sod without limiter at dt = 0.05\n        sod1 = euler_1d_sod()\n        pf = merge(sod1.shared, sod1.methods[:RK2MUSCL2_VK], Dict{Symbol, Any}(:Grid_Ns => (100,), :Time_dt => 0.05,\n                   :Limiter_name => :none, :tmax => 0.2, :snapshots => 1))\n        delete!(pf, :Time_CFL)\n        simf = @test_logs (:warn, r\"not finite\") match_mode = :any run_direct_simulation(pf)\n        @test simf !== nothing && !simf.metadata[:finite]\n        # An infinite fixed step is not a step\n        pinf = merge(linear_1d_gauss(50), UPWIND1, Dict{Symbol, Any}(:Time_dt => Inf))\n        delete!(pinf, :Time_CFL)\n        siminf = @test_logs (:warn, r\"time step is not finite\") match_mode = :any run_direct_simulation(pinf)\n        @test siminf !== nothing && siminf.t == [0.0, 0.0]\n\n        # No fixed time scale: tmax = 1e-13 is integrated (the absolute round-off end 1e-12 returned the IC at t = 0)\n        ptiny = merge(linear_1d_gauss(50; tmax = 1e-13), UPWIND1)\n        simtiny = run_direct_simulation(ptiny)\n        @test simtiny !== nothing && simtiny.t[end] ≈ 1e-13\n\n        # No wave moves (zero velocity: infinite CFL step): the run reaches tmax without a warning\n        pz = merge(linear_1d_gauss(50), UPWIND1, Dict{Symbol, Any}(:PDE_velocities => ((0.0,),)))\n        logs, simz = Test.collect_test_logs(() -> run_direct_simulation(pz))\n        @test simz !== nothing && simz.t[end] ≈ 0.1\n        @test !any(l -> l.level >= Base.CoreLogging.Warn, logs)\n\n        p0 = merge(linear_1d_gauss(50), UPWIND1)\n        p0[:snapshots] = 0\n        logs, sim0 = Test.collect_test_logs(() -> run_direct_simulation(p0))\n        @test sim0 === nothing\n        errs = [first(l.kwargs[:exception]) for l in logs if haskey(l.kwargs, :exception)]\n        @test length(errs) == 1 && errs[1] isa ArgumentError && occursin(\"snapshots must be ≥ 1\", errs[1].msg)\n    end\n\n    @testset \"Convergence order: $label\" for (label, method, min_order) in [\n        (\"RK2 Upwind1\", last(create_method(:RK2, :Upwind, 1; Scheme_upwind_alg_nd = :Classic)), 0.7),\n        (\"RK2 MUSCL2\",  last(create_method(:RK2, :MUSCL, 2)), 1.8),\n        (\"RK4 MUSCL4\",  last(create_method(:RK4, :MUSCL, 4)), 3.5),\n    ]\n        # Measured on N = 100 → 200: 0.80, 2.06, 4.36\n        errs = [first(l1_error(merge(linear_1d_gauss(N), method))) for N in (100, 200)]\n        @test all(isfinite, errs)\n        observed = log2(errs[1] / errs[2])\n        @info \"Observed convergence order\" label errs observed\n        @test observed > min_order\n    end\n\n    @testset \"Burgers (smooth, pre-shock) vs exact: $label\" for (label, method) in [\n        (\"direct RK2 MUSCL2\",     last(create_method(:RK2, :MUSCL, 2))),\n        (\"kinetic ARS222 MUSCL2\", last(create_method(:ARS222, :MUSCL, 2))),\n    ]\n        vels, idx = generate_relax_params(2.0, 1, 1)\n        params = merge(burgers_1d_gauss(200), method, Dict{Symbol, Any}(\n            :Kinetic_velocities => vels, :Kinetic_indices => idx, :Kinetic_epsilon => 1e-6))\n        err, sim = l1_error(params)\n        @test sim !== nothing\n        @test err \u003c 0.03\n    end\n\n    @testset \"Sod shock tube: every configured method vs exact\" begin\n        config = euler_1d_sod()\n        γ = config.shared[:PDE_gamma]\n        cases = sort!([(k, v) for (k, v) in config.methods if haskey(v, :Time_stepper)]; by = first)\n\n        @testset \"$name\" for (name, m) in cases\n            err, sim = l1_error(merge(config.shared, m))\n            @test sim !== nothing\n            @test err \u003c 0.1\n            if sim !== nothing\n                us = sim.u[end]\n                @test minimum(u -> u[1], us) > 0                                          # density\n                @test minimum(u -> (γ - 1) * (u[3] - 0.5 * u[2]^2 / u[1]), us) > 0        # pressure\n            end\n        end\n    end\n\n    @testset \"Float32 end-to-end\" begin\n        p64 = merge(linear_1d_gauss(100), UPWIND1)\n        p32 = merge(p64, Dict{Symbol, Any}(:T => Float32))\n        err64, _   = l1_error(p64)\n        err32, s32 = l1_error(p32)\n        @test s32 !== nothing\n        @test isfinite(err32)\n        @test abs(err32 - err64) \u003c 1e-3\n    end\n\n    @testset \"Lagrangian mover uses the PDE's fluid velocity\" begin\n        config = euler_1d_sod()\n        params = merge(config.shared, config.methods[:RK2MUSCL2_U1_EPD1], Dict{Symbol, Any}(:Grid_mover => :lagrangian))\n        err, sim = l1_error(params)\n        @test sim !== nothing\n        @test err \u003c 0.1\n        sim === nothing || @test sim.x[end] != sim.x[1]           # the particles moved with the flow\n    end\n\n    @testset \"Execution backend helpers\" begin\n        @test storage_for(PolyesterBackend()) === Array\n        @test storage_for(ThreadsBackend()) === Array\n        @test storage_for(KABackend(HyperCloudCore.KA.CPU())) === Array\n        previous = get_backend()\n        @test with_backend(get_backend, ThreadsBackend()) isa ThreadsBackend\n        @test_throws ErrorException with_backend(() -> error(\"boom\"), ThreadsBackend())\n        @test get_backend() === previous                            # restored, also after an error\n    end\n\n    @testset \"Memory limit\" begin\n        params = merge(linear_1d_gauss(100), UPWIND1)\n        try\n            set_memory_limit!(64 * 2^20; tolerance = 0.1)\n            @test get_memory_limit() == (; limit = 64 * 2^20, tolerance = 0.1, slots_per_particle = nothing)\n            sim = run_sim(params)\n            @test sim !== nothing\n            if sim !== nothing\n                @test sim.stats[:reserved_particles][1] >= length(sim.x[end])\n                @test sim.stats[:reserved_bytes][1] \u003c= 0.9 * 64 * 2^20\n            end\n            set_memory_limit!(10_000)                               # cannot hold 100 particles\n            @test (@test_logs (:error, r\"Error during Direct Simulation\") match_mode = :any run_sim(params)) === nothing\n        finally\n            set_memory_limit!(nothing)\n        end\n        @test get_memory_limit() === nothing\n        @test_throws ArgumentError set_memory_limit!(0)\n    end\n\n    @testset \"Spherical WENO & progress logging\" begin\n        # Disable the progress bar and force frequent @info logs\n        enable_progress_bar!(false)\n        set_progress_interval!(0.001)\n        try\n            params = Dict{Symbol, Any}(\n                :PDE_name => :linear, :PDE_velocities => ((1.0,),),\n                :sim_func_name => :run_direct_simulation,\n                :tmax => 0.05, :snapshots => 2,\n                :Grid_domain => :spherical, :Grid_mins => (0.1,), :Grid_maxs => (1.0,),\n                :Grid_Ns => (250,),   # large enough that the ETA log fires\n                :Grid_periodic => false, :Grid_randomness_factor => (0.0,), :Grid_seed => 42, :Grid_mover => :none,\n                :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 2.5,\n                :IC_name => :gauss, :IC_a => (1.0,), :IC_b => (0.5,), :IC_width => 0.1,\n                :Time_CFL => 0.1, :Time_stepper => :RK2,\n                :Scheme_name => :WENO, :Scheme_order => 2, :Scheme_MLS_order => 0,\n                :Flux_name => :Upwind, :Limiter_name => :none,\n                :MOOD_criterion => :none,\n            )\n\n            @test_logs (:info, r\"Using .* for parallel runs!\") (:info, r\"Simulation Progress: .*\") match_mode = :any begin\n                sim = run_direct_simulation(params)\n                @test sim !== nothing\n                @test sim.t[end] ≈ 0.05\n                @test length(sim.x[end]) == 251\n            end\n        finally\n            enable_progress_bar!(true)\n            set_progress_interval!(1.0)\n        end\n    end\n\n    @testset \"run_all_simulations driver (with stats)\" begin\n        methods = Dict{Symbol, Dict{Symbol, Any}}(\n            :analytical_solution => Dict{Symbol, Any}(),\n            :Upwind => copy(UPWIND1),\n        )\n        conf = SimulationConfig(linear_1d_gauss(50), methods, [:analytical_solution, :Upwind];\n                                reference = :analytical_solution)\n        old_path = get_save_path()\n        set_save_path!(mktempdir())          # never reuse or write results in the working directory\n        try\n            summary = run_all_simulations(conf; force_overwrite = true, calculate_stats = true)\n            tasks = generate_tasks(conf)\n            @test length(tasks) == 1                                   # the reference method is not run\n            @test length(summary.ran) == 1 && isempty(summary.failed) && isempty(summary.empty)\n            p = only(tasks)\n            @test does_sim_data_exist(p)\n            if does_sim_data_exist(p)\n                sim = load_sim_data(p, Val(:lagrangian))\n                @test sim.t[end] ≈ 0.1\n                # the runner's metadata comes back with the data, next to PDEStudioCore's provenance\n                md = sim.metadata\n                @test md[:hypercloudcore] == string(pkgversion(HyperCloudCore)) && md[:stopped_early] == false && md[:finite]\n                @test md[:steps] > 0 && md[:t_final] ≈ 0.1 && md[:float_type] == \"Float64\"\n                @test md[:provenance][:solver_module] == \"HyperCloud\"\n                # a second run is cached\n                @test length(run_all_simulations(conf; calculate_stats = false).cached) == 1\n                exact = analytical_solution(p)\n                xs, us = sim.x[end], sim.u[end]\n                err = sum(i -> abs(exact(spacetime(xs[i], sim.t[end]))[1] - us[i][1]), eachindex(xs)) / length(xs)\n                @test err \u003c 0.15                                      # Upwind1 at N = 50: 0.079\n            end\n        finally\n            set_save_path!(old_path)\n        end\n    end\nend\n"},{"name":"sims_bgk.jl","path":"test/sims_bgk.jl","type":"file","files":1,"lines":97,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.13402061855670103,"G3":0.865979381443299},"lines":{"G2":13,"G3":84}},"Human-Review":{"files":{"H0":0.865979381443299,"H1":0.13402061855670103},"lines":{"H0":84,"H1":13}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":97}}},"parts":[{"lines":84,"runs":[[1,55],[69,97]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":13,"runs":[[56,68]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Group `sims-bgk`: BGK simulations (collisionless convergence, Euler limit, conservation, explicit vs IMEX).\n\n@testset \"Simulations\" begin\n    @testset \"BGK\" begin\n        @testset \"Collisionless transport converges at the scheme's order\" begin\n            errs = [first(l1_error(bgk_wave_params(N))) for N in (50, 100)]\n            @test all(isfinite, errs)\n            @test errs[2] \u003c 5e-5\n            @test log2(errs[1] / errs[2]) > 2.7                     # MUSCL3 / RK3 against the exact DVM solution\n        end\n\n        @testset \"Euler limit: Sod at τ = 1e-5 (IMEX, forwarded by run_kinetic_simulation)\" begin\n            err, sim = euler_l1(bgk_sod_params(200))\n            @test sim !== nothing\n            if sim !== nothing\n                us = sim.u[end]\n                @test length(us[1]) == 3                              # macroscopic output\n                @test err \u003c 0.025                                     # the Euler scheme itself: about 0.016\n                @test minimum(u -> u[1], us) > 0\n                @test minimum(u -> 0.4 * (u[3] - 0.5 * u[2]^2 / u[1]), us) > 0\n            end\n            # A larger τ is further from the Euler solution (viscous, heat-conducting profiles)\n            err_far, _ = euler_l1(bgk_sod_params(200; tau = 1e-2))\n            @test err_far > 0.025\n        end\n\n        @testset \"Mass, momentum and energy are conserved (periodic lattice, IMEX)\" begin\n            sim = run_sim(bgk_wave_params(64; tau = 1e-2, stepper = :ARS222, order = 2))\n            @test sim !== nothing\n            sim !== nothing && @test isapprox(totals(sim, length(sim.u)), totals(sim, 1); rtol = 1e-12, atol = 1e-12)\n        end\n\n        @testset \"Explicit collision (RK2) agrees with IMEX for a non-stiff τ\" begin\n            pe = merge(bgk_wave_params(64; tau = 0.05, stepper = :RK2, order = 2), Dict{Symbol, Any}(:sim_func_name => :run_direct_simulation))\n            pi_ = bgk_wave_params(64; tau = 0.05, stepper = :ARS222, order = 2)\n            se, si = run_sim(pe), run_sim(pi_)\n            @test se !== nothing && si !== nothing\n            if se !== nothing && si !== nothing\n                @test maximum(i -> abs(se.u[end][i][1] - si.u[end][i][1]), eachindex(se.u[end])) \u003c 1e-3\n                @test isapprox(totals(se, length(se.u)), totals(se, 1); rtol = 1e-12, atol = 1e-12)\n                # Relaxation damps the free-transport solution\n                ex = analytical_solution(merge(pe, Dict{Symbol, Any}(:PDE_tau => Inf)))\n                @test maximum(i -> abs(ex(spacetime(se.x[end][i], se.t[end]))[1] - se.u[end][i][1]), eachindex(se.x[end])) > 1e-3\n            end\n        end\n\n        @testset \":save_relax keeps the distributions\" begin\n            p = bgk_wave_params(32; tau = 1e-2, stepper = :ARS222, order = 2)\n            s_mac, s_kin = run_sim(p), run_sim(merge(p, Dict{Symbol, Any}(:save_relax => true)))\n            @test s_mac !== nothing && s_kin !== nothing\n            if s_mac !== nothing && s_kin !== nothing\n                eq = build_equation(HC.extract_namespace(p, :PDE), Dict{Symbol, Any}(:T => Float64))\n                @test length(s_kin.u[end][1]) == HC.get_M(eq) == 16\n                @test all(i -> moments(eq, s_kin.u[end][i]) ≈ s_mac.u[end][i], eachindex(s_mac.u[end]))\n            end\n            # ... also through the Kinetic namespace, as for run_kinetic_simulation (the BGK runner ignored it)\n            s_kin2 = run_sim(merge(p, Dict{Symbol, Any}(:Kinetic_save_relax => true)))\n            @test s_kin2 !== nothing && length(s_kin2.u[end][1]) == 16\n        end\n\n        @testset \"τ = 0 (the Euler limit as a projection) runs end to end\" begin\n            p0 = bgk_wave_params(32; tau = 0.0, stepper = :ARS222, order = 2)\n            s0 = run_sim(p0)\n            @test s0 !== nothing && all(u -> all(isfinite, u), s0.u[end])\n            if s0 !== nothing\n                m(s, k) = sum(u -> u[k], s.u[end]) / length(s.u[end])\n                @test all(k -> isapprox(m(s0, k), sum(u -> u[k], s0.u[1]) / length(s0.u[1]); atol = 1e-12), 1:3)   # conserved\n            end\n        end\n\n        @testset \"Float32 end-to-end\" begin\n            e64, _ = l1_error(bgk_wave_params(50))\n            e32, s32 = l1_error(bgk_wave_params(50; T = Float32))\n            @test s32 !== nothing\n            s32 !== nothing && @test eltype(s32.u[end][1]) == Float32\n            @test abs(e32 - e64) \u003c 1e-4\n        end\n\n        @testset \"2D: collisionless convergence and conservation\" begin\n            p2 = Dict{Symbol, Any}(\n                :PDE_name => :bgk, :PDE_D => 2, :PDE_gamma => 2.0, :PDE_Nv => 6, :PDE_vmax => 4.0, :PDE_tau => Inf,\n                :sim_func_name => :run_bgk_simulation, :tmax => 0.1, :snapshots => 1,\n                :Grid_domain => :rectangular, :Grid_mins => (0.0, 0.0), :Grid_maxs => (1.0, 1.0),\n                :Grid_periodic => true, :Grid_randomness_factor => (0.0, 0.0), :Grid_seed => 42, :Grid_mover => :none,\n                :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 2.5,\n                :IC_name => :sine, :IC_a => (0.2, 0.05, 0.05, 0.1), :IC_period => (1.0, 1.0), :IC_c_offset => (1.0, 0.0, 0.0, 0.5),\n                :Time_CFL => 0.2, :Time_stepper => :RK2,\n                :Scheme_name => :MUSCL, :Scheme_order => 2, :Flux_name => :Rusanov, :Limiter_name => :none, :MOOD_criterion => :none)\n            errs = [first(l1_error(merge(p2, Dict{Symbol, Any}(:Grid_Ns => (N, N))))) for N in (16, 32)]\n            @test all(isfinite, errs)\n            @test log2(errs[1] / errs[2]) > 1.5\n            sim = run_sim(merge(p2, Dict{Symbol, Any}(:Grid_Ns => (16, 16), :PDE_tau => 1e-2, :Time_stepper => :ARS222)))\n            @test sim !== nothing\n            sim !== nothing && @test isapprox(totals(sim, length(sim.u)), totals(sim, 1); rtol = 1e-12, atol = 1e-12)\n        end\n    end\nend\n"},{"name":"sims_sweep.jl","path":"test/sims_sweep.jl","type":"file","files":1,"lines":22,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"errors":[],"parts":[{"lines":22,"runs":[[1,22]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [3]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Groups `sweep-a`, `sweep-b`: every method of the master dictionary on a 1-D advection, split over the two\n# groups by `_sweep_cases` (each method is a new type combination, i.e. a compilation of its stepper).\n\n@testset \"Simulations\" begin\n    @testset \"Master method dictionary sweep (1D linear advection)\" begin\n        # Replaces the copy-pasted per-scheme runs: every registered method must run and stay accurate.\n        vels, idx = generate_relax_params(2.0, 1, 1)\n        base = merge(linear_1d_gauss(200), Dict{Symbol, Any}(\n            :Kinetic_velocities => vels, :Kinetic_indices => idx, :Kinetic_epsilon => 1e-6))\n        cases = sort!([(k, v) for (k, v) in get_master_method_dict() if haskey(v, :Time_stepper)]; by = first)\n\n        @testset \"$name\" for (name, m) in _sweep_cases(cases)\n            err, sim = l1_error(merge(base, m))\n            if haskey(KNOWN_BROKEN_METHODS, name)\n                @test_broken sim !== nothing && err \u003c 0.05\n            else\n                @test sim !== nothing\n                @test err \u003c 0.05\n            end\n        end\n    end\nend\n"},{"name":"sims_walls.jl","path":"test/sims_walls.jl","type":"file","files":1,"lines":327,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"errors":[],"parts":[{"lines":327,"runs":[[1,327]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Group `walls`: the wall operators for MirrorBC (SlipWall for Euler and BGK, DiffuseWall for BGK) on static and\n# moving boundaries, against exact Rankine–Hugoniot states and the kinetic flux balance.\n\nconst BCD = Dict{Int, AbstractBoundaryCondition}\n\neuler_wall_base(; Ns = 200, tmax = 0.3) = Dict{Symbol, Any}(\n    :PDE_name => :euler, :PDE_D => 1, :PDE_gamma => 1.4,\n    :sim_func_name => :run_direct_simulation, :tmax => tmax, :snapshots => 1,\n    :Grid_Ns => (Ns,), :Grid_periodic => false, :Grid_randomness_factor => (0.0,), :Grid_seed => 1, :Grid_mover => :none,\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 2.5,\n    :Time_CFL => 0.2, :Time_stepper => :RK3,\n    :Scheme_name => :MUSCL, :Scheme_order => 2, :Flux_name => :Rusanov, :Limiter_name => :VK, :Limiter_mode => :hard,\n    :MOOD_criterion => :none)\n\nbgk_wall_base(; Ns = 50, tau = 1e-2, tmax = 0.2) = Dict{Symbol, Any}(\n    :PDE_name => :bgk, :PDE_D => 1, :PDE_gamma => 1.4, :PDE_Nv => 16, :PDE_vmax => 6.0, :PDE_tau => tau,\n    :sim_func_name => :run_bgk_simulation, :tmax => tmax, :snapshots => 1,\n    :Grid_domain => :rectangular, :Grid_mins => (0.0,), :Grid_maxs => (1.0,), :Grid_Ns => (Ns,),\n    :Grid_periodic => false, :Grid_randomness_factor => (0.0,), :Grid_seed => 1, :Grid_mover => :none,\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 2.5,\n    :IC_name => :riemann, :IC_uL => (1.0, 0.0, 2.5), :IC_uR => (1.0, 0.0, 2.5), :IC_p0 => (0.5,), :IC_n => (1.0,),\n    :Time_CFL => 0.2, :Time_stepper => :ARS222,\n    :Scheme_name => :MUSCL, :Scheme_order => 2, :Flux_name => :Rusanov, :Limiter_name => :none, :MOOD_criterion => :none)\n\n# Net mass flux through a wall (normal n into the wall, velocity w) of a BGK ghost state g for the mirrored interior\n# state f: the incident half (c > 0) from f, the emitted half from g. Zero for a wall that holds the gas.\nfunction wall_mass_flux(eq, f, g, n, w)\n    Φ = 0.0\n    for k in 1:HyperCloud.num_velocities(eq)\n        v, wk = velocity_node(eq, k)\n        c = sum((v - w) .* n)\n        Φ += wk * c * (c > 0 ? f[k] : g[k])\n    end\n    return Φ\nend\n\n# Mass of the final state minus the initial mass (trapezoid rule over the sorted 1-D cloud: the mean of the point\n# values is not the mass, the wall particles at both ends count half)\nfunction mass_change(sim)\n    xs = [x[1] for x in sim.x[end]]\n    o = sortperm(xs)\n    trap(us) = sum((us[o[i]][1] + us[o[i + 1]][1]) / 2 * (xs[o[i + 1]] - xs[o[i]]) for i in 1:length(o) - 1)\n    return trap(sim.u[end]) - trap(sim.u[1])\nend\n\n# Mean of (ρ, u, p) over the particles with x in (lo, hi)\nfunction plateau(sim, lo, hi)\n    xs, us = [x[1] for x in sim.x[end]], sim.u[end]\n    idx = [i for i in eachindex(xs) if lo \u003c xs[i] \u003c hi]\n    @test length(idx) >= 10\n    ρ = sum(us[i][1] for i in idx) / length(idx)\n    u = sum(us[i][2] / us[i][1] for i in idx) / length(idx)\n    p = sum(0.4 * (us[i][3] - 0.5 * us[i][2]^2 / us[i][1]) for i in idx) / length(idx)\n    return ρ, u, p\nend\n\n@testset \"Walls\" begin\n    @testset \"Operators\" begin\n        eq = EulerEquation(Val(2), Float64)\n        wall = WallPoint(SVector(0.0, 0.0), SVector(0.0, 1.0), 0.1, SVector(0.0, 0.0))\n        U = prim2cons(eq, State{4, Float64}(2.0, 0.3, -0.4, 1.5))\n        V = cons2prim(eq, SlipWall()(eq, U, wall))\n        @test V ≈ State{4, Float64}(2.0, 0.3, 0.4, 1.5)                        # the normal velocity flips, the rest stays\n        moving = WallPoint(SVector(0.0, 0.0), SVector(0.0, 1.0), 0.1, SVector(0.0, 0.2))\n        V = cons2prim(eq, SlipWall()(eq, U, moving))\n        @test V ≈ State{4, Float64}(2.0, 0.3, 0.8, 1.5)                        # relative to the wall: -0.4 - 0.2 -> +0.6, plus 0.2\n        accel = WallPoint(SVector(0.0, 0.0), SVector(0.0, 1.0), 0.1, SVector(0.0, 0.2), SVector(0.5, -1.0))\n        V = cons2prim(eq, SlipWall()(eq, U, accel))\n        p2 = 1.5 * exp(2 * 0.1 * 2.0 * 1.0 / 1.5)                                # p' = p exp(-2 d ρ n⋅a / p), n⋅a = -1\n        ρ2 = 2.0 * (p2 / 1.5)^(1 / 1.4)                                          # isentropic\n        @test V[4] ≈ p2 && V[1] ≈ ρ2 && V[3] ≈ 0.8                               # normal velocity as before\n        @test V[2] ≈ 0.3                                                         # a flat wall: the tangential speed stays\n        # a disc spinning about its centre (ω = 2, r = 0.15) in a gas at rest: acceleration, spin and curvature cancel,\n        # the ghost is the gas at rest (the acceleration alone stirred it)\n        ω, r = 2.0, 0.15\n        Ω = SMatrix{2, 2}(0.0, ω, -ω, 0.0)\n        xw, nw = SVector(r, 0.0), SVector(-1.0, 0.0)                              # outward of the gas: into the disc\n        spin = WallPoint{2, Float64, 4}(xw, nw, 0.02, Ω * xw, Ω * Ω * xw, Ω, -(I - SVector(1.0, 0.0) * SVector(1.0, 0.0)') / r)\n        rest = prim2cons(eq, State{4, Float64}(1.0, 0.0, 0.0, 1.0))\n        @test SlipWall()(eq, rest, spin) ≈ rest atol = 1e-14\n        # ... also when round-off leaves a pressure term (the curvature correction acts on the lab-frame velocity,\n        # irrotational here, not on the velocity relative to the spinning wall)\n        spin2 = WallPoint{2, Float64, 4}(xw, nw, 0.02, Ω * xw, Ω * Ω * xw * (1 + 1e-6), Ω, spin.hessian)\n        @test SlipWall()(eq, rest, spin2) ≈ rest atol = 1e-6\n        # a vortex along a static concave wall (inside the circle r = 1): ∂p/∂n = ρ u_t² / r, the pressure grows outward\n        conc = WallPoint{2, Float64, 4}(SVector(1.0, 0.0), SVector(1.0, 0.0), 0.05, zero(SVector{2}), zero(SVector{2}),\n                                        zero(SMatrix{2, 2}), SMatrix{2, 2}(0.0, 0.0, 0.0, 1.0))\n        Vc = cons2prim(eq, SlipWall()(eq, prim2cons(eq, State{4, Float64}(1.0, 0.0, 0.5, 1.0)), conc))\n        @test Vc[4] ≈ exp(2 * 0.05 * 0.25) && abs(Vc[2]) \u003c 1e-15\n        @test Vc[3] ≈ 0.5 * (1 - 2 * 0.05)                                       # the irrotational vortex slows outward\n        # Galilean invariance: the same wall and flow seen from a frame moving at V (the wall moves at V) give the same\n        # ghost relative to the wall (the lab-frame correction of the tangential velocity was not invariant)\n        V0 = SVector(0.3, 0.2)\n        convV = WallPoint{2, Float64, 4}(conc.position, conc.normal, conc.distance, V0, zero(SVector{2}), zero(SMatrix{2, 2}), conc.hessian)\n        Vv = cons2prim(eq, SlipWall()(eq, prim2cons(eq, State{4, Float64}(1.0, V0[1], 0.5 + V0[2], 1.0)), convV))\n        @test Vv ≈ State{4, Float64}(Vc[1], Vc[2] + V0[1], Vc[3] + V0[2], Vc[4])\n        # a supersonic flow along a convex wall: the ghost pressure stays positive (log-linear, bounded)\n        cvx = WallPoint{2, Float64, 4}(SVector(0.15, 0.0), SVector(-1.0, 0.0), 0.04, zero(SVector{2}), zero(SVector{2}),\n                                       zero(SMatrix{2, 2}), SMatrix{2, 2}(0.0, 0.0, 0.0, -1 / 0.15))\n        Vs = cons2prim(eq, SlipWall()(eq, prim2cons(eq, State{4, Float64}(1.0, 0.0, 4.0, 1.0)), cvx))\n        @test Vs[4] ≈ exp(-0.5) && Vs[1] > 0\n        @test 4.0 \u003c Vs[3] \u003c= 6.0 + 1e-12                                         # the tangential correction is bounded too\n        # a concave wall of radius below 2d: the tangential velocity keeps its direction\n        tight = WallPoint{2, Float64, 4}(SVector(0.05, 0.0), SVector(1.0, 0.0), 0.04, zero(SVector{2}), zero(SVector{2}),\n                                         zero(SMatrix{2, 2}), SMatrix{2, 2}(0.0, 0.0, 0.0, 1 / 0.05))\n        Vt = cons2prim(eq, SlipWall()(eq, prim2cons(eq, State{4, Float64}(1.0, 0.0, 0.5, 1.0)), tight))\n        @test 0.25 - 1e-12 \u003c= Vt[3] \u003c 0.5\n        @test_throws ArgumentError DiffuseWall(0.0)\n        @test_throws ArgumentError DiffuseWall(1.0; accommodation = 2)\n        @test slip_wall() isa MirrorBC{1, SlipWall, true} && diffuse_wall(1.5; degree = 2) isa MirrorBC{2, \u003c:DiffuseWall, true}\n        # the runners check the operators before the first step (inside the kernel a MethodError, or no wall at all)\n        box1 = get_rectangular_domain(Float64, (0.0,), (1.0,); bc_map = BCD(1 => slip_wall(), 2 => slip_wall()))\n        lin  = LinearAdvection(((1.0,),), Float64)\n        @test_throws ArgumentError HyperCloud._check_wall_ops(lin, box1)\n        @test HyperCloud._check_wall_ops(EulerEquation(Val(1), Float64), box1) === nothing\n        # BGK: specular reflection flips the node index along the wall axis; the diffuse wall returns an\n        # equilibrium at its own temperature into itself (exact discrete flux balance)\n        nodes, weights = velocity_grid(:uniform, 8, 6.0)\n        bgk = BGKEquation(Val(1), nodes, weights, 1.4, ConstantRelaxationTime(1e-2))\n        f, _ = equilibrium(bgk, SVector(1.0, 0.3, 2.5 + 0.5 * 0.09))\n        w1 = WallPoint(SVector(1.0), SVector(1.0), 0.05, SVector(0.0))\n        g = SlipWall()(bgk, f, w1)\n        @test all(k -> g[k] == f[9 - k] && g[8 + k] == f[17 - k], 1:8)\n        feq, _ = equilibrium(bgk, SVector(1.0, 0.0, 2.5))\n        @test DiffuseWall(1.0)(bgk, feq, w1) ≈ feq atol = 1e-13\n        @test DiffuseWall(1.0; accommodation = 0.3)(bgk, feq, w1) ≈ feq atol = 1e-13\n        # a hotter wall emits a hotter half: the outgoing (v \u003c 0, into the fluid at x \u003c 1) components change\n        boxd(op) = get_rectangular_domain(Float64, (0.0,), (1.0,); bc_map = BCD(1 => MirrorBC(op), 2 => MirrorBC(op)))\n        @test HyperCloud._check_wall_ops(bgk, boxd(DiffuseWall(2.0))) === nothing\n        @test_throws ArgumentError HyperCloud._check_wall_ops(bgk, boxd(DiffuseWall(1.0; velocity = (0.1, 0.2))))\n        @test_throws ArgumentError HyperCloud._check_wall_ops(bgk, boxd(DiffuseWall(1.0; velocity = (NaN,))))   # no Maxwellian\n        @test_throws ArgumentError HyperCloud._check_wall_ops(bgk, boxd(DiffuseWall(1e-4)))    # too cold for 8 nodes: emits nothing\n        @test_throws ArgumentError HyperCloud._check_wall_ops(EulerEquation(Val(1), Float64), boxd(DiffuseWall(1.0)))\n        hot = DiffuseWall(2.0)(bgk, feq, w1)\n        @test all(k -> (velocity_node(bgk, k)[1][1] > 0) == (hot[k] == feq[k]), 1:8)\n        @test moments(bgk, hot)[1] > 0\n        # Off the node grid (a shifted grid, an oblique normal, a moving wall) the specular reflection keeps the mass\n        # flux through the wall at zero and reflects an equilibrium into the equilibrium of the reflected state.\n        # A drifting gas, so that the identity or an even reflection would fail.\n        reflected(eq, f, n, w) = (U = moments(eq, f); u = SVector(U[2:end-1]...) / U[1];\n                                  ur = u - 2 * sum((u - w) .* n) * n; (U[1], ur, U[end] - 0.5 * U[1] * sum(abs2, u)))\n        function check_reflection(eq, f, n, w; tol = 1e-3)\n            g = SlipWall()(eq, f, WallPoint(zero(n), n, 0.05, w))\n            @test abs(wall_mass_flux(eq, f, g, n, w)) \u003c 1e-13\n            ρ, ur, ei = reflected(eq, f, n, w)\n            G = moments(eq, g)\n            @test abs(G[1] - ρ) \u003c tol && maximum(abs.(SVector(G[2:end-1]...) / G[1] - ur)) \u003c tol &&\n                  abs(G[end] - 0.5 * G[1] * sum(abs2, SVector(G[2:end-1]...) / G[1]) - ei) \u003c tol\n        end\n        nodes16, weights16 = velocity_grid(:uniform, 16, 6.0)\n        shifted = BGKEquation(Val(1), nodes16, weights16, 1.4, ConstantRelaxationTime(1e-2); center = (0.5,))\n        fs, _ = equilibrium(shifted, SVector(1.0, 0.2, 2.5 + 0.5 * 0.04))\n        # (16 nodes: the scaled emitted half is off by 2e-3 in 1-D, 2e-5 with 64 nodes)\n        check_reflection(shifted, fs, SVector(1.0), SVector(0.0); tol = 5e-3)   # used to reflect about the grid centre 0.5\n        bgk16 = BGKEquation(Val(1), nodes16, weights16, 1.4, ConstantRelaxationTime(1e-2))\n        f16, _ = equilibrium(bgk16, SVector(1.0, 0.3, 2.5 + 0.5 * 0.09))\n        check_reflection(bgk16, f16, SVector(1.0), SVector(0.5); tol = 5e-3)    # moving wall: u' = 2w - u = 0.7\n        nodes12, weights12 = velocity_grid(:uniform, 12, 6.0)\n        bgk2 = BGKEquation(Val(2), nodes12, weights12, 1.4, ConstantRelaxationTime(1e-2))\n        f2, _ = equilibrium(bgk2, SVector(1.0, 0.2, -0.1, 2.5 + 0.5 * 0.05))\n        for θ in (0.3, π / 4)                                                # oblique; the diagonal is a node permutation\n            check_reflection(bgk2, f2, SVector(cos(θ), sin(θ)), SVector(0.0, 0.0))\n        end\n    end\n\n    @testset \"Euler: an oscillating piston radiates the acoustic wave (wall acceleration in the ghost pressure)\" begin\n        # A face at x_f - a (1 - cos ωt) with a ω ≪ c₀ and a ≪ h on a gas at rest radiates u(x, t) = v_p(t - (x_f - x)/c₀)\n        # (linear acoustics). With the even pressure mirror the error next to the face was first order (3.3 / 2.0 / 0.8 %\n        # of the amplitude for 300 / 600 / 1200 particles); with ∂p/∂n = -ρ n⋅a in the ghost pressure 0.3 / 0.7 / 0.1 %.\n        γ = 1.4; c₀ = sqrt(γ); ω = 8π; a = 1e-4 * c₀ / ω\n        I1, Z1 = SMatrix{1, 1, Float64, 1}(1.0), zero(SMatrix{1, 1, Float64, 1})\n        osc(t) = RigidMotion(SVector(-a * (1 - cos(ω * t))), I1, SVector(-a * ω * sin(ω * t)), Z1)\n        tube = intersect(Tagged(Cuboid((0.0,), (1.5,)), 1), Moving(Tagged(HalfSpace((1.0,), (1.0,)), 2), osc))\n        p = merge(euler_wall_base(; Ns = 300, tmax = 0.5), Dict{Symbol, Any}(:Grid_domain => :shape, :Grid_shape => tube, :Grid_mins => (0.0,), :Grid_maxs => (1.5,),\n                  :Grid_bc => BCD(1 => slip_wall(), 2 => slip_wall()), :Scheme_order => 3, :Limiter_name => :none,\n                  :IC_name => :riemann, :IC_uL => (1.0, 0.0, 2.5), :IC_uR => (1.0, 0.0, 2.5), :IC_p0 => (0.5,), :IC_n => (1.0,)))\n        sim = run_direct_simulation(p)\n        @test sim !== nothing\n        if sim !== nothing\n            t = sim.t[end]; h = 1.5 / 300\n            face = 1 - a * (1 - cos(ω * t))\n            err_near, err_bulk = 0.0, 0.0\n            for (x, U) in zip(sim.x[end], sim.u[end])\n                x[1] \u003c face || continue                                            # (the ghosts of the face)\n                τ = t - (1 - x[1]) / c₀\n                ue = τ > 0 ? -a * ω * sin(ω * τ) : 0.0\n                e = abs(U[2] / U[1] - ue) / (a * ω)\n                face - x[1] \u003c 3h ? (err_near = max(err_near, e)) : (err_bulk = max(err_bulk, e))\n            end\n            @test err_near \u003c 0.01                                                  # measured 0.0032 (even mirror 0.033)\n            @test err_bulk \u003c 0.15                                                  # measured 0.097 (the scheme's dispersion)\n        end\n    end\n\n    @testset \"Euler: a uniform flow along slip walls, with an inflow and an outflow, stays uniform\" begin\n        # The ghosts behind the corners of the box carried the diagonal normal to the corner, and SlipWall reflected the\n        # velocity about it: a flow along the floor became a jet into it at the inflow corner, and the free stream broke\n        # down (2-D 100 x 25, t = 0.5: density off by 3.2 everywhere, blow-up at 400 x 100). They now carry their own\n        # face's normal (HyperCloudCore's ghost geometry).\n        E = 1 / 0.4 + 0.5\n        p = merge(euler_wall_base(), Dict{Symbol, Any}(:PDE_D => 2, :Grid_domain => :rectangular, :Grid_mins => (0.0, 0.0), :Grid_maxs => (1.0, 0.25),\n                  :Grid_Ns => (60, 15), :Grid_randomness_factor => (0.2, 0.2), :Grid_seed => 7, :tmax => 0.3,\n                  :Grid_bc => BCD(1 => FixedDirichlet(), 2 => ExtrapolationBC(1), 3 => slip_wall(), 4 => slip_wall()),\n                  :IC_name => :riemann, :IC_uL => (1.0, 1.0, 0.0, E), :IC_uR => (1.0, 1.0, 0.0, E), :IC_p0 => (0.0, 0.0), :IC_n => (1.0, 0.0)))\n        sim = run_direct_simulation(p)\n        @test sim !== nothing\n        if sim !== nothing\n            us = sim.u[end]\n            pr(U) = 0.4 * (U[4] - 0.5 * (U[2]^2 + U[3]^2) / U[1])\n            @test maximum(abs(U[1] - 1) for U in us) \u003c 1e-6\n            @test maximum(abs(pr(U) - 1) for U in us) \u003c 1e-6\n            @test maximum(abs(U[3]) for U in us) \u003c 1e-6\n        end\n    end\n\n    @testset \"Euler: a gas at u = 1 reflected by a slip wall reaches the Rankine–Hugoniot state\" begin\n        ρ₂, p₂, S = HyperCloud.piston_state(1.0, 1.0, 1.0, 1.4)\n        E₁ = 2.5 + 0.5\n        p = merge(euler_wall_base(), Dict{Symbol, Any}(:Grid_domain => :rectangular, :Grid_mins => (0.0,), :Grid_maxs => (1.0,),\n                  :Grid_bc => BCD(1 => FixedDirichlet(), 2 => slip_wall()),\n                  :IC_name => :riemann, :IC_uL => (1.0, 1.0, E₁), :IC_uR => (1.0, 1.0, E₁), :IC_p0 => (0.5,), :IC_n => (1.0,)))\n        sim = run_direct_simulation(p)\n        @test sim !== nothing\n        if sim !== nothing\n            t = sim.t[end]\n            ρ, u, pr = plateau(sim, 1 - (S - 1) * t + 0.08, 0.98)\n            @test abs(ρ - ρ₂) \u003c 0.01 && abs(pr - p₂) \u003c 0.01 && abs(u) \u003c 0.01   # measured 2.0774 / 2.9267 / 4e-4 (exact 2.0792 / 2.9266 / 0)\n        end\n    end\n\n    @testset \"Euler: a piston driven into a gas at rest (moving slip wall) matches Rankine–Hugoniot\" begin\n        w = 0.5\n        ρ₂, p₂, S = HyperCloud.piston_state(1.0, 1.0, w, 1.4)\n        piston = Moving(Tagged(HalfSpace((1.0,), (1.0,)), 2), translating((-w,)))\n        tube   = intersect(Tagged(Cuboid((0.0,), (1.5,)), 1), piston)\n        p = merge(euler_wall_base(; Ns = 300), Dict{Symbol, Any}(:Grid_domain => :shape, :Grid_shape => tube, :Grid_mins => (0.0,), :Grid_maxs => (1.5,),\n                  :Grid_bc => BCD(1 => slip_wall(), 2 => slip_wall()),\n                  :IC_name => :riemann, :IC_uL => (1.0, 0.0, 2.5), :IC_uR => (1.0, 0.0, 2.5), :IC_p0 => (0.5,), :IC_n => (1.0,)))\n        sim = run_direct_simulation(p)\n        @test sim !== nothing\n        if sim !== nothing\n            t = sim.t[end]\n            face = 1 - w * t\n            xs = [x[1] for x in sim.x[end]]\n            @test face - 0.01 \u003c maximum(xs) \u003c face                                # the cloud follows the piston\n            ρ, u, pr = plateau(sim, 1 - S * t + 0.06, face - 0.03)\n            @test abs(ρ - ρ₂) \u003c 0.01 && abs(pr - p₂) \u003c 0.01 && abs(u + w) \u003c 0.005   # measured 1.4895 / 1.7602 / -0.5000\n            @test all(u -> u[1] > 0.99, sim.u[end])\n        end\n        # the example wraps this set-up; its reference is the exact plateau solution\n        conf = euler_1d_piston()\n        @test conf.reference == :exact_piston\n        ex = exact_piston(conf.shared)\n        @test ex(SVector(0.2, 0.3))[1] == 1.0 && ex(SVector(0.8, 0.3))[1] ≈ ρ₂\n        # its shape is a string, so the piston speed is in the parameter hash (a Moving instance's motion is a\n        # closure, which the hash does not see), and it builds in the run's float type\n        @test euler_1d_piston(speed = 0.4).shared[:Grid_shape] != conf.shared[:Grid_shape]\n        @test euler_1d_piston(speed = 0.4).shared[:piston_speed] == 0.4\n        @test_throws ArgumentError euler_1d_piston(speed = -0.5)\n        @test_throws ArgumentError euler_1d_piston(face = 0.3)\n        p32 = merge(conf.shared, conf.methods[:RK2MUSCL2_VK], Dict{Symbol, Any}(:T => Float32, :Grid_Ns => (60,), :tmax => 0.05, :snapshots => 1))\n        sim32 = run_direct_simulation(p32)\n        @test sim32 !== nothing && eltype(sim32.u[end][1]) == Float32\n        @test HyperCloud.piston_state(1.0, 1.0, 50.0, 1.4)[2] > 1000      # a fast piston is bracketed (capped at 1000 p₁)\n        # a piston face on the end of the canvas has no ghosts of its own: refused\n        bad = intersect(Tagged(Cuboid((0.0,), (1.0,)), 1), piston)\n        @test_throws ArgumentError ParticleGrid(GeometricDomain(bad; mins = (0.0,), maxs = (1.0,)), (0.01,), ExponentialWeightFunction(1.0, 0.025), 3)\n    end\n\n    # (a smoke test of the runs: an equilibrium at rest is even in v, so any even reflection keeps it; the operator\n    # checks above discriminate)\n    @testset \"BGK: an equilibrium gas between walls at its temperature stays in equilibrium\" begin\n        for bc in (diffuse_wall(1.0), slip_wall(), diffuse_wall(1.0; accommodation = 0.5))\n            sim = run_bgk_simulation(merge(bgk_wall_base(), Dict{Symbol, Any}(:Grid_bc => BCD(1 => bc, 2 => bc))))\n            @test sim !== nothing\n            sim !== nothing && @test maximum(maximum(abs.(u - SVector(1.0, 0.0, 2.5))) for u in sim.u[end]) \u003c 1e-12\n        end\n    end\n\n    @testset \"BGK: a hot diffuse wall heats the gas, the mass error shrinks with the resolution\" begin\n        # control: specular walls with a pressure jump in the gas conserve the mass to second order (measured\n        # -3.9e-5 at N = 100), so the drift below is the diffuse wall's\n        simc = run_bgk_simulation(merge(bgk_wall_base(; Ns = 100, tmax = 0.5), Dict{Symbol, Any}(:Grid_bc => BCD(1 => slip_wall(), 2 => slip_wall()),\n                                  :IC_uR => (0.5, 0.0, 1.0))))\n        @test simc !== nothing\n        simc !== nothing && @test abs(mass_change(simc)) \u003c 2e-4\n        θ(u) = 2 * (u[3] - 0.5 * u[2]^2 / u[1]) / (5 * u[1])                  # D + K = 5 for γ = 1.4 in 1-D\n        drift = Float64[]\n        for N in (50, 100)\n            sim = run_bgk_simulation(merge(bgk_wall_base(; Ns = N, tmax = 0.5), Dict{Symbol, Any}(:Grid_bc => BCD(1 => diffuse_wall(1.0), 2 => diffuse_wall(2.0)))))\n            @test sim !== nothing\n            sim === nothing && continue\n            us = sim.u[end]\n            @test 1.7 \u003c θ(us[end]) \u003c 2.0 && abs(θ(us[1]) - 1) \u003c 0.01            # measured 1.83 / 1.86 next to the hot wall\n            @test all(x -> 0.99 \u003c x \u003c 2.0, θ.(us)) && θ(us[end - 5]) > θ(us[5])    # (the profile is not strictly monotone: 1e-3 ripples at the cold wall)\n            push!(drift, abs(mass_change(sim)))\n        end\n        length(drift) == 2 && @test drift[2] \u003c 0.8 * drift[1] && drift[2] \u003c 0.01   # measured 1.15e-2 / 7.1e-3 / 4.2e-3 (N = 50 / 100 / 200)\n    end\n\n    @testset \"BGK: a piston (τ = 1e-4, isothermal diffuse wall) reproduces the Euler plateau within 1 %\" begin\n        w = 0.5\n        ρ₂, p₂, S = HyperCloud.piston_state(1.0, 1.0, w, 1.4)\n        piston = Moving(Tagged(HalfSpace((1.0,), (1.0,)), 2), translating((-w,)))\n        tube   = intersect(Tagged(Cuboid((0.0,), (1.5,)), 1), piston)\n        p = merge(bgk_wall_base(; Ns = 300, tau = 1e-4, tmax = 0.3), Dict{Symbol, Any}(:Grid_domain => :shape, :Grid_shape => tube,\n                  :Grid_mins => (0.0,), :Grid_maxs => (1.5,), :Grid_bc => BCD(1 => slip_wall(), 2 => diffuse_wall(1.0)),\n                  :Limiter_name => :VK, :Limiter_mode => :hard))\n        sim = run_bgk_simulation(p)\n        @test sim !== nothing\n        if sim !== nothing\n            t = sim.t[end]\n            ρ, u, pr = plateau(sim, 1 - S * t + 0.06, 1 - w * t - 0.08)\n            @test abs(ρ - ρ₂) / ρ₂ \u003c 0.012 && abs(pr - p₂) / p₂ \u003c 0.012 && abs(u + w) \u003c 0.012   # measured 1.482 / 1.747 / -0.493\n        end\n        # the same with a specular face: a moving wall takes the reflection off the node grid inside the kernel (the\n        # nearest-node reflection was 9 % low in ρ and 13 % in p)\n        ps = merge(p, Dict{Symbol, Any}(:Grid_Ns => (200,), :Grid_bc => BCD(1 => slip_wall(), 2 => slip_wall())))\n        sims = run_bgk_simulation(ps)\n        @test sims !== nothing\n        if sims !== nothing\n            t = sims.t[end]\n            ρ, u, pr = plateau(sims, 1 - S * t + 0.06, 1 - w * t - 0.08)\n            @test abs(ρ - ρ₂) / ρ₂ \u003c 0.02 && abs(pr - p₂) / p₂ \u003c 0.02 && abs(u + w) \u003c 0.02\n        end\n    end\nend\n"},{"name":"units.jl","path":"test/units.jl","type":"file","files":1,"lines":982,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.05295315682281059,"G3":0.9470468431771895},"lines":{"G2":52,"G3":930}},"Human-Review":{"files":{"H0":0.9419551934826884,"H1":0.05804480651731161},"lines":{"H0":925,"H1":57}},"AI-Review":{"files":{"A0":0.006109979633401222,"A1":0.9938900203665988},"lines":{"A0":6,"A1":976}}},"parts":[{"lines":823,"runs":[[1,44],[51,121],[130,140],[145,270],[277,297],[299,315],[317,370],[372,404],[408,503],[517,587],[607,688],[707,790],[820,922],[973,982]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u00
