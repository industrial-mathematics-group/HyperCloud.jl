eview":{"files":{"H1":1.0},"lines":{"H1":107}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":107}}},"errors":0,"children":[{"name":"runners.jl","path":"benchmark/runners.jl","type":"file","files":1,"lines":107,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [1]"},"errors":[],"parts":[{"lines":107,"runs":[[1,107]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [1]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Throughput of the simulation runners: CPU (PolyesterBackend) vs GPU (KABackend(ROCBackend())), Float64 vs\n# Float32, on 2-D problems. Uses the GPU test environment:\n#     julia -t auto --project=test/gpu benchmark/runners.jl\n# BENCH_N=100,200,400,800 (grid points per dimension), BENCH_CASES=\u003cregex>, BENCH_OUT=\u003cfile.md>,\n# BENCH_GPU=0 (CPU only), BENCH_FTZ=1 (flush subnormals to zero on the CPU workers: Float32 intermediates of\n# the neighbour sums can underflow to subnormals, which x86 cores process very slowly and GPUs flush).\n# Time per step is the runner's `Runtime` statistic (the time-stepping loop, CFL estimate and snapshots\n# included, setup excluded) divided by its step count; every GPU run is compared with the CPU run.\nusing HyperCloud, AMDGPU, Printf\nAMDGPU.allowscalar(false)\nenable_progress_bar!(false)\n\nconst NS    = parse.(Int, split(get(ENV, \"BENCH_N\", \"100,200,400,800\"), \",\"))\nconst ONLY  = Regex(get(ENV, \"BENCH_CASES\", \"\"))\nconst OUT   = get(ENV, \"BENCH_OUT\", \"\")\nconst BACKENDS = get(ENV, \"BENCH_GPU\", \"1\") == \"1\" ? [(\"CPU\", PolyesterBackend()), (\"GPU\", KABackend(ROCBackend()))] :\n                                                     [(\"CPU\", PolyesterBackend())]\nconst FTZ = get(ENV, \"BENCH_FTZ\", \"\") == \"1\"\nif FTZ   # every Polyester worker (one per core) and the main thread\n    for _ in 1:20\n        HyperCloud.HyperCloudCore.@batch per=core for i in 1:10_000; set_zero_subnormals(true); end\n    end\n    set_zero_subnormals(true)\nend\n\n\"2-D unit square, `n × n` jittered particles, a run of about 40 CFL steps.\"\nfunction grid_2d(n; periodic = true)\n    d = Dict{Symbol, Any}(\n        :tmax => 40 * 0.2 / n, :snapshots => 1, :remove_ghosts => true,\n        :Grid_domain => :rectangular, :Grid_mins => (0.0, 0.0), :Grid_maxs => (1.0, 1.0), :Grid_Ns => (n, n),\n        :Grid_periodic => periodic, :Grid_randomness_factor => (0.2, 0.2), :Grid_seed => 42, :Grid_mover => :none,\n        :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 2.5,\n        :Time_CFL => 0.2, :Scheme_upwind_alg_nd => :Classic, :MOOD_delta_relax => 1e-4)\n    periodic || (d[:Grid_bc] = Dict{Int, AbstractBoundaryCondition}(i => OutflowBC() for i in 1:4))\n    return d\nend\n\nconst ADVECTION = Dict{Symbol, Any}(:PDE_name => :linear, :PDE_D => 2, :PDE_velocities => ((1.0,), (0.5,)),\n    :IC_name => :box, :IC_u_bg => (0.1,), :IC_u_box => (1.0,), :IC_mins => (0.25, 0.25), :IC_maxs => (0.6, 0.6))\nconst EULER = Dict{Symbol, Any}(:PDE_name => :euler, :PDE_D => 2, :PDE_gamma => 1.4,\n    :IC_name => :riemann, :IC_uL => (1.0, 0.0, 0.0, 2.5), :IC_uR => (0.125, 0.0, 0.0, 0.25),\n    :IC_p0 => (0.5, 0.5), :IC_n => (1.0, 1.0))                     # diagonal Sod tube (conservative states)\nconst KINETIC = let (v, i) = generate_relax_params(2.0, 2, 1)\n    Dict{Symbol, Any}(:Kinetic_velocities => v, :Kinetic_indices => i, :Kinetic_epsilon => 1e-6)\nend\n\nconst CASES = [\n    (\"A advection RK2 MUSCL2\",        n -> merge(grid_2d(n), ADVECTION, last(create_method(:RK2, :MUSCL, 2)))),\n    (\"B advection RK3 MUSCL3 MOOD\",   n -> merge(grid_2d(n), ADVECTION, last(create_method(:RK3, :MUSCL, 3; mood_criterion = :U1)))),\n    (\"C Euler RK2 MUSCL2 MOOD\",       n -> merge(grid_2d(n; periodic = false), EULER, last(create_method(:RK2, :MUSCL, 2; mood_criterion = :U1)))),\n    (\"D kinetic ARS222 MUSCL2\",       n -> merge(grid_2d(n), ADVECTION, KINETIC, last(create_method(:ARS222, :MUSCL, 2)))),\n]\n\nstat(sim, k) = sim.stats[k][1]\n\nfunction run_on(backend, params)\n    run = getfield(HyperCloud, params[:sim_func_name])\n    sim = with_backend(() -> run(params), backend)\n    sim === nothing && error(\"run failed: $(params[:sim_func_name]) on $backend\")\n    return sim\nend\n\nmaxdiff(a, b) = maximum(i -> maximum(abs.(a[i] .- b[i])), eachindex(a))\nscale(a)      = maximum(u -> maximum(abs, u), a)\n\nrows = NamedTuple[]\nfor (name, make) in CASES\n    occursin(ONLY, name) || continue\n    for T in (Float64, Float32)\n        for (_, b) in BACKENDS; run_on(b, merge(make(20), Dict{Symbol, Any}(:T => T))); end   # compile\n        for n in NS\n            params = merge(make(n), Dict{Symbol, Any}(:T => T))\n            sims = Dict(bn => run_on(b, params) for (bn, b) in BACKENDS)\n            for (bn, _) in BACKENDS\n                s = sims[bn]\n                steps, rt, N = Int(stat(s, :k_step)), stat(s, :Runtime), Int(stat(s, :final_particle_count))\n                push!(rows, (; case = name, T = string(T), n, N, backend = bn, steps, ms_step = 1e3 * rt / steps,\n                               mpps = N * steps / rt / 1e6,\n                               rel_diff = bn == \"GPU\" ? maxdiff(sims[\"GPU\"].u[end], sims[\"CPU\"].u[end]) / scale(sims[\"CPU\"].u[end]) : NaN,\n                               same_steps = bn == \"GPU\" ? stat(s, :k_step) == stat(sims[\"CPU\"], :k_step) : true))\n                r = rows[end]\n                @printf(\"%-30s %-7s %4d² %-3s %4d steps  %9.3f ms/step  %8.2f Mpart-steps/s  %s\\n\", name, r.T, n, bn,\n                        steps, r.ms_step, r.mpps, bn == \"GPU\" ? @sprintf(\"rel diff to CPU %.1e%s\", r.rel_diff, r.same_steps ? \"\" : \"  STEP COUNT DIFFERS\") : \"\")\n            end\n        end\n    end\nend\n\n# Markdown summary: one row per case, precision and size; speed-up = CPU time / GPU time per step.\nio = IOBuffer()\nif length(BACKENDS) == 1\n    println(io, \"| case | T | particles | CPU ms/step | CPU Mpart-steps/s |\\n|---|---|---:|---:|---:|\")\n    foreach(r -> @printf(io, \"| %s | %s | %d | %.2f | %.2f |\\n\", r.case, r.T, r.N, r.ms_step, r.mpps), rows)\nelse\n    println(io, \"| case | T | particles | CPU ms/step | GPU ms/step | GPU speed-up | GPU rel. diff |\")\n    println(io, \"|---|---|---:|---:|---:|---:|---:|\")\nend\nfor r in rows\n    r.backend == \"GPU\" || continue\n    c = only(filter(x -> x.case == r.case && x.T == r.T && x.n == r.n && x.backend == \"CPU\", rows))\n    @printf(io, \"| %s | %s | %d | %.2f | %.2f | %.1f× | %.0e |\\n\", r.case, r.T, r.N, c.ms_step, r.ms_step, c.ms_step / r.ms_step, r.rel_diff)\nend\ntable = String(take!(io))\nprintln(\"\\n\", table)\nisempty(OUT) || write(OUT, \"CPU: $(Sys.cpu_info()[1].model), $(Threads.nthreads()) Julia threads (Polyester: one worker per core)\" *\n                         (FTZ ? \", subnormals flushed to zero\" : \"\") * \"\\n\" *\n                         \"GPU: $(AMDGPU.device())\\n\\n\" * table)\n"}]},{"name":"docs","path":"docs","type":"dir","files":22,"lines":1826,"counts":{"AI-Generation":{"files":{"G2":0.11381913959613696,"G3":21.886180860403865},"lines":{"G2":9,"G3":1817}},"Human-Review":{"files":{"H0":11.826727308491295,"H1":2.1732726915087057,"H2":8.0},"lines":{"H0":1114,"H1":134,"H2":578}},"AI-Review":{"files":{"A0":3.346273444123422,"A1":18.653726555876577},"lines":{"A0":208,"A1":1618}}},"errors":0," eneration":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Linear Advection\n\n`LinearAdvection` implements coupled linear transport with constant matrices:\n\n```math\n\\frac{\\partial U}{\\partial t} + \\sum_{d=1}^D A_d \\frac{\\partial U}{\\partial x_d} = 0,\n```\n\nwhere ``U`` has ``M`` components and every ``A_d`` is an ``M \\times M`` matrix.\n\n## Specifying the velocities\n\n`velocities` has one entry per dimension, each describing ``A_d``. The dimension `D` is the\nnumber of entries.\n\n```julia\nLinearAdvection(((1.0,),), Float64)               # 1D scalar: u_t + u_x = 0\nLinearAdvection(((1.0,), (0.5,)), Float64)        # 2D scalar, velocity (1, 0.5)\nLinearAdvection(((1.0, -1.0),), Float64)          # 1D, two variables: diag(1, -1)\n```\n\nA tuple of ``M`` numbers is read as the diagonal matrix ``\\operatorname{diag}(a_1, \\dots, a_M)``.\nThis is the format produced by [`generate_relax_params`](@ref) for kinetic systems. Other\nformats are converted by `param2vel`.\n\nIn a configuration: `:PDE_name => :linear, :PDE_velocities => ((1.0,), (1.0,))`.\n\n## Implementation\n\n- **Wave speeds.** The constructor precomputes the spectral radius of every ``A_d``;\n  `max_eigenvalue` returns it without any work at run time.\n- **Variables.** `prim2cons` and `cons2prim` are the identity.\n- **Moving grids.** For scalar equations (`M = 1`), `fluid_velocity` returns the advection\n  velocity; a Lagrangian grid then carries the solution exactly.\n- **Flux.** ``F_d(U) = A_d U``; `velocity(eq, U, d)` returns ``A_d``.\n- **Kinetic use.** `kinetic_wave_speed(eq, d, k)` returns the diagonal entry\n  ``(A_d)_{kk}``. It is meaningful for diagonal systems, which is how kinetic relaxation\n  systems are built.\n\n## Exact solution\n\nThe exact solution works with any initial condition and any dimension:\n\n1. **Commutation check.** For ``D > 1`` the matrices must commute\n   (``A_i A_j = A_j A_i``, checked as ``\\|A_i A_j - A_j A_i\\| \\le \\sqrt{\\varepsilon}\\,\\|A_i\\|\\,\\|A_j\\|``\n   with the machine epsilon of the precision). Otherwise the closure throws an error.\n2. **Characteristic variables.** It diagonalizes ``\\sum_d A_d = R \\Lambda R^{-1}``. The speed of\n   characteristic ``m`` in direction ``d`` is ``\\lambda_{m,d} = (R^{-1} A_d R)_{mm}``.\n3. **Tracing.** Each characteristic variable is the initial condition at\n   ``x - \\lambda_m t``, projected with ``R^{-1}``. Periodic directions are wrapped into the domain.\n   The physical state is reassembled with ``R``.\n\n!!! note\n    Step 2 assumes that the eigenvectors of ``\\sum_d A_d`` also diagonalize every ``A_d``. This\n    always holds for diagonal systems. It can fail for non-diagonal matrices when\n    ``\\sum_d A_d`` has repeated eigenvalues; the closure then throws an error (off-diagonal\n    entries of ``R^{-1} A_d R`` above ``\\sqrt{\\varepsilon} \\max(1, \\max|R^{-1} A_d R|)``).\n\n## API\n\n```@docs\nLinearAdvection\n```\n"},{"name":"bgk.md","path":"docs/src/PDEs/bgk.md","type":"file","files":1,"lines":142,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":142}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":142}},"AI-Review":{"files":{"A0":0.04225352112676056,"A1":0.9577464788732394},"lines":{"A0":6,"A1":136}}},"parts":[{"lines":131,"runs":[[1,54],[60,115],[122,142]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":5,"runs":[[55,59]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":6,"runs":[[116,121]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# BGK Equation\n\n[`BGKEquation`](@ref) is a discrete-velocity model of the Bhatnagar–Gross–Krook equation\n\n```math\n\\partial_t f + \\vec v\\cdot\\nabla_x f = \\frac{1}{\\tau}\\big(\\mathcal M[f] - f\\big),\n```\n\nfor the distribution ``f(\\vec x, \\vec v, t)`` of a gas in ``D`` space dimensions. Its moments\n``U = (\\rho, \\rho\\vec u, E)`` are the conservative variables of the Euler equations, which the BGK\nsolution approaches for ``\\tau \\to 0``; for ``\\tau \\to \\infty`` every velocity moves freely.\n\n## Velocity space as the state vector\n\nThe velocity space is discretised by a tensor grid of `Nv` nodes per direction\n([`velocity_grid`](@ref)), and the particle state is the vector of distribution values at the\nnodes: the number of equations is the number of discrete velocities. Everything HyperCloudCore\noffers (MUSCL, limiters, MOOD, IMEX, moving grids, the device backends) therefore runs on the BGK\nmodel unchanged. Moments are quadrature sums,\n``U = \\sum_k w_k\\,(1, \\vec v_k, \\tfrac12|\\vec v_k|^2)\\,f_k``.\n\nSince the state is an `SVector`, its length drives compile time and per-particle cost. The model\nkeeps it small in three ways:\n\n- **Only `D` velocity directions.** Degrees of freedom beyond the resolved velocity directions (the\n  remaining directions of a 3-D gas and internal ones, ``K = 2/(\\gamma - 1) - D`` in total) are\n  carried by a second distribution ``h = \\int \\tfrac12|\\xi|^2 f\\,d\\xi`` on the same nodes (a Chu\n  reduction). The state is ``f`` for ``\\gamma = (D + 2)/D`` (``M = N_v^D``), otherwise ``(f, h)``\n  (``M = 2 N_v^D``). A 1-D shock tube with ``\\gamma = 1.4`` needs a 1-D velocity grid, not ``N_v^3``\n  velocities.\n- **Gauss–Hermite nodes** (`:velocity_grid => :gauss_hermite`) integrate polynomials times the\n  Gaussian of their scale exactly, so near-equilibrium flows need far fewer nodes than the uniform\n  midpoint grid (`:uniform`, the robust choice for strongly non-equilibrium flows).\n- **No per-velocity arrays in kernels.** The equation is a small bits type (1-D nodes and weights,\n  grid centre, ``K``, ``\\gamma``, relaxation model); the node of a component is resolved from its index\n  at compile time, so the flux and the dissipation unroll into straight-line code.\n\n## Collision term\n\nThe equilibrium is the conservative discrete Maxwellian of [`equilibrium`](@ref)\n(``f_k = \\exp(\\alpha\\cdot\\psi_k)`` with ``\\psi = (1, \\vec v, \\tfrac12|\\vec v|^2)``, Mieussens'\ndiscrete entropic equilibrium, ``h_k = \\tfrac K2\\,\\hat\\theta f_k``): ``\\alpha`` is found by a damped\nNewton iteration on the convex dual problem, started from the continuous Maxwellian, so the discrete\nmoments of the equilibrium equal ``U`` to round-off and the collision term conserves mass, momentum\nand energy exactly. A few microseconds per particle; the iteration runs inside the kernels.\n\nThe relaxation time comes from a [`RelaxationTimeModel`](@ref): constant ([`ConstantRelaxationTime`](@ref),\n`Inf` for free transport) or ``\\tau = \\mu(\\theta)/p`` with a power-law viscosity\n([`ViscosityRelaxationTime`](@ref)).\n\nWith an IMEX tableau the collision is the implicit source [`BGKRelaxation`](@ref). Because it\nconserves the moments, the implicit stage equation has the closed-form solution\n``f = (f^* + \\lambda\\,\\mathcal M[f^*])/(1 + \\lambda)``, ``\\lambda = \\Delta t\\,a_{ii}/\\tau``, for any\nstiffness, which makes the scheme asymptotic preserving: at ``\\tau = 10^{-5}`` the BGK Sod solution\nis as close to the exact Euler solution as the Euler scheme itself, and ``\\tau = 0``\n(``\\lambda = \\infty``) gives ``\\mathcal M[f^*]``. With an explicit tableau the collision becomes\n[`ExplicitBGKRelaxation`](@ref) (stable for ``\\Delta t \\lesssim \\tau`` only; ``\\tau = 0`` is\nrejected with an `ArgumentError`). Negative relaxation times are rejected when the equation is\nbuilt.\n\n## Transport\n\nThe flux is ``v_{k,d} f_k``. The transport is linear and diagonal, so the Rusanov flux of every\nvelocity is its exact upwind flux: `RusanovFlux`, `UpwindFlux` and `AlignedRusanovFlux` use the\ndissipation ``|v_{k,d}|`` per component instead of the largest node speed for all components (which\nsmears the slow velocities; on a smooth collisionless wave it costs a factor 2 to 10 in the error).\n`max_eigenvalue` is the largest node speed, which sets the CFL time step.\n\nThe PAD of MOOD (`is_admissible`) asks for positive density and temperature; individual ``f_k`` may\ndip below zero.\n\n## Configuration\n\n```julia\n:PDE_name => :bgk, :PDE_D => 1, :PDE_gamma => 1.4,\n:PDE_Nv => 24, :PDE_vmax => 6.0, :PDE_velocity_grid => :uniform,\n:PDE_tau => 1e-3,                       # or :PDE_viscosity => μ_ref, :PDE_omega => ω\n:sim_func_name => :run_bgk_simulation,  # direct and kinetic runners forward BGK runs here\n```\n\nInitial conditions give the macroscopic state ``(\\rho, \\rho\\vec u, E)``, exactly as for an Euler\nrun with the same ``\\gamma``; every particle starts in the discrete Maxwellian of that state. The\nstored snapshots are the moments, so BGK and Euler runs can be compared directly\n(`:save_relax => true` keeps the distributions). Choose `vmax` so that the Maxwellians of the flow\ndecay inside the grid (``|u| + 5\\sqrt\\theta`` or more) and enough nodes to resolve them\n(``\\Delta v \\lesssim \\sqrt\\theta``).\n\nReferences: the collisionless model has the exact solution of [`analytic_closure`](@ref)\n(each velocity transported, initial data in equilibrium); for small ``\\tau`` use\n[`euler_limit_solution`](@ref) as the `reference` of a `SimulationConfig` (see the example\n`bgk_1d_sod`).\n\n## Cost of the velocity space\n\nMeasured on 8 threads (ARS222, MUSCL3 with the Venkatakrishnan limiter, regular lattice, `Float64`),\none time step and the first (compiling) step:\n\n| D | M | particles | step / particle | first step | per-particle buffers | neighbour-slot buffers |\n|:--|--:|--:|--:|--:|--:|--:|\n| 1 | 16 | 4000 | 0.32 µs | 3 s | 1.9 KiB | 10 × 0.27 KiB |\n| 1 | 64 | 4000 | 1.6 µs | 5 s | 6.8 KiB | 10 × 1.0 KiB |\n| 1 | 128 | 4000 | 3.2 µs | 11 s | 13 KiB | 10 × 2.0 KiB |\n| 1 | 256 | 4000 | 7.1 µs | 30 s | 26 KiB | 10 × 4.0 KiB |\n| 2 | 16 | 64² | 2.4 µs | 5 s | 3.1 KiB | 36 × 0.41 KiB |\n| 2 | 64 | 64² | 5.8 µs | 15 s | 9.1 KiB | 36 × 1.5 KiB |\n| 2 | 144 | 64² | 16 µs | 40 s | 19 KiB | 36 × 3.4 KiB |\n| 2 | 256 | 64² | 30 µs | 95 s | 33 KiB | 36 × 6.0 KiB |\n\nThe cost per particle grows linearly with ``M`` up to a few hundred equations. In 2-D the per-slot\nbuffers of the scheme (the flux differences of every neighbour, ``(D + 1) M`` values per slot)\ndominate the memory, about 6× the per-particle buffers, and the compile time of the first step grows\nfaster than ``M``; ``16 \\times 16`` velocities still work (95 s to compile, 30 µs per particle and\nstep). About a third of a step is the collision (two equilibria per stage), a third the gradient\npre-pass with the limiter, and the rest the flux pass.\n\n## Walls\n\n`diffuse_wall(θ_w; velocity, accommodation)` is the Maxwell (diffuse) wall, `slip_wall()` the specular one, both\noperators of `MirrorBC`; see [Walls and Moving Boundaries](@ref). A gas in equilibrium at the wall temperature is\nreflected into itself exactly.\n\n## API\n\n```@docs\nBGKEquation\nHyperCloudCore.is_admissible(::BGKEquation{D, M, T}, ::State{M, T}) where {D, M, T}\nvelocity_grid\nnum_velocities\nvelocity_node\nmoments\nequilibrium\neuler_limit\nRelaxationTimeModel\nConstantRelaxationTime\nViscosityRelaxationTime\nrelaxation_time\nBGKRelaxation\nExplicitBGKRelaxation\nrun_bgk_simulation\neuler_limit_solution\nbgk_1d_sod\n```\n"},{"name":"burgers.md","path":"docs/src/PDEs/burgers.md","type":"file","files":1,"lines":74,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":74}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":74}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":74}}},"parts":[{"lines":64,"runs":[[1,24],[29,44],[48,52],[56,74]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":10,"runs":[[25,28],[45,47],[53,55]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Burgers' Equation\n\n`BurgersEquation{D, T}` implements the inviscid Burgers' equation in ``D`` dimensions:\n\n```math\n\\frac{\\partial u}{\\partial t} + \\sum_{d=1}^D \\frac{\\partial}{\\partial x_d}\\left(\\frac{u^2}{2}\\right) = 0 .\n```\n\nThe state is a scalar (`M = 1`). Information travels with velocity ``(u, \\dots, u)``, so\ncompressive regions steepen into shocks and expansive regions open into rarefaction fans.\n\nIn a configuration: `:PDE_name => :burgers, :PDE_D => D`.\n\n## Implementation\n\n- **Variables.** `prim2cons` and `cons2prim` are the identity.\n- **Flux.** ``F_d(u) = u^2/2`` in every direction.\n- **Wave speed.** `max_eigenvalue` returns ``|u|``; `velocity` returns the ``1 \\times 1``\n  Jacobian ``u``.\n- **Moving grids.** `fluid_velocity` returns ``(u, \\dots, u)``, the characteristic velocity, so a\n  Lagrangian grid follows the characteristics.\n\n## Exact solutions\n\nThe closures solve the problem on the whole line: on a periodic domain they ignore the wrap-around (a\nsecond interface at the boundary, characteristics leaving on one side and entering on the other), so\nthey are exact there only while the solution near the boundary is still the initial state.\n\n### Riemann and smoothed Riemann (any dimension)\n\nAlong the normal coordinate ``\\xi = (x - p_0)\\cdot n`` the equation reduces to a 1D law with\nflux ``a\\,u^2/2``, where ``a = \\sum_d n_d``. The characteristic speeds are ``a u_L`` and\n``a u_R``:\n\n- ``a u_L > a u_R``: a shock moving at ``a (u_L + u_R)/2`` (Rankine–Hugoniot).\n- otherwise: a rarefaction fan with ``u = \\xi / (a t)`` between the two speeds.\n\nThe wave type depends on the sign of ``a``, so flipping the normal and swapping the states gives\nthe same solution. The normal does not need to be normalized. For `SRiemann` the closure returns\nthe sharp Riemann solution, a good reference once the waves are wider than `width`.\n\n### Gauss (any dimension)\n\nThe solution is given implicitly by ``u = u_0(x - u\\,t\\,\\mathbf{1})``, which is solved with\nNewton's method, safeguarded by bisection on ``[\\min(0, a), \\max(0, a)]`` and stopped at a relative\ntolerance of ``4\\varepsilon`` of the precision (so Float32 references converge too). This is only\nvalid before the pulse breaks, at\n\n```math\nt^* = \\frac{\\mathrm{width}}{|a|}\\sqrt{\\frac{e}{2D}} .\n```\n\nPast ``t^*`` the relation has several roots and none of them is the entropy (shock) solution: the\nclosure warns once (per closure, not per point) when it is evaluated after ``t^*``, and once if\nthe iteration does not converge, and returns its last iterate.\n\n### Box (1D)\n\nThe top-hat case (`u_box > u_bg`) produces a rarefaction at the left edge and a shock at the\nright edge. The well case (`u_box \u003c u_bg`) produces a shock at the left edge and a rarefaction at\nthe right edge. Both are exact before and after the time the fan catches up with the shock,\n``t_\\mathrm{int} = 2(x_e - x_s)/|u_\\mathrm{box} - u_\\mathrm{bg}|``. After that the shock moves like\n``\\sqrt{t}`` relative to the background flow and its strength decays like ``t^{-1/2}``.\n\n### Other initial conditions\n\nThere is no exact solution. The closure warns and returns the initial condition, which is\nonly correct at ``t = 0``.\n\n## API\n\n```@docs\nBurgersEquation\n```\n"},{"name":"euler.md","path":"docs/src/PDEs/euler.md","type":"file","files":1,"lines":67,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":67}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":67}},"AI-Review":{"files":{"A0":0.08955223880597014,"A1":0.9104477611940298},"lines":{"A0":6,"A1":61}}},"parts":[{"lines":54,"runs":[[1,47],[55,55],[62,67]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":7,"runs":[[48,54]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":6,"runs":[[56,61]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Euler Equations\n\n`EulerEquation{D, M, T, R}` implements the compressible Euler equations for an ideal gas in\n``D`` dimensions, with conservative variables ``U = (\\rho, \\rho\\vec u, E)`` and ``M = D + 2``:\n\n```math\n\\begin{aligned}\n\\partial_t \\rho + \\nabla\\cdot(\\rho\\vec u) &= 0,\\\\\n\\partial_t (\\rho\\vec u) + \\nabla\\cdot(\\rho\\vec u\\otimes\\vec u + p I) &= 0,\\\\\n\\partial_t E + \\nabla\\cdot\\big(\\vec u\\,(E + p)\\big) &= 0,\n\\end{aligned}\n\\qquad\nE = \\frac{p}{\\gamma - 1} + \\frac{1}{2}\\rho\\lVert\\vec u\\rVert^2 .\n```\n\nIn a configuration: `:PDE_name => :euler, :PDE_D => D, :PDE_gamma => 1.4`. Initial states are\ngiven as conservative variables.\n\n## Implementation\n\n- **Construction.** `EulerEquation(Val(D), T, gamma, rep)` sets `M = D + 2`. `rep` is the\n  representation tag (default `Conservative()`).\n- **Variables.** `prim2cons` maps ``(\\rho, \\vec u, p) \\mapsto (\\rho, \\rho\\vec u, E)``. `cons2prim`\n  is its inverse and floors density and pressure at ``10^{-7}``.\n- **Flux.** Defined for the `Conservative` representation.\n- **Wave speed.** `max_eigenvalue` returns ``|u_d| + c`` with ``c = \\sqrt{\\gamma p / \\rho}``, using\n  a ``10^{-9}`` floor on density and pressure. For `Conservative` it expects conservative\n  variables; for an `NCRepresentation` it expects primitive variables.\n\n- **Admissibility.** [`is_admissible`](@ref) accepts finite conservative states with positive\n  density and pressure. MOOD flags every candidate that fails it, whatever its criterion says\n  (HyperCloudCore's [PAD](@extref HyperCloudCore Physical-admissibility-detection-(PAD))).\n- **Moving grids.** `fluid_velocity` returns ``\\vec u``, so the Lagrangian movers work.\n\n## Exact solution: 1D Riemann problem\n\nFor `Riemann` initial data in 1D the closure computes the exact solution (e.g. for the Sod\nshock tube):\n\n1. **Star pressure.** ``p^*`` is found with Newton's method on the pressure function, using a\n   finite-difference derivative and the tolerance ``|f(p^*)| \u003c 10^{-9}``. This gives ``u^*``.\n2. **Wave types.** Each outer wave is a shock if ``p^* > p_{L/R}``, otherwise a rarefaction.\n3. **Evaluation.** At a point ``(x, t)`` the closure selects the region by the similarity\n   variable ``(x - x_0)/t``: outer state, rarefaction fan, star state left or right of the\n   contact. It returns conservative variables.\n\nIf the normal points in ``-x``, the problem is solved in the mirrored frame, so both\norientations of the same data give the same solution.\n\n**Vacuum generation.** If the pressure positivity condition fails,\n``2(c_L + c_R)/(\\gamma - 1) \\le u_R - u_L`` (Toro, Sec. 4.6), the two rarefactions do not meet: the\nsolution is the left fan up to its tail ``u_L + 2c_L/(\\gamma - 1)``, vacuum (``\\rho = p = 0``, zero\nmomentum) up to ``u_R - 2c_R/(\\gamma - 1)``, and the right fan beyond. Close to this limit ``p^*`` is\nfloored at ``10^{-9}``. Initial states that are already vacuum (``\\rho_{L/R} = 0``) are not handled.\n\n## Walls\n\n`slip_wall()` is the reflecting wall (`MirrorBC` with the `SlipWall` operator: density and pressure of the mirrored\nstate, velocity reflected relative to the wall, which may move). See [Walls and Moving Boundaries](@ref) for the\nmeasured shock reflection and piston.\n\n## API\n\n```@docs\nEulerEquation\nHyperCloudCore.is_admissible(::EulerEquation{D, M, T, \u003c:Conservative}, ::State{M, T}) where {D, M, T}\n```\n"},{"name":"main.md","path":"docs/src/PDEs/main.md","type":"file","files":1,"lines":96,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":96}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":96}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":96}}},"parts":[{"lines":90,"runs":[[1,38],[45,96]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":6,"runs":[[39,44]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# PDE Architecture & Exact Solutions\n\nEvery equation is a struct subtyping\n[`HyperbolicPDE{D, M, T}`](@extref HyperCloudCore HyperCloudCore.HyperbolicPDE), where `D` is the\nspatial dimension, `M` the number of variables and `T` the floating-point type. The numerical\nschemes only access an equation through a small set of functions, so new physics plugs in without\ntouching the solver. The full contract, including which scheme needs which method, is\nHyperCloudCore's [API Contracts](@extref HyperCloudCore A-new-PDE-(HyperbolicPDE{D,-M,-T})).\n\n## Equation interface\n\n| Function | Required | Returns |\n|:---------|:---------|:--------|\n| `flux(eq, U)` | yes | `Flux{D, M, T}`: the physical flux ``F_d(U)`` for every direction `d`. |\n| `max_eigenvalue(eq, U, d)` | yes | Largest absolute wave speed in direction `d` (used for the CFL step and Rusanov flux). |\n| `prim2cons(eq, V)`, `cons2prim(eq, U)` | yes | Conversion between primitive and conservative variables (identity for scalar laws). |\n| `velocity(eq, U, d)` | upwind schemes, WENO, `UpwindFlux` | Flux Jacobian ``\\partial F_d / \\partial U`` as an `M × M` static matrix. |\n| `fluid_velocity(eq, U)` | Lagrangian grid movers | Velocity the particles move with, a `Space{D, T}`. |\n| `is_admissible(eq, U)` | optional | Physical admissibility for MOOD (default: all components finite). |\n| `max_eigenvalue(eq, U, d, shift)` | optional | Exact relative wave speed on moving grids. |\n| `kinetic_wave_speed(eq, d, k)` | kinetic systems | Speed of kinetic variable `k` in direction `d`. |\n| `analytic_closure(eq, ic, geom)` | optional | Exact solution, see below. |\n\nThe functions run inside the time step, on a GPU as device code, so they have to follow\nHyperCloudCore's [rules for kernel bodies](@extref HyperCloudCore Rules-for-kernel-bodies).\nImport them from HyperCloudCore before adding methods (`import HyperCloudCore: flux, max_eigenvalue`).\n\nA builder method makes the equation available from configurations:\n\n```julia\nfunction HyperCloud.build_equation(::Val{:my_pde}, pde_conf::Dict, context::Dict)\n    T = context[:T]::DataType\n    return MyPDE{pde_conf[:D], T}()\nend\n```\n\n## Representations\n\nEquations carry a representation tag, a subtype of `EquationRepresentation`, and methods such as\n`flux` and `max_eigenvalue` dispatch on it. `Conservative` is the conservative form and the only\none implemented. `NCRepresentation` is the abstract type reserved for non-conservative (e.g.\nprimitive) forms; no concrete subtype exists yet, so `parse_representation` accepts only\n`:representation => :conservative` and raises an `ArgumentError` for `:primitive`, `:lagrangian`\nor any other name.\n\n## Exact solutions\n\n[`analytical_solution`](@ref) builds the equation, domain and initial condition from a\nconfiguration and calls [`analytic_closure`](@ref). The result is a closure\n\n```julia\nexact = analytical_solution(params)\nexact(SVector(x..., t))   # -> State{M}\n```\n\nthat evaluates the exact solution at any spacetime point. It is used as the reference for\nerror statistics and plots. The reference is computed in `params[:real_type]` (default\n`Float64`), independently of the simulation precision.\n\nExact solutions currently available:\n\n| Equation | Initial condition | Dimension |\n|:---------|:------------------|:----------|\n| `LinearAdvection` | any | any `D` (commuting velocity matrices) |\n| `BurgersEquation` | `Riemann`, `SRiemann` | any `D` |\n| `BurgersEquation` | `Gauss` | any `D`, before the breaking time |\n| `BurgersEquation` | `Box` | 1D |\n| `EulerEquation` | `Riemann` | 1D |\n\nOther combinations fall back to a warning. Burgers returns the initial condition (exact only\nat `t = 0`); every other equation returns `nothing`.\n\nTo add an exact solution, add a method for your combination:\n\n```julia\nfunction HyperCloud.analytic_closure(eq::MyPDE{D, T}, ic::Gauss, geom::GeometricDomain) where {D, T}\n    # precompute everything that does not depend on (x, t) here\n    return function (st::SVector)\n        t = T(st[end])\n        x = SVector{D, T}(ntuple(d -> T(st[d]), Val(D)))\n        # ...\n        return State{1, T}(u)\n    end\nend\n```\n\n`geom` gives access to the domain bounds (`geom.mins`, `geom.maxs`) and periodicity\n(`geom.is_periodic`).\n\n## API\n\n```@docs\nanalytical_solution\nanalytic_closure\nEquationRepresentation\n```\n"}]},{"name":"SourceTerms","path":"docs/src/SourceTerms","type":"dir","files":1,"lines":92,"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":92}},"Human-Review":{"files":{"H2":1.0},"lines":{"H2":92}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":92}}},"errors":0,"children":[{"name":"kinetic.md","path":"docs/src/SourceTerms/kinetic.md","type":"file","files":1,"lines":92,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"parts":[{"lines":92,"runs":[[1,92]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Kinetic Relaxation\n\nThe kinetic relaxation approach replaces a nonlinear system of ``N_M`` conservation laws by\n``N_K`` linear transport equations with a stiff source:\n\n```math\n\\partial_t f_k + \\sum_{d=1}^D \\lambda_{k,d}\\,\\partial_{x_d} f_k = \\frac{\\mathcal{M}_k(u) - f_k}{\\epsilon},\n\\qquad u = \\text{sum of the kinetic variables belonging to each macroscopic variable}.\n```\n\nAs ``\\epsilon \\to 0`` the macroscopic variables ``u`` satisfy the original conservation law.\nThe transport part is a diagonal `LinearAdvection` system, so all spatial schemes work on it\nunchanged. The source is solved implicitly.\n\n## Setting it up\n\nUse the kinetic pipeline with an IMEX time stepper and the `Kinetic_` namespace:\n\n```julia\nvels, idx = generate_relax_params(2.0, D, M)   # speeds ±2 along each axis\n\nparams[:sim_func_name]      = :run_kinetic_simulation\nparams[:Time_stepper]       = :ARS222\nparams[:Kinetic_velocities] = vels\nparams[:Kinetic_indices]    = idx\nparams[:Kinetic_epsilon]    = 1e-6\n```\n\nThe kinetic speed must exceed the largest wave speed of the macroscopic system\n(subcharacteristic condition). For Burgers with ``|u| \\le 1``, a speed of `2.0` is safe.\n\n## Mapping kinetic to macroscopic variables (`Kin2Macro`)\n\n[`Kin2Macro`](@ref) is built from a list of edges. `Kin2Macro([1, 3, 6])` assigns kinetic\nvariables `1:2` to macroscopic variable 1 and `3:5` to variable 2.\n\n- `km(f)` sums each group and returns the macroscopic state.\n- `km(k)` returns the macroscopic index of kinetic variable `k`.\n\n[`generate_relax_params`](@ref)`(v, D, M)` produces ``2D`` variables per macroscopic variable,\nwith speeds ``\\pm v`` along each axis, and the matching edges.\n\n## Equilibrium and source term\n\nFor kinetic variable ``k`` belonging to macroscopic variable ``m`` the equilibrium is\n\n```math\n\\mathcal{M}_k(u) = c_m\\Big(u_m + \\sum_{d=1}^D F_d^m(u)\\, s_{k,d}\\Big),\n\\qquad\ns_{k,d} = \\begin{cases} \\gamma / \\lambda_{k,d} & \\lambda_{k,d} \\neq 0 \\\\ 0 & \\text{otherwise,}\\end{cases}\n```\n\nwhere ``c_m = 1 / (\\text{number of kinetic variables of } m)``, ``F_d^m`` is the physical flux,\nand ``\\gamma`` is `interior_factor` (default ``D``). The constructor precomputes the ``s_{k,d}``\nand ``1/\\epsilon``.\n\nFor the velocity sets from `generate_relax_params` with the default `interior_factor`, the\nequilibrium reproduces the macroscopic state and flux exactly:\n\n```math\n\\sum_{k \\in m} \\mathcal{M}_k(u) = u_m,\n\\qquad\n\\sum_{k \\in m} \\lambda_{k,d}\\,\\mathcal{M}_k(u) = F_d^m(u).\n```\n\n`evaluate_source` returns ``(\\mathcal{M}_k(u) - f_k)/\\epsilon``.\n\n## Implicit solve\n\nIn each IMEX stage with implicit coefficient ``a_{ii}``, the stage value satisfies\n``Y = Y^* + a_{ii}\\Delta t\\,(\\mathcal{M}(u) - Y)/\\epsilon``. The relaxation does not change the\nmacroscopic variables (``\\sum_{k\\in m}(\\mathcal{M}_k - f_k) = 0``), so ``u`` can be taken from\n``Y^*``, and `implicit_solve` is exact and explicit in form:\n\n```math\nY_k = \\frac{Y^*_k + \\frac{a_{ii}\\Delta t}{\\epsilon}\\,\\mathcal{M}_k(u(Y^*))}{1 + \\frac{a_{ii}\\Delta t}{\\epsilon}} .\n```\n\nThis holds for any ``\\epsilon > 0``, including the stiff limit.\n\n## Initialization\n\n[`set_initial_conditions!`](@ref) has a kinetic method. It takes the macroscopic initial\ncondition and sets every particle to the equilibrium ``\\mathcal{M}(u_0(x))``, so you never write\nkinetic initial data by hand.\n\n## API\n\n```@docs\nKin2Macro\nRelaxationSourceTerm\n```\n"}]},{"name":"aisignoff.md","path":"docs/src/aisignoff.md","type":"file","files":1,"lines":35,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit f1f430d (Docs: publish the AI signoff report (#16)), pull request checkboxes"},"errors":[],"parts":[{"lines":35,"runs":[[1,35]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit f1f430d (Docs: publish the AI signoff report (#16)), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# AI signoff report\n\nThis package declares how AI was used to write it, file by file and, from the git history, line by line, on three axes:\n\n- **Generation** (G0 to G3): from written by a person (G0) to AI-autonomous (G3).\n- **Human review** (H0 to H3): from a plausibility check (H0) to independently validated (H3).\n- **AI review** (A0 to A3): from no independent AI review (A0) to validated by a different model (A3).\n\nThe declarations are in `SIGNOFF.toml` and in the descriptions of the merged pull requests, and\n[aisignoff](https://industrial-mathematics-group.github.io/aisignoff/) checks them on every pull request. The levels\nare defined in the [aisignoff documentation](https://industrial-mathematics-group.github.io/aisignoff/levels/).\n\nThe report below was generated from the commit these pages were built from. Click a folder in the sunburst to zoom\nin, and a file to see the level of each line.\n\n```@raw html\n\u003cp>\u003ca id=\"aisignoff-open\" href=\"#\" target=\"_blank\" rel=\"noopener\">Open the report on its own page\u003c/a>, where it has more room.\u003c/p>\n\u003ciframe id=\"aisignoff-report\" title=\"AI signoff report of HyperCloud.jl\"\n        style=\"width: 100%; height: 85vh; border: 1px solid #8884; border-radius: 4px;\">\u003c/iframe>\n\u003cscript>\n  (function () {\n    // The report sits next to the pages (docs/src/assets/aisignoff.html, written by the docs workflow);\n    // documenterBaseURL is the relative path to the root of the built docs, with or without pretty URLs.\n    var base = (typeof documenterBaseURL === \"string\") ? documenterBaseURL : \"..\";\n    var url = base + \"/assets/aisignoff.html\";\n    document.getElementById(\"aisignoff-report\").src = url;\n    document.getElementById(\"aisignoff-open\").href = url;\n  })();\n\u003c/script>\n```\n\n!!! note \"Building the docs locally\"\n    The report is generated by the docs workflow and is not in the repository. To include it in a local build, run\n    `pipx run --spec aisignoff==1.0.0rc8 aisignoff report --html docs/src/assets/aisignoff.html --with-source` in the repository before\n    `docs/make.jl` (with the whole git history, for the line-by-line declarations).\n"},{"name":"builder.md","path":"docs/src/builder.md","type":"file","files":1,"lines":106,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"parts":[{"lines":106,"runs":[[1,106]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Builder API\n\nThe runners never construct solver components directly. They split the parameter dictionary\ninto namespaces with [`extract_namespace`](@ref) and call one `build_*` function per component.\nEvery builder dispatches on a `Val` of a configuration value, so new components are added by\ndefining a method, without changing HyperCloud.\n\nThe builders come from two packages:\n\n- **Physics, in HyperCloud:** [`build_equation`](@ref), [`build_ic`](@ref) and\n  [`build_kinetic_system`](@ref) (documented below).\n- **Numerics, in HyperCloudCore:** domain, particle grid, weights, flux, limiter, MOOD, scheme,\n  tableau, time stepper and adaptivity. They are re-exported by HyperCloud and documented in\n  HyperCloudCore's [Config-Driven Builders](@extref HyperCloudCore Config-Driven-Builders),\n  together with the [context keys](@extref HyperCloudCore Context-keys) they read and write.\n\n## Build order and context\n\nThe builders share a `context::Dict{Symbol, Any}`. Each one reads what earlier builders stored\nand adds its own result. [`run_direct_simulation`](@ref) runs them in this order:\n\n| Step | Builder | Reads from `context` | Stores |\n|:-----|:--------|:---------------------|:-------|\n| 0 | runner | — | `:T`, `:Storage` ([`storage_for`](@ref)), `:MemoryLimit` (only with [`set_memory_limit!`](@ref)) |\n| 1 | [`build_equation`](@ref) | `:T` | runner stores `:Equation`, `:D`, `:M`, `:ExplicitSources`, `:ImplicitSources` |\n| 2 | [`build_domain`](@extref HyperCloudCore HyperCloudCore.build_domain) | `:T`, `:D` | runner stores `:Domain`, `:WeightConf` |\n| 3 | [`build_particle_grid`](@extref HyperCloudCore HyperCloudCore.build_particle_grid) | `:T`, `:D`, `:M`, `:Domain`, `:WeightConf`, `:Storage` | `:max_dx`, `:Grid` |\n| 3a | [`build_weights`](@extref HyperCloudCore HyperCloudCore.build_weights), [`build_mover`](@extref HyperCloudCore HyperCloudCore.build_mover), [`build_volume_estimator`](@extref HyperCloudCore HyperCloudCore.build_volume_estimator) (called by step 3) | `:T`, `:max_dx`, `:Domain` | `:interp_range` |\n| 3b | [`build_adaptivity`](@extref HyperCloudCore HyperCloudCore.build_adaptivity) | `:T` | — |\n| 4 | [`build_flux`](@extref HyperCloudCore HyperCloudCore.build_flux), [`build_limiter`](@extref HyperCloudCore HyperCloudCore.build_limiter), [`build_mood`](@extref HyperCloudCore HyperCloudCore.build_mood) | `:T`, `:Grid` (MOOD) | runner stores `:Flux`, `:Limiter`, `:MOOD` |\n| 5 | [`build_scheme`](@extref HyperCloudCore HyperCloudCore.build_scheme) | `:T`, `:D`, `:M`, `:Flux`, `:Limiter`, `:Storage` | runner stores `:Scheme` |\n| 6 | [`build_tableau`](@extref HyperCloudCore HyperCloudCore.build_tableau), [`build_timestepper`](@extref HyperCloudCore HyperCloudCore.build_timestepper) | everything above | runner stores `:Tableau`; `:Memory` (with a memory limit) |\n| 7 | [`build_ic`](@ref) | `:T`, `:D`, `:M` (macroscopic) | — |\n\nThe particle grid is built on a CPU backend and then moved to the device when `:Storage` is a\ndevice array type, and the time stepper's memory reservation is checked against a fingerprint of\nthe grid (see [Running on a GPU](@ref)).\n\n[`run_kinetic_simulation`](@ref) builds the initial condition right after step 1, while `:M`\nstill holds the macroscopic size. Then [`build_kinetic_system`](@ref) overwrites `:Equation`\nand `:M` with the kinetic system and puts the relaxation term into `:ImplicitSources`, and the\nremaining steps run on the kinetic variables.\n\n`:T` is the floating-point type (`params[:T]`, default `Float64`). The runners set\n`:ExplicitSources` and `:ImplicitSources` to `()` unless a source term is added.\n\n## Extending the builders\n\n| Builder | Package | Dispatches on | Extend with |\n|:--------|:--------|:--------------|:------------|\n| `build_equation` | HyperCloud | `:PDE_name` | `HyperCloud.build_equation(::Val{:x}, conf, ctx)` |\n| `build_ic` | HyperCloud | `:IC_name` | `HyperCloud.build_ic(::Val{:x}, conf, ctx)` |\n| `build_domain` | HyperCloudCore | `:Grid_domain` | `HyperCloudCore.build_domain(::Val{:x}, conf, ctx)` |\n| `build_weights` | HyperCloudCore | `:Weight_name` | `HyperCloudCore.build_weights(::Val{:x}, conf, ctx)` |\n| `build_mover` | HyperCloudCore | `:Grid_mover` | `HyperCloudCore.build_mover(::Val{:x}, conf, ctx)` |\n| `build_volume_estimator` | HyperCloudCore | `:Grid_volumes` | `HyperCloudCore.build_volume_estimator(::Val{:x}, conf, ctx)` |\n| `build_flux` | HyperCloudCore | `:Flux_name` | `HyperCloudCore.build_flux(::Val{:x}, conf, ctx)` |\n| `build_limiter` | HyperCloudCore | `:Limiter_name` | `HyperCloudCore.build_limiter(::Val{:x}, conf, ctx)` |\n| `build_mood_criterion` | HyperCloudCore | `:MOOD_criterion` | `HyperCloudCore.build_mood_criterion(::Val{:x}, conf, ctx)` |\n| `build_mood_strategy` | HyperCloudCore | `:MOOD_strategy` | `HyperCloudCore.build_mood_strategy(::Val{:x}, conf, ctx)` |\n| `build_scheme` | HyperCloudCore | `:Scheme_name` | `HyperCloudCore.build_scheme(::Val{:x}, conf, ctx)` |\n| `build_tableau` | HyperCloudCore | `:Time_stepper` | `HyperCloudCore.build_tableau(::Val{:x}, conf, ctx)` |\n\nBecause HyperCloud re-exports HyperCloudCore, `HyperCloud.build_scheme` and\n`HyperCloudCore.build_scheme` are the same function; qualifying with the owning package makes it\nclear where the method goes. Unknown names raise an error naming the missing method. A complete\nexample for initial conditions is in [Initial Conditions](ICs.md); a new equation is described\nin [PDE Architecture](PDEs/main.md).\n\nA custom spatial scheme follows the same pattern. The returned object must be a\n[`DivergenceInterpolator`](@extref HyperCloudCore HyperCloudCore.DivergenceInterpolator) that\nimplements HyperCloudCore's [scheme contract](@extref HyperCloudCore A-new-spatial-scheme-(DivergenceInterpolator)):\n\n```julia\nfunction HyperCloudCore.build_scheme(::Val{:my_scheme}, conf::Dict, context::Dict)\n    T = context[:T]::DataType\n    D = context[:D]::Int\n    M = context[:M]::Int\n    return MyScheme(T, D, M, conf[:my_param]; flux = context[:Flux])\nend\n```\n\n`:Scheme_name => :my_scheme, :Scheme_my_param => 3` then selects it.\n\n### Custom boundary conditions\n\n`:Grid_bc` maps boundary tags to boundary conditions\n([`parse_bc`](@extref HyperCloudCore HyperCloudCore.parse_bc)). Besides instances and the names\n`:outflow` and `:fixed_dirichlet`, it accepts the name of any zero-argument constructor defined\nin HyperCloudCore or in `Main`:\n\n```julia\nstruct MyWall \u003c: AbstractBoundaryCondition end   # plus the functor HyperCloudCore requires\nparams[:Grid_bc] = Dict(1 => :MyWall, 2 => :outflow)\n```\n\nThe functor a boundary condition implements is described in HyperCloudCore's\n[Boundary Conditions](@extref HyperCloudCore Boundary-Conditions).\n\n## API\n\n```@docs\nbuild_equation\nbuild_ic\nbuild_kinetic_system\n```\n"},{"name":"configuration.md","path":"docs/src/configuration.md","type":"file","files":1,"lines":200,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.01,"G3":0.9900000000000001},"lines":{"G2":2,"G3":198}},"Human-Review":{"files":{"H0":0.9900000000000001,"H1":0.01},"lines":{"H0":198,"H1":2}},"AI-Review":{"files":{"A0":0.02,"A1":0.9800000000000001},"lines":{"A0":4,"A1":196}}},"parts":[{"lines":187,"runs":[[1,18],[20,39],[43,47],[51,51],[53,58],[62,156],[158,161],[163,200]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":7,"runs":[[19,19],[40,42],[59,61]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":4,"runs":[[48,50],[52,52]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":2,"runs":[[157,157],[162,162]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Configuration Reference\n\nA simulation is described by one flat `Dict{Symbol, Any}`. Keys are grouped into namespaces\nby prefix: `:Grid_Ns` belongs to the `Grid` namespace and reaches the builder as `:Ns`\n(see [`extract_namespace`](@ref)). Keys without a prefix are global.\n\nMost namespaces configure numerical components of HyperCloudCore; their builders and defaults\nare documented in HyperCloudCore's [Config-Driven Builders](@extref HyperCloudCore Config-Driven-Builders).\n\nA method dictionary (for example from [`create_method`](@ref)) is merged on top of the shared\nparameters, so any key below may appear in either place.\n\n## Global keys\n\n| Key | Default | Meaning |\n|:----|:--------|:--------|\n| `:sim_func_name` | — | Pipeline to run: `:run_direct_simulation`, `:run_kinetic_simulation` or `:run_bgk_simulation`. Set automatically by `create_method`; BGK configurations (`:PDE_name => :bgk`) run [`run_bgk_simulation`](@ref) from either of the other two. |\n| `:tmax` | — | Final time. `:Time_tmax` overrides it. |\n| `:snapshots` | — | Number of output intervals (≥ 1); `snapshots + 1` states are stored, including `t = 0`. |\n| `:remove_ghosts` | `true` | Drop boundary/ghost particles from the stored snapshots. |\n| `:T` | `Float64` | Floating-point type of the simulation. |\n| `:real_type` | `Float64` | Floating-point type of the exact reference (`analytical_solution`). |\n| `:save_relax` | `false` | Kinetic and BGK runs only: store the raw kinetic variables (distributions) instead of the macroscopic state. |\n\n## `PDE_` — equation\n\n| Key | Used by | Meaning |\n|:----|:--------|:--------|\n| `:name` | all | `:linear`, `:burgers`, `:euler` or `:bgk`. Required. |\n| `:D` | `:burgers`, `:euler`, `:bgk` | Spatial dimension. Linear advection infers `D` from `:velocities`. |\n| `:velocities` | `:linear` | One entry per dimension describing ``A_d``; see [Linear Advection](PDEs/advection.md). |\n| `:gamma` | `:euler`, `:bgk` | Ratio of specific heats (BGK default `(D + 2) / D`; it fixes the internal degrees of freedom, see [BGK](PDEs/bgk.md)). |\n| `:Nv` | `:bgk` | Velocity nodes per direction (`Nv^D` discrete velocities). |\n| `:vmax` | `:bgk` | Half-width of the velocity grid (outermost node for Gauss–Hermite). |\n| `:velocity_grid` | `:bgk` | `:uniform` (default) or `:gauss_hermite`. |\n| `:vcenter` | `:bgk` | Centre of the velocity grid per direction (default `0`). |\n| `:tau` | `:bgk` | Constant relaxation time; `Inf` is collisionless. |\n| `:viscosity`, `:omega` | `:bgk` | Instead of `:tau`: `τ = μ / p` with `μ = viscosity * θ^omega` (`omega` default `0.5`). |\n\nThe equation representation is read from the same namespace by `parse_representation`:\n`:representation` may only be `:conservative` (the default). Non-conservative forms (`:primitive`,\n`:lagrangian`) are not implemented; any other value raises an `ArgumentError`.\n\n## `Grid_` — domain and particles\n\n| Key | Default | Meaning |\n|:----|:--------|:--------|\n| `:domain` | — | `:rectangular`, `:spherical`, `:shape`, or a pre-built `GeometricDomain`. Required. |\n| `:shape` | — | With `:domain => :shape`: an `AbstractShape` of HyperCloudCore (boxes, balls, half spaces, their combinations, `Moving` pieces; see [Geometric Domains](@extref HyperCloudCore Geometric-Domains) and [Walls and Moving Boundaries](@ref)), or a string of Julia code building one, in which `T` is the run's float type (`\"Ball((T(0), T(0)), T(1))\"`). Prefer the string for `Moving` pieces: the parameter hash reduces the motion of a shape instance to `\"Closure\"`, so runs that differ only in the motion would share a cache file. |\n| `:mins`, `:maxs` | — | Bounding box (tuples of length `D`). A spherical domain uses their midpoint as center and half the first extent as radius; a shape needs them where it is unbounded (a piston's half space, a periodic axis). |\n| `:periodic` | `false` | `Bool` or `NTuple{D, Bool}`. |\n| `:bc` | none | Boundary conditions: `Dict(tag => bc)` where `bc` is an `AbstractBoundaryCondition` (e.g. `slip_wall()`, `diffuse_wall(θ)`, see [Walls and Moving Boundaries](@ref)), `:outflow`, `:fixed_dirichlet`, or the name of a zero-argument constructor (looked up in HyperCloudCore, then in `Main`; see [`parse_bc`](@extref HyperCloudCore HyperCloudCore.parse_bc)). A string is parsed as Julia code. |\n| `:Ns` | — | Particles per direction (tuple). The nominal spacing is `(maxs - mins) ./ Ns`. |\n| `:randomness_factor` | — | Jitter per direction as a fraction of the spacing (tuple). |\n| `:seed` | `42` | RNG seed for the jitter. |\n| `:mover` | `:none` | Grid motion: `:none`, `:lagrangian`, `:scaled_lagrangian` (factor `:mover_alpha`) or `:sinusoidal` (amplitude `:mover_amplitude`); see [Moving Grids](@extref HyperCloudCore Moving-Grids-(ALE)). Lagrangian movers need `fluid_velocity` for the equation; all built-in equations define it. |\n| `:volumes` | `:shepard` | Particle volume estimator: `:shepard` (`:volumes_sweeps`) or `:mls` (`:volumes_degree`, `:volumes_samples_per_dx`); see [Particle Volumes](@extref HyperCloudCore Particle-Volumes-and-Adaptivity). Used for the initial volumes and, on a moving grid, for the re-estimation after every step and every adaptation call (HyperCloudCore ≥ 0.7.5; before, only the initial volumes). On a moving grid Shepard volumes give a resolution-independent bias in the discrete mass; `:mls` converges but costs about 3 (1-D) to 20 (2-D) time steps per re-estimation. |\n\n!!! note \"`:Grid_bc` and `:Grid_bc_map`\"\n    Boundary conditions are read from `:Grid_bc`; `:Grid_bc_map` is accepted as an alias when `:Grid_bc`\n    is absent (HyperCloudCore's `build_domain`). Other spellings are silently ignored.\n\n## `Weight_` — MLS weight function\n\n| Key | Meaning |\n|:----|:--------|\n| `:name` | `:exponential` or `:inverse`. Required. |\n| `:range` | Support radius in multiples of the largest grid spacing. Required. High reconstruction orders need a larger range (the examples use `5.5`). |\n| `:alpha` | Shape parameter of the weight. Required. |\n\n## `IC_` — initial condition\n\n`:name` selects the initial condition; every other key is converted to the simulation type `T`.\n\n| `:name` | Type | Keys |\n|:--------|:-----|:-----|\n| `:gauss` | [`Gauss`](@ref) | `:a` (amplitude, length `M`), `:b` (center, length `D`), `:width` |\n| `:box` | [`Box`](@ref) | `:u_bg`, `:u_box` (length `M`), `:mins`, `:maxs` (length `D`) |\n| `:sine` | [`Sine`](@ref) | `:a`, `:c_offset` (length `M`), `:period` (length `D`) |\n| `:riemann` | [`Riemann`](@ref) | `:uL`, `:uR` (length `M`), `:p0` (length `D`), `:n` (optional, default `+x`, normalized) |\n| `:s_riemann` | [`SRiemann`](@ref) | as `:riemann`, plus `:width` |\n| `:q_riemann` | [`QRiemann`](@ref) | `:states` (tuple of `2^D` states, binary ordering), `:p0` |\n\nStates are given in the variables the equation evolves. For Euler these are the conservative\nvariables ``(\\rho, \\rho\\vec u, E)``.\n\n## `Scheme_` — spatial discretization\n\n| Key | Default | Meaning |\n|:----|:--------|:--------|\n| `:name` | — | `:MUSCL`, `:Upwind`, `:Central` or `:WENO`. Required. |\n| `:order` | — | Consistency order (expected convergence rate; MUSCL reconstructs with degree `order - 1`). `:Upwind` only supports `1`, `:WENO` needs at least `2`. |\n| `:MLS_order` | `0` | Fixed order of the MLS divergence operator; `0` follows each particle's current order. |\n| `:moment_correction` | `false` | `:MUSCL` with `:order => 1` only: adds a non-negative dissipation that cancels the first moment of the Rusanov dissipation, so the first-order scheme is consistent on irregular clouds (no wave lag). Ignored for higher orders. See HyperCloudCore's [moment-corrected first-order dissipation](@extref HyperCloudCore Moment-corrected-first-order-dissipation). |\n| `:upwind_alg_nd` | — | `:Upwind` only: `:Classic` (any system), `:Tiwari` (scalar) or `:Praveen` (scalar, 2D). |\n\nThe schemes are described in HyperCloudCore: [MUSCL](@extref HyperCloudCore MUSCL-Reconstruction-and-Limiting),\n[Upwind](@extref HyperCloudCore Upwind-Divergence), [Central](@extref HyperCloudCore Central-Divergence) and\n[WENO](@extref HyperCloudCore Meshfree-WENO) (scalar equations only).\n\n## `Flux_`, `Limiter_`, `MOOD_`\n\n| Key | Default | Meaning |\n|:----|:--------|:--------|\n| `:Flux_name` | — | `:Rusanov` or `:Upwind`. Required. |\n| `:Limiter_name` | `:none` | `:none`, `:minmod`, `:superbee`, `:VK` (Venkatakrishnan), `:BJ` (Barth–Jespersen). |\n| `:Limiter_mode` | — | Required by every active limiter, e.g. `:hard`. |\n| `:MOOD_criterion` | `:none` | `:none`, `:only`, `:U1`, `:U2`. |\n| `:MOOD_strategy` | `:none` | `:EPD0`, `:SEPD0`, `:EPD1`, `:EPD2`. Required when a criterion is set. |\n| `:MOOD_delta_relax` | — | Required by `:U1`/`:U2`. Multiplied by the cell volume `prod(dx)`. |\n| `:MOOD_plateau` | `1e-3` | `:U2` only (HyperCloudCore ≥ 0.7.6): a component that varies across the stencil by less than this fraction of its global range is not checked. Keeps smooth far fields (e.g. a vortex tail) at full order; `0` turns it off. |\n| `:MOOD_curvature_ratio` | `0.5` | `:U2` only (HyperCloudCore ≥ 0.7.6): Diot's curvature-magnitude test, applied among the nearest neighbours; `0` turns it off. |\n\nSee HyperCloudCore's [Numerical Flux Functions](@extref HyperCloudCore Numerical-Flux-Functions), the\n[limiters](@extref HyperCloudCore Slope-limiting-(*a-priori*)) and\n[MOOD](@extref HyperCloudCore Multi-Dimensional-Optimal-Order-Detection-(MOOD)) for what the options do.\n\n## `Time_` — time stepping\n\n| Key | Meaning |\n|:----|:--------|\n| `:stepper` | Explicit: `:Euler`, `:RK2` (SSP), `:RK2Ralston`, `:RK3` (SSP), `:RK4SSP` (SSPRK(5,4), Spiteri–Ruuth), `:RK4` (classical). IMEX: `:IMEXEuler`, `:ARS222`, `:ARS233`, `:PRSSP3`, `:SSP332`. |\n| `:CFL` | CFL number; the step is recomputed every iteration. It is not a classical Courant number, see [what the CFL number means on a point cloud](@extref HyperCloudCore What-the-CFL-number-means-on-a-point-cloud). |\n| `:dt` | Fixed time step, used when `:CFL` is absent. |\n| `:tmax` | Optional override of the global `:tmax`. |\n| `:reset_orders_per_stage` | `true` restores the maximum order before every stage (default `false`: orders lowered by MOOD stay lowered for the step). |\n| `:full_search_per_stage` | `true` rebuilds the neighbour lists at every stage of a moving grid (default `false`). |\n| `:mood_substeps` | `true` (default, HyperCloudCore ≥ 0.7.7): with an explicit SSP tableau MOOD checks the forward Euler substeps `Y + (Δt/C) K` of the canonical Shu–Osher form instead of the stage values, so the admissibility of every substep carries over to every stage and the result (also for `:RK4SSP`, whose final update reuses earlier substeps). `false` checks the stage values. |\n\nIMEX steppers treat the source terms implicitly and are used with the kinetic pipeline. See\nHyperCloudCore's [Butcher Tableaus](@extref HyperCloudCore Butcher-Tableaus) for the properties of each\ntableau.\n\n## `Adapt_` — particle insertion and merging\n\nOptional; mainly for Lagrangian grids. See\n[Particle insertion and merging](@extref HyperCloudCore Particle-insertion-and-merging).\n\n| Key | Default | Meaning |\n|:----|:--------|:--------|\n| `:enabled` | `false` | Insert and merge particles between time steps. |\n| `:max_gap`, `:min_gap` | `1.6`, `0.5` | Pair distances (in units of the spacing) above which a particle is inserted and below which a pair is merged. |\n| `:clearance` | `0.7` | Free radius required around an insertion point. |\n| `:samples_per_dx` | `2` | Lattice resolution of the conservative remap. |\n| `:exclude_reduced_order` | `true` | No events near particles whose MOOD order was lowered. |\n| `:max_events` | unlimited | At most this many insertions/merges per call (HyperCloudCore ≥ 0.7.5). |\n\nEvery adaptation call is exactly conservative with respect to `Σ V_i U_i`, also with several events per call\nand, on a moving grid, across the volume re-estimation that follows (HyperCloudCore ≥ 0.7.5; with 0.7.4 and\nearlier, calls with several events in 2-D/3-D and the next re-estimation were not, see\n[Particle insertion and merging](@extref HyperCloudCore Particle-insertion-and-merging)).\n\nThe number of particles at the end is stored in the statistic `final_particle_count`.\n\n## `Kinetic_` — relaxation system\n\nOnly read by `run_kinetic_simulation` (and `:save_relax` also by `run_bgk_simulation`).\n\n| Key | Default | Meaning |\n|:----|:--------|:--------|\n| `:velocities` | — | Kinetic speeds, one `NK`-tuple per dimension. Use [`generate_relax_params`](@ref). |\n| `:indices` | — | Edges (a `Vector{Int}` or a tuple) mapping kinetic to macroscopic variables (see [`Kin2Macro`](@ref)). |\n| `:epsilon` | — | Relaxation time ``\\epsilon``. |\n| `:interior_factor` | `D` | Scaling of the inverse kinetic speeds in the Maxwellian. |\n| `:save_relax` | `false` | Same as the global key. |\n\n## Complete example\n\n```julia\nusing HyperCloud, StaticArrays\n\nvels, idx = generate_relax_params(2.0, 1, 1)\n\nparams = Dict{Symbol, Any}(\n    :sim_func_name => :run_kinetic_simulation,\n    :tmax => 0.5, :snapshots => 10,\n\n    :PDE_name => :burgers, :PDE_D => 1,\n\n    :Grid_domain => :rectangular, :Grid_mins => (-1.0,), :Grid_maxs => (1.0,),\n    :Grid_periodic => true, :Grid_Ns => (200,),\n    :Grid_randomness_factor => (0.2,), :Grid_seed => 10,\n\n    :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 5.5,\n\n    :IC_name => :gauss, :IC_a => (1.0,), :IC_b => (0.0,), :IC_width => 0.5,\n\n    :Scheme_name => :MUSCL, :Scheme_order => 2,\n    :Flux_name => :Rusanov, :Limiter_name => :none,\n    :MOOD_criterion => :U2, :MOOD_strategy => :EPD1, :MOOD_delta_relax => 1e-4,\n\n    :Time_stepper => :ARS222, :Time_CFL => 0.2,\n\n    :Kinetic_velocities => vels, :Kinetic_indices => idx, :Kinetic_epsilon => 1e-6,\n)\n\nsim = run_kinetic_simulation(params)   # `nothing` if anything failed (the error is logged)\nexact = analytical_solution(params)\nexact(SVector(0.3, 0.5))               # exact state at x = 0.3, t = 0.5\n```\n"},{"name":"examples.md","path":"docs/src/examples.md","type":"file","files":1,"lines":87,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":87}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":87}},"AI-Review":{"files":{"A0":0.09195402298850575,"A1":0.9080459770114943},"lines":{"A0":8,"A1":79}}},"parts":[{"lines":79,"runs":[[1,27],[36,87]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":8,"runs":[[28,35]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Examples\n\nHyperCloud ships with benchmark configurations covering the built-in equations and the simulation\npipelines.\n\n## Running an example\n\nPass the example function, uncalled, to a macro:\n\n```julia\nusing HyperCloud\nusing PDEStudio\nusing GLMakie          # or WGLMakie for browser-based rendering\n\n@plot euler_1d_sod     # run (or load from cache) and open the viewer\n```\n\nWithout a viewer, for example on a cluster:\n\n```julia\nusing HyperCloud\n\n@sim euler_1d_sod\n```\n\n## Available benchmarks\n\n### 1D piston (`euler_1d_piston`)\n\nA wall driven at speed 0.5 into a gas at rest, a `Moving` half space with a slip wall: the shock it drives and the\nRankine–Hugoniot plateau behind it, against the exact `exact_piston` (reference method `:exact_piston`).\n300 particles over `[0, 1.5]`, `tmax = 0.3`, MUSCL2 with the VK limiter and MUSCL3 with MOOD U2. Other piston\nspeeds and face positions: `euler_1d_piston(speed = 0.8, face = 1.2)` (shape and reference together; the shape is a\nstring, so the speed is part of the parameter hash). See [Walls and Moving Boundaries](@ref).\n\n### 1D Sod shock tube (`euler_1d_sod`)\n\nThe classic Riemann problem for the Euler equations with ``\\gamma = 1.4``.\n\n- **Data:** ``(\\rho, u, p) = (1, 0, 1)`` for ``x \u003c 0`` and ``(0.125, 0, 0.1)`` for ``x > 0``,\n  given to the IC as conservative states. `SOD_LEFT` and `SOD_RIGHT` hold them.\n- **Grid:** 330 jittered particles on ``[-0.5, 0.5]``, fixed Dirichlet on the left and outflow\n  on the right, `tmax = 0.2`.\n- **Methods:** the exact solution, first-order `RK2Upwind1`, `RK2MUSCL2_VK` (Venkatakrishnan\n  limiter), and MUSCL with MOOD (`RK2MUSCL2_U2_EPD1`, `RK4MUSCL4_U2_EPD1`, plus the inactive\n  `RK2MUSCL2_U2_EPD2` and `RK2MUSCL2_U1_EPD1`).\n\n### 1D kinetic Burgers (`burgers_kinetic`)\n\nCompares a direct scheme with the kinetic relaxation formulation for Burgers' equation.\n\n- **Data:** a Gaussian pulse (`a = 1`, `width = 1`) on the periodic domain ``[-5, 5]`` with\n  300 particles, up to `tmax = 1.0`. The pulse breaks at ``t^* \\approx 1.17``, so the run stays\n  in the smooth regime where the exact solution is available.\n- **Kinetic setup:** speeds ``\\pm 2`` from `generate_relax_params(2.0, 1, 1)` and\n  ``\\epsilon = 10^{-6}``.\n- **Methods:** `RK2MUSCL2` (direct) and `ARS222MUSCL2` (kinetic, IMEX).\n- **Sweep:** grid seeds `10, 100, 1000, 10000`.\n\n### 1D BGK shock tube (`bgk_1d_sod`)\n\nThe Sod problem for the discrete-velocity [BGK model](PDEs/bgk.md) with ``\\gamma = 1.4``.\n\n- **Model:** 24 uniform velocity nodes on ``[-6, 6]`` and the Chu-reduced pair ``(f, h)``\n  (48 equations); the IC gives the Sod states as Euler variables.\n- **Grid:** as `euler_1d_sod` (330 jittered particles, Dirichlet left, outflow right, `tmax = 0.2`).\n- **Methods:** `ARS222MUSCL2_VK` and `ARS222MUSCL2_U2_EPD1` (implicit collision), the inactive explicit\n  `RK2MUSCL2_VK` (only stable for the larger ``\\tau``), against the exact Euler solution\n  (`reference = :euler_limit_solution`).\n- **Sweep:** relaxation times ``\\tau = 10^{-5}, 10^{-3}, 10^{-2}``: the hydrodynamic limit, then\n  increasingly viscous and heat-conducting profiles.\n\n### 2D linear advection (`advection_2d`)\n\nTransport of a Gaussian pulse along the diagonal.\n\n- **Data:** velocity ``(1, 1)`` on the periodic square ``[-5, 5]^2`` with ``50 \\times 50``\n  jittered particles, up to `tmax = 10` (one full period in each direction).\n- **Methods:** `RK2MUSCL2` against the exact solution from characteristic tracing.\n- **Sweep:** grid seeds `10, 100, 1000, 10000`.\n\n## Writing your own\n\nCopy one of the example functions, change the parameters, and run it with `@sim` or `@plot`.\nThe [Configuration Reference](configuration.md) lists every key. Saving the function as\n`my_case.jl` in a folder listed in `CONFIG_SEARCH_PATHS` lets you call `@sim my_case` from any\nsession without including the file first.\n"},{"name":"ICs.md","path":"docs/src/ICs.md","type":"file","files":1,"lines":72,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"parts":[{"lines":72,"runs":[[1,72]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Initial Conditions\n\nAn initial condition is a callable struct that subtypes `InitialCondition`. It takes a position\n`pos::Space{D}` and returns the state `State{M}` at that point.\n\n[`set_initial_conditions!`](@ref) evaluates it at every particle. The kinetic pipeline uses a\nsecond method that maps the macroscopic state to the kinetic equilibrium (see\n[Kinetic Relaxation](SourceTerms/kinetic.md)).\n\nIn a configuration the initial condition is selected with `:IC_name`; [`build_ic`](@ref)\nconverts all `IC_` parameters to the simulation type `T`. The keys of each type are listed in\nthe [Configuration Reference](configuration.md).\n\n## Available initial conditions\n\n| Type | `:IC_name` | State at `pos` |\n|:-----|:-----------|:---------------|\n| [`Gauss`](@ref) | `:gauss` | ``a \\exp\\left(-\\lVert pos - b \\rVert^2 / \\mathrm{width}^2\\right)`` |\n| [`Box`](@ref) | `:box` | `u_box` if `mins .\u003c= pos .\u003c= maxs` in every direction, else `u_bg` |\n| [`Sine`](@ref) | `:sine` | ``a \\sin\\left(2\\pi \\sum_d pos_d / \\mathrm{period}_d\\right) + c_\\mathrm{offset}`` |\n| [`Riemann`](@ref) | `:riemann` | `uL` if ``(pos - p_0) \\cdot n \u003c 0``, else `uR` |\n| [`SRiemann`](@ref) | `:s_riemann` | ``\\frac{u_L + u_R}{2} - \\frac{u_L - u_R}{\\pi} \\arctan\\left(\\frac{(pos - p_0)\\cdot n}{\\mathrm{width}}\\right)`` |\n| [`QRiemann`](@ref) | `:q_riemann` | `u_states[1 + Σ_d 2^(d-1) (pos_d ≥ p0_d)]` |\n\nNotes:\n\n- **Riemann normals.** `build_ic` normalizes `n` (default ``+x``). `uL` lies on the side the\n  normal points away from.\n- **Quadrant ordering.** `QRiemann` needs `2^D` states in binary order. In 2D:\n  `(bottom-left, bottom-right, top-left, top-right)`.\n- **Precision.** `Gauss` and `SRiemann` store their parameters in the precision of the\n  amplitude/state. A Float32 configuration therefore evaluates entirely in Float32.\n\n## Adding an initial condition\n\nDefine a struct, make it callable, and add a builder method:\n\n```julia\nusing HyperCloud, StaticArrays\n\nstruct Ring{D, M, T} \u003c: InitialCondition\n    u_in::State{M, T}\n    u_out::State{M, T}\n    center::Space{D, T}\n    radius::T\nend\n\n(ic::Ring)(pos::Space{D}) where {D} = sum(abs2, pos - ic.center) \u003c ic.radius^2 ? ic.u_in : ic.u_out\n\nfunction HyperCloud.build_ic(::Val{:ring}, conf::Dict, ctx::Dict)\n    T, D, M = ctx[:T]::DataType, ctx[:D]::Int, ctx[:M]::Int\n    return Ring(State{M, T}(Tuple(T.(conf[:u_in]))), State{M, T}(Tuple(T.(conf[:u_out]))),\n                Space{D, T}(Tuple(T.(conf[:center]))), T(conf[:radius]))\nend\n```\n\n`:IC_name => :ring` now selects it. To use it as a reference solution, add an\n[`analytic_closure`](@ref) method for the equations where it has one (see\n[PDE Architecture](PDEs/main.md)).\n\n## API\n\n```@docs\nInitialCondition\nset_initial_conditions!\nBox\nGauss\nQRiemann\nRiemann\nSine\nSRiemann\n```\n"},{"name":"index.md","path":"docs/src/index.md","type":"file","files":1,"lines":84,"levels":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"errors":[],"parts":[{"lines":84,"runs":[[1,84]],"declaration":{"AI-Generation":"G3","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [4]"},"levels":{"AI-Generation":"
