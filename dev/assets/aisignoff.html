ration":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":52,"runs":[[1,52]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export advection_2d\nfunction advection_2d()\n    varied_params = create_varied_dict()\n    # Ensure parameter variations use the updated flattened namespace keys\n    push!(varied_params, :Grid_seed => [10, 100, 1000, 10000]) \n    \n    base_methods = get_master_method_dict()\n    \n    sim_config = SimulationConfig(\n        Dict{Symbol, Any}(\n            # Global\n            :snapshots => 25, \n            :remove_ghosts => false,\n            :sim_func_name => :run_direct_simulation,\n            :tmax => 10.0, \n\n            # Time Namespace\n            :Time_CFL => 0.2, \n            \n            # Grid & Domain Namespace\n            :Grid_domain => :rectangular,\n            :Grid_Ns => (50,50), \n            :Grid_mins => (-5.0,-5.0), \n            :Grid_maxs => (5.0,5.0),\n            :Grid_periodic => true,\n            :Grid_randomness_factor => (0.2,0.2),\n            :Grid_seed => 42,\n            :Grid_mover => :none,\n            \n            # Weight Namespace\n            :Weight_name => :exponential,\n            :Weight_alpha => 1.0,\n            :Weight_range => 5.5,\n            \n            # IC Namespace\n            :IC_name => :gauss,\n            :IC_a => (1.0,),\n            :IC_b => (0.0,0.0),\n            :IC_width => 1.0,\n            \n            # PDE Namespace\n            :PDE_name => :linear, \n            :PDE_velocities => ((1.0,),(1.0,)), \n\n            :Scheme_MLS_order => 2,\n        ),\n        base_methods,\n        [\"RK2MUSCL2\"];\n        varied = varied_params, reference = \"analytical_solution\"\n    )\n    return sim_config\nend"},{"name":"bgk_1d_sod.jl","path":"src/Examples/bgk_1d_sod.jl","type":"file","files":1,"lines":83,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":83,"runs":[[1,83]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export bgk_1d_sod\n\n\"\"\"\n    bgk_1d_sod()\n\nThe Sod shock tube for the discrete-velocity BGK model (`γ = 1.4`, i.e. a Chu-reduced distribution\npair on a 1-D velocity grid of 24 nodes, 48 equations) at the relaxation times `τ = 1e-5, 1e-3, 1e-2`,\nagainst the exact Euler solution ([`euler_limit_solution`](@ref)), which the BGK solution approaches\nas `τ → 0`. Methods: IMEX `ARS222` with MUSCL2 (Venkatakrishnan limiter, or U2 MOOD) and explicit\n`RK2` with MUSCL2 (the collision term explicit, only stable for the larger `τ`).\n\"\"\"\nfunction bgk_1d_sod()\n    varied_params = create_varied_dict()\n    push!(varied_params, :PDE_tau => [1e-5, 1e-3, 1e-2])\n\n    bc_map = Dict{Int, AbstractBoundaryCondition}(\n        1 => FixedDirichlet(), # Left Boundary\n        2 => OutflowBC()       # Right Boundary\n    )\n\n    shared = Dict{Symbol, Any}(\n        # Discrete-velocity BGK model; the IC below is macroscopic (Euler conservative variables)\n        :PDE_name => :bgk,\n        :PDE_D => 1,\n        :PDE_gamma => 1.4,\n        :PDE_Nv => 24,\n        :PDE_vmax => 6.0,\n        :PDE_velocity_grid => :uniform,\n        :PDE_tau => 1e-5,\n\n        :sim_func_name => :run_bgk_simulation,\n        :tmax => 0.2,\n        :snapshots => 20,\n\n        :Grid_domain => :rectangular,\n        :Grid_mins => (-0.5,),\n        :Grid_maxs => (0.5,),\n        :Grid_Ns => (330,),\n        :Grid_periodic => false,\n        :Grid_bc => bc_map,\n        :Grid_randomness_factor => (0.2,),\n        :Grid_seed => 10,\n        :Grid_mover => :none,\n\n        :Weight_name => :exponential,\n        :Weight_alpha => 1.0,\n        :Weight_range => 5.5,\n\n        :IC_name => :riemann,\n        :IC_uL => SOD_LEFT,\n        :IC_uR => SOD_RIGHT,\n        :IC_p0 => (0.0,),\n        :IC_n => (1.0,),\n\n        :Time_CFL => 0.2,\n    )\n\n    methods = Dict{Symbol, Dict{Symbol, Any}}(\n        :exact_euler_limit => Dict(),\n        :ARS222MUSCL2_VK => Dict(\n            :Time_stepper => :ARS222,\n            :Scheme_name => :MUSCL, :Scheme_order => 2,\n            :Flux_name => :Rusanov, :Limiter_name => :VK, :Limiter_mode => :hard,\n            :MOOD_criterion => :none\n        ),\n        :ARS222MUSCL2_U2_EPD1 => Dict(\n            :Time_stepper => :ARS222,\n            :Scheme_name => :MUSCL, :Scheme_order => 2,\n            :Flux_name => :Rusanov, :Limiter_name => :none,\n            :MOOD_criterion => :U2, :MOOD_strategy => :EPD1, :MOOD_delta_relax => 1e-4\n        ),\n        :RK2MUSCL2_VK => Dict(\n            :Time_stepper => :RK2,\n            :Scheme_name => :MUSCL, :Scheme_order => 2,\n            :Flux_name => :Rusanov, :Limiter_name => :VK, :Limiter_mode => :hard,\n            :MOOD_criterion => :none\n        ),\n    )\n\n    active_methods = [:exact_euler_limit, :ARS222MUSCL2_VK, :ARS222MUSCL2_U2_EPD1]\n\n    return SimulationConfig(shared, methods, active_methods; varied = varied_params, reference = :euler_limit_solution)\nend\n"},{"name":"burgers_kinetic.jl","path":"src/Examples/burgers_kinetic.jl","type":"file","files":1,"lines":62,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":62}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":62}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":62}}},"parts":[{"lines":61,"runs":[[1,17],[19,62]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[18,18]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export burgers_kinetic\n\nfunction burgers_kinetic()\n    varied_params = create_varied_dict()\n    push!(varied_params, :Grid_seed => [10, 100, 1000, 10000]) \n    \n    base_methods = get_master_method_dict()\n    \n    # Generate symmetric kinetic velocities and indices for 1D, 1-component Burgers\n    # v_mag = 2.0 (Must be strictly greater than max|u| of the IC to remain stable)\n    kin_vels, kin_idx = generate_relax_params(2.0, 1, 1)\n    \n    sim_config = SimulationConfig(\n        Dict{Symbol, Any}(\n            # Global\n            :snapshots => 25, \n            :remove_ghosts => false,\n            :tmax => 1.0, # the pulse breaks at t_b = e^{1/2} / √2 ≈ 1.17; the exact reference only exists before that\n            \n            # Time Namespace\n            :Time_CFL => 0.2, \n            \n            # Grid & Domain Namespace\n            :Grid_domain => :rectangular,\n            :Grid_Ns => (300,), \n            :Grid_mins => (-5.0,), \n            :Grid_maxs => (5.0,),\n            :Grid_periodic => true,\n            :Grid_randomness_factor => (0.2,),\n            :Grid_seed => 42,\n            :Grid_mover => :none,\n            \n            # Weight Namespace\n            :Weight_name => :exponential,\n            :Weight_alpha => 1.0,\n            :Weight_range => 5.5,\n            \n            # IC Namespace (Gauss pulse of amplitude 1.0)\n            :IC_name => :gauss,\n            :IC_a => (1.0,),\n            :IC_b => (0.0,),\n            :IC_width => 1.0,\n            \n            # PDE Namespace\n            :PDE_name => :burgers, \n            :PDE_D => 1,\n            \n            # Kinetic Namespace\n            :Kinetic_velocities => kin_vels,\n            :Kinetic_indices => kin_idx,\n            :Kinetic_epsilon => 1e-6,\n\n            :Scheme_MLS_order => 2,\n        ),\n        base_methods,\n        # Compare a Direct scheme vs a Kinetic scheme\n        [\"RK2MUSCL2\", \"ARS222MUSCL2\"];\n        varied = varied_params, reference = \"analytical_solution\"\n    )\n    \n    return sim_config\nend"},{"name":"euler_1d_piston.jl","path":"src/Examples/euler_1d_piston.jl","type":"file","files":1,"lines":136,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"errors":[],"parts":[{"lines":136,"runs":[[1,136]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"export euler_1d_piston, exact_piston\n\n# =========================================================================\n# 1-D PISTON: a wall driven into a gas at rest (moving boundary)\n# =========================================================================\n#\n# Gas at rest (ρ = 1, p = 1, γ = 1.4) in the tube [0, 1.5]; the right end is a piston face, a `Moving` half\n# space at x = 1 - w t with w = 0.5, treated as a slip wall that moves (`slip_wall()` on a `Moving` piece: the\n# mirrored state is reflected relative to the wall velocity). The piston drives a shock into the gas; between\n# shock and piston the gas moves with the piston at the Rankine–Hugoniot state (ρ₂, p₂), which `exact_piston`\n# gives exactly (the shock runs at S = w ρ₂ / (ρ₂ − ρ₁)).\n\nconst PISTON_SPEED = 0.5\nconst PISTON_FACE  = 1.0\n\n\"\"\"\n    piston_state(ρ₁, p₁, w, γ) -> (ρ₂, p₂, S)\n\nRankine–Hugoniot state behind a piston moving at speed `w` into a gas `(ρ₁, p₁)` at rest, and the shock speed `S`\n(relative to the gas at rest; the shock moves away from the piston).\n\"\"\"\nfunction piston_state(ρ₁::Real, p₁::Real, w::Real, γ::Real)\n    g(p₂) = (p₂ - p₁) / sqrt(ρ₁ * ((γ + 1) / 2 * p₂ + (γ - 1) / 2 * p₁)) - w\n    lo, hi = p₁, 2p₁\n    while g(hi) \u003c= 0                      # g grows like √p₂: any piston speed is bracketed\n        lo, hi = hi, 2hi\n    end\n    for _ in 1:200\n        mid = (lo + hi) / 2\n        g(mid) > 0 ? (hi = mid) : (lo = mid)\n    end\n    p₂ = (lo + hi) / 2\n    ρ₂ = ρ₁ * ((γ + 1) * p₂ + (γ - 1) * p₁) / ((γ - 1) * p₂ + (γ + 1) * p₁)\n    return ρ₂, p₂, w * ρ₂ / (ρ₂ - ρ₁)\nend\n\n\"\"\"\n    exact_piston(params) -> (spacetime -> State)\n\nExact solution of [`euler_1d_piston`](@ref): the gas at rest ahead of the shock, the Rankine–Hugoniot state moving\nwith the piston behind it (and that state, for reference, beyond the piston face). Reads the gas state from the\n`IC` keys, `γ`, the piston speed `:piston_speed` and face position `:piston_face` from `params`.\n\"\"\"\nfunction exact_piston(params::Dict)\n    γ   = Float64(get(params, :PDE_gamma, 1.4))\n    uL  = Float64.(collect(params[:IC_uL]))\n    ρ₁  = uL[1]\n    p₁  = (γ - 1) * (uL[3] - 0.5 * uL[2]^2 / uL[1])\n    w   = Float64(get(params, :piston_speed, PISTON_SPEED))\n    x_f = Float64(get(params, :piston_face, PISTON_FACE))\n    ρ₂, p₂, S = piston_state(ρ₁, p₁, w, γ)\n    U₁ = State{3, Float64}(ρ₁, 0.0, p₁ / (γ - 1))\n    U₂ = State{3, Float64}(ρ₂, -ρ₂ * w, p₂ / (γ - 1) + 0.5 * ρ₂ * w^2)\n    return xt -> xt[1] \u003c x_f - S * xt[2] ? U₁ : U₂\nend\n\n# The tube with the piston face at `face` moving at `-speed`, as a string of code in the run's float type `T`: the\n# parameter hash sees a string in full (the motion of a `Moving` instance is a closure, which it reduces to\n# \"Closure\", so runs at different piston speeds shared one cache file), and `T` makes it work in Float32\npiston_shape(speed::Real, face::Real) =\n    \"intersect(Tagged(Cuboid((T(0),), (T(1.5),)), 1), Moving(Tagged(HalfSpace((T($face),), (T(1),)), 2), translating((-T($speed),))))\"\n\n\"\"\"\n    euler_1d_piston(; speed = 0.5, face = 1.0) -> SimulationConfig\n\nA piston face starting at `face` and driven at `speed` into a gas at rest in the tube `[0, 1.5]` (the canvas\nreaches beyond the face), with the exact solution [`exact_piston`](@ref) as reference. The shape is given as a\nstring (`:Grid_shape`), so the piston speed is part of the parameter hash and the run follows `:T`; the keys\n`:piston_speed` and `:piston_face` feed the reference. Change the speed through the keyword (shape and reference\ntogether), not by overriding `:piston_speed` alone.\n\"\"\"\nfunction euler_1d_piston(; speed::Real = PISTON_SPEED, face::Real = PISTON_FACE)\n    w = speed\n    # the exact solution is the shock of a piston moving into the gas (a receding piston drives a rarefaction), and\n    # the face must stay away from the left wall until tmax = 0.3 (the shock ahead of it reaches the wall first)\n    speed > 0 || throw(ArgumentError(\"euler_1d_piston: the piston must move into the gas (speed > 0), got $speed\"))\n    face \u003c 1.5 || throw(ArgumentError(\"euler_1d_piston: the face must lie inside the canvas (\u003c 1.5), got $face\"))\n    _, _, S = piston_state(1.0, 1.0, speed, 1.4)\n    face - S * 0.3 > 0.05 ||\n        throw(ArgumentError(\"euler_1d_piston: the shock reaches the left wall before tmax = 0.3 (face $face, shock speed $S); move the face right\"))\n\n    shared = Dict{Symbol, Any}(\n        :PDE_name => :euler,\n        :PDE_D => 1,\n        :PDE_gamma => 1.4,\n\n        :sim_func_name => :run_direct_simulation,\n        :tmax => 0.3,\n        :snapshots => 30,\n        :piston_speed => w,\n        :piston_face => face,\n\n        :Grid_domain => :shape,\n        :Grid_shape => piston_shape(w, face),\n        :Grid_mins => (0.0,),\n        :Grid_maxs => (1.5,),\n        :Grid_Ns => (300,),\n        :Grid_periodic => false,\n        :Grid_bc => Dict{Int, AbstractBoundaryCondition}(1 => slip_wall(), 2 => slip_wall()),\n        :Grid_randomness_factor => (0.0,),\n        :Grid_seed => 1,\n        :Grid_mover => :none,\n\n        :Weight_name => :exponential,\n        :Weight_alpha => 1.0,\n        :Weight_range => 2.5,\n\n        :IC_name => :riemann,\n        :IC_uL => (1.0, 0.0, 2.5),\n        :IC_uR => (1.0, 0.0, 2.5),\n        :IC_p0 => (0.5,),\n        :IC_n => (1.0,),\n\n        :Time_CFL => 0.2,\n    )\n\n    methods = Dict{Symbol, Dict{Symbol, Any}}(\n        :exact_piston => Dict(),\n        :RK2MUSCL2_VK => Dict(\n            :Time_stepper => :RK2,\n            :Scheme_name => :MUSCL, :Scheme_order => 2, :Scheme_MLS_order => 0,\n            :Flux_name => :Rusanov, :Limiter_name => :VK, :Limiter_mode => :hard,\n            :MOOD_criterion => :none\n        ),\n        :RK3MUSCL3_U2_EPD1 => Dict(\n            :Time_stepper => :RK3,\n            :Scheme_name => :MUSCL, :Scheme_order => 3, :Scheme_MLS_order => 0,\n            :Flux_name => :Rusanov, :Limiter_name => :none,\n            :MOOD_criterion => :U2, :MOOD_strategy => :EPD1, :MOOD_delta_relax => 1e-4\n        ),\n    )\n\n    active_methods = [:exact_piston, :RK2MUSCL2_VK, :RK3MUSCL3_U2_EPD1]\n\n    return SimulationConfig(shared, methods, active_methods; reference = :exact_piston)\nend\n"},{"name":"euler_1d_sod.jl","path":"src/Examples/euler_1d_sod.jl","type":"file","files":1,"lines":126,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":126,"runs":[[1,126]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export euler_1d_sod\n\n# =========================================================================\n# EXACT CONSTANTS FOR 1D SOD SHOCK TUBE\n# =========================================================================\n\n# Primitive states: (rho, u, p)\n# Left: rho = 1.0, u = 0.0, p = 1.0\n# E = p / (gamma - 1) + 0.5 * rho * u^2 = 1.0 / 0.4 = 2.5\nconst SOD_LEFT  = State{3, Float64}(1.0, 0.0, 2.5)\n\n# Right: rho = 0.125, u = 0.0, p = 0.1\n# E = 0.1 / 0.4 = 0.25\nconst SOD_RIGHT = State{3, Float64}(0.125, 0.0, 0.25)\n\n\n# =========================================================================\n# MAIN SIMULATION SETUP\n# =========================================================================\n\nfunction euler_1d_sod()\n    # Interface normal for 1D\n    p0 = (0.0,)\n    n  = (1.0,) \n    \n    # Simple boundaries for 1D Sod shock tube\n    bc_map = Dict{Int, AbstractBoundaryCondition}(\n        1 => FixedDirichlet(), # Left Boundary\n        2 => OutflowBC()       # Right Boundary\n    )\n\n    # 1. Flat Namespace Shared Configuration\n    shared = Dict{Symbol, Any}(\n        :PDE_name => :euler,\n        :PDE_D => 1,\n        :PDE_gamma => 1.4,\n\n        :sim_func_name => :run_direct_simulation,                \n        :tmax => 0.2,\n        :snapshots => 51,\n        \n        :Grid_domain => :rectangular,\n        :Grid_mins => (-0.5,),\n        :Grid_maxs => (0.5,),\n        :Grid_Ns => (330,),\n        :Grid_periodic => false,\n        :Grid_bc_map => bc_map,\n        :Grid_randomness_factor => (0.2,),\n        :Grid_seed => 10,\n        :Grid_mover => :none,\n        \n        # New Weight Function API mappings\n        :Weight_name => :exponential,\n        :Weight_alpha => 1.0,\n        :Weight_range => 5.5,\n        \n        :IC_name => :riemann,\n        :IC_uL => SOD_LEFT,\n        :IC_uR => SOD_RIGHT,\n        :IC_p0 => p0,\n        :IC_n => n,\n\n        :Time_CFL => 0.2,\n    )\n\n    # 2. Modernized Method Configurations\n    methods = Dict{Symbol, Dict{Symbol, Any}}(\n        :analytical_solution => Dict(),\n        # 1st Order Baseline\n        :RK2Upwind1 => Dict(\n            :Time_stepper => :RK2, \n            :Scheme_name => :Upwind, :Scheme_order => 1, :Scheme_MLS_order => 1, \n            :Scheme_upwind_alg_nd => :Classic, :Flux_name => :Upwind,\n            :MOOD_criterion => :none\n        ),\n        \n        # A Priori Limiter\n        :RK2MUSCL2_VK => Dict(\n            :Time_stepper => :RK2, \n            :Scheme_name => :MUSCL, :Scheme_order => 2, :Scheme_MLS_order => 0, \n            :Flux_name => :Rusanov, :Limiter_name => :VK, :Limiter_mode => :hard,\n            :MOOD_criterion => :none\n        ),\n        \n        # U2 MOOD Variations (with various EPD Halo Strategies)\n        :RK2MUSCL2_U2_EPD1 => Dict(\n            :Time_stepper => :RK2, \n            :Scheme_name => :MUSCL, :Scheme_order => 2, :Scheme_MLS_order => 0, \n            :Flux_name => :Rusanov, :Limiter_name => :none,\n            :MOOD_criterion => :U2, :MOOD_strategy => :EPD1, :MOOD_delta_relax => 1e-4\n        ),\n        :RK2MUSCL2_U2_EPD2 => Dict(\n            :Time_stepper => :RK2, \n            :Scheme_name => :MUSCL, :Scheme_order => 2, :Scheme_MLS_order => 0, \n            :Flux_name => :Rusanov, :Limiter_name => :none,\n            :MOOD_criterion => :U2, :MOOD_strategy => :EPD2, :MOOD_delta_relax => 1e-4\n        ),\n        \n        # U1 Standard DMP Variation\n        :RK2MUSCL2_U1_EPD1 => Dict(\n            :Time_stepper => :RK2, \n            :Scheme_name => :MUSCL, :Scheme_order => 2, :Scheme_MLS_order => 0, \n            :Flux_name => :Rusanov, :Limiter_name => :none,\n            :MOOD_criterion => :U1, :MOOD_strategy => :EPD1, :MOOD_delta_relax => 1e-4\n        ),\n        \n        # High-Order RK4 MUSCL Variations\n        :RK4MUSCL4_U2_EPD1 => Dict(\n            :Time_stepper => :RK4, \n            :Scheme_name => :MUSCL, :Scheme_order => 4, :Scheme_MLS_order => 0, \n            :Flux_name => :Rusanov, :Limiter_name => :none,\n            :MOOD_criterion => :U2, :MOOD_strategy => :EPD1, :MOOD_delta_relax => 1e-4\n        )\n    )\n\n    # Active methods to run by default\n    active_methods = [\n        :analytical_solution,\n        :RK2Upwind1,\n        :RK2MUSCL2_VK,\n        :RK2MUSCL2_U2_EPD1,\n        :RK4MUSCL4_U2_EPD1\n    ]\n\n    return SimulationConfig(shared, methods, active_methods; reference=:analytical_solution)\nend"}]},{"name":"ICs","path":"src/ICs","type":"dir","files":7,"lines":306,"counts":{"AI-Generation":{"files":{"G2":6.041666666666666,"G3":0.9583333333333334},"lines":{"G2":260,"G3":46}},"Human-Review":{"files":{"H0":0.9583333333333334,"H1":0.041666666666666664,"H2":6.0},"lines":{"H0":46,"H1":2,"H2":258}},"AI-Review":{"files":{"A1":7.0},"lines":{"A1":306}}},"errors":0,"children":[{"name":"_main.jl","path":"src/ICs/_main.jl","type":"file","files":1,"lines":50,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":50,"runs":[[1,50]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export InitialCondition, set_initial_conditions!, build_ic\n\n\"\"\"\n    InitialCondition\n\nAbstract base type for all initial condition functors in the framework.\nFunctors derived from this type evaluate the starting state of the physical system at a given spatial coordinate.\n\"\"\"\nabstract type InitialCondition end\n\n\"\"\"\n    set_initial_conditions!(pg::ParticleGrid, eq::HyperbolicPDE, IC::InitialCondition)\n    set_initial_conditions!(pg::ParticleGrid, st::RelaxationSourceTerm, IC::InitialCondition, eq_macro::HyperbolicPDE)\n\nEvaluates the initial condition functor and applies it to the particle grid.\n\n- **Direct formulation:** evaluates `IC` at every particle position and assigns the physical state to `pg.rhos`.\n- **Kinetic formulation:** evaluates the macroscopic state and physical fluxes at every particle and initializes\n  the kinetic variables directly in the Maxwellian equilibrium, component by component.\n\"\"\"\nfunction set_initial_conditions!(pg::ParticleGrid{D, M}, eq::HyperbolicPDE, IC::InitialCondition) where {D, M}\n    # IC(pos) must return a State{M}\n    set_states!(IC, pg)\n    return nothing\nend\n\n\"\"\"\n    build_ic(ic_conf::Dict, context::Dict)\n\nReads the `:IC` namespace and dispatches to the matching builder via `Val(ic_conf[:name])`.\nExtend it by defining `build_ic(::Val{:my_ic}, conf::Dict, ctx::Dict)`.\n\"\"\"\nfunction build_ic(ic_conf::Dict, context::Dict)\n    if !haskey(ic_conf, :name)\n        error(\"Initial Condition configuration must include a strictly typed :name Symbol (e.g., :gauss, :box).\")\n    end\n\n    ic_name = ic_conf[:name]::Symbol\n    return build_ic(Val(ic_name), ic_conf, context)\nend\n\n# Fallback error for missing implementations\nbuild_ic(name::Val, conf::Dict, ctx::Dict) = error(\"Unknown initial condition: $(typeof(name))\")\n\ninclude(\"box.jl\")\ninclude(\"gauss.jl\")\ninclude(\"quadrant_riemann.jl\")\ninclude(\"riemann.jl\")\ninclude(\"sine.jl\")\ninclude(\"smoothed_riemann.jl\")\n"},{"name":"box.jl","path":"src/ICs/box.jl","type":"file","files":1,"lines":40,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":40,"runs":[[1,40]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export Box\n\n\"\"\"\n    Box{D, M, T} \u003c: InitialCondition\n\nDefines a discontinuous rectangular sub-region.\n\n# Fields\n- `u_bg::State{M, T}`: The background state applied outside the box.\n- `u_box::State{M, T}`: The interior state applied within the box.\n- `mins::Space{D, T}`: The lower spatial bounds of the rectangular region.\n- `maxs::Space{D, T}`: The upper spatial bounds of the rectangular region.\n\nEvaluates to `u_box` if `mins .\u003c= pos .\u003c= maxs` holds in every direction (the boundary\nbelongs to the box), and to `u_bg` otherwise. Mixed-precision inputs are promoted to one `T`.\n\"\"\"\nstruct Box{D, M, T} \u003c: InitialCondition\n    u_bg::State{M, T}\n    u_box::State{M, T}\n    mins::Space{D, T}\n    maxs::Space{D, T}\nend\n\nfunction Box(u_bg::State{M}, u_box::State{M}, mins::Space{D}, maxs::Space{D}) where {D, M}\n    T = promote_type(eltype(u_bg), eltype(u_box), eltype(mins), eltype(maxs))\n    return Box{D, M, T}(u_bg, u_box, mins, maxs)\nend\n\n(ic::Box)(pos::Space{D}) where {D} = all(ic.mins .\u003c= pos .\u003c= ic.maxs) ? ic.u_box : ic.u_bg\n\nfunction build_ic(::Val{:box}, conf::Dict, ctx::Dict)\n    T, D, M = ctx[:T]::DataType, ctx[:D]::Int, ctx[:M]::Int\n    \n    u_bg = State{M, T}(Tuple(T.(conf[:u_bg])))\n    u_box = State{M, T}(Tuple(T.(conf[:u_box])))\n    mins = Space{D, T}(Tuple(T.(conf[:mins])))\n    maxs = Space{D, T}(Tuple(T.(conf[:maxs])))\n    \n    return Box(u_bg, u_box, mins, maxs)\nend"},{"name":"gauss.jl","path":"src/ICs/gauss.jl","type":"file","files":1,"lines":36,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":36,"runs":[[1,36]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export Gauss\n\n\"\"\"\n    Gauss{D, M, T} \u003c: InitialCondition\n\nEvaluates a smooth, multi-dimensional Gaussian pulse.\n\n# Fields\n- `a::State{M, T}`: The amplitude state vector.\n- `b::Space{D, T}`: The spatial center coordinate of the pulse.\n- `width::T`: The parameter controlling the spatial spread of the bell curve.\n\nThe physical state is computed as `a * exp(-sum(abs2, pos - b) / width^2)`.\nThe center and width are converted to the precision `T` of the amplitude, so a\n`Float32` amplitude gives a pure `Float32` pulse even if `b` or `width` are `Float64`.\n\"\"\"\nstruct Gauss{D, M, T} \u003c: InitialCondition\n    a::State{M, T}\n    b::Space{D, T}\n    width::T\nend\n\n# Mixed-precision convenience constructor (the default one requires matching T everywhere)\nGauss(a::State{M, T}, b::Space{D}, width::Real) where {D, M, T} = Gauss{D, M, T}(a, b, width)\n\n(ic::Gauss)(pos::Space{D}) where {D} = ic.a * exp(-sum(abs2, pos - ic.b) / ic.width^2)\n\nfunction build_ic(::Val{:gauss}, conf::Dict, ctx::Dict)\n    T, D, M = ctx[:T]::DataType, ctx[:D]::Int, ctx[:M]::Int\n\n    a = State{M, T}(Tuple(T.(conf[:a])))\n    b = Space{D, T}(Tuple(T.(conf[:b])))\n    width = T(conf[:width])\n\n    return Gauss(a, b, width)\nend\n"},{"name":"quadrant_riemann.jl","path":"src/ICs/quadrant_riemann.jl","type":"file","files":1,"lines":48,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.041666666666666664,"G3":0.9583333333333334},"lines":{"G2":2,"G3":46}},"Human-Review":{"files":{"H0":0.9583333333333334,"H1":0.041666666666666664},"lines":{"H0":46,"H1":2}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":48}}},"parts":[{"lines":46,"runs":[[1,40],[43,48]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":2,"runs":[[41,42]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export QRiemann\n\n\"\"\"\n    QRiemann{D, M, N_states, T} \u003c: InitialCondition\n\nDefines a multi-dimensional quadrant Riemann problem that partitions the domain into orthogonal regions intersecting at a central point.\n\n# Fields\n- `u_states::NTuple{N_states, State{M, T}}`: A tuple of constant physical states corresponding to each spatial quadrant.\n- `p0::Space{D, T}`: The central intersection point of the quadrants.\n\nThe state index is `1 + Σ_d 2^(d-1) * (pos[d] >= p0[d])`, so `u_states` must hold `2^D`\nstates ordered by binary encoding. In 2D: `(bottom-left, bottom-right, top-left, top-right)`.\n\"\"\"\nstruct QRiemann{D, M, N_states, T} \u003c: InitialCondition\n    u_states::NTuple{N_states, State{M, T}}\n    p0::Space{D, T}\nend\n\nfunction QRiemann(u_states::NTuple{N, State{M}}, p0::Space{D}) where {D, M, N}\n    T = promote_type(eltype(p0), map(eltype, u_states)...)\n    return QRiemann{D, M, N, T}(u_states, p0)\nend\n\nfunction (ic::QRiemann{D, M, N})(pos::Space{D}) where {D, M, N}\n    # Binary encoding: Left/Bottom adds 0, Right/Top adds 2^(d-1)\n    idx = 1\n    for d in 1:D\n        if pos[d] >= ic.p0[d]\n            idx += 2^(d-1)\n        end\n    end\n    return ic.u_states[idx]\nend\n\nfunction build_ic(::Val{:q_riemann}, conf::Dict, ctx::Dict)\n    T, D, M = ctx[:T]::DataType, ctx[:D]::Int, ctx[:M]::Int\n    \n    # Process the tuple of states explicitly via the extracted dictionary list\n    raw_states = conf[:states]::Tuple\n    length(raw_states) == 2^D ||\n        throw(ArgumentError(\"q_riemann needs 2^D = $(2^D) states (one per quadrant/octant, binary order), got $(length(raw_states))\"))\n    states = ntuple(i -> State{M, T}(Tuple(T.(raw_states[i]))), length(raw_states))\n    \n    p0 = Space{D, T}(Tuple(T.(conf[:p0])))\n    \n    return QRiemann(states, p0)\nend"},{"name":"riemann.jl","path":"src/ICs/riemann.jl","type":"file","files":1,"lines":47,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":47,"runs":[[1,47]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export Riemann\n\n\"\"\"\n    Riemann{D, M, T} \u003c: InitialCondition\n\nDefines a standard discontinuous Riemann problem (e.g., a shock tube or half-space) split by a hyperplane.\n\n# Fields\n- `uL::State{M, T}`: The physical state vector on the \"left\" side of the hyperplane.\n- `uR::State{M, T}`: The physical state vector on the \"right\" side of the hyperplane.\n- `p0::Space{D, T}`: An origin point located exactly on the separating hyperplane.\n- `n::Space{D, T}`: The normal vector of the hyperplane pointing toward the right state.\n\nReturns `uL` if the dot product of the relative position and the normal is negative, and `uR` otherwise.\n\"\"\"\nstruct Riemann{D, M, T} \u003c: InitialCondition\n    uL::State{M, T}\n    uR::State{M, T}\n    p0::Space{D, T}\n    n::Space{D, T}\nend\n\nfunction Riemann(uL::State{M}, uR::State{M}, p0::Space{D}, n::Space{D}) where {D, M}\n    T = promote_type(eltype(uL), eltype(uR), eltype(p0), eltype(n))\n    return Riemann{D, M, T}(uL, uR, p0, n)\nend\n\n# The signed distance is summed without `dot`, which uses `muladd`: a fused multiply-add rounds differently\n# from mul + add, and whether `muladd` fuses depends on the compiled context, so a particle exactly on the\n# hyperplane got different states from the runner and from the analytic reference.\n@inline signed_distance(ic::Riemann{D}, pos::Space{D}) where {D} =\n    sum(ntuple(d -> (pos[d] - ic.p0[d]) * ic.n[d], Val(D)))\n(ic::Riemann{D})(pos::Space{D}) where {D} = signed_distance(ic, pos) \u003c 0 ? ic.uL : ic.uR\n\nfunction build_ic(::Val{:riemann}, conf::Dict, ctx::Dict)\n    T, D, M = ctx[:T]::DataType, ctx[:D]::Int, ctx[:M]::Int\n    \n    uL = State{M, T}(Tuple(T.(conf[:uL])))\n    uR = State{M, T}(Tuple(T.(conf[:uR])))\n    p0 = Space{D, T}(Tuple(T.(conf[:p0])))\n    \n    # Default normal points in +X direction if not provided\n    n_tup = get(conf, :n, ntuple(i -> i == 1 ? 1.0 : 0.0, D))\n    n = normalize(Space{D, T}(Tuple(T.(n_tup))))\n    \n    return Riemann(uL, uR, p0, n)\nend"},{"name":"sine.jl","path":"src/ICs/sine.jl","type":"file","files":1,"lines":38,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":38,"runs":[[1,38]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export Sine\n\n\"\"\"\n    Sine{D, M, T} \u003c: InitialCondition\n\nEvaluates a smooth, multi-dimensional periodic sinusoidal wave.\n\n# Fields\n- `a::State{M, T}`: The amplitude state of the wave.\n- `period::Space{D, T}`: The spatial periodicity along each axis.\n- `c_offset::State{M, T}`: The constant background offset state.\n\nThe physical state is `a * sin(2π * sum(pos ./ period)) + c_offset`. It is evaluated\nwith `sinpi`, which keeps the input precision (no promotion to `Float64` via `pi`)\nand is exact at integer multiples of the period.\n\"\"\"\nstruct Sine{D, M, T} \u003c: InitialCondition\n    a::State{M, T}\n    period::Space{D, T}\n    c_offset::State{M, T}\nend\n\nfunction Sine(a::State{M}, period::Space{D}, c_offset::State{M}) where {D, M}\n    T = promote_type(eltype(a), eltype(period), eltype(c_offset))\n    return Sine{D, M, T}(a, period, c_offset)\nend\n\n(ic::Sine)(pos::Space{D}) where {D} = ic.a * sinpi(2 * sum(pos ./ ic.period)) + ic.c_offset\n\nfunction build_ic(::Val{:sine}, conf::Dict, ctx::Dict)\n    T, D, M = ctx[:T]::DataType, ctx[:D]::Int, ctx[:M]::Int\n\n    a = State{M, T}(Tuple(T.(conf[:a])))\n    period = Space{D, T}(Tuple(T.(conf[:period])))\n    c_offset = State{M, T}(Tuple(T.(conf[:c_offset])))\n\n    return Sine(a, period, c_offset)\nend\n"},{"name":"smoothed_riemann.jl","path":"src/ICs/smoothed_riemann.jl","type":"file","files":1,"lines":47,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":47,"runs":[[1,47]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export SRiemann\n\n\"\"\"\n    SRiemann{D, M, T} \u003c: InitialCondition\n\nSmoothed, continuous approximation of a standard Riemann problem that avoids infinite initial gradients at the interface.\n\n# Fields\n- `uL::State{M, T}`: The asymptotic physical state on the \"left\".\n- `uR::State{M, T}`: The asymptotic physical state on the \"right\".\n- `p0::Space{D, T}`: A point located on the central interface.\n- `n::Space{D, T}`: The normal vector pointing toward the right state.\n- `width::T`: Controls the steepness of the transition.\n\nUses an arctangent to blend smoothly between `uL` and `uR` over the given `width`.\nAll fields are converted to the precision `T` of `uL`.\n\"\"\"\nstruct SRiemann{D, M, T} \u003c: InitialCondition\n    uL::State{M, T}\n    uR::State{M, T}\n    p0::Space{D, T}\n    n::Space{D, T}\n    width::T\nend\n\n# Mixed-precision convenience constructor (the default one requires matching T everywhere)\nSRiemann(uL::State{M, T}, uR::State{M}, p0::Space{D}, n::Space{D}, width::Real) where {D, M, T} =\n    SRiemann{D, M, T}(uL, uR, p0, n, width)\n\nfunction (ic::SRiemann{D, M, T})(pos::Space{D}) where {D, M, T}\n    dist = dot(pos - ic.p0, ic.n)\n    return (ic.uL + ic.uR) / 2 - (ic.uL - ic.uR) * (atan(dist / ic.width) / T(π))\nend\n\nfunction build_ic(::Val{:s_riemann}, conf::Dict, ctx::Dict)\n    T, D, M = ctx[:T]::DataType, ctx[:D]::Int, ctx[:M]::Int\n\n    uL = State{M, T}(Tuple(T.(conf[:uL])))\n    uR = State{M, T}(Tuple(T.(conf[:uR])))\n    p0 = Space{D, T}(Tuple(T.(conf[:p0])))\n    width = T(conf[:width])\n\n    n_tup = get(conf, :n, ntuple(i -> i == 1 ? 1.0 : 0.0, D))\n    n = normalize(Space{D, T}(Tuple(T.(n_tup))))\n\n    return SRiemann(uL, uR, p0, n, width)\nend\n"}]},{"name":"PDEs","path":"src/PDEs","type":"dir","files":5,"lines":1061,"counts":{"AI-Generation":{"files":{"G2":0.0970464135021097,"G3":4.90295358649789},"lines":{"G2":23,"G3":1038}},"Human-Review":{"files":{"H0":4.90295358649789,"H1":0.0970464135021097},"lines":{"H0":1038,"H1":23}},"AI-Review":{"files":{"A1":5.0},"lines":{"A1":1061}}},"errors":0,"children":[{"name":"_main.jl","path":"src/PDEs/_main.jl","type":"file","files":1,"lines":32,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":32}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":32}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":32}}},"parts":[{"lines":27,"runs":[[1,16],[20,25],[28,32]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":5,"runs":[[17,19],[26,27]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export EquationRepresentation, NCRepresentation, Conservative, analytical_solution\n\n\"\"\"\n    EquationRepresentation\n\nAbstract base type for categorizing the mathematical formulation of a PDE system.\n\n# Subtypes\n- `Conservative`: Concrete type indicating the system evaluates standard conservative fluxes and eigenvalues.\n- `NCRepresentation`: Abstract type for non-conservative evaluations (e.g., primitive or Lagrangian representations).\n\"\"\"\nabstract type EquationRepresentation end\nabstract type NCRepresentation \u003c: EquationRepresentation end\nstruct Conservative \u003c: EquationRepresentation end\n\n# --- Representation Parsing ---\n# Only the conservative form is implemented. `NCRepresentation` is the extension point for non-conservative\n# (e.g. primitive or Lagrangian) forms, but no such representation exists yet, so `:primitive` and\n# `:lagrangian` are rejected like any other unknown name.\nfunction parse_representation(pde_conf::Dict)\n    rep_sym = get(pde_conf, :representation, :conservative)::Symbol\n    return _parse_representation(Val(rep_sym), pde_conf)\nend\n\n_parse_representation(::Val{:conservative}, pde_conf::Dict) = Conservative()\n_parse_representation(::Val{R}, pde_conf::Dict) where {R} = throw(ArgumentError(\n    \"PDE representation :$R is not supported; only :conservative is implemented\"))\n\ninclude(\"burgers.jl\")\ninclude(\"linear_advection.jl\")\ninclude(\"euler.jl\")\ninclude(\"bgk.jl\")"},{"name":"bgk.jl","path":"src/PDEs/bgk.jl","type":"file","files":1,"lines":460,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":460}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":460}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":460}}},"parts":[{"lines":445,"runs":[[1,19],[21,21],[24,52],[64,164],[166,460]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":15,"runs":[[20,20],[22,23],[53,63],[165,165]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export BGKEquation, RelaxationTimeModel, ConstantRelaxationTime, ViscosityRelaxationTime\nexport velocity_grid, num_velocities, velocity_node, moments, equilibrium, relaxation_time, euler_limit\n\n# =========================================================================\n# RELAXATION TIME MODELS\n# =========================================================================\n\n\"\"\"\n    RelaxationTimeModel\n\nRelaxation time `τ(ρ, θ)` of the BGK collision operator `(M[f] - f) / τ`, evaluated from the\nmacroscopic density `ρ` and temperature `θ = p / ρ` of a particle. Subtypes implement\n`relaxation_time(model, ρ, θ)`; it runs inside kernels.\n\"\"\"\nabstract type RelaxationTimeModel end\n\n\"\"\"\n    ConstantRelaxationTime(tau)\n\nConstant relaxation time `τ ≥ 0` (the Knudsen number of the non-dimensional BGK equation). `τ = Inf` is the\ncollisionless (free transport) limit: the runners drop the collision term and `analytic_closure` returns\nthe exact solution of the discrete-velocity model. `τ = 0` projects onto the equilibrium in every implicit\nstage (IMEX tableaus only); `BGKEquation` rejects `τ \u003c 0`.\n\"\"\"\nstruct ConstantRelaxationTime{T} \u003c: RelaxationTimeModel\n    tau::T\nend\n\n\"\"\"\n    ViscosityRelaxationTime(mu_ref, omega)\n\n`τ = μ(θ) / p` with the power-law viscosity `μ = mu_ref θ^ω` (the Chapman–Enskog viscosity of the BGK\nmodel is `τ p`), i.e. `τ = mu_ref θ^(ω - 1) / ρ`. `ω = 1/2` are hard spheres, `ω = 1` Maxwell molecules.\n\"\"\"\nstruct ViscosityRelaxationTime{T} \u003c: RelaxationTimeModel\n    mu_ref::T\n    omega::T\nend\n\n\"\"\"\n    relaxation_time(model::RelaxationTimeModel, ρ, θ)\n    relaxation_time(eq::BGKEquation, U::State)\n\nRelaxation time of the BGK collision term for density `ρ` and temperature `θ`, or for the macroscopic\nstate `U = (ρ, ρu..., E)` of the equation.\n\"\"\"\n@inline relaxation_time(m::ConstantRelaxationTime, ρ, θ) = m.tau\n@inline relaxation_time(m::ViscosityRelaxationTime{T}, ρ, θ) where {T} = m.mu_ref * θ^(m.omega - one(T)) / ρ\n\n_is_collisionless(m::ConstantRelaxationTime) = isinf(m.tau)\n_is_collisionless(::RelaxationTimeModel) = false\n\n_is_zero_relaxation(m::ConstantRelaxationTime) = iszero(m.tau)\n_is_zero_relaxation(m::ViscosityRelaxationTime) = iszero(m.mu_ref)\n_is_zero_relaxation(::RelaxationTimeModel) = false\n\n# τ \u003c 0 (or NaN) has no meaning; τ = 0 is the Euler limit (implicit collision only), τ = Inf collisionless.\n_check_relaxation(m::ConstantRelaxationTime) = m.tau >= 0 ||\n    throw(ArgumentError(\"BGK: the relaxation time τ must be ≥ 0 (Inf is collisionless), got τ = $(m.tau)\"))\n_check_relaxation(m::ViscosityRelaxationTime) = m.mu_ref >= 0 ||\n    throw(ArgumentError(\"BGK: the reference viscosity must be ≥ 0, got mu_ref = $(m.mu_ref)\"))\n_check_relaxation(::RelaxationTimeModel) = true\n\n_convert_relaxation(::Type{T}, m::ConstantRelaxationTime) where {T} = ConstantRelaxationTime{T}(T(m.tau))\n_convert_relaxation(::Type{T}, m::ViscosityRelaxationTime) where {T} = ViscosityRelaxationTime{T}(T(m.mu_ref), T(m.omega))\n\n# =========================================================================\n# VELOCITY GRIDS\n# =========================================================================\n\n\"\"\"\n    velocity_grid(kind::Symbol, Nv::Int, vmax::Real, ::Type{T} = Float64) -> (nodes, weights)\n\nOne-dimensional velocity nodes and quadrature weights (`SVector{Nv, T}` each) of a discrete-velocity\nmodel; the BGK equation uses their tensor product in every spatial direction.\n\n- `:uniform`: midpoint rule on `[-vmax, vmax]`, `v_j = -vmax + (j - 1/2) Δv`, weights `Δv = 2 vmax / Nv`.\n  Spectrally accurate for Maxwellians that decay inside the interval; the robust choice for strongly\n  non-equilibrium flows.\n- `:gauss_hermite`: Gauss–Hermite nodes scaled so that the outermost node is `±vmax`, with the weights\n  `w_j e^{x_j^2}` that integrate `f` itself. Exact for polynomials times the Gaussian of that scale, so\n  near-equilibrium flows need far fewer nodes (the conservative equilibrium keeps the moments exact\n  either way). Weights come from the Christoffel function of the Hermite functions (stable for large `Nv`).\n\"\"\"\nfunction velocity_grid(kind::Symbol, Nv::Int, vmax::Real, ::Type{T} = Float64) where {T}\n    Nv >= 2 || throw(ArgumentError(\"a velocity grid needs at least 2 nodes, got Nv = $Nv\"))\n    vmax > 0 || throw(ArgumentError(\"vmax must be positive, got $vmax\"))\n    V = Float64(vmax)\n    if kind === :uniform\n        dv = 2V / Nv\n        nodes = [-V + (j - 0.5) * dv for j in 1:Nv]\n        weights = fill(dv, Nv)\n    elseif kind === :gauss_hermite\n        x = eigvals(SymTridiagonal(zeros(Nv), [sqrt(j / 2) for j in 1:(Nv - 1)]))\n        # w_j e^{x_j^2} = 1 / Σ_k φ_k(x_j)^2 with the orthonormal Hermite functions φ_k (no over- or underflow)\n        W = map(x) do xj\n            φ_prev, φ = 0.0, π^(-0.25) * exp(-xj^2 / 2)\n            s = φ^2\n            for k in 1:(Nv - 1)\n                φ_prev, φ = φ, sqrt(2 / k) * xj * φ - sqrt((k - 1) / k) * φ_prev\n                s += φ^2\n            end\n            1 / s\n        end\n        scale = V / maximum(abs, x)\n        nodes = scale .* x\n        weights = scale .* W\n    else\n        throw(ArgumentError(\"unknown velocity grid :$kind (use :uniform or :gauss_hermite)\"))\n    end\n    return SVector{Nv, T}(T.(nodes)), SVector{Nv, T}(T.(weights))\nend\n\n# =========================================================================\n# THE EQUATION\n# =========================================================================\n\n\"\"\"\n    BGKEquation{D, M, T, NV1, NV, R} \u003c: HyperbolicPDE{D, M, T}\n    BGKEquation(::Val{D}, nodes, weights, gamma, relaxation; center = 0)\n\nDiscrete-velocity model of the BGK equation `∂_t f + v·∇f = (M[f] - f) / τ` in `D` space dimensions. The\nvelocity space is the tensor product of the 1-D `nodes` (with quadrature `weights`, see\n[`velocity_grid`](@ref)) in every direction, shifted by `center`: `NV = NV1^D` discrete velocities.\n\nThe state of a particle is the vector of distribution values at the nodes, so the number of equations is\nthe number of velocities. Degrees of freedom beyond the `D` resolved velocity directions (the remaining\nvelocity directions of a 3-D gas and internal ones, `K = 2 / (γ - 1) - D` in total) are carried by a\nsecond distribution `h` (a Chu reduction, `h = ∫ |ξ|²/2 f dξ` over the unresolved directions): for\n`K = 0` (`γ = (D + 2) / D`) the state is `f` (`M = NV`), otherwise `(f, h)` (`M = 2 NV`). Any `γ` thus\nneeds only a `D`-dimensional velocity grid.\n\nThe macroscopic state is `U = (ρ, ρu..., E) = Σ_k w_k (1, v_k, |v_k|²/2) f_k + (0, 0, h_k)` (see\n[`moments`](@ref)), the conservative variables of the Euler equations with the same `γ`\n([`euler_limit`](@ref)), which the BGK solution approaches for `τ → 0`. The collision term relaxes\ntowards the conservative discrete Maxwellian of [`equilibrium`](@ref) (source terms `BGKRelaxation`,\n`ExplicitBGKRelaxation`) with the relaxation time of `relaxation` (a [`RelaxationTimeModel`](@ref)).\n\nThe transport is linear and diagonal (velocity `k` moves with `v_k`): the flux is `v_{k,d} f_k`, the\nRusanov and Upwind fluxes reduce to exact upwinding per velocity (dissipation `|v_{k,d}|` instead of the\nlargest speed for every component), and `max_eigenvalue` is the largest node speed. The equation object\nis a small bits type (nodes, weights, center, `K`, `γ`, the relaxation model); node indices are resolved\nat compile time, so there are no per-velocity arrays in the kernels.\n\"\"\"\nstruct BGKEquation{D, M, T, NV1, NV, R \u003c: RelaxationTimeModel} \u003c: HyperbolicPDE{D, M, T}\n    nodes::SVector{NV1, T}\n    weights::SVector{NV1, T}\n    center::SVector{D, T}\n    max_speed::SVector{D, T}\n    K::T\n    gamma::T\n    relaxation::R\nend\n\nfunction BGKEquation(::Val{D}, nodes::SVector{NV1, T}, weights::SVector{NV1, T}, gamma::Real,\n                     relaxation::RelaxationTimeModel; center = ntuple(_ -> 0, D)) where {D, NV1, T}\n    K = 2 / (Float64(gamma) - 1) - D\n    abs(K) \u003c= 1e-8 && (K = 0.0)\n    K >= 0 || throw(ArgumentError(\"γ = $gamma is too large for D = $D (BGK needs γ ≤ (D + 2) / D = $((D + 2) / D))\"))\n    NV = NV1^D\n    M  = iszero(K) ? NV : 2NV\n    c  = SVector{D, T}(ntuple(d -> T(center[d]), Val(D)))\n    smax = SVector{D, T}(ntuple(d -> maximum(abs, c[d] .+ nodes), Val(D)))\n    rel = _convert_relaxation(T, relaxation)\n    _check_relaxation(rel)\n    return BGKEquation{D, M, T, NV1, NV, typeof(rel)}(nodes, weights, c, smax, T(K), T((D + K + 2) / (D + K)), rel)\nend\n\n\"\"\"\n    num_velocities(eq::BGKEquation) -> Int\n\nNumber of discrete velocities `NV = NV1^D` (the number of equations is `NV`, or `2 NV` with internal\ndegrees of freedom).\n\"\"\"\nnum_velocities(::BGKEquation{D, M, T, NV1, NV}) where {D, M, T, NV1, NV} = NV\n\n@inline _has_h(::BGKEquation{D, M, T, NV1, NV}) where {D, M, T, NV1, NV} = M != NV\n\n# 1-D node index along `d` of state component `k` (the `h` components share the nodes of `f`), the first\n# axis running fastest.\n_node_index(NV1::Int, NV::Int, k::Int, d::Int) = ((k - 1) % NV) ÷ NV1^(d - 1) % NV1 + 1\n\n# The node indices of all components as a compile-time constant (a literal tuple): the index arithmetic\n# never runs in the kernels, a runtime `k` is a table load and a constant one folds away.\n@generated function _node_table(::BGKEquation{D, M, T, NV1, NV}) where {D, M, T, NV1, NV}\n    table = ntuple(k -> ntuple(d -> _node_index(NV1, NV, k, d), D), M)\n    return :($table)\nend\n@inline _node_index(eq::BGKEquation, k::Int, d::Int) = @inbounds _node_table(eq)[k][d]\n\n@inline _velocity_component(eq::BGKEquation, k::Int, d::Int) = @inbounds eq.center[d] + eq.nodes[_node_index(eq, k, d)]\n\n\"\"\"\n    velocity_node(eq::BGKEquation, k::Int) -> (v::Space{D, T}, w::T)\n\nVelocity and quadrature weight of state component `k` (components `NV + 1 … 2 NV` of `h` share the\nnodes of `f`).\n\"\"\"\n@inline function velocity_node(eq::BGKEquation{D, M, T}, k::Int) where {D, M, T}\n    v = Space{D, T}(ntuple(d -> _velocity_component(eq, k, d), Val(D)))\n    w = prod(ntuple(d -> (@inbounds eq.weights[_node_index(eq, k, d)]), Val(D)))\n    return v, w\nend\n\n# Velocities of all state components along axis `d`, unrolled with literal node indices.\n@generated function _component_speeds(eq::BGKEquation{D, M, T, NV1, NV}, ::Val{d}) where {D, M, T, NV1, NV, d}\n    terms = [:(eq.center[$d] + eq.nodes[$(_node_index(NV1, NV, k, d))]) for k in 1:M]\n    return :(@inbounds State{$M, $T}(($(terms...),)))\nend\n\n# `Flux{D, M, T}((g(speeds_1), …, g(speeds_D)))` with the speeds of every axis (`g(speeds, d)`), unrolled over D.\n@generated function _per_axis(g::G, eq::BGKEquation{D, M, T}) where {G, D, M, T}\n    terms = [:(g(_component_speeds(eq, Val($d)), $d)) for d in 1:D]\n    return :(Flux{$D, $M, $T}(($(terms...),)))\nend\n\n# =========================================================================\n# MOMENTS AND EQUILIBRIUM\n# =========================================================================\n\n\"\"\"\n    moments(eq::BGKEquation, f::State) -> State{D + 2}\n\nMacroscopic conservative state `(ρ, ρu..., E)` of the distribution `f` by quadrature over the velocity\ngrid (`E` includes the energy `Σ w_k h_k` of the unresolved degrees of freedom).\n\"\"\"\n@inline function moments(eq::BGKEquation{D, M, T, NV1, NV}, f::State{M, T}) where {D, M, T, NV1, NV}\n    m = zero(SVector{D + 2, T})\n    @inbounds for k in 1:NV\n        v, w = velocity_node(eq, k)\n        fk = f[k]\n        e  = T(0.5) * sum(abs2, v) * fk\n        _has_h(eq) && (e += f[k + NV])\n        m += w * SVector{D + 2, T}(fk, (fk * v)..., e)\n    end\n    return m\nend\n\n# Density, velocity and temperature θ = p / ρ of a macroscopic state.\n@inline function _primitives(eq::BGKEquation{D, M, T}, U::SVector{P, T}) where {D, M, T, P}\n    ρ = U[1]\n    u = Space{D, T}(ntuple(d -> U[1 + d], Val(D))) / ρ\n    θ = T(2) * (U[P] - T(0.5) * ρ * sum(abs2, u)) / ((T(D) + eq.K) * ρ)\n    return ρ, u, θ\nend\n\n@inline function relaxation_time(eq::BGKEquation{D, M, T}, U::SVector{P, T}) where {D, M, T, P}\n    ρ, _, θ = _primitives(eq, U)\n    return relaxation_time(eq.relaxation, ρ, θ)\nend\n\n# The conservative discrete Maxwellian is f_k = exp(α·ψ_k) (2π θ̂)^(K/2), h_k = (K/2) θ̂ f_k with\n# ψ_k = (1, v_k, |v_k|²/2) and θ̂ = -1/α_E. Its moments are the gradient of the convex dual potential\n# Φ(α) = Σ_k w_k exp(α·ψ_k) (2π θ̂)^(K/2), so the Newton matrix (the Hessian of Φ) is symmetric positive\n# definite. Returns the moments m(α), the Hessian J(α) and the moment scale.\n@inline function _equilibrium_system(eq::BGKEquation{D, M, T, NV1, NV}, α::SVector{P, T}) where {D, M, T, NV1, NV, P}\n    θh = -one(T) / α[P]\n    c  = T(0.5) * eq.K\n    lognorm = c * log(T(2π) * θh)\n    S0 = zero(T)\n    S1 = zero(SVector{P, T})\n    S2 = zero(SMatrix{P, P, T})\n    @inbounds for k in 1:NV\n        v, w = velocity_node(eq, k)\n        ψ  = SVector{P, T}(one(T), v..., T(0.5) * sum(abs2, v))\n        G  = w * exp(dot(α, ψ) + lognorm)\n        S0 += G\n        S1 += G * ψ\n        S2 += G * (ψ * ψ')\n    end\n    _has_h(eq) || return S1, S2\n    eP = SVector{P, T}(ntuple(i -> i == P ? one(T) : zero(T), Val(P)))\n    m  = S1 + (c * θh * S0) * eP\n    J  = S2 + (c * θh) * (S1 * eP' + eP * S1') + ((c^2 + c) * θh^2 * S0) * (eP * eP')\n    return m, J\nend\n\n# Cholesky solve of a small SPD system without allocation (kernel safe); `false` if not positive definite.\n@inline function _spd_solve(A::SMatrix{P, P, T}, b::SVector{P, T}) where {P, T}\n    L = zero(SMatrix{P, P, T})\n    @inbounds for j in 1:P\n        s = A[j, j]\n        for k in 1:(j - 1)\n            s -= L[j, k]^2\n        end\n        s > zero(T) || return b, false\n        ljj = sqrt(s)\n        L = setindex(L, ljj, j, j)\n        for i in (j + 1):P\n            t = A[i, j]\n            for k in 1:(j - 1)\n                t -= L[i, k] * L[j, k]\n            end\n            L = setindex(L, t / ljj, i, j)\n        end\n    end\n    y = zero(SVector{P, T})\n    @inbounds for i in 1:P\n        t = b[i]\n        for k in 1:(i - 1)\n            t -= L[i, k] * y[k]\n        end\n        y = setindex(y, t / L[i, i], i)\n    end\n    x = zero(SVector{P, T})\n    @inbounds for i in P:-1:1\n        t = y[i]\n        for k in (i + 1):P\n            t -= L[k, i] * x[k]\n        end\n        x = setindex(x, t / L[i, i], i)\n    end\n    return x, true\nend\n\n# Moment residual relative to the natural scale of each component (mass ρ, momentum ρ(|u| + √θ), energy E).\n@inline function _scaled_residual(r::SVector{P, T}, scale::SVector{P, T}) where {P, T}\n    return maximum(abs.(r) ./ scale)\nend\n\nconst _BGK_NEWTON_ITERATIONS = 12\nconst _BGK_LINE_SEARCH_STEPS = 6\n\n\"\"\"\n    equilibrium(eq::BGKEquation, U::State{D + 2}) -> (f_eq::State{M}, ok::Bool)\n\nConservative discrete Maxwellian of the macroscopic state `U = (ρ, ρu..., E)`: the discrete entropic\nequilibrium `f_k = exp(α·ψ_k)` (Mieussens), whose discrete moments reproduce `U` to round-off on the\nvelocity grid, so the collision term conserves mass, momentum and energy exactly. `α` is found by a\ndamped Newton iteration on the convex dual problem, started from the continuous Maxwellian (on a grid\nthat resolves the Maxwellian that start is already accurate to the quadrature error, so one or two\niterations suffice). With internal degrees of freedom `h_k = (K/2) θ̂ f_k`.\n\n`ok` is `false` for a non-physical `U` (non-finite, `ρ ≤ 0` or `θ ≤ 0`); `f_eq` is meaningless then.\nIf the grid cannot represent `U` (e.g. a mean velocity near `vmax`), the iteration stops at the closest\nequilibrium it reaches. Allocation free, runs inside kernels.\n\"\"\"\nfunction equilibrium(eq::BGKEquation{D, M, T, NV1, NV}, U::SVector{P, T}) where {D, M, T, NV1, NV, P}\n    ρ, u, θ = _primitives(eq, U)\n    (isfinite(ρ) && isfinite(θ) && all(isfinite, u) && ρ > zero(T) && θ > zero(T)) || return zero(State{M, T}), false\n\n    # Start: the continuous Maxwellian ρ (2πθ)^(-(D+K)/2) exp(-|v - u|²/(2θ)) in the exponential form\n    α = SVector{P, T}(log(ρ) - T(0.5) * (T(D) + eq.K) * log(T(2π) * θ) - T(0.5) * sum(abs2, u) / θ,\n                      (u / θ)..., -one(T) / θ)\n    vscale = sqrt(sum(abs2, u)) + sqrt(θ)\n    scale  = SVector{P, T}(ρ, ntuple(_ -> ρ * vscale, Val(D))..., U[P])\n    tol    = T(16) * eps(T)\n\n    m, J = _equilibrium_system(eq, α)\n    res  = _scaled_residual(m - U, scale)\n    for _ in 1:_BGK_NEWTON_ITERATIONS\n        res \u003c= tol && break\n        Δ, spd = _spd_solve(J, m - U)\n        spd || break\n        step = one(T)\n        accepted = false\n        for _ in 1:_BGK_LINE_SEARCH_STEPS\n            αn = α - step * Δ\n            if all(isfinite, αn) && αn[P] \u003c zero(T)\n                mn, Jn = _equilibrium_system(eq, αn)\n                resn = _scaled_residual(mn - U, scale)\n                if resn \u003c res\n                    α, m, J, res = αn, mn, Jn, resn\n                    accepted = true\n                    break\n                end\n            end\n            step *= T(0.5)\n        end\n        accepted || break        # round-off floor (or an unrepresentable state): keep the best iterate\n    end\n    return _equilibrium_state(eq, α), true\nend\n\n@inline function _equilibrium_state(eq::BGKEquation{D, M, T, NV1, NV}, α::SVector{P, T}) where {D, M, T, NV1, NV, P}\n    θh = -one(T) / α[P]\n    c  = T(0.5) * eq.K\n    lognorm = c * log(T(2π) * θh)\n    return State{M, T}(ntuple(Val(M)) do k\n        v, _ = velocity_node(eq, k)\n        G = exp(dot(α, SVector{P, T}(one(T), v..., T(0.5) * sum(abs2, v))) + lognorm)\n        k > NV ? c * θh * G : G\n    end)\nend\n\n\"\"\"\n    euler_limit(eq::BGKEquation) -> EulerEquation\n\nThe compressible Euler equations (conservative variables) with the ratio of specific heats of the BGK\nmodel, which its moments approach for `τ → 0`: the reference for small relaxation times.\n\"\"\"\neuler_limit(eq::BGKEquation{D, M, T}) where {D, M, T} = EulerEquation(Val(D), T, eq.gamma, Conservative())\n\n# =========================================================================\n# HYPERCLOUDCORE API\n# =========================================================================\n\n@inline flux(eq::BGKEquation{D, M, T}, U::State{M, T}) where {D, M, T} = _per_axis((v, d) -> v .* U, eq)\n\n@inline max_eigenvalue(eq::BGKEquation, U::State, d::Int) = @inbounds eq.max_speed[d]\n\n\"Admissible BGK state (MOOD PAD): finite, with positive density and temperature (individual `f_k` may dip below zero).\"\n@inline function is_admissible(eq::BGKEquation{D, M, T}, U::State{M, T}) where {D, M, T}\n    all(isfinite, U) || return false\n    ρ, _, θ = _primitives(eq, moments(eq, U))\n    return ρ > zero(T) && θ > zero(T)\nend\n\n@inline fluid_velocity(eq::BGKEquation{D, M, T}, U::State{M, T}) where {D, M, T} = _primitives(eq, moments(eq, U))[2]\n\n# The transport is diagonal, so the Rusanov flux of every velocity is its exact upwind flux: dissipation\n# |v_{k,d}| per component, not the largest node speed for all of them (which smears the slow velocities and\n# dominates the error near equilibrium). `UpwindFlux` and `AlignedRusanovFlux` fall back to this method.\n@inline function (::RusanovFlux)(f_L::Flux{D, M, T}, f_R::Flux{D, M, T}, F_L::Flux{D, M, T}, F_R::Flux{D, M, T},\n                                 eq::BGKEquation{D, M, T}) where {D, M, T}\n    return _per_axis(eq) do v, d\n        T(0.5) * (F_L[d] + F_R[d] - abs.(v) .* (f_R[d] - f_L[d]))\n    end\nend\n\n# =========================================================================\n# ANALYTIC CLOSURE (collisionless limit)\n# =========================================================================\n\n\"\"\"\n    analytic_closure(eq::BGKEquation, ic::InitialCondition, geom::GeometricDomain)\n\nFor the collisionless model (`ConstantRelaxationTime(Inf)`) the exact solution of the discrete-velocity\nequation: every velocity is transported, `f_k(x, t) = f_k^0(x - v_k t)` with the equilibrium initial data\nof `ic` (wrapped on periodic axes), and the closure returns its moments `(ρ, ρu..., E)` like the BGK\nrunner. Finite relaxation times have no closed-form solution (warns, returns `nothing`); compare with the\nEuler limit `analytic_closure(euler_limit(eq), ic, geom)` for small `τ` instead.\n\"\"\"\nfunction analytic_closure(eq::BGKEquation{D, M, T, NV1, NV}, ic::InitialCondition, geom::GeometricDomain) where {D, M, T, NV1, NV}\n    if !_is_collisionless(eq.relaxation)\n        @warn \"No Analytical Solution implemented for the BGK equation with a finite relaxation time; \" *\n              \"compare with analytic_closure(euler_limit(eq), ic, geom) for small τ.\"\n        return nothing\n    end\n    mins, maxs, is_per = geom.mins, geom.maxs, geom.is_periodic\n\n    return function exact_free_transport(st::SVector)\n        t   = T(st[end])\n        pos = Space{D, T}(ntuple(d -> T(st[d]), Val(D)))\n        U   = zero(SVector{D + 2, T})\n        for k in 1:NV\n            v, w = velocity_node(eq, k)\n            x0 = pos - v * t\n            x0 = Space{D, T}(ntuple(Val(D)) do d\n                is_per[d] ? T(mins[d] + mod(x0[d] - mins[d], maxs[d] - mins[d])) : x0[d]\n            end)\n            f0, ok = equilibrium(eq, SVector{D + 2, T}(ic(x0)))\n            ok || error(\"initial state at $x0 is not admissible for the BGK equation\")\n            e = T(0.5) * sum(abs2, v) * f0[k]\n            _has_h(eq) && (e += f0[k + NV])\n            U += w * SVector{D + 2, T}(f0[k], (f0[k] * v)..., e)\n        end\n        return U\n    end\nend\n"},{"name":"burgers.jl","path":"src/PDEs/burgers.jl","type":"file","files":1,"lines":189,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":189}},"Human-Review":{"files":{"H0":1.0},"lines":{"H0":189}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":189}}},"parts":[{"lines":159,"runs":[[1,40],[47,47],[49,49],[57,63],[68,68],[73,79],[81,81],[83,84],[86,86],[88,92],[97,189]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":30,"runs":[[41,46],[48,48],[50,56],[64,67],[69,72],[80,80],[82,82],[85,85],[87,87],[93,96]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export BurgersEquation\n\n\"\"\"\n    BurgersEquation{D, T} \u003c: HyperbolicPDE{D, 1, T}\n\nImplements the multi-dimensional inviscid Burgers' equation. \nThe system mathematically enforces a strictly scalar state vector (`M = 1`) across any spatial dimension `D`.\n\"\"\"\nstruct BurgersEquation{D, T} \u003c: HyperbolicPDE{D, 1, T} end\n\n@inline prim2cons(::BurgersEquation, u::State) = u\n@inline cons2prim(::BurgersEquation, w::State) = w\n\n@inline function flux(eq::BurgersEquation{D, T}, u::State{1, T}) where {D, T}\n    return Flux{D, 1, T}(ntuple(_ -> State{1, T}(T(0.5) * u[1]^2), Val(D)))\nend\n\n@inline function max_eigenvalue(eq::BurgersEquation, u::State{1, T}, d::Int) where {T}\n    return abs(u[1])\nend\n\n# Returns the localized Jacobian (u) as a strict 1x1 SMatrix\n@inline velocity(eq::BurgersEquation, u::State{1, T}, d::Int) where {T} = SMatrix{1, 1, T, 1}(u[1])\n\n# Moving grids: transport velocity (u in every direction) and exact relative wave speed\n@inline fluid_velocity(eq::BurgersEquation{D, T}, u::State{1, T}) where {D, T} = Space{D, T}(ntuple(_ -> u[1], Val(D)))\n@inline max_eigenvalue(eq::BurgersEquation, u::State{1, T}, d::Int, shift::Real) where {T} = abs(u[1] - T(shift))\n\n# =========================================================================\n# BURGERS ANALYTIC CLOSURES\n# =========================================================================\n\n# Fallback for ICs without an exact solution: returns the initial condition, which is only\n# correct at t = 0. Warn once at construction so a wrong reference is never silent.\nfunction analytic_closure(eq::BurgersEquation{D, T}, ic::InitialCondition, geom::GeometricDomain) where {D, T}\n    @warn \"No exact Burgers solution for $(nameof(typeof(ic))) in $(D)D; the reference returns the initial condition and is only valid at t = 0.\"\n    return (st::SVector) -> ic(SVector{D, T}(ntuple(d -> T(st[d]), Val(D))))\nend\n\n# Multi-Dimensional Gauss (Newton-Raphson Characteristic Trace)\n#\n# The pulse u₀ = a exp(-|x - b|² / w²) is transported along (1, …, 1), so u solves u = u₀(x - u t (1, …, 1)).\n# This has a unique smooth solution only before the breaking time t_b = w e^{1/2} / (|a| √(2D)), where\n# 1 + t min (1, …, 1)⋅∇u₀ first vanishes. Past t_b the relation has several roots, none of which is the entropy\n# (shock) solution, so the closure warns (once) instead of returning a wrong reference silently. The safeguarded\n# Newton iteration stops on a relative tolerance: an absolute one is not reachable in Float32.\nfunction analytic_closure(eq::BurgersEquation{D, T}, ic::Gauss, geom::GeometricDomain) where {D, T}\n    tol = 4 * eps(T)\n    max_iter = 100\n    a = T(ic.a[1])\n    b = SVector{D, T}(ic.b)\n    w = T(ic.width)\n    w2 = w^2\n    t_break = iszero(a) ? T(Inf) : w * exp(T(0.5)) / (abs(a) * sqrt(T(2 * D)))\n    warned_break = Threads.Atomic{Bool}(false)\n    warned_newton = Threads.Atomic{Bool}(false)\n\n    return function exact_burgers_gauss(st::SVector)\n        t = T(st[end])\n        pos = SVector{D, T}(ntuple(d -> T(st[d]), Val(D)))\n        \n        if t \u003c= T(1e-12); return ic(pos); end\n\n        if t > t_break && !Threads.atomic_xchg!(warned_break, true)\n            @warn \"Burgers Gauss reference evaluated at t = $t, past the breaking time t_b = $t_break: the \" *\n                  \"characteristic solution is multivalued there and is not the entropy (shock) solution.\"\n        end\n        \n        # F(u) = u - u₀(x - u t) changes sign on [min(0, a), max(0, a)] (u₀ takes its values there) and is\n        # increasing before breaking, so Newton steps that leave the bracket fall back to bisection.\n        lo, hi = min(zero(T), a), max(zero(T), a)\n        u_curr = T(ic(pos)[1])\n        \n        for _ in 1:max_iter\n            x0 = pos .- u_curr .* t\n            dist2 = sum(abs2, x0 .- b)\n            exp_term = exp(-dist2 / w2)\n            \n            F = u_curr - a * exp_term\n            F \u003c zero(T) ? (lo = u_curr) : (hi = u_curr)\n            sum_diff = sum(x0 .- b)\n            dFdu = one(T) - (a * exp_term) * (T(2) * t * sum_diff / w2)\n            \n            u_next = u_curr - F / dFdu\n            (lo \u003c= u_next \u003c= hi && isfinite(u_next)) || (u_next = (lo + hi) / 2)\n            \n            if abs(u_next - u_curr) \u003c= tol * max(one(T), abs(u_next))\n                return SVector{1, T}(u_next)\n            end\n            u_curr = u_next\n        end\n        \n        if !Threads.atomic_xchg!(warned_newton, true)\n            @warn \"Newton-Raphson did not converge for the Burgers Gauss reference (first at pos = $pos, t = $t; \" *\n                  \"further failures of this reference are not reported).\"\n        end\n        return SVector{1, T}(u_curr)\n    end\nend\n\n# Planar Riemann problem in any dimension D.\n#\n# With ξ = (x - p0)⋅n and u = u(ξ, t), the equation u_t + Σ_d ∂_d(u²/2) = 0 becomes\n# u_t + a ∂_ξ(u²/2) = 0 with a = Σ_d n_d. The wave type therefore depends on the\n# characteristic speeds a·uL and a·uR, not on uL vs uR alone: flipping the sign of `n`\n# (and swapping uL/uR) describes the same data and must give the same solution.\n# `n` does not need to be normalized.\n#\n# For SRiemann this returns the sharp-interface Riemann solution (the t → 0 limit of the\n# smoothed data is ignored), which is a good reference once the fan/shock is wider than `width`.\nfunction analytic_closure(eq::BurgersEquation{D, T}, ic::Union{Riemann, SRiemann}, geom::GeometricDomain) where {D, T}\n    p0 = SVector{D, T}(ic.p0)\n    n  = SVector{D, T}(ic.n)\n    uL, uR = T(ic.uL[1]), T(ic.uR[1])\n\n    a = sum(n)\n    aL, aR = a * uL, a * uR      # characteristic speeds along ξ\n    s = a * (uL + uR) / 2        # shock speed along ξ\n\n    return function exact_burgers_riemann(st::SVector)\n        t = T(st[end])\n        pos = SVector{D, T}(ntuple(d -> T(st[d]), Val(D)))\n\n        if t \u003c= T(1e-12); return SVector{1, T}(ic(pos)); end\n\n        ξ = dot(pos - p0, n)\n        if aL > aR                         # converging characteristics ⇒ shock\n            return SVector{1, T}(ξ \u003c s * t ? uL : uR)\n        elseif ξ \u003c aL * t                  # left of the fan\n            return SVector{1, T}(uL)\n        elseif ξ > aR * t                  # right of the fan\n            return SVector{1, T}(uR)\n        elseif abs(a) \u003c T(1e-14)           # stationary interface (a = 0): same convention as the IC\n            return SVector{1, T}(uR)\n        else                               # inside the fan\n            return SVector{1, T}(ξ / (a * t))\n        end\n    end\nend\n\n# 1D Box\nfunction analytic_closure(eq::BurgersEquation{1, T}, ic::Box, geom::GeometricDomain) where {T}\n    xs, xe = ic.mins[1], ic.maxs[1]\n    ub, ug = ic.u_box[1], ic.u_bg[1]\n    \n    return function exact_burgers_box(st::SVector)\n        t = T(st[end])\n        x = T(st[1])\n        \n        if t \u003c= T(1e-12); return ic(SVector{1, T}(x)); end\n        if abs(ub - ug) \u003c T(1e-12); return ic.u_bg; end\n\n        if ub > ug # Top-hat case\n            t_int = T(2.0) * (xe - xs) / (ub - ug)\n            if t \u003c t_int\n                s_shock = T(0.5) * (ub + ug)\n                if x \u003c xs + ug * t; return ic.u_bg\n                elseif x \u003c xs + ub * t; return SVector{1, T}((x - xs) / t)\n                elseif x \u003c xe + s_shock * t; return ic.u_box\n                else return ic.u_bg\n                end\n            else\n                C = sqrt(T(2.0) * (xe - xs) * (ub - ug))\n                x_shock = xs + ug * t + C * sqrt(t)\n                if x \u003c xs + ug * t; return ic.u_bg\n                elseif x \u003c x_shock; return SVector{1, T}((x - xs) / t)\n                else return ic.u_bg\n                end\n            end\n        else # Well case\n            t_int = T(2.0) * (xe - xs) / (ug - ub)\n            if t \u003c t_int\n                s_shock = T(0.5) * (ug + ub)\n                if x \u003c xs + s_shock * t; return ic.u_bg\n                elseif x \u003c xe + ub * t; return ic.u_box\n                elseif x \u003c xe + ug * t; return SVector{1, T}((x - xe) / t)\n                else return ic.u_bg\n                end\n            else\n                C = sqrt(T(2.0) * (xe - xs) * (ug - ub))\n                x_shock = xe + ug * t - C * sqrt(t)\n                if x \u003c x_shock; return ic.u_bg\n                elseif x \u003c xe + ug * t; return SVector{1, T}((x - xe) / t)\n                else return ic.u_bg\n                end\n            end\n        end\n    end\nend\n"},{"name":"euler.jl","path":"src/PDEs/euler.jl","type":"file","files":1,"lines":237,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.0970464135021097,"G3":0.9029535864978904},"lines":{"G2":23,"G3":214}},"Human-Review":{"files":{"H0":0.9029535864978904,"H1":0.0970464135021097},"lines":{"H0":214,"H1":23}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":237}}},"parts":[{"lines":187,"runs":[[1,34],[40,40],[42,47],[49,77],[79,82],[84,89],[91,91],[93,100],[102,107],[109,109],[11
