G3","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# HyperCloud.jl\n\n**HyperCloud.jl** is a meshfree framework for hyperbolic conservation laws. It solves PDEs\non particle clouds with moving-least-squares (MLS) reconstructions: first-order upwind, MUSCL\nup to fifth order, and WENO. Slope limiters and a posteriori MOOD limiting keep shocks stable.\nA kinetic relaxation pipeline with IMEX time stepping approximates nonlinear systems by linear\ntransport plus a stiff source term.\n\nHyperCloud is part of the **PDEStudio** ecosystem:\n\n- [HyperCloudCore.jl](@extref HyperCloudCore HyperCloudCore:-A-Meshfree-Hyperbolic-Solver)\n  provides the numerical engine (particle grids, MLS schemes, MOOD, time steppers, boundary\n  conditions, GPU backends) and the [config-driven builders](@extref HyperCloudCore Config-Driven-Builders)\n  that HyperCloud's runners call. HyperCloud re-exports it.\n- `PDEStudioCore.jl` runs batches of simulations, caches results on disk under a hash of\n  their parameters, and computes error statistics.\n- `PDEStudio.jl` plots the results, either locally (`GLMakie`) or in the browser from a\n  headless machine (`WGLMakie` + Bonito).\n\n## A first simulation\n\nA simulation is a function returning a `SimulationConfig`: shared parameters, a dictionary of\nnumerical methods, and the methods to run.\n\n```julia\nusing HyperCloud\n\nfunction my_advection()\n    shared = Dict{Symbol, Any}(\n        :sim_func_name => :run_direct_simulation,\n        :tmax => 1.0, :snapshots => 20,\n\n        :PDE_name => :linear, :PDE_velocities => ((1.0,),),   # u_t + u_x = 0\n\n        :Grid_domain => :rectangular, :Grid_mins => (0.0,), :Grid_maxs => (1.0,),\n        :Grid_Ns => (200,), :Grid_periodic => true,\n        :Grid_randomness_factor => (0.2,), :Grid_seed => 42, :Grid_mover => :none,\n\n        :Weight_name => :exponential, :Weight_alpha => 1.0, :Weight_range => 5.5,\n\n        :IC_name => :gauss, :IC_a => (1.0,), :IC_b => (0.5,), :IC_width => 0.1,\n\n        :Time_CFL => 0.2,\n    )\n\n    methods = Dict{Symbol, Dict{Symbol, Any}}(\n        :analytical_solution => Dict{Symbol, Any}(),\n        :RK2MUSCL2 => last(create_method(:RK2, :MUSCL, 2)),\n        :RK4MUSCL4 => last(create_method(:RK4, :MUSCL, 4)),\n    )\n\n    return SimulationConfig(shared, methods, [:analytical_solution, :RK2MUSCL2, :RK4MUSCL4];\n                            ref_func_name = :analytical_solution)\nend\n\n@sim my_advection     # run and cache\n@plot my_advection    # open the interactive viewer (needs PDEStudio and a Makie backend)\n```\n\nEvery available key is listed in the [Configuration Reference](configuration.md).\n\n## Workflow\n\n1. **Configure.** Write a function returning a `SimulationConfig`, either in your script or as\n   `name.jl` in one of the `CONFIG_SEARCH_PATHS` folders (see [Execution Macros](macros.md)).\n2. **Run.** `@sim name` builds and runs every active method and caches the results.\n3. **Visualize.** `@plot name` loads the configuration into the PDEStudio GUI.\n4. **Archive.** `@backup name` copies the configuration file into a timestamped `backups` folder.\n\n## Package layout\n\n| Folder / file | Content |\n|:--------------|:--------|\n| `PDEs/` | Equation definitions (linear advection, Burgers, Euler) and their exact solutions. |\n| `SourceTerms/` | Source terms, currently the kinetic relaxation term. |\n| `ICs/` | Initial conditions: Gaussian pulse, box, sine wave and three Riemann variants. |\n| `Builder/` | The physics builders (`build_equation`, `build_kinetic_system`) and the exact references; the numerical builders come from HyperCloudCore (see [Builder API](builder.md)). |\n| `device.jl` | GPU placement and memory limit of the runners ([`storage_for`](@ref), [`set_memory_limit!`](@ref)). |\n| `inbuilt_methods.jl` | [`create_method`](@ref), [`get_master_method_dict`](@ref), [`generate_relax_params`](@ref). |\n| `SimulationFunctions/` | The pipelines [`run_direct_simulation`](@ref) and [`run_kinetic_simulation`](@ref). |\n| `time_integration.jl` | The time loop [`solve_equation`](@ref) and snapshot storage. |\n| `Builder/reference.jl` | [`analytical_solution`](@ref) and the [`analytic_closure`](@ref) interface. |\n| `macros.jl` | [`@sim`](@ref), [`@plot`](@ref), [`@backup`](@ref). |\n| `Examples/` | Ready-to-run benchmarks: `euler_1d_sod`, `burgers_kinetic`, `advection_2d`. |\n"},{"name":"macros.md","path":"docs/src/macros.md","type":"file","files":1,"lines":84,"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus 5.5 (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [8]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":84}},"Human-Review":{"files":{"H1":1.0},"lines":{"H1":84}},"AI-Review":{"files":{"A0":1.0},"lines":{"A0":84}}},"parts":[{"lines":70,"runs":[[1,21],[23,34],[46,47],[50,84]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus 5.5 (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [8]"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":14,"runs":[[22,22],[35,45],[48,49]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 04a3f13"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Execution Macros\n\nThe macros are the main user interface. They resolve a configuration by name, run it, and\nhandle plugin loading and world-age issues for you.\n\n## Global settings\n\n| Variable | Meaning |\n|:---------|:--------|\n| `CONFIG_SEARCH_PATHS` | Folders searched recursively for `name.jl` (default `[\"configs\", \"experiments\"]`). |\n| `CONFIG_ROOT_OVERWRITE` | Project root for that search. Defaults to `PDEStudioCore.get_save_path()`. |\n| `BONITO_LISTEN_URL`, `BONITO_LISTEN_PORT`, `BONITO_PROXY_URL` | Server settings for browser plots with `WGLMakie`. |\n\nAll of them are `Ref`s, e.g. `HyperCloud.CONFIG_SEARCH_PATHS[] = [\"my_cases\"]`.\n\n## `@sim`\n\n```julia\n@sim name\n@sim \"name\"\n@sim :name\n@sim name dry_run = true                  # options are passed on to run_all_simulations\n```\n\nRuns the configuration returned by `name()`:\n\n1. If a function `name` exists in the calling module, it is used.\n2. Otherwise the macro searches `CONFIG_SEARCH_PATHS` for `name.jl`, includes it, and calls the\n   function of the same name.\n3. The call goes through `Base.invokelatest`, so functions defined by a freshly included file\n   work in the same session.\n\nIf neither exists, `@sim` throws an `ErrorException`.\n\n`@sim` returns PDEStudioCore's `RunSummary`, which the REPL prints as a short report: what ran, what was taken from\nthe cache, what produced nothing or failed (with the error message), and what was made with other code. Options\nafter the name override the defaults `force_overwrite = false`, `calculate_stats = true`:\n\n- `dry_run = true` reports what would run and writes nothing;\n- `force_overwrite = true` recomputes every method;\n- `on_changed_sources = :recompute` recomputes cached results made with another HyperCloud version (`:warn`, the\n  default, keeps them with a warning; `:ignore` keeps them silently). PDEStudioCore compares the version of the\n  solver's own package only, so results made with another **HyperCloudCore** version are not detected; their\n  version is in `sim.metadata[:hypercloudcore]` (see [Simulation Engine](@ref)).\n\n!!! note \"Failed runs do not abort a batch\"\n    The simulation runners catch exceptions, log them with `@error`, and return `nothing`.\n    A batch therefore continues past a failing method; the `RunSummary` lists such methods under\n    \"produced nothing\", and the log has the error.\n\n## `@plot`\n\n```julia\n@plot\n@plot name\n```\n\nOpens the PDEStudio viewer. With `name`, the configuration is resolved like in `@sim`, passed\nto the viewer with `set_sim_config!`, and computed (or loaded from cache).\n\nThe backend is chosen from what is loaded in the calling module:\n\n- `GLMakie`: a local window.\n- `WGLMakie`: plots are served by a Bonito server (configured once per session with the\n  `BONITO_*` settings). If Bonito itself is not loaded, a warning is printed.\n- Neither: a warning is printed and the figure is returned without being displayed.\n\n## `@backup`\n\n```julia\n@backup name\n```\n\nCopies the file that defines `name` into a `backups` folder next to it, with a timestamp in the\nfile name (`name_YYYYMMDD_HHMMSS.jl`). Use it to archive the exact configuration behind a\nresult.\n\n## API\n\n```@docs\n@sim\n@plot\n@backup\n```\n"},{"name":"simulation.md","path":"docs/src/simulation.md","type":"file","files":1,"lines":150,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":0.9999999999999999},"lines":{"G3":150}},"Human-Review":{"files":{"H0":0.9733333333333333,"H1":0.02666666666666667},"lines":{"H0":146,"H1":4}},"AI-Review":{"files":{"A0":0.05333333333333334,"A1":0.9466666666666667},"lines":{"A0":8,"A1":142}}},"parts":[{"lines":142,"runs":[[1,27],[36,150]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":4,"runs":[[28,29],[34,35]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 04a3f13"},"levels":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0"},"errors":[],"advisory":false},{"lines":4,"runs":[[30,33]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Simulation Engine\n\nThe runners turn a flat parameter dictionary into a complete solver, run it, and package the\nresult: [`run_direct_simulation`](@ref) for the PDE itself, [`run_kinetic_simulation`](@ref) for its\nkinetic relaxation approximation, and [`run_bgk_simulation`](@ref) for the discrete-velocity\n[BGK model](PDEs/bgk.md).\n\n## Pipeline\n\nBoth runners follow the same steps, sharing one `context` dictionary (see\n[Builder API](builder.md); the numerical builders are HyperCloudCore's\n[config-driven builders](@extref HyperCloudCore Config-Driven-Builders)):\n\n1. **Split the parameters** into namespaces with `extract_namespace` (`PDE`, `Grid`, `Weight`,\n   `Flux`, `Limiter`, `MOOD`, `Scheme`, `IC`, `Time`, `Adapt`, and `Kinetic` for the kinetic runner).\n2. **Build the equation.** It determines the dimension `D` and system size `M`.\n3. **Build the geometry and particle grid**, including the MLS weight function.\n4. **Build the spatial discretization:** flux, limiter, MOOD and scheme.\n5. **Build the time stepper**, HyperCloudCore's\n   [`GeneralRKTimeStepper`](@extref HyperCloudCore HyperCloudCore.GeneralRKTimeStepper), from the\n   Butcher tableau (explicit RK or IMEX), and optionally the particle adaptivity (`Adapt` namespace).\n6. **Apply the initial condition.**\n7. **Integrate** with [`solve_equation`](@ref) up to `tmax`, using either a fixed `dt` or a CFL\n   number.\n8. **Package** the snapshots into an `AbstractSimData` and add the statistics `Runtime`\n   (wall-clock seconds), `k_step` (number of steps) and `final_particle_count`, plus\n   `reserved_particles` and `reserved_bytes` with a [memory limit](@ref \"Memory limit\").\n   The dataset's `metadata` (PDEStudioCore ≥ 0.5: information about the run that is not data and is never\n   plotted) holds `:hypercloudcore` (the HyperCloudCore version), `:backend`, `:float_type`, `:steps`,\n   `:t_final` (the time reached), `:stopped_early` (`true` if the run stopped before `tmax`, e.g. after a\n   blow-up) and `:finite` (`false` if the last stored state is not finite: a blow-up the time step does not see,\n   with a fixed `dt` or constant wave speeds, is only detected at stored snapshots and can reach `tmax`). A\n   blown-up run is cached like any other, so check both flags before using it. The pipeline adds its\n   `:provenance` (PDEStudioCore, Julia and HyperCloud versions, host, threads, git commit, wall time).\n   `load_sim_data(params).metadata` returns all of it; PDEStudioCore's `sim_data_table()` lists the stored runs.\n\nThe simulation precision is `params[:T]` (default `Float64`).\n\nThe returned object holds one entry per snapshot: `sim.x[k]` are the positions, `sim.u[k]`\nthe states and `sim.t[k]` the time of snapshot `k`.\n\n!!! warning \"Errors are caught\"\n    Both runners catch every exception, log it with `@error` (including the backtrace), and\n    return `nothing`. Always check the result, e.g. `@assert sim !== nothing`, when calling them\n    directly.\n\n## Running on a GPU\n\nThe runners place a run where HyperCloudCore's execution backend runs ([`storage_for`](@ref);\nsee [Execution backends](@extref HyperCloudCore Execution-backends-and-the-GPU-roadmap)).\nThe CPU backends ([`PolyesterBackend()`](@extref HyperCloudCore HyperCloudCore.PolyesterBackend), the\ndefault, [`ThreadsBackend()`](@extref HyperCloudCore HyperCloudCore.ThreadsBackend) and\n`KernelAbstractions.CPU()`) keep the run in host memory. With a GPU backend, the grid, the scheme\nand the time stepper live on the device (`context[:Storage]`). No parameter changes, so a GPU run\nhas the same parameter hash as its CPU counterpart:\n\n```julia\nusing HyperCloud, AMDGPU          # or CUDA / Metal / oneAPI\nset_backend!(ROCBackend())\nsim = run_direct_simulation(params)\nset_backend!(PolyesterBackend())  # back to the CPU\n\nwith_backend(() -> run_direct_simulation(params), ROCBackend())   # the same, scoped\n```\n\n- The grid is constructed on the host and then moved to the device; the time steps (neighbour\n  search, MOOD, boundary conditions, CFL estimate) run there.\n- Initial conditions are evaluated on the host and copied over once; each snapshot copies the\n  active particles back. The returned `sim` therefore holds plain host arrays.\n- Particle adaptivity works; a step that actually inserts or merges particles copies the grid to the\n  host and back.\n- All schemes, including `:WENO`, and all grid movers run on the device (since HyperCloudCore 0.6.1).\n  What still runs on the host is listed under\n  [Not yet on the device](@extref HyperCloudCore Not-yet-on-the-device).\n- Custom equations, boundary conditions and source terms run inside the time step and must\n  follow the [rules for kernel bodies](@extref HyperCloudCore Rules-for-kernel-bodies) (bits types,\n  no allocation, no dynamic dispatch). Initial conditions only run on the host.\n\n### Memory limit\n\nBy default the buffers of a run grow on demand; growing a buffer briefly holds the old and the new\narray at once, which is where a run on a nearly full device fails. `set_memory_limit!(bytes)`\ninstead sizes every buffer of the following runs once, to the largest particle capacity under the\nlimit (HyperCloudCore's [`reserve!`](@extref HyperCloudCore HyperCloudCore.reserve!)), and a run that\noutgrows it stops with a [`CapacityError`](@extref HyperCloudCore HyperCloudCore.CapacityError):\n\n```julia\nset_memory_limit!(12 * 2^30; slots_per_particle = 40)   # 12 GiB; room for neighbourhoods to grow\nsim = run_direct_simulation(params)                       # stats: reserved_particles, reserved_bytes\nset_memory_limit!(nothing)\n```\n\nLike the backend it is a session setting, not a parameter, so it does not change the run hash.\n`slots_per_particle` defaults to what the initial neighbour lists need; raise it for moving or adaptive\ngrids.\n\n!!! warning \"Device reservations (AMDGPU 2.9.1, ROCm 7.2)\"\n    A reservation on a device can zero grid buffers when earlier device runs happened in the same\n    Julia session (see HyperCloudCore's [memory budget](@extref HyperCloudCore Memory-budget) notes).\n    The runners compare the grid before and after the reservation and refuse to run when it changed.\n    Until this is fixed upstream, start reserved GPU runs in a fresh session.\n\n## Direct simulation\n\n[`run_direct_simulation`](@ref) evolves the PDE given in the `PDE` namespace.\n\n- No source terms are attached.\n- The initial condition is evaluated at every particle.\n- The stored states are the variables the equation evolves (conservative variables for Euler).\n\n## Kinetic simulation\n\n[`run_kinetic_simulation`](@ref) replaces the macroscopic system with ``M`` variables by a\nlinear kinetic system with ``N_K`` variables plus a stiff relaxation term (see\n[Kinetic Relaxation](SourceTerms/kinetic.md)).\n\n- **Two equations.** The macroscopic equation is built first; [`build_kinetic_system`](@ref)\n  then builds the kinetic `LinearAdvection` system and the [`RelaxationSourceTerm`](@ref) from\n  the `Kinetic` namespace.\n- **Kinetic context.** The context is switched to the kinetic equation and `M = N_K`, so the\n  same schemes run on the kinetic variables. The relaxation term is registered as an implicit\n  source, which requires an IMEX stepper (`:IMEXEuler`, `:ARS222`, `:ARS233`, `:PRSSP3`, `:SSP332`).\n- **Initialization.** The macroscopic initial condition is mapped to the kinetic equilibrium\n  (Maxwellian) at every particle.\n- **Output.** Snapshots are summed back to the macroscopic variables with the source term's\n  `Kin2Macro` map. Set `:save_relax => true` to keep the raw kinetic variables instead.\n\n## BGK simulation\n\n[`run_bgk_simulation`](@ref) runs the [BGK equation](PDEs/bgk.md) (`:PDE_name => :bgk`). The direct\nand kinetic runners hand BGK configurations over to it, so the method dictionaries work unchanged.\n\n- **Macroscopic initial data.** The initial condition is built with `M = D + 2` (the Euler variables\n  of the same ``\\gamma``) and every particle starts in the discrete Maxwellian of its state.\n- **Collision term.** [`BGKRelaxation`](@ref) (implicit) for an IMEX tableau,\n  [`ExplicitBGKRelaxation`](@ref) for an explicit one, none for `:PDE_tau => Inf`.\n- **Output.** Snapshots hold the moments ``(\\rho, \\rho\\vec u, E)``; `:save_relax => true` keeps the\n  distributions.\n\n## API\n\n```@docs\nrun_direct_simulation\nrun_kinetic_simulation\nextract_namespace\nstorage_for\nwith_backend\nset_memory_limit!\nget_memory_limit\n```\n"},{"name":"time_integration.md","path":"docs/src/time_integration.md","type":"file","files":1,"lines":67,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.05970149253731343,"G3":0.9402985074626866},"lines":{"G2":4,"G3":63}},"Human-Review":{"files":{"H0":0.9402985074626866,"H1":0.05970149253731343},"lines":{"H0":63,"H1":4}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":67}}},"parts":[{"lines":55,"runs":[[1,18],[29,30],[33,67]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":4,"runs":[[19,22]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":8,"runs":[[23,28],[31,32]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Time Integration\n\n[`solve_equation`](@ref) runs the time loop: it computes the step size, advances the particle\ngrid with the chosen Runge–Kutta or IMEX stepper (HyperCloudCore's\n[Time Stepper](@extref HyperCloudCore Time-Stepper)), applies particle adaptivity between steps if\nit is enabled, reports progress, and stores snapshots.\n\n## Time step\n\n- **Fixed:** with `is_cfl = false`, `dt` is the physical time step.\n- **CFL:** with `is_cfl = true` (`:Time_CFL` in a configuration), `dt` is a CFL number and the\n  physical step is recomputed every iteration as `dt * get_time_step(pg, eq, div_interp)`. This\n  uses the current wave speeds of the equation and the MLS derivative stencils of the grid; see\n  HyperCloudCore's [CFL time step](@extref HyperCloudCore CFL-time-step) for the formula and\n  measured limits.\n\nThe last step is shortened so the run ends exactly at `tmax`.\n\nIf the step collapses (below ``10^{-12}\\,t_{max}``, relative, so no time scale is assumed) or is not finite (NaN states or unbounded wave speeds after a\nblow-up, or an infinite CFL number or fixed step), or a stored intermediate snapshot is not finite, the loop stops\nbefore `tmax` with a warning that gives the time reached; a non-finite final snapshot (at `tmax`) gives a warning\ntoo. Each blow-up is reported once. The snapshot check also catches blow-ups the step doesn't see: fixed time steps,\nequations with constant wave speeds (linear advection, BGK, kinetic runs) and CFL estimates that skip NaN\nparticles. The final slot then holds the state at that time, snapshots that were not reached are dropped\nby the runners, and no NaN time is recorded. The runners still return the data, so check the warning or\n`t[end]`. A snapshot more than ``10^8`` times larger than the initial state gives a warning (once) without\nstopping the run. If no wave moves at all (an infinite CFL step with a finite state), the run advances straight to `tmax`.\n\n## Snapshots\n\n`snapshots + 1` states are stored, at the target times `range(0, tmax, length = snapshots + 1)`;\n`snapshots` must be at least 1 (an `ArgumentError` otherwise).\n\n- Snapshot 1 is the initial state at `t = 0`.\n- Each further snapshot is taken at the end of the first step that reaches its target time,\n  so `t[k]` can lie slightly after the target.\n- The final state is always stored in the last slot.\n\n[`saveData!`](@ref) copies positions and states into new arrays, so later steps do not modify\nstored snapshots. With `remove_ghosts = true` only non-boundary particles are kept. The runners\npass `:remove_ghosts` from the configuration (default `true`); `solve_equation` itself defaults\nto `false`.\n\n## Progress output\n\n- `show_progress = true`: a progress bar.\n- `show_progress = false`: an `@info` line with the percentage and an ETA (HH:MM:SS) every\n  `progress_interval` seconds, which is better suited for log files.\n\nThe runners take both settings from global switches: `enable_progress_bar!(false)` and\n`set_progress_interval!(seconds)`.\n\nThe loop also logs the execution backend of the parallel loops (see\n[`set_backend!`](@extref HyperCloudCore HyperCloudCore.set_backend!)).\n\n## Return value\n\n`solve_equation` returns `(positions, states, times, k_step, elapsed_time)`: the stored\npositions, states and times per snapshot, the number of steps, and the wall-clock time of the\nloop in seconds.\n\n## API\n\n```@docs\nsolve_equation\nsaveData!\n```\n"},{"name":"walls.md","path":"docs/src/walls.md","type":"file","files":1,"lines":54,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"errors":[],"parts":[{"lines":54,"runs":[[1,54]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit 1faba3c (Slip wall: normal momentum along accelerating, …), pull request checkboxes"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A0"},"errors":[],"advisory":false}],"source":"# Walls and Moving Boundaries\n\nHyperCloudCore treats a boundary through ghost particles: a [`MirrorBC`](@extref HyperCloudCore HyperCloudCore.MirrorBC) evaluates the interior solution at a ghost's mirror point behind the wall and hands that state, with the wall's normal, position and velocity ([`WallPoint`](@extref HyperCloudCore HyperCloudCore.WallPoint)), to an *operator* that turns it into the ghost state. HyperCloud supplies the operators of the physical walls; the geometry (shapes, normals, moving pieces) lives in HyperCloudCore ([Geometric Domains](@extref HyperCloudCore Geometric-Domains), [Moving Boundaries](@extref HyperCloudCore Moving-Boundaries)).\n\n| Condition | Equation | Ghost state |\n|:--|:--|:--|\n| `slip_wall()` (`MirrorBC(SlipWall())`) | Euler | density of the mirrored state, velocity reflected relative to the wall: `u' = u − 2 ((u − w)·n) n`, pressure with the gradient of an accelerating wall: `p' = p − 2 d ρ (n·a)` |\n| `slip_wall()` | BGK | specular reflection `f'(v) = f(v − 2 ((v − w)·n) n)`: an exact node flip for a wall along an axis whose normal velocity is the grid centre; otherwise the equilibrium of the reflected state plus the interpolated non-equilibrium part, with zero mass flux through the wall |\n| `diffuse_wall(θ_w; velocity, accommodation)` (`MirrorBC(DiffuseWall(…))`) | BGK | velocities out of the wall: the discrete Maxwellian at `θ_w` and the wall velocity, with the density that returns the incident mass flux; velocities into the wall: the mirrored interior values. `accommodation \u003c 1` mixes in the specular reflection |\n\nGhosts behind the corners and edges of a box are reflected in the face whose tag they carry (HyperCloudCore's ghost geometry), so a uniform flow along slip walls survives the corners with an inflow and an outflow exactly. All of them need a shape-based domain (`:Grid_domain => :rectangular`, `:spherical` or `:shape`); the walls of a box are tagged `2d − 1` / `2d` per axis, so `:Grid_bc => Dict(1 => FixedDirichlet(), 2 => slip_wall())` is a tube with an inflow on the left and a wall on the right. `degree` and `bounded` of the underlying `MirrorBC` are keyword arguments of both constructors.\n\n## Moving walls\n\nA `Moving` piece of the shape carries its ghosts along and the cloud makes way for it (HyperCloudCore places the ghosts at every stage time and sweeps the interior after every step). The wall velocity, acceleration, spin and curvature reach the operators through the `WallPoint`: the slip wall reflects the normal velocity relative to the wall, and at an accelerating, rotating or curved wall gives the mirrored state the normal momentum of the fluid along the wall, `∂p/∂n = −ρ (n·a + 2 n·Ω(u − w) − u_t·H u_t)`, with the tangential velocity of an irrotational flow (see [`SlipWall`](@ref); the even mirror, `∂p/∂n = 0`, left a first-order error next to an oscillating piston and at static curved walls, and the material acceleration alone stirred a gas at rest around a spinning disc); the diffuse wall emits at the wall velocity. A piston driven into a gas at rest:\n\n```julia\npiston = Moving(Tagged(HalfSpace((1.0,), (1.0,)), 2), translating((-0.5,)))   # face at x = 1 − 0.5 t\ntube   = intersect(Tagged(Cuboid((0.0,), (1.5,)), 1), piston)                  # the canvas reaches beyond the face\nparams[:Grid_domain] = :shape\nparams[:Grid_shape]  = tube\nparams[:Grid_mins], params[:Grid_maxs] = (0.0,), (1.5,)\nparams[:Grid_bc]     = Dict(1 => slip_wall(), 2 => slip_wall())\n```\n\nThe canvas must reach beyond a moving face: a face on the end of the canvas shares its ghosts with the static wall there, and the grid refuses it. Keep the step below a quarter spacing per step for the piece (`|w| Δt ≤ Δx / 4`; the CFL number does not see the wall speed).\n\n**Caching.** The motion of a `Moving` piece is a function, and the parameter hash reduces functions to `\"Closure\"`: two runs that differ only in the motion of a shape instance share one cache file, and the second returns the first's result. Give the shape as a string of code instead, which the hash sees in full and in which `T` is the run's float type (so it works in Float32 too); [`euler_1d_piston`](@ref) does this:\n\n```julia\nparams[:Grid_shape] = \"intersect(Tagged(Cuboid((T(0),), (T(1.5),)), 1), Moving(Tagged(HalfSpace((T(1),), (T(1),)), 2), translating((-T(0.5),))))\"\n```\n\nThe runners check the wall operators before the first step: an operator without a method for the equation (`SlipWall` on linear advection, `DiffuseWall` on Euler) or a sliding velocity of the wrong length is an `ArgumentError` naming the boundary tag, not a `MethodError` from inside the kernel.\n\n## What was measured\n\n- **Euler, shock reflection** (gas at `u = 1` against a slip wall, `MUSCL2 VK`, 200 particles, `t = 0.3`): the plateau behind the reflected shock is `ρ = 2.0774`, `p = 2.9267`, `u = 4·10⁻⁴` against the Rankine–Hugoniot state `2.0792`, `2.9266`, `0` (`p` within `10⁻⁴`, `ρ` within `2·10⁻³`).\n- **Euler, piston** (`w = 0.5` into a gas at rest, 300 particles over `[0, 1.5]`, `t = 0.3`; the example [`euler_1d_piston`](@ref)): `ρ = 1.4895`, `u = −0.5000`, `p = 1.7602` against `1.4899`, `−0.5`, `1.7603`, and the first particle stays within one spacing of the face.\n- **BGK, equilibrium**: a gas in equilibrium between diffuse walls at its temperature (also specular walls, or an accommodation of 0.5) stays in equilibrium to `2·10⁻¹⁶`: the discrete flux balance of the diffuse wall is exact on the symmetric velocity grid. The same holds next to a curved wall (a gas at rest in a disc, 24² particles, 8² velocities, `t = 0.1`): `2·10⁻¹⁵` for both walls (the specular wall used to take the nearest velocity node off the axes, which drifted by 9 %).\n- **BGK, specular reflection off the node grid** (an equilibrium at `u = (0.2, −0.1)`, 12² velocities, oblique normals): zero mass flux through the wall to round-off, density, velocity and energy of the reflected state within `2·10⁻⁴` (exact for the diagonal, which permutes the nodes); a moving wall reflects `u' = 2w − u` and a grid centred off the wall velocity (`:PDE_vcenter`) no longer lets mass through.\n- **BGK, hot wall** (`θ_w = 2` on a gas at `θ = 1`, `τ = 10⁻²`, `t = 0.5`): the temperature next to the wall reaches 1.83 / 1.86 / 1.87 for 50 / 100 / 200 particles (a temperature jump remains at this Knudsen number); the mass of the gas (trapezoid rule) changes by 1.15 / 0.71 / 0.42 % (0.24 % at 400 particles: order 0.7–0.8), against `−3.9·10⁻⁵` for specular walls on a gas with a pressure jump (second order). The zero-flux condition holds for the ghost state, but the scheme's flux through the wall comes from a reconstruction across the half-range jump of the ghost, so a diffuse wall conserves mass at first order only; exact conservation would need a flux-form wall.\n- **BGK, piston** (`τ = 10⁻⁴`, isothermal diffuse face at the gas temperature, 300 particles): the plateau is within 1 % of the Euler Rankine–Hugoniot state (`ρ = 1.482`, `p = 1.747`, `u = −0.493`); the isothermal face adds a thin thermal layer that the Euler plateau does not have.\n\n## API\n\n```@docs\nSlipWall\nDiffuseWall\nslip_wall\ndiffuse_wall\neuler_1d_piston\nexact_piston\n```\n"},{"name":"wrappers.md","path":"docs/src/wrappers.md","type":"file","files":1,"lines":68,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.04411764705882353,"G3":0.9558823529411765},"lines":{"G2":3,"G3":65}},"Human-Review":{"files":{"H0":0.9558823529411765,"H1":0.04411764705882353},"lines":{"H0":65,"H1":3}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":68}}},"parts":[{"lines":57,"runs":[[1,21],[25,36],[40,40],[46,68]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":3,"runs":[[22,24]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":8,"runs":[[37,39],[41,45]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] c276d39"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"# Method Wrappers\n\nWriting method dictionaries by hand is tedious and error-prone. These helpers create them with\nconsistent keys and labels.\n\n## `create_method`\n\n```julia\nlabel, method = create_method(:RK2, :MUSCL, 2; limiter = :VK)\n# label  == \"RK2MUSCL2(VK)\"\n# method == Dict(:Time_stepper => :RK2, :Scheme_name => :MUSCL, :Scheme_order => 2,\n#                :Limiter_name => :VK, :Limiter_mode => :hard, ...)\n```\n\nReturns `label => method`, where `method` uses the namespaced keys of the\n[Configuration Reference](configuration.md).\n\n- **Pipeline.** Unless `sim_func_name` is given, IMEX steppers (`:IMEXEuler`, `:ARS222`,\n  `:ARS233`, `:PRSSP3`, `:SSP332`) select `:run_kinetic_simulation` and all others\n  `:run_direct_simulation`.\n- **Label.** `\"\u003cstepper>\u003cscheme>\u003corder>\"`, followed in parentheses by any non-default flux,\n  the limiter (with its mode if it is not `:hard`), and for MOOD the strategy (plus the criterion if it is not\n  `:U2`, and `δ=\u003cMOOD_delta_relax>` if it is non-zero). Examples: `\"RK2MUSCL2\"`, `\"RK2MUSCL2(VK)\"`,\n  `\"RK2MUSCL2(VK soft)\"`, `\"RK2MUSCL2(EPD1)\"`, `\"RK2MUSCL2(EPD2,U1)\"`, `\"RK2MUSCL2(EPD1,δ=0.0001)\"`,\n  `\"RK4MUSCL3(Upwind,minmod)\"`. `custom_label` replaces it.\n- **Extra keywords** are stored as additional keys, e.g. `Scheme_upwind_alg_nd = :Classic` or\n  `MOOD_delta_relax = 1e-4`. String values are converted to `Symbol`s.\n- **`ignore`** lists parameters the method should ignore. The built-in direct methods pass the\n  kinetic keys (`ignore_relax`).\n\nThe `:Upwind` scheme only exists at order 1.\n\n## `get_master_method_dict`\n\nReturns all built-in methods as `Dict(label => method)`:\n\n- the reference entry `\"Analytical Solution\"`;\n- first-order baselines: `EulerUpwind1`, `RK2Upwind1`, `IMEXEulerUpwind1`, `SSP332Upwind1`,\n  `PRSSP3Upwind1`, and `RK2WENO2`;\n- direct second order: `RK2MUSCL2` without limiter, with `VK`, `BJ` or `minmod`, and with MOOD\n  (`EPD0`, `EPD1`, `EPD2`, `SEPD0`, `EPD1,U1`), plus `RK2MUSCL1` and `RK4SSPMUSCL4(EPD1,only)`;\n- kinetic second order: `ARS222MUSCL2` (no limiter) and `SSP332MUSCL2` without limiter, with `VK` or\n  `minmod`, and with MOOD (`EPD1`, `EPD2`, `SEPD0`, `EPD1,U1`);\n- high order: `RK4SSPMUSCL2`–`RK4SSPMUSCL5` without limiter, with `VK`, `minmod`, or MOOD (`EPD1`,\n  `EPD2`), and kinetic `PRSSP3MUSCL2(EPD1)`–`PRSSP3MUSCL5(EPD1)`.\n\nSelect methods by label in a `SimulationConfig`, e.g. `[\"RK2MUSCL2\", \"ARS222MUSCL2\"]`.\n\n## `generate_relax_params`\n\n```julia\nvels, idx = generate_relax_params(2.0, 2, 1)\n# vels == ((2.0, -2.0, 0.0, 0.0), (0.0, 0.0, 2.0, -2.0))\n# idx  == [1, 5]\n```\n\nBuilds the standard kinetic velocity set: ``2D`` kinetic variables per macroscopic variable,\nwith speeds ``\\pm v`` along each axis. It returns the speeds in the format expected by\n`:Kinetic_velocities` and the edges for `:Kinetic_indices`. See\n[Kinetic Relaxation](SourceTerms/kinetic.md).\n\n## API\n\n```@docs\ncreate_method\nget_master_method_dict\ngenerate_relax_params\n```\n"}]},{"name":"make.jl","path":"docs/make.jl","type":"file","files":1,"lines":61,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G3":1.0},"lines":{"G3":61}},"Human-Review":{"files":{"H0":0.9672131147540983,"H1":0.03278688524590164},"lines":{"H0":59,"H1":2}},"AI-Review":{"files":{"A0":0.04918032786885246,"A1":0.9508196721311475},"lines":{"A0":3,"A1":58}}},"parts":[{"lines":58,"runs":[[1,16],[18,49],[51,52],[54,61]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[17,17]],"declaration":{"AI-Generation":"G3","Human-Review":"H1","AI-Review":"A0","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":[],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"commit d3e4df5 (Cleanup: remove Forgejo, PR badges; REUSE and c…), pull request checkboxes"},"levels":{"AI-Genera ==============================================================\n# WALL OPERATORS for HyperCloudCore's MirrorBC\n# =========================================================================\n#\n# `MirrorBC(op; degree, bounded)` evaluates the interior solution at a ghost particle's mirror point behind the\n# wall and stores `op(eq, U, wall::WallPoint)`. The operators below turn that mirrored state into the ghost state\n# of a physical wall: `wall.normal` is the outward unit normal (into the solid), `wall.velocity` the wall's\n# velocity there (zero for a static wall, the piece's velocity for a `Moving` one). They are bits types and run\n# inside the kernel.\n\n# -------------------------------------------------------------------------\n# Slip wall: reflection of the velocity relative to the wall (Euler), specular reflection (BGK)\n# -------------------------------------------------------------------------\n\"\"\"\n    SlipWall()\n\nOperator of a reflecting (slip, adiabatic) wall for [`MirrorBC`](@extref HyperCloudCore HyperCloudCore.MirrorBC):\n[`slip_wall`](@ref) builds the condition.\n\n- **Euler:** the normal velocity relative to the wall is reflected, `u' ⋅ n = 2 w ⋅ n - u ⋅ n` with the wall\n  velocity `w` (zero for a static wall), so the normal velocity at the wall equals the wall's. At a flat, static or\n  uniformly moving wall that is all (density, pressure and tangential velocity are mirrored evenly). At an\n  accelerating, rotating or curved wall the even mirror (`∂p/∂n = 0`) is first order; the ghost's pressure then takes\n  the normal momentum of the fluid along the wall, `p' = p + 2 d ∂p/∂n` with the ghost's wall distance `d` and\n  `∂p/∂n = -ρ (n ⋅ a + 2 n ⋅ Ω (u - w) - u_t ⋅ H u_t)` (the `WallPoint`'s acceleration `a`, spin `Ω` and\n  curvature `H`, `u_t` the tangential velocity relative to the wall), extrapolated log-linearly (always positive;\n  the exponent `2 d ∂p/∂n / p` bounded to ±1/2), its density follows isentropically and its tangential velocity that\n  of a flow along the curved wall that is irrotational in the lab frame, `u_t' = u_t - 2 d (H u_t - P_t(Ωᵀ n))`\n  relative to the wall (Dadone & Grossman's curvature-corrected symmetry, Galilean invariant). Measured: an\n  oscillating piston 0.18 % of the wave amplitude at 2400 particles (first order with the even mirror); a disc\n  spinning in a gas at rest keeps it at rest to 1e-15 (the material acceleration alone stirred it by 1 %); the\n  potential vortex between static circles, L1 error of ρ 1.6e-3 / 6.8e-4 / 2.1e-4 for N = 50 / 100 / 200 (order\n  1.3–1.7; 1.2e-2 / 6.2e-3 / 3.5e-3 with the even mirror) and the near-wall velocity error eight times smaller. The\n  tangential correction is bounded by half the relative tangential speed, like the pressure exponent.\n- **BGK:** specular reflection of the distribution, `f'(v) = f(v - 2 ((v - w) ⋅ n) n)`. Exact on the tensor\n  velocity grid when the reflection maps the grid onto itself: a wall normal along an axis whose normal wall\n  velocity equals the grid centre on that axis (`:PDE_vcenter`; a static wall on a grid centred at 0), where the\n  node index is flipped. Otherwise (oblique or curved walls, moving walls, a shifted grid) the reflected velocity\n  is not a node: the reflection is split into the discrete equilibrium of the reflected macroscopic state\n  (density and internal energy kept, velocity reflected as for Euler), which is exact, and the non-equilibrium\n  rest of the distribution, interpolated (multilinearly on the tensor grid) at the reflected velocities. The\n  components leaving the wall are then scaled so that the net mass flux through the wall vanishes, as for\n  [`DiffuseWall`](@ref). A gas at rest next to a curved wall is reflected exactly, a drifting equilibrium at an\n  oblique wall up to the zero-flux scaling (2e-4 to 2e-3 in the moments, shrinking with the velocity grid); the\n  interpolated non-equilibrium part is clipped at zero (it made the ghost negative for strongly non-equilibrium\n  gases, -10 % of max f for two beams at an oblique wall), so the reflection stays non-negative.\n\"\"\"\nstruct SlipWall end\n\n@inline function (::SlipWall)(eq::EulerEquation{D, M, T, \u003c:Conservative}, U::State{M, T}, wall::WallPoint{D, T}) where {D, M, T}\n    V  = cons2prim(eq, U)\n    ρ, p = V[1], V[M]\n    u  = Space{D, T}(ntuple(d -> V[1 + d], Val(D)))\n    n  = wall.normal\n    ur = u - wall.velocity                       # relative to the wall\n    un = sum(ur .* n)\n    ut = ur - un * n\n    d, H, Ω = wall.distance, wall.hessian, wall.spin\n    # Normal momentum of the fluid along the wall: acceleration and rotation of the wall, and its curvature\n    dpdn = -ρ * (sum(wall.acceleration .* n) + 2 * sum(n .* (Ω * ur)) - sum(ut .* (H * ut)))\n    # Tangential velocity of a flow that is irrotational in the lab frame, relative to the wall (Galilean invariant):\n    # ∂u_t/∂n = -H (u - w)_t + P_t(Ωᵀ n), P_t the projection onto the tangent plane (Dadone & Grossman's\n    # curvature-corrected symmetry for a moving wall; in vector form, so 3-D flows oblique to the principal directions\n    # are covered). For a disc spinning in a gas at rest both corrections vanish.\n    ωn  = Ω' * n\n    dut = -2d * (H * ut - (ωn - sum(ωn .* n) * n))\n    # bounded like the pressure: at most half the relative tangential speed (a wall of radius below 2d reversed the\n    # ghost's tangential velocity, a convex one amplified it without limit; zero for the spinning disc, untouched)\n    qd, qt = sum(abs2, dut), sum(abs2, ut)\n    qd > qt / 4 && (dut = dut * sqrt(qt / (4qd)))\n    (iszero(dpdn) && iszero(dut)) && return prim2cons(eq, State{M, T}(ρ, (u - (2 * un) * n)..., p))   # flat, static, uniform motion\n    # Log-linear pressure (second order like p + 2d ∂p/∂n, always positive), the exponent bounded to ±1/2: beyond that\n    # the linearisation is meaningless (behind a cylinder in Mach 2 flow the linear form reached the old 1 % clamp\n    # and the run lost positivity); the density follows isentropically\n    p2 = p * exp(clamp(2d * dpdn / p, -T(0.5), T(0.5)))\n    ρ2 = ρ * (p2 / p)^(1 / eq.gamma)\n    return prim2cons(eq, State{M, T}(ρ2, (wall.velocity + ut + dut - un * n)..., p2))\nend\n\n# The axis a unit normal is aligned with, 0 if none\n@inline function _axis_of(n::Space{D, T}) where {D, T}\n    ax = 0\n    for d in 1:D\n        abs(abs(n[d]) - one(T)) \u003c= T(1e-6) && (ax = d)\n    end\n    return ax\nend\n\n# Component whose velocity is that of `k` with the node index along axis `d` flipped (symmetric node sets)\n@inline function _flipped_index(eq::BGKEquation{D, M, T, NV1, NV}, k::Int, d::Int) where {D, M, T, NV1, NV}\n    idx  = _node_index(eq, k, d)\n    return k + (NV1 + 1 - 2 * idx) * NV1^(d - 1)\nend\n\n# Bracketing node index `i` (nodes[i] ≤ x ≤ nodes[i+1], clamped to the grid) and the linear weight of node i + 1\n@inline function _bracket(nodes::SVector{NV1, T}, x::T) where {NV1, T}\n    i = 1\n    @inbounds while i \u003c NV1 - 1 && nodes[i + 1] \u003c x\n        i += 1\n    end\n    @inbounds t = clamp((x - nodes[i]) / (nodes[i + 1] - nodes[i]), zero(T), one(T))\n    return i, t\nend\n\n# f (block starting at `off`: 0 for f, NV for h) interpolated multilinearly at the velocity `v` on the tensor grid\n@inline function _interp_f(eq::BGKEquation{D, M, T, NV1, NV}, f::State{M, T}, v::Space{D, T}, off::Int) where {D, M, T, NV1, NV}\n    br = ntuple(d -> _bracket(eq.nodes, v[d] - eq.center[d]), Val(D))\n    acc = zero(T)\n    @inbounds for corner in 0:(2^D - 1)\n        k, wt = 1, one(T)\n        for d in 1:D\n            hi = (corner >> (d - 1)) & 1 == 1\n            i, t = br[d]\n            k  += (hi ? i : i - 1) * NV1^(d - 1)\n            wt *= hi ? t : one(T) - t\n        end\n        acc += wt * f[off + k]\n    end\n    return acc\nend\n\n@inline function _specular(eq::BGKEquation{D, M, T, NV1, NV}, f::State{M, T}, n::Space{D, T}, w::Space{D, T}) where {D, M, T, NV1, NV}\n    ax = _axis_of(n)\n    # Exact node flip: along an axis the reflection v_ax -> 2 w_ax - v_ax maps the (symmetric) grid onto itself if\n    # the grid is centred at the wall's normal velocity (it used to be taken for any static wall, which reflected\n    # about the grid centre: with :PDE_vcenter != 0 the wall was penetrable)\n    if ax > 0 && eq.center[ax] == w[ax]\n        return State{M, T}(ntuple(k -> (@inbounds f[_flipped_index(eq, k, ax)]), Val(M)))\n    end\n    # Otherwise the components leaving the wall ((v - w)⋅n \u003c 0) take the reflection of f at their reflected velocity:\n    # the discrete equilibrium of the reflected macroscopic state (density and internal energy kept, velocity\n    # reflected relative to the wall) plus the non-equilibrium part of f interpolated (multilinearly) at the reflected\n    # velocity, then scaled so that the mass flux through the wall vanishes. The equilibrium part is reflected\n    # exactly, so a gas in equilibrium (at rest next to a curved wall, or drifting) is reflected into the correct\n    # equilibrium; the nearest node, used before, lost or gained mass (a gas at rest next to a disc drifted by 9 % in\n    # t = 0.1). If a discrete equilibrium does not exist, the whole of f is interpolated.\n    U  = moments(eq, f)\n    ρ  = U[1]\n    u  = Space{D, T}(ntuple(d -> U[1 + d], Val(D))) / ρ\n    ur = u - (2 * sum((u - w) .* n)) * n\n    Ur = SVector{D + 2, T}(ρ, (ρ * ur)..., U[D + 2] + T(0.5) * ρ * (sum(abs2, ur) - sum(abs2, u)))\n    Mf, ok1 = equilibrium(eq, U)\n    Mr, ok2 = equilibrium(eq, Ur)\n    use_eq  = ok1 && ok2\n    neq = use_eq ? f - Mf : f\n    raw = State{M, T}(ntuple(Val(M)) do k\n        kk = k > NV ? k - NV : k\n        v, _ = velocity_node(eq, kk)\n        c = sum((v - w) .* n)\n        max(zero(T), (use_eq ? (@inbounds Mr[k]) : zero(T)) + _interp_f(eq, neq, v - (2c) * n, k > NV ? NV : 0))\n    end)\n    # Mass flux through the wall: incident part of the interior (mirrored) state, emitted part of the reflection\n    Φin, Φout = zero(T), zero(T)\n    @inbounds for k in 1:NV\n        v, wk = velocity_node(eq, k)\n        c = sum((v - w) .* n)\n        c > zero(T) ? (Φin += wk * c * f[k]) : (Φout += wk * c * raw[k])\n    end\n    s = Φout \u003c zero(T) ? max(Φin, zero(T)) / (-Φout) : one(T)\n    return State{M, T}(ntuple(Val(M)) do k\n        kk = k > NV ? k - NV : k\n        v, _ = velocity_node(eq, kk)\n        @inbounds sum((v - w) .* n) \u003c zero(T) ? s * raw[k] : raw[k]\n    end)\nend\n\n@inline (::SlipWall)(eq::BGKEquation{D, M, T}, f::State{M, T}, wall::WallPoint{D, T}) where {D, M, T} =\n    _specular(eq, f, wall.normal, wall.velocity)\n\n# -------------------------------------------------------------------------\n# Diffuse (Maxwell) wall for the BGK model\n# -------------------------------------------------------------------------\n\"\"\"\n    DiffuseWall(temperature; velocity = nothing, accommodation = 1)\n\nOperator of a diffusely reflecting wall at the temperature `θ_w = p / ρ` for the BGK model, for\n[`MirrorBC`](@extref HyperCloudCore HyperCloudCore.MirrorBC) ([`diffuse_wall`](@ref) builds the condition). The\ncomponents of the ghost state whose velocity points out of the wall into the fluid (relative to the wall,\n`(v - w) ⋅ n \u003c 0`) are the discrete Maxwellian at the wall temperature and velocity, with the density that\nmakes the mass flux through the wall vanish (the incident flux of the mirrored interior distribution returns);\nthe components pointing into the wall keep the mirrored interior values. The wall velocity `w` is the piece's\nvelocity from the `WallPoint` plus `velocity` (a tangential sliding velocity, e.g. the plates of a Couette\nflow; a tuple of length `D`). With an `accommodation` coefficient `α \u003c 1` (Maxwell's model) the emitted\ndistribution is `α` times the diffuse one plus `1 - α` times the specular reflection of [`SlipWall`](@ref).\n\nIsothermal: a wall at the gas temperature reflects an equilibrium gas at rest into itself exactly (the discrete\nflux balance is exact on the symmetric velocity grid), a colder or hotter wall drives a thermal boundary layer.\nInternal degrees of freedom (`h`) are emitted at the wall temperature as well.\n\"\"\"\nstruct DiffuseWall{T, V}\n    temperature::T\n    velocity::V\n    accommodation::T\nend\nfunction DiffuseWall(temperature::Real; velocity = nothing, accommodation::Real = 1)\n    temperature > 0 || throw(ArgumentError(\"DiffuseWall: the wall temperature must be positive\"))\n    0 \u003c= accommodation \u003c= 1 || throw(ArgumentError(\"DiffuseWall: the accommodation coefficient must be in [0, 1]\"))\n    T = float(typeof(temperature))\n    vel = velocity === nothing ? nothing : SVector{length(velocity), T}(velocity...)\n    return DiffuseWall{T, typeof(vel)}(T(temperature), vel, T(accommodation))\nend\n@inline _slip_velocity(::DiffuseWall{Tw, Nothing}, ::Val{D}, ::Type{T}) where {Tw, D, T} = zero(Space{D, T})\n@inline _slip_velocity(w::DiffuseWall{Tw, \u003c:SVector{D}}, ::Val{D}, ::Type{T}) where {Tw, D, T} = Space{D, T}(w.velocity)\n\n@inline function (wd::DiffuseWall)(eq::BGKEquation{D, M, T, NV1, NV}, f::State{M, T}, wall::WallPoint{D, T}) where {D, M, T, NV1, NV}\n    n  = wall.normal\n    w  = wall.velocity + _slip_velocity(wd, Val(D), T)\n    θw = T(wd.temperature)\n    α  = T(wd.accommodation)\n    # Unit-density discrete Maxwellian of the wall\n    Uw = SVector{D + 2, T}(one(T), w..., T(0.5) * sum(abs2, w) + T(0.5) * (T(D) + eq.K) * θw)\n    Mw, ok = equilibrium(eq, Uw)\n    ok || return f                     # no wall Maxwellian on the grid: the runners refuse such a wall before the run\n    # Flux balance of the relative normal velocity: what the fluid sends into the wall comes back\n    Φin, Φout = zero(T), zero(T)\n    @inbounds for k in 1:NV\n        v, wk = velocity_node(eq, k)\n        c = sum((v - w) .* n)\n        if c > zero(T)\n            Φin += wk * c * f[k]\n        else\n            Φout += wk * c * Mw[k]\n        end\n    end\n    ρw  = Φout \u003c zero(T) ? max(Φin, zero(T)) / (-Φout) : zero(T)\n    spec = α \u003c one(T) ? _specular(eq, f, n, w) : f\n    return State{M, T}(ntuple(Val(M)) do k\n        kk = k > NV ? k - NV : k\n        v, _ = velocity_node(eq, kk)\n        c = sum((v - w) .* n)\n        @inbounds c > zero(T) ? f[k] : α * ρw * Mw[k] + (one(T) - α) * spec[k]\n    end)\nend\n\n# -------------------------------------------------------------------------\n# Host-side checks before a run\n# -------------------------------------------------------------------------\n# The operators run inside the ghost-fit kernel: an operator without a method for the equation was a MethodError at\n# the first ghost update (a compile error on a device), a sliding velocity of the wrong length too, and a wall\n# Maxwellian that does not exist on the velocity grid made the wall silently an even reflection (no wall at all).\n# The runners check the conditions of the domain once, before the first step.\nfunction _check_wall_ops(eq::HyperbolicPDE{D, M, T}, geom) where {D, M, T}\n    for (tag, bc) in geom.bc_map\n        bc isa MirrorBC && bc.op !== nothing && _check_wall_op(bc.op, eq, tag)\n    end\n    return nothing\nend\n\nfunction _check_wall_op(op, eq::HyperbolicPDE{D, M, T}, tag) where {D, M, T}\n    n = Space{D, T}(ntuple(d -> d == 1 ? one(T) : zero(T), Val(D)))\n    applicable(op, eq, zero(State{M, T}), WallPoint(zero(Space{D, T}), n, zero(T), zero(Space{D, T}))) ||\n        throw(ArgumentError(\"the wall operator $(nameof(typeof(op))) of boundary tag $tag has no method for $(nameof(typeof(eq))) \" *\n                            \"(SlipWall: Euler and BGK; DiffuseWall: BGK)\"))\n    return nothing\nend\n\nfunction _check_wall_op(wd::DiffuseWall, eq::HyperbolicPDE{D, M, T}, tag) where {D, M, T}\n    wd.velocity === nothing || length(wd.velocity) == D ||\n        throw(ArgumentError(\"DiffuseWall of boundary tag $tag: the sliding velocity has length $(length(wd.velocity)), the run is $D-D\"))\n    invoke(_check_wall_op, Tuple{Any, HyperbolicPDE{D, M, T}, Any}, wd, eq, tag)\n    w  = wd.velocity === nothing ? zero(Space{D, T}) : Space{D, T}(wd.velocity)\n    Uw = SVector{D + 2, T}(one(T), w..., T(0.5) * sum(abs2, w) + T(0.5) * (T(D) + eq.K) * T(wd.temperature))\n    # `equilibrium` reports success also where the grid cannot carry the wall's Maxwellian (θ_w = 1e-4 on 8 nodes:\n    # density 0, the wall swallowed every incoming particle; 0.05: three times the temperature): compare its moments\n    Mw, ok = equilibrium(eq, Uw)\n    m  = moments(eq, Mw)\n    ok && m[1] > zero(T) && maximum(abs.(m ./ m[1] .- Uw)) \u003c= T(1e-3) * max(one(T), maximum(abs, Uw)) ||\n        throw(ArgumentError(\"DiffuseWall of boundary tag $tag: the velocity grid has no discrete Maxwellian at the wall \" *\n                            \"temperature $(wd.temperature) and velocity $(wd.velocity) (moments per unit density $(m ./ m[1]), \" *\n                            \"wanted $Uw); refine or widen the velocity grid\"))\n    return nothing\nend\n\n# -------------------------------------------------------------------------\n# Conditions\n# -------------------------------------------------------------------------\n\"\"\"\n    slip_wall(; degree = 1, bounded = true) -> MirrorBC\n\nA reflecting wall (Euler: slip, adiabatic; BGK: specular): `MirrorBC(SlipWall(); degree, bounded)`, see\n[`SlipWall`](@ref) and [`MirrorBC`](@extref HyperCloudCore HyperCloudCore.MirrorBC). Needs a shape-based domain\n(wall normals); follows a `Moving` piece.\n\"\"\"\nslip_wall(; degree::Int = 1, bounded::Bool = true) = MirrorBC(SlipWall(); degree = degree, bounded = bounded)\n\n\"\"\"\n    diffuse_wall(temperature; velocity = nothing, accommodation = 1, degree = 1, bounded = true) -> MirrorBC\n\nA diffusely reflecting kinetic wall: `MirrorBC(DiffuseWall(temperature; velocity, accommodation); degree, bounded)`,\nsee [`DiffuseWall`](@ref).\n\"\"\"\ndiffuse_wall(temperature::Real; velocity = nothing, accommodation::Real = 1, degree::Int = 1, bounded::Bool = true) =\n    MirrorBC(DiffuseWall(temperature; velocity = velocity, accommodation = accommodation); degree = degree, bounded = bounded)\n"}]},{"name":"Builder","path":"src/Builder","type":"dir","files":4,"lines":195,"counts":{"AI-Generation":{"files":{"G2":3.03125,"G3":0.96875},"lines":{"G2":164,"G3":31}},"Human-Review":{"files":{"H0":0.96875,"H1":0.03125,"H2":3.0},"lines":{"H0":31,"H1":1,"H2":163}},"AI-Review":{"files":{"A1":4.0},"lines":{"A1":195}}},"errors":0,"children":[{"name":"_main.jl","path":"src/Builder/_main.jl","type":"file","files":1,"lines":3,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":3,"runs":[[1,3]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"include(\"equations.jl\")\ninclude(\"kinetic.jl\")\ninclude(\"reference.jl\")\n"},{"name":"equations.jl","path":"src/Builder/equations.jl","type":"file","files":1,"lines":83,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":83,"runs":[[1,83]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export build_equation\n\n# --- Main Equation Builder ---\n\"\"\"\n    build_equation(pde_conf::Dict, context::Dict)\n\nConstructs the physical equation system based on the provided configuration dictionary.\nStrictly requires a `:name` Symbol (e.g., `:linear`, `:burgers`, `:euler`) in the configuration to dynamically dispatch to the correct specific constructor using `Val`.\n\"\"\"\nfunction build_equation(pde_conf::Dict, context::Dict)\n    if !haskey(pde_conf, :name)\n        error(\"PDE configuration must include a strictly typed :name Symbol (e.g., :linear, :burgers).\")\n    end\n    \n    eq_name = pde_conf[:name]::Symbol\n    return build_equation(Val(eq_name), pde_conf, context)\nend\n\n\n\"\"\"\n    build_equation(eq_name::Val, pde_conf::Dict, context::Dict)\n\nConstructs the physical equation system based on the provided configuration dictionary.\nStrictly requires a `:name` Symbol (e.g., `:linear`, `:burgers`, `:euler`) in the configuration to dynamically dispatch to the correct specific constructor using `Val`.\n\"\"\"\nbuild_equation(eq_name::Val, pde_conf::Dict, context::Dict) = error(\"PDE '$(typeof(eq_name))' is not implemented.\")\n\nfunction build_equation(::Val{:burgers}, pde_conf::Dict, context::Dict)\n    T = context[:T]::DataType\n    D = pde_conf[:D]::Int\n    \n    return BurgersEquation{D, T}()\nend\n\nfunction build_equation(::Val{:euler}, pde_conf::Dict, context::Dict)\n    T = context[:T]::DataType\n    D = pde_conf[:D]::Int\n    rep = parse_representation(pde_conf)\n    \n    gamma = T(pde_conf[:gamma])\n    \n    return EulerEquation(Val(D), T, gamma, rep)\nend\n\nfunction build_equation(::Val{:linear}, pde_conf::Dict, context::Dict)\n    T = context[:T]::DataType\n    \n    # We pass T securely, and the smart constructor utilizes param2vel internally\n    return LinearAdvection(pde_conf[:velocities], T) \nend\n\n\"\"\"\n    build_equation(::Val{:bgk}, pde_conf::Dict, context::Dict) -> BGKEquation\n\nDiscrete-velocity BGK model. Keys of the `PDE` namespace:\n\n| Key | Meaning |\n|:--|:--|\n| `:D` | space dimension (the velocity grid has the same dimension) |\n| `:Nv` | velocity nodes per direction (`Nv^D` discrete velocities) |\n| `:vmax` | half-width of the velocity grid (outermost node for `:gauss_hermite`) |\n| `:velocity_grid` | `:uniform` (default) or `:gauss_hermite`, see [`velocity_grid`](@ref) |\n| `:vcenter` | centre of the velocity grid per direction (default `0`) |\n| `:gamma` | ratio of specific heats (default `(D + 2) / D`, no internal degrees of freedom) |\n| `:tau` | constant relaxation time ([`ConstantRelaxationTime`](@ref)); `Inf` is collisionless |\n| `:viscosity`, `:omega` | instead of `:tau`: `τ = μ / p` with `μ = viscosity θ^omega` ([`ViscosityRelaxationTime`](@ref), `omega` defaults to `0.5`) |\n\"\"\"\nfunction build_equation(::Val{:bgk}, pde_conf::Dict, context::Dict)\n    T = context[:T]::DataType\n    D = pde_conf[:D]::Int\n    haskey(pde_conf, :tau) && haskey(pde_conf, :viscosity) && error(\"BGK: give either :tau or :viscosity, not both.\")\n    relaxation = if haskey(pde_conf, :viscosity)\n        ViscosityRelaxationTime(T(pde_conf[:viscosity]), T(get(pde_conf, :omega, 0.5)))\n    elseif haskey(pde_conf, :tau)\n        ConstantRelaxationTime(T(pde_conf[:tau]))\n    else\n        error(\"BGK: the PDE namespace needs a relaxation time (:tau, or :viscosity with :omega).\")\n    end\n    nodes, weights = velocity_grid(get(pde_conf, :velocity_grid, :uniform)::Symbol, pde_conf[:Nv]::Int, pde_conf[:vmax], T)\n    gamma = get(pde_conf, :gamma, (D + 2) / D)\n    center = get(pde_conf, :vcenter, ntuple(_ -> 0.0, D))\n    return BGKEquation(Val(D), nodes, weights, gamma, relaxation; center = center)\nend\n"},{"name":"kinetic.jl","path":"src/Builder/kinetic.jl","type":"file","files":1,"lines":32,"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"errors":[],"counts":{"AI-Generation":{"files":{"G2":0.03125,"G3":0.96875},"lines":{"G2":1,"G3":31}},"Human-Review":{"files":{"H0":0.96875,"H1":0.03125},"lines":{"H0":31,"H1":1}},"AI-Review":{"files":{"A1":1.0},"lines":{"A1":32}}},"parts":[{"lines":31,"runs":[[1,20],[22,32]],"declaration":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [6]"},"levels":{"AI-Generation":"G3","Human-Review":"H0","AI-Review":"A1"},"errors":[],"advisory":false},{"lines":1,"runs":[[21,21]],"declaration":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1","Assisted-by":["Claude Opus (Anthropic)"],"AI-Reviewed-by":["Claude Opus (Anthropic), new session without the generating conversation"],"Reviewed-by":["Pascal Jung \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [[commits]] 8ec6a61"},"levels":{"AI-Generation":"G2","Human-Review":"H1","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export build_kinetic_system\n\n\"\"\"\n    build_kinetic_system(kin_conf::Dict, context::Dict)\n\nConstructs the kinetic equation and relaxation source term for kinetic simulations.\nRequires a `:velocities` key in the kinetic configuration dictionary. Extracts the relaxation parameter (`epsilon`), edge indices (`indices`), and `interior_factor` to build a `Kin2Macro` mapping, a `LinearAdvection` kinetic equation, and a `RelaxationSourceTerm`. Returns the tuple `(eq_kin, source_term)`.\n\"\"\"\nfunction build_kinetic_system(kin_conf::Dict, context::Dict)\n    T = context[:T]::DataType\n    D = context[:D]::Int\n    NM = context[:M]::Int\n    eq_macro = context[:Equation]\n    \n    if !haskey(kin_conf, :velocities)\n        error(\"Kinetic simulation requested, but no ':velocities' found in the Kinetic configuration namespace.\")\n    end\n    \n    relax_config = kin_conf[:velocities]::Tuple\n    relax_eps = T(kin_conf[:epsilon])\n    relax_indices = collect(Int, kin_conf[:indices])      # a Vector or a tuple, as for every other key\n    \n    km = Kin2Macro(relax_indices)\n    eq_kin = LinearAdvection(relax_config, T)\n    \n    coeffs = State{NM, T}(ntuple(m -> one(T) / T(relax_indices[m+1] - relax_indices[m]), Val(NM)))\n    interior_factor = T(get(kin_conf, :interior_factor, D)) \n    \n    source_term = RelaxationSourceTerm(km, relax_eps, coeffs, eq_macro, eq_kin, interior_factor)\n        \n    return eq_kin, source_term\nend"},{"name":"reference.jl","path":"src/Builder/reference.jl","type":"file","files":1,"lines":77,"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"errors":[],"parts":[{"lines":77,"runs":[[1,77]],"declaration":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1","Assisted-by":["Claude (Anthropic), claude-opus-5-5, claude-fable-5-1"],"AI-Reviewed-by":["Claude Opus 5.5 (Anthropic), new sessions without the generating conversation"],"Reviewed-by":["blhackslash \u003cdev@blackslash.win>"],"source":"SIGNOFF.toml [2]"},"levels":{"AI-Generation":"G2","Human-Review":"H2","AI-Review":"A1"},"errors":[],"advisory":false}],"source":"export analytic_closure, analytical_solution, euler_limit_solution\n\n\"\"\"\n    analytical_solution(shared_params::ParamDict)\n\nBuilds the equation, domain and initial condition from the `PDE`, `Grid` and `IC`\nnamespaces and returns the standalone closure `exact_u(st)` from [`analytic_closure`](@ref).\n`st` is the spacetime vector `SVector(x..., t)`.\n\nThe reference is computed in `shared_params[:real_type]` (default `Float64`), independently\nof the simulation precision `:T`, so Float32 runs are still compared to a Float64 reference.\n\"\"\"\nfunction analytical_solution(shared_params::ParamDict)\n    # 1. Precision of the reference (independent of the simulation precision :T)\n    T = get(shared_params, :real_type, Float64)\n    context = Dict{Symbol, Any}()\n    context[:T] = T\n\n    pde_conf    = extract_namespace(shared_params, :PDE)\n    domain_conf = extract_namespace(shared_params, :Grid)\n    ic_conf     = extract_namespace(shared_params, :IC)\n\n    # 2. Base Equation & Dimensions\n    eq = build_equation(pde_conf, context)\n    D = get_D(eq)\n    \n    context[:Equation] = eq\n    context[:D] = D\n    context[:M] = _ic_components(eq)\n    \n    # 2. Build the pure mathematical geometry (handles boundaries and periodicity)\n    geom = build_domain(domain_conf, context)\n    context[:Domain] = geom\n    \n    # 3. Instantiate the InitialCondition struct using the modular builder\n    IC = build_ic(ic_conf, context)\n    \n    # 4. Dispatch to the correct pure mathematical closure \n    # (Notice how it no longer depends on the messy parameters dict)\n    return analytic_closure(eq, IC, geom)\nend\n\n\"\"\"\n    euler_limit_solution(params::ParamDict)\n\nReference for BGK runs (`:PDE_name => :bgk`) in the hydrodynamic limit `τ → 0`: the exact solution of\nthe Euler equations with the same `:PDE_D`, `:PDE_gamma` (default `(D + 2) / D`, as for the BGK model),\ninitial condition and domain, i.e. [`analytical_solution`](@ref) with `:PDE_name => :euler`. Pass it as the\n`reference` of a `SimulationConfig`; it accepts any parameter set with an Euler-compatible `PDE` namespace.\n\"\"\"\nfunction euler_limit_solution(params::ParamDict)\n    p = copy(params)\n    p[:PDE_name] = :euler\n    haskey(p, :PDE_gamma) || (p[:PDE_gamma] = (p[:PDE_D] + 2) / p[:PDE_D])\n    return analytical_solution(p)\nend\n\n# Components of the initial condition: the state itself, except for kinetic models whose initial data are\n# macroscopic (the BGK distribution starts in the Maxwellian of an Euler state).\n_ic_components(eq::HyperbolicPDE) = get_M(eq)\n_ic_components(eq::BGKEquation) = get_D(eq) + 2\n\n# ==============================================================================\n# PDE-SPECIFIC CLOSURE GENERATORS\n# ==============================================================================\n\n# Generic fallback\n\"\"\"\n    analytic_closure(eq::HyperbolicPDE, ic::InitialCondition, geom::GeometricDomain)\n\nReturns a closure `st -> State{M}` evaluating the exact solution at the spacetime point\n`st = SVector(x..., t)`. PDEs add methods for the initial conditions they can solve exactly.\n\nThis generic fallback only emits a warning and returns `nothing` when no method exists for\nthe combination of equation, initial condition and domain.\n\"\"\"\nanalytic_closure(eq::HyperbolicPDE, ic::InitialCondition, geom::GeometricDomain) = @warn \"No Analytical Solution implemented for $(typeof(eq)) with $(typeof(ic)) on domain $(typeof(geom))!\"\n"}]},{"name":"Examples","path":"src/Examples","type":"dir","files":6,"lines":464,"counts":{"AI-Generation":{"files":{"G2":3.0,"G3":3.0},"lines":{"G2":261,"G3":203}},"Human-Review":{"files":{"H0":3.0,"H2":3.0},"lin
