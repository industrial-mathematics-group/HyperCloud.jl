name: REUSE

# Checks that every file has copyright and licence information (REUSE.toml, LICENSES/).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: reuse lint
        uses: fsfe/reuse-action@v6
